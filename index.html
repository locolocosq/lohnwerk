  }
  // Sicherheitsnetz: fehlende Listen ergänzen, damit nirgends undefined auftaucht.
  p.einnahmen    = Array.isArray(p.einnahmen)    ? p.einnahmen    : [];
  p.ausgaben     = Array.isArray(p.ausgaben)     ? p.ausgaben     : [];
  p.konten       = Array.isArray(p.konten)       ? p.konten       : [];
  p.tags         = Array.isArray(p.tags)         ? p.tags         : [];
  p.zahlungswege = Array.isArray(p.zahlungswege) && p.zahlungswege.length ? p.zahlungswege : wegeNeu();
  // Spar- und Zakat-Tag sind Pflicht.
  if(!p.tags.some(t => t.id === SPAR_TAG_ID)) p.tags.unshift({ ...SPAR_TAG });
  if(!p.tags.some(t => t.id === ZAKAT_TAG_ID)) p.tags.push({ ...ZAKAT_TAG });
  return p;
}

/** Der Zahlungsweg einer Position — mit Rückfall, falls er gelöscht wurde. */
function wegFuer(pos){
  const p = P();
  return p.zahlungswege.find(w => w.id === pos.zahlungsweg)
      || p.zahlungswege[0]
      || { id:"", name:"—", icon:"ic-bank", kontotyp:"giro" };
}

/** Ist diese Position Sparen statt Ausgabe? */
function istSparen(pos){
  return Array.isArray(pos.tags) && pos.tags.includes(SPAR_TAG_ID);
}

/** Ist diese Position eine Zakat-Zahlung? */
function istZakat(pos){
  return Array.isArray(pos.tags) && pos.tags.includes(ZAKAT_TAG_ID);
}

/* ----------------------------------------------------------------
   ZAKAT-ABGLEICH
   Was von der berechneten Pflicht läuft schon, was ist noch offen?
   ---------------------------------------------------------------- */

/** Die Position, die den offenen Rest abdeckt — oder null. */
function zakatRestPosition(){
  return P().ausgaben.find(a => a.zakatRest === true) || null;
}

/** Alle Zakat-Positionen außer der Restposition, Jahres-Cent. */
function zakatVerplant(){
  return aktivePosten()
    .filter(a => istZakat(a) && !a.zakatRest)
    .reduce((s,a) => s + jahresCent(a), 0);
}

/** Die einzelnen Zakat-Zahlungen, größte zuerst. */
function zakatPositionen(){
  return aktivePosten()
    .filter(a => istZakat(a) && !a.zakatRest)
    .sort((a,b) => jahresCent(b) - jahresCent(a));
}

/**
 * Gleicht die berechnete Pflicht mit dem ab, was schon läuft.
 * @param sollJahr die berechnete Zakat als Jahresbetrag in Cent
 */
function zakatAbgleich(sollJahr){
  const verplant = zakatVerplant();
  const rest = zakatRestPosition();
  const restJahr = rest && rest.aktiv !== false ? jahresCent(rest) : 0;
  const offen = Math.max(0, sollJahr - verplant);
  return {
    sollJahr, verplant, offen,
    restPosition: rest,
    restJahr,
    /* Weicht die Restposition vom rechnerisch Offenen ab? */
    restStimmt: rest ? Math.abs(restJahr - offen) < 100 : offen === 0,
    zuViel: Math.max(0, verplant - sollJahr)
  };
}

/** Prüft und repariert einen geladenen Zustand, ohne je abzustürzen. */
function zustandSaeubern(roh){
  const z = zustandNeu();
  if(!roh || typeof roh !== "object") return z;

  z.schemaVersion = SCHEMA_VERSION;
  z.einrichtungFertig = roh.einrichtungFertig === true;

  const e = roh.einstellungen && typeof roh.einstellungen === "object" ? roh.einstellungen : {};
  z.einstellungen.ansicht = (e.ansicht === "jahr") ? "jahr" : "monat";
  z.einstellungen.theme = ["hell","dunkel","auto"].includes(e.theme) ? e.theme : "auto";
  z.einstellungen.wochenstunden = Number.isFinite(+e.wochenstunden) ? klemmen(+e.wochenstunden,0,168) : 0;
  z.einstellungen.notgroschenZiel = Number.isFinite(+e.notgroschenZiel) ? Math.max(0, Math.round(+e.notgroschenZiel)) : 0;
  z.einstellungen.hochrechnungJahre = Number.isFinite(+e.hochrechnungJahre) ? klemmen(Math.round(+e.hochrechnungJahre),1,40) : 10;
  z.einstellungen.einfacheAnsicht = e.einfacheAnsicht === true;
  z.einstellungen.inflation = Number.isFinite(+e.inflation) ? klemmen(+e.inflation,0,20) : 2;
  /* Die Vermögenswerte des Zakat-Rechners zurückholen. */
  const zk = e.zakat && typeof e.zakat === "object" ? e.zakat : {};
  z.einstellungen.zakat = {
    schule: ["hanafi","schafii"].includes(zk.schule) ? zk.schule : "hanafi",
    grundlage: ["silber","gold"].includes(zk.grundlage) ? zk.grundlage : "silber",
    stand: typeof zk.stand === "string" ? zk.stand : null,
    stichtag: typeof zk.stichtag === "string" ? zk.stichtag : null,
    bezahltCent: Number.isFinite(+zk.bezahltCent) ? Math.max(0, Math.round(+zk.bezahltCent)) : 0,
    posten: []
  };

  if(Array.isArray(zk.posten)){
    z.einstellungen.zakat.posten = zk.posten.map(p => {
      if(!p || typeof p !== "object") return null;
      const art = ZAKAT_ARTEN[p.art] ? p.art : "geld";
      const roh = Number(p.wert);
      if(!Number.isFinite(roh) || roh < 0) return null;
      return {
        id: typeof p.id === "string" && p.id ? p.id : idNeu("zp"),
        name: (typeof p.name === "string" ? p.name.trim() : "").slice(0,50) || ZAKAT_ARTEN[art].name,
        art,
        /* Geldbeträge als ganze Cent, Mengen mit Nachkommastellen. */
        wert: ZAKAT_ARTEN[art].geld ? Math.round(roh) : roh
      };
    }).filter(Boolean);
  } else {
    /* Aus der früheren Fassung mit festen Feldern übernehmen. */
    const alt = [
      ["bargeld","Bargeld","geld"], ["guthaben","Guthaben auf Konten","geld"],
      ["handelsware","Handelsware","geld"], ["anlagen","Aktien, Fonds und Anlagen","geld"],
      ["forderungen","Geliehenes Geld","geld"], ["schulden","Fällige Schulden","schuld"],
      ["goldGramm","Gold","gold"], ["silberGramm","Silber","silber"]
    ];
    alt.forEach(([schluessel,name,art]) => {
      const w = Number(zk[schluessel]);
      if(Number.isFinite(w) && w > 0){
        z.einstellungen.zakat.posten.push({
          id: idNeu("zp"), name, art,
          wert: ZAKAT_ARTEN[art].geld ? Math.round(w) : w
        });
      }
    });
  }

  z.einstellungen.goldPreisCent = Number.isFinite(+e.goldPreisCent) ? Math.max(0, Math.round(+e.goldPreisCent)) : 0;
  z.einstellungen.btcPreisCent = Number.isFinite(+e.btcPreisCent) ? Math.max(0, Math.round(+e.btcPreisCent)) : 0;
  z.einstellungen.silberPreisCent = Number.isFinite(+e.silberPreisCent) ? Math.max(0, Math.round(+e.silberPreisCent)) : 0;
  z.einstellungen.preiseStand = typeof e.preiseStand === "string" ? e.preiseStand : null;
  z.einstellungen.preiseAusNetz = e.preiseAusNetz === true;
  z.einstellungen.kurseErlaubt = e.kurseErlaubt === true;
  z.einstellungen.sparSteigerung = Number.isFinite(+e.sparSteigerung) ? klemmen(+e.sparSteigerung,0,20) : 0;
  z.einstellungen.letzteSicherung = typeof e.letzteSicherung === "string" ? e.letzteSicherung : null;
  z.einstellungen.sicherungsHinweisAus = typeof e.sicherungsHinweisAus === "string" ? e.sicherungsHinweisAus : null;

  const profileRoh = Array.isArray(roh.profile) ? roh.profile : [];
  z.profile = profileRoh.map(prSaeubern).filter(Boolean);
  if(z.profile.length === 0) z.profile.push(profilNeu());
  const gewuenscht = z.profile.find(p => p.id === roh.aktivesProfil);
  z.aktivesProfil = gewuenscht ? gewuenscht.id : z.profile[0].id;
  return z;
}

function prSaeubern(roh){
  if(!roh || typeof roh !== "object") return null;
  const p = profilNeu(typeof roh.name === "string" && roh.name.trim() ? roh.name.trim().slice(0,60) : "Profil");
  if(typeof roh.id === "string" && roh.id) p.id = roh.id;

  p.konten = (Array.isArray(roh.konten) ? roh.konten : []).map(k => {
    if(!k || typeof k !== "object") return null;
    return {
      id: typeof k.id === "string" && k.id ? k.id : idNeu("ko"),
      name: (typeof k.name === "string" ? k.name.trim() : "").slice(0,60) || "Konto",
      typ: KONTOTYPEN[k.typ] ? k.typ : "giro",
      startsaldoCent: Number.isFinite(+k.startsaldoCent) ? Math.round(+k.startsaldoCent) : 0
    };
  }).filter(Boolean);

  p.tags = (Array.isArray(roh.tags) ? roh.tags : []).map(t => {
    if(!t || typeof t !== "object") return null;
    const id = typeof t.id === "string" && t.id ? t.id : idNeu("tg");
    if(id === SPAR_TAG_ID) return { ...SPAR_TAG };
    if(id === ZAKAT_TAG_ID) return { ...ZAKAT_TAG };
    return {
      id,
      name: (typeof t.name === "string" ? t.name.trim() : "").slice(0,40) || "Tag",
      farbe: PALETTE.includes(t.farbe) ? t.farbe : "p1"
    };
  }).filter(Boolean);
  // Spar- und Zakat-Tag sind nicht verhandelbar.
  if(!p.tags.some(t => t.id === SPAR_TAG_ID)) p.tags.unshift({ ...SPAR_TAG });
  if(!p.tags.some(t => t.id === ZAKAT_TAG_ID)) p.tags.push({ ...ZAKAT_TAG });

  /* Zahlungswege: entweder schon als Liste vorhanden (Schema 2) oder aus den
     festen Werten der ersten Fassung übernommen. */
  const wegeRoh = Array.isArray(roh.zahlungswege) ? roh.zahlungswege : [];
  p.zahlungswege = wegeRoh.map(w => {
    if(!w || typeof w !== "object") return null;
    return {
      id: typeof w.id === "string" && w.id ? w.id : idNeu("zw"),
      name: (typeof w.name === "string" ? w.name.trim() : "").slice(0,40) || "Zahlungsweg",
      icon: WEG_ICONS.includes(w.icon) ? w.icon : "ic-bank",
      kontotyp: KONTOTYPEN[w.kontotyp] ? w.kontotyp : "giro"
    };
  }).filter(Boolean);
  if(p.zahlungswege.length === 0) p.zahlungswege = wegeNeu();

  /* Übersetzungstabelle für Daten aus der ersten Fassung, in der der
     Zahlungsweg noch ein fester Text war. */
  const altWeg = {};
  [["bar","Bar"],["giro","Überweisung"],["lastschrift","Lastschrift"],
   ["tagesgeld","Tagesgeld"],["kreditkarte","Kreditkarte"]].forEach(([alt,neu]) => {
    const treffer = p.zahlungswege.find(w => w.name.toLowerCase() === neu.toLowerCase());
    if(treffer) altWeg[alt] = treffer.id;
  });

  const kontoIds = new Set(p.konten.map(k => k.id));
  const tagIds = new Set(p.tags.map(t => t.id));
  const wegIds = new Set(p.zahlungswege.map(w => w.id));

  /* Daten aus der ersten Fassung kannten das Spar-Tag noch nicht. Dort war
     Sparen eine ganz normale Ausgabe. Beim Übernehmen erkennen wir die
     eindeutigen Fälle an Name oder alter Kategorie und setzen das Tag —
     sonst wäre der Überschuss nach dem Umstieg zu niedrig. */
  const istAlteFassung = !Array.isArray(roh.zahlungswege);
  const SPAR_WOERTER = /spar(en|plan|buch|rate)?|notgroschen|r(ü|ue)cklage|altersvorsorge|verm(ö|oe)gensaufbau/i;

  p.einnahmen = (Array.isArray(roh.einnahmen) ? roh.einnahmen : []).map(x => {
    if(!x || typeof x !== "object") return null;
    return {
      id: typeof x.id === "string" && x.id ? x.id : idNeu("ei"),
      name: (typeof x.name === "string" ? x.name.trim() : "").slice(0,80) || "Einnahme",
      betragCent: Number.isFinite(+x.betragCent) ? Math.max(0, Math.round(+x.betragCent)) : 0,
      intervall: INTERVALLE[x.intervall] ? x.intervall : "monatlich",
      kontoId: kontoIds.has(x.kontoId) ? x.kontoId : null,
      eingangTag: Number.isFinite(+x.eingangTag) ? klemmen(Math.round(+x.eingangTag),1,31) : 1,
      art: ["netto","brutto"].includes(x.art) ? x.art : "netto",
      aktiv: x.aktiv !== false,
      notiz: (typeof x.notiz === "string" ? x.notiz : "").slice(0,400)
    };
  }).filter(Boolean);

  p.ausgaben = (Array.isArray(roh.ausgaben) ? roh.ausgaben : []).map(x => {
    if(!x || typeof x !== "object") return null;
    const tags = (Array.isArray(x.tags) ? x.tags : []).filter(t => tagIds.has(t));

    /* Alte Sparposten erkennen und markieren. */
    if(istAlteFassung && !tags.includes(SPAR_TAG_ID)){
      const text = (typeof x.name === "string" ? x.name : "") + " " + (typeof x.kategorie === "string" ? x.kategorie : "");
      if(SPAR_WOERTER.test(text)) tags.unshift(SPAR_TAG_ID);
    }

    /* Zahlungsweg: neue ID, sonst aus der ersten Fassung übersetzen. */
    let weg = null;
    if(wegIds.has(x.zahlungsweg)) weg = x.zahlungsweg;
    else if(altWeg[x.zahlungsweg]) weg = altWeg[x.zahlungsweg];
    else weg = p.zahlungswege[0].id;

    /* Die Kategorie gibt es nicht mehr. Damit nichts verlorengeht, wandert
       sie in die Notiz — aber nur, wenn sie dort noch nicht steht. */
    let notiz = (typeof x.notiz === "string" ? x.notiz : "");
    const alteKategorie = typeof x.kategorie === "string" ? x.kategorie.trim() : "";
    const name = (typeof x.name === "string" ? x.name.trim() : "").slice(0,80) || "Position";
    if(alteKategorie && alteKategorie !== "Sonstiges"
       && !name.toLowerCase().includes(alteKategorie.toLowerCase())
       && !notiz.toLowerCase().includes(alteKategorie.toLowerCase())){
      notiz = (notiz ? notiz + " · " : "") + alteKategorie;
    }

    return {
      id: typeof x.id === "string" && x.id ? x.id : idNeu("au"),
      name,
      betragCent: Number.isFinite(+x.betragCent) ? Math.max(0, Math.round(+x.betragCent)) : 0,
      intervall: INTERVALLE[x.intervall] ? x.intervall : "monatlich",
      zahlungsweg: weg,
      kontoId: kontoIds.has(x.kontoId) ? x.kontoId : null,
      faelligTag: Number.isFinite(+x.faelligTag) ? klemmen(Math.round(+x.faelligTag),1,31) : 1,
      startMonat: Number.isFinite(+x.startMonat) ? klemmen(Math.round(+x.startMonat),1,12) : 1,
      tags,
      prioritaet: PRIORITAETEN[x.prioritaet] ? x.prioritaet : "variabel",
      aktiv: x.aktiv !== false,
      notiz: notiz.slice(0,400),
      /* Nur für Sparposten: erwartete Rendite in Prozent pro Jahr und der Betrag,
         der heute schon zurückgelegt ist. Beides pflegt der Nutzer selbst —
         Lohnwerk schreibt Bestände niemals von allein fort. */
      /* Das Feld hieß in einer früheren Fassung „zinsProzent“. Beim Laden
         nehmen wir den alten Wert mit, damit nichts verlorengeht. */
      renditeProzent: Number.isFinite(+x.renditeProzent) ? klemmen(+x.renditeProzent,0,30)
                    : Number.isFinite(+x.zinsProzent) ? klemmen(+x.zinsProzent,0,30) : 0,
      /* Kennzeichnet die Position, die den noch offenen Zakat-Rest abdeckt.
         Sie wird bei der Frage „was ist schon verplant“ nicht mitgezählt,
         sonst würde sie sich selbst erfüllen. */
      zakatRest: x.zakatRest === true,
      bestandCent: Number.isFinite(+x.bestandCent) ? Math.max(0, Math.round(+x.bestandCent)) : 0,
      zielCent: Number.isFinite(+x.zielCent) ? Math.max(0, Math.round(+x.zielCent)) : 0
    };
  }).filter(Boolean);

  return p;
}

/** Lädt aus dem Browserspeicher. Kaputte Daten werden beiseitegelegt. */
function laden(){
  let roh = null;
  try{
    roh = localStorage.getItem(SPEICHER_SCHLUESSEL);
  }catch(fehler){
    // Speicher gesperrt (z. B. privater Modus mit Blockade) — wir arbeiten flüchtig weiter.
    S = zustandNeu();
    return;
  }
  if(!roh){ S = zustandNeu(); return; }
  try{
    const daten = JSON.parse(roh);
    S = zustandSaeubern(daten);
  }catch(fehler){
    ladeFehler = true;
    try{ localStorage.setItem(SPEICHER_DEFEKT, roh); }catch(f2){ /* kein Platz — dann eben nicht */ }
    S = zustandNeu();
  }
}

let speicherBlockiert = false;

function speichernSofort(){
  try{
    localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(S));
    speicherBlockiert = false;
  }catch(fehler){
    if(!speicherBlockiert){
      speicherBlockiert = true;
      toast("Speichern nicht möglich. Der Browser lässt keinen Speicherplatz zu.", null, 8000);
    }
  }
}
const speichern = entprellen(speichernSofort, 300);

/** Nach jeder Änderung: speichern und die Oberfläche neu zeichnen. */
function aendern(neuZeichnen = true){
  speichern();
  if(neuZeichnen) zeichnen();
}

/* ================================================================
   4. BERECHNUNGEN
   Alles läuft über Jahres-Cent als ganze Zahl.
   Monat = Jahr / 12 — erst bei der Anzeige gerundet.
   ================================================================ */

/** Jahresbetrag einer Position in Cent. Wöchentlich = Betrag × 52. */
function jahresCent(pos){
  if(!pos || pos.aktiv === false) return 0;
  const iv = INTERVALLE[pos.intervall];
  if(!iv) return 0;
  const c = Number.isFinite(pos.betragCent) ? pos.betragCent : 0;
  return Math.round(c * iv.faktor);
}
/** Monatsbetrag in Cent (gerundet, nur für die Anzeige einzelner Zeilen). */
function monatsCent(pos){
  return Math.round(jahresCent(pos) / 12);
}
/** Der Wert im gerade gewählten Zeitraum. */
function imZeitraum(jahresWert){
  return S.einstellungen.ansicht === "jahr" ? jahresWert : jahresWert / 12;
}
function zeitraumWort(){
  return S.einstellungen.ansicht === "jahr" ? "im Jahr" : "im Monat";
}
function zeitraumKurz(){
  return S.einstellungen.ansicht === "jahr" ? "/Jahr" : "/Monat";
}
/** Formatiert einen Jahres-Cent-Wert im aktuell gewählten Zeitraum. */
function euroZ(jahresWert){
  return euro(imZeitraum(jahresWert));
}

/** Aktive Positionen des aktuellen Profils. */
function aktiveEinnahmen(){ return P().einnahmen.filter(x => x.aktiv !== false); }
/** Alle aktiven Positionen — Ausgaben und Sparposten zusammen. */
function aktivePosten(){ return P().ausgaben.filter(x => x.aktiv !== false); }
/** Nur echte Ausgaben — Geld, das weg ist. */
function aktiveAusgaben(){ return aktivePosten().filter(x => !istSparen(x)); }
/** Nur Sparposten — Geld, das dir erhalten bleibt. */
function aktiveSparposten(){ return aktivePosten().filter(istSparen); }

function summeJahr(liste){
  return liste.reduce((s,x) => s + jahresCent(x), 0);
}

/**
 * Die zentrale Kennzahl-Berechnung.
 *
 * Wichtige Regel: Sparen ist keine Ausgabe. Was du zur Seite legst, ist
 * weiterhin dein Geld. Deshalb gilt
 *      Überschuss = Einnahmen − Ausgaben
 * und der Sparplan wird davon nur noch aufgeteilt:
 *      Überschuss = fester Sparplan + frei verfügbar
 * Alles, was am Monatsende übrig ist, zählt ebenfalls als Sparen.
 *
 * Optional mit einem "Was wäre wenn"-Szenario:
 *   { einnahmenFaktor, ausgabenFaktor, ausgeblendet:Set }
 */
function kennzahlen(szenario = null){
  const ein = aktiveEinnahmen();
  let posten = aktivePosten();
  if(szenario && szenario.ausgeblendet && szenario.ausgeblendet.size > 0){
    posten = posten.filter(a => !szenario.ausgeblendet.has(a.id));
  }
  const fE = szenario ? szenario.einnahmenFaktor : 1;
  const fA = szenario ? szenario.ausgabenFaktor : 1;

  const aus   = posten.filter(a => !istSparen(a));
  const spar  = posten.filter(istSparen);

  const einnahmenJahr = Math.round(summeJahr(ein) * fE);
  const ausgabenJahr  = Math.round(summeJahr(aus) * fA);
  const sparplanJahr  = Math.round(summeJahr(spar) * fA);

  const ueberschussJahr = einnahmenJahr - ausgabenJahr;
  const freiJahr = ueberschussJahr - sparplanJahr;   // kann negativ werden
  const sparquote = einnahmenJahr > 0 ? (ueberschussJahr / einnahmenJahr * 100) : null;

  // Bar-Bedarf: alle Posten, deren Zahlungsweg auf ein Bargeldkonto zeigt.
  const barJahr = Math.round(posten
    .filter(a => wegFuer(a).kontotyp === "bargeld")
    .reduce((s,a)=>s+jahresCent(a),0) * fA);

  // Fixkosten und variable Kosten — Sparposten bleiben außen vor.
  const fixJahr = Math.round(aus.filter(a => a.prioritaet === "fix").reduce((s,a)=>s+jahresCent(a),0) * fA);
  const varJahr = Math.round(aus.filter(a => a.prioritaet === "variabel").reduce((s,a)=>s+jahresCent(a),0) * fA);
  const luxJahr = Math.round(aus.filter(a => a.prioritaet === "luxus").reduce((s,a)=>s+jahresCent(a),0) * fA);

  // Rücklage: alles, was nicht monatlich oder öfter anfällt.
  const ruecklageJahr = Math.round(aus
    .filter(a => ["zweimonatlich","vierteljaehrlich","halbjaehrlich","jaehrlich","einmalig"].includes(a.intervall))
    .reduce((s,a)=>s+jahresCent(a),0) * fA);

  return {
    einnahmenJahr, ausgabenJahr, sparplanJahr, ueberschussJahr, freiJahr, sparquote,
    barJahr, fixJahr, varJahr, luxJahr, ruecklageJahr,
    anzahlEinnahmen: ein.length, anzahlAusgaben: aus.length, anzahlSpar: spar.length
  };
}

/** Ordnet eine Position einem Konto zu — direkt oder über den Zahlungsweg. */
function kontoFuer(pos){
  const p = P();
  if(pos.kontoId){
    const k = p.konten.find(k => k.id === pos.kontoId);
    if(k) return k;
  }
  const wunschTyp = wegFuer(pos).kontotyp;
  if(wunschTyp){
    const k = p.konten.find(k => k.typ === wunschTyp);
    if(k) return k;
  }
  return null;
}

/** Summen je Zahlungsweg (Jahres-Cent), absteigend. */
function summenNachZahlungsweg(){
  const p = P();
  const map = new Map();
  p.zahlungswege.forEach(w => map.set(w.id, { weg:w, jahr:0, sparJahr:0, anzahl:0 }));
  aktivePosten().forEach(a => {
    const w = wegFuer(a);
    if(!map.has(w.id)) return;
    const e = map.get(w.id);
    e.jahr += jahresCent(a);
    if(istSparen(a)) e.sparJahr += jahresCent(a);
    e.anzahl++;
  });
  return Array.from(map.values()).sort((a,b) => b.jahr - a.jahr);
}

/** Summen je Konto (Jahres-Cent), inklusive "ohne Konto". */
function summenNachKonto(){
  const p = P();
  const map = new Map();
  p.konten.forEach(k => map.set(k.id, { konto:k, jahr:0, anzahl:0 }));
  let ohne = { konto:null, jahr:0, anzahl:0 };
  aktivePosten().forEach(a => {
    const k = kontoFuer(a);
    if(k && map.has(k.id)){
      const e = map.get(k.id);
      e.jahr += jahresCent(a); e.anzahl++;
    } else {
      ohne.jahr += jahresCent(a); ohne.anzahl++;
    }
  });
  const liste = Array.from(map.values()).filter(e => e.anzahl > 0 || e.jahr !== 0);
  if(ohne.anzahl > 0) liste.push(ohne);
  liste.sort((a,b) => b.jahr - a.jahr);
  return liste;
}

/**
 * Summen je Tag (Jahres-Cent).
 * Achtung: Eine Position kann mehrere Tags haben, deshalb ergibt die Summe
 * aller Tags mehr als die Gesamtausgaben. Die Oberfläche sagt das dazu.
 */
function summenNachTag(nurAusgaben = true){
  const p = P();
  const map = new Map();
  p.tags.forEach(t => map.set(t.id, { tag:t, jahr:0, anzahl:0 }));
  let ohne = 0, ohneAnzahl = 0;
  const quelle = nurAusgaben ? aktiveAusgaben() : aktivePosten();
  quelle.forEach(a => {
    const eigene = (a.tags||[]).filter(t => t !== SPAR_TAG_ID);
    if(eigene.length === 0){ ohne += jahresCent(a); ohneAnzahl++; }
    (a.tags||[]).forEach(tid => {
      if(map.has(tid)){ const e = map.get(tid); e.jahr += jahresCent(a); e.anzahl++; }
    });
  });
  const liste = Array.from(map.values());
  liste.sort((a,b) => b.jahr - a.jahr);
  return { liste, ohneJahr:ohne, ohneAnzahl };
}

/**
 * Ordnet jede Ausgabe genau EINEM Tag zu — dem ersten, den sie trägt.
 * Damit ergeben Donut und Rangliste in Summe wieder exakt die Ausgaben.
 */
function summenNachHauptTag(){
  const p = P();
  const map = new Map();
  let ohne = { name:"Ohne Tag", jahr:0, anzahl:0, farbe:"var(--text-3)" };
  aktiveAusgaben().forEach(a => {
    const erstes = (a.tags||[]).find(t => t !== SPAR_TAG_ID);
    const tag = erstes ? p.tags.find(t => t.id === erstes) : null;
    if(!tag){ ohne.jahr += jahresCent(a); ohne.anzahl++; return; }
    if(!map.has(tag.id)) map.set(tag.id, { name:tag.name, jahr:0, anzahl:0, farbe:tagFarbe(tag), tagId:tag.id });
    const e = map.get(tag.id);
    e.jahr += jahresCent(a); e.anzahl++;
  });
  const liste = Array.from(map.values()).sort((a,b) => b.jahr - a.jahr);
  if(ohne.anzahl > 0) liste.push(ohne);
  return liste;
}

/* ----------------------------------------------------------------
   SPAREN — der eigene Rechenbereich

   Grundsatz: Lohnwerk schreibt niemals von allein Bestände fort.
   Was auf deinen Konten liegt, trägst nur du ein. Alle Zahlen hier
   sind Prognosen mit klarer Beschriftung, keine Kontostände.
   ---------------------------------------------------------------- */

/** Alle Sparposten mit ihren Kennzahlen, größte zuerst. */
function sparUebersicht(){
  const posten = aktiveSparposten().map(a => ({
    pos: a,
    jahr: jahresCent(a),
    monat: jahresCent(a) / 12,
    rendite: Number.isFinite(a.renditeProzent) ? a.renditeProzent : 0,
    bestand: Number.isFinite(a.bestandCent) ? a.bestandCent : 0,
    ziel: Number.isFinite(a.zielCent) ? a.zielCent : 0
  })).sort((a,b) => b.jahr - a.jahr);

  const sparplanJahr = posten.reduce((s,x) => s + x.jahr, 0);
  const bestandGesamt = posten.reduce((s,x) => s + x.bestand, 0);
  const k = kennzahlen();
  /* Die Mischrendite: nach Sparbetrag gewichtet. Ohne Beiträge nach Bestand. */
  const basis = sparplanJahr > 0 ? sparplanJahr : bestandGesamt;
  const mischRendite = basis > 0
    ? posten.reduce((s,x) => s + x.rendite * ((sparplanJahr > 0 ? x.jahr : x.bestand) / basis), 0)
    : 0;

  return {
    posten, sparplanJahr, bestandGesamt, mischRendite,
    freiJahr: k.freiJahr,
    gesamtSparenJahr: k.ueberschussJahr,   // Sparplan + was übrig bleibt
    sparquote: k.sparquote
  };
}

/**
 * Entwicklung eines Sparpostens über N Jahre.
 * Liefert je Jahr: eingezahlt, Gewinn, Endwert und Kaufkraft in heutigem Geld.
 *
 * @param startCent   was heute schon da ist
 * @param proJahrCent was jährlich dazukommt
 * @param renditeProzent erwartete Rendite pro Jahr
 * @param jahre       Laufzeit
 * @param inflation   angenommene Geldentwertung pro Jahr
 * @param steigerung  jährliche Erhöhung des Sparbetrags
 */
function sparVerlauf(startCent, proJahrCent, renditeProzent, jahre, inflation = 0, steigerung = 0){
  const r = (Number.isFinite(renditeProzent) ? renditeProzent : 0) / 100;
  const i = (Number.isFinite(inflation) ? inflation : 0) / 100;
  const g = (Number.isFinite(steigerung) ? steigerung : 0) / 100;
  const reihe = [];
  let wert = Math.max(0, startCent || 0);
  let eingezahlt = wert;
  let rate = Math.max(0, proJahrCent || 0);

  reihe.push({ jahr:0, wert, eingezahlt, gewinn:0, kaufkraft:wert });
  for(let j = 1; j <= jahre; j++){
    // Monatliche Einzahlung, monatlich verrechnet — das trifft die Realität besser.
    const rm = r / 12;
    const monatsRate = rate / 12;
    for(let m = 0; m < 12; m++){
      wert = wert * (1 + rm) + monatsRate;
    }
    eingezahlt += rate;
    const kaufkraft = i > 0 ? wert / Math.pow(1 + i, j) : wert;
    reihe.push({
      jahr: j,
      wert: Math.round(wert),
      eingezahlt: Math.round(eingezahlt),
      gewinn: Math.round(wert - eingezahlt),
      kaufkraft: Math.round(kaufkraft)
    });
    rate = rate * (1 + g);
  }
  return reihe;
}

/**
 * Der Gesamtverlauf über alle Sparposten — jeder mit seiner eigenen Rendite.
 * Optional zählt der frei verfügbare Rest mit (er wird ja auch gespart).
 */
function sparVerlaufGesamt(jahre, mitFreiemRest = true){
  const u = sparUebersicht();
  const inf = S.einstellungen.inflation || 0;
  const stg = S.einstellungen.sparSteigerung || 0;
  const gesamt = [];
  for(let j = 0; j <= jahre; j++) gesamt.push({ jahr:j, wert:0, eingezahlt:0, gewinn:0, kaufkraft:0 });

  u.posten.forEach(x => {
    const reihe = sparVerlauf(x.bestand, x.jahr, x.rendite, jahre, inf, stg);
    reihe.forEach((r,idx) => {
      gesamt[idx].wert += r.wert;
      gesamt[idx].eingezahlt += r.eingezahlt;
      gesamt[idx].gewinn += r.gewinn;
      gesamt[idx].kaufkraft += r.kaufkraft;
    });
  });

  /* Was am Monatsende übrig bleibt, landet ohne Gewinnannahme auf der Seite —
     ohne Zuwachs, weil unklar ist, wo es liegt. Ehrlicher als zu raten. */
  if(mitFreiemRest && u.freiJahr > 0){
    const reihe = sparVerlauf(0, u.freiJahr, 0, jahre, inf, stg);
    reihe.forEach((r,idx) => {
      gesamt[idx].wert += r.wert;
      gesamt[idx].eingezahlt += r.eingezahlt;
      gesamt[idx].kaufkraft += r.kaufkraft;
    });
  }
  return gesamt;
}

/** Wie lange dauert es, bis ein Sparziel erreicht ist? Monate oder null. */
function monateBisZiel(startCent, proMonatCent, zielCent, renditeProzent){
  if(!(zielCent > 0)) return null;
  if(startCent >= zielCent) return 0;
  if(!(proMonatCent > 0)) return null;
  const rm = (renditeProzent || 0) / 100 / 12;
  let wert = startCent;
  for(let m = 1; m <= 1200; m++){          // höchstens 100 Jahre
    wert = wert * (1 + rm) + proMonatCent;
    if(wert >= zielCent) return m;
  }
  return null;
}

/**
 * Fällt eine Position in einem bestimmten Monat an? (1 = Januar)
 * Nicht-monatliche Positionen starten in ihrem Startmonat und wiederholen sich
 * im Rhythmus des Intervalls.
 */
function faelligImMonat(pos, monat1bis12){
  const iv = INTERVALLE[pos.intervall];
  if(!iv || !iv.kalender) return false;
  const schritt = 12 / iv.faktor;              // monatlich=1, jährlich=12 …
  if(pos.intervall === "einmalig") return monat1bis12 === (pos.startMonat || 1);
  const start = (pos.startMonat || 1) - 1;
  const diff = ((monat1bis12 - 1) - start + 12) % 12;
  return diff % schritt === 0;
}

/** Der tatsächlich in diesem Monat abgebuchte Betrag in Cent. */
function betragImMonat(pos, monat1bis12){
  const iv = INTERVALLE[pos.intervall];
  if(!iv) return 0;
  if(!iv.kalender){
    // Wöchentlich / 14-tägig: gleichmäßig auf jeden Monat verteilt.
    // Bewusst ohne Rundung, damit die Summe über zwölf Monate exakt bleibt.
    return pos.betragCent * iv.faktor / 12;
  }
  return faelligImMonat(pos, monat1bis12) ? pos.betragCent : 0;
}

/** Der Jahresverlauf: 12 Werte in Cent. */
function jahresverlauf(){
  const werte = [];
  for(let m=1; m<=12; m++){
    let summe = 0;
    aktiveAusgaben().forEach(a => summe += betragImMonat(a, m));
    werte.push(summe);
  }
  return werte;
}

/** Alle Positionen, die an einem bestimmten Tag eines Monats fällig sind. */
function faelligkeitenProTag(monat1bis12){
  const map = new Map();
  aktiveAusgaben().forEach(a => {
    const iv = INTERVALLE[a.intervall];
    if(!iv || !iv.kalender) return;
    if(!faelligImMonat(a, monat1bis12)) return;
    const tag = klemmen(a.faelligTag || 1, 1, 31);
    if(!map.has(tag)) map.set(tag, { tag, summe:0, positionen:[] });
    const e = map.get(tag);
    e.summe += a.betragCent;
    e.positionen.push(a);
  });
  return map;
}

/** Die nächsten Abbuchungen ab heute, über die Monatsgrenze hinaus. */
function naechsteAbbuchungen(anzahl = 5){
  const jetzt = heute();
  const heuteTag = jetzt.getDate();
  const treffer = [];
  for(let versatz = 0; versatz < 3 && treffer.length < anzahl * 3; versatz++){
    const d = new Date(jetzt.getFullYear(), jetzt.getMonth() + versatz, 1);
    const monat = d.getMonth() + 1;
    const tageImMonat = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    aktiveAusgaben().forEach(a => {
      const iv = INTERVALLE[a.intervall];
      if(!iv || !iv.kalender) return;
      if(!faelligImMonat(a, monat)) return;
      const tag = Math.min(klemmen(a.faelligTag||1,1,31), tageImMonat);
      if(versatz === 0 && tag < heuteTag) return;
      treffer.push({ pos:a, tag, monat, jahr:d.getFullYear(), versatz,
                     sortier: versatz*100 + tag });
    });
  }
  treffer.sort((a,b) => a.sortier - b.sortier || b.pos.betragCent - a.pos.betragCent);
  return treffer.slice(0, anzahl);
}

/**
 * Der Monatsanfang-Plan: Was muss nach dem Gehaltseingang wohin?
 * Genau das, was der Nutzer am 1. wissen will — gruppiert nach Zahlungsweg,
 * getrennt in "geht weg" und "bleibt dein Geld".
 */
function ueberweisungsplan(){
  const k = kennzahlen();
  const eintraege = [];

  summenNachZahlungsweg().filter(w => w.jahr > 0).forEach(w => {
    const ausgabenTeil = w.jahr - w.sparJahr;
    const typ = w.weg.kontotyp;
    const verb = typ === "bargeld" ? "abheben"
               : typ === "giro" ? "auf dem Girokonto lassen"
               : typ === "kreditkarte" ? "für die Kreditkarte bereithalten"
               : "überweisen";
    if(ausgabenTeil > 0){
      eintraege.push({ name:w.weg.name, text:verb, jahr:ausgabenTeil, icon:w.weg.icon, sparen:false });
    }
    if(w.sparJahr > 0){
      eintraege.push({ name:w.weg.name, text:"zur Seite legen", jahr:w.sparJahr, icon:"ic-sparen", sparen:true });
    }
  });

  return {
    eintraege,
    ruecklageJahr: k.ruecklageJahr,
    freiJahr: k.freiJahr,
    einnahmenJahr: k.einnahmenJahr,
    sparplanJahr: k.sparplanJahr
  };
}

/** Fixkosten für X Monate — Grundlage des Notgroschens. */
function notgroschenBedarf(monate = 3){
  const k = kennzahlen();
  return Math.round(k.fixJahr / 12 * monate);
}

/** 50/30/20: Bedarf, Wünsche, Sparen — jeweils Jahres-Cent. */
function regel503020(){
  let bedarf = 0, wuensche = 0;
  aktiveAusgaben().forEach(a => {
    const j = jahresCent(a);
    if(a.prioritaet === "luxus") wuensche += j;
    else bedarf += j;
  });
  const k = kennzahlen();
  // Sparen ist alles, was übrig bleibt — Sparplan und freier Rest zusammen.
  const sparen = Math.max(0, k.ueberschussJahr);
  return { bedarf, wuensche, sparen, basis:k.einnahmenJahr };
}

/** Kündigungs-Kandidaten: Tag "Kündbar" oder Priorität "Luxus". */
function kuendigungsKandidaten(){
  const p = P();
  const kuendbarTag = p.tags.find(t => t.name.toLowerCase().startsWith("kündbar"));
  return aktiveAusgaben()
    .filter(a => a.prioritaet === "luxus" || (kuendbarTag && a.tags.includes(kuendbarTag.id)))
    .sort((a,b) => jahresCent(b) - jahresCent(a));
}

/** Stundenlohn in Cent — nur wenn Wochenstunden eingetragen sind. */
function stundenlohnCent(){
  const std = S.einstellungen.wochenstunden;
  if(!std || std <= 0) return null;
  const k = kennzahlen();
  if(k.einnahmenJahr <= 0) return null;
  const jahresStunden = std * 52;
  if(jahresStunden <= 0) return null;
  return k.einnahmenJahr / jahresStunden;
}

/** Wie viele Arbeitsstunden kostet eine Position im Jahr? */
function arbeitsstunden(jahresBetragCent){
  const lohn = stundenlohnCent();
  if(!lohn || lohn <= 0) return null;
  return jahresBetragCent / lohn;
}

/**
 * Hochrechnung über N Monate: Was ist dann da, und was ist es real noch wert?
 * Rechnet jeden Sparposten mit seiner eigenen Rendite.
 */
function hochrechnung(monate){
  const jahre = monate / 12;
  const reihe = sparVerlaufGesamt(Math.ceil(jahre), true);
  const ganz = Math.floor(jahre);
  const a = reihe[Math.min(ganz, reihe.length-1)];
  const b = reihe[Math.min(ganz+1, reihe.length-1)];
  const anteil = jahre - ganz;
  const misch = (x,y) => Math.round(x + (y - x) * anteil);
  return {
    wert:       misch(a.wert, b.wert),
    eingezahlt: misch(a.eingezahlt, b.eingezahlt),
    gewinn:     misch(a.gewinn, b.gewinn),
    kaufkraft:  misch(a.kaufkraft, b.kaufkraft)
  };
}

/** Die kurze Beschreibung unter dem Namen einer Position. */
function postenUnterzeile(a){
  const p = P();
  const iv = INTERVALLE[a.intervall];
  const teile = [iv.name];
  if(iv.kalender && a.intervall !== "einmalig" && a.intervall !== "monatlich"){
    teile.push(`${a.faelligTag}. ab ${MONATE_KURZ[(a.startMonat||1)-1]}`);
  } else if(a.intervall === "monatlich"){
    teile.push(`am ${a.faelligTag}.`);
  } else if(a.intervall === "einmalig"){
    teile.push(`im ${MONATE_KURZ[(a.startMonat||1)-1]}`);
  }
  teile.push(wegFuer(a).name);
  if(istSparen(a) && a.renditeProzent > 0){
    teile.push(nfProzent.format(a.renditeProzent).replace(",0","") + " % Rendite");
  }
  if(a.aktiv === false) teile.push("pausiert");
  return teile.join(" · ");
}

/** Die Farbe eines Tags als CSS-Wert. */
function tagFarbe(tag){
  return `var(--${PALETTE.includes(tag?.farbe) ? tag.farbe : "p1"})`;
}
function palettenFarbe(index){
  return `var(--${PALETTE[index % PALETTE.length]})`;
}

/* ---------- Toasts mit Rückgängig ---------- */

let toastZaehler = 0;
function toast(text, rueckgaengig = null, dauer = 6000){
  const bereich = $("#toast-bereich");
  const meins = ++toastZaehler;
  const knopf = rueckgaengig
    ? el("button",{ type:"button", text:"Rückgängig", onclick:() => { rueckgaengig(); weg(); } })
    : null;
  const t = el("div",{ class:"toast", role:"status" },
    el("div",{ class:"text", text }),
    knopf
  );
  bereich.appendChild(t);
  let zeit = setTimeout(weg, dauer);
  function weg(){
    clearTimeout(zeit);
    if(!t.isConnected) return;
    t.classList.add("weg");
    setTimeout(() => t.remove(), 220);
  }
  // Nie mehr als drei Toasts gleichzeitig.
  while(bereich.children.length > 3) bereich.firstElementChild.remove();
  return { schliessen: weg, id: meins };
}

/* ---------- Modale Dialoge (zwei Ebenen möglich) ---------- */

const dialogStapel = [];

function dialogOeffnen({ titel, koerper, fuss, ebene = 1, beimSchliessen = null, breite = null }){
  const o = ebene === 2 ? $("#overlay2") : $("#overlay");
  const kBox = ebene === 2 ? $("#sheet2-koerper") : $("#sheet-koerper");
  const fBox = ebene === 2 ? $("#sheet2-fuss") : $("#sheet-fuss");
  const tBox = ebene === 2 ? $("#sheet2-titel") : $("#sheet-titel");

  tBox.textContent = titel;
  kBox.replaceChildren();
  fBox.replaceChildren();
  if(koerper) kBox.appendChild(koerper);
  if(fuss){ fBox.appendChild(fuss); fBox.style.display = ""; } else { fBox.style.display = "none"; }

  o.hidden = false;
  // Ein Frame warten, damit die Einblend-Animation greift.
  requestAnimationFrame(() => o.classList.add("offen"));
  document.body.style.overflow = "hidden";
  kBox.scrollTop = 0;

  dialogStapel.push({ ebene, beimSchliessen, vorherFokus: document.activeElement });

  // Erstes sinnvolles Feld fokussieren.
  setTimeout(() => {
    const ziel = kBox.querySelector("[data-autofokus]") || kBox.querySelector("input:not([type=hidden]), textarea, select");
    if(ziel && window.matchMedia("(min-width:700px)").matches) ziel.focus();
    else if(ziel && ziel.dataset.autofokus !== undefined) ziel.focus();
  }, 280);
  return { koerper:kBox, fuss:fBox };
}

function dialogSchliessen(ebene = null){
  const oben = dialogStapel[dialogStapel.length - 1];
  if(!oben) return;
  if(ebene !== null && oben.ebene !== ebene) return;
  dialogStapel.pop();
  const o = oben.ebene === 2 ? $("#overlay2") : $("#overlay");
  o.classList.remove("offen");
  setTimeout(() => {
    o.hidden = true;
    if(dialogStapel.length === 0) document.body.style.overflow = "";
  }, 260);
  if(typeof oben.beimSchliessen === "function") oben.beimSchliessen();
  if(oben.vorherFokus && typeof oben.vorherFokus.focus === "function" && dialogStapel.length === 0){
    try{ oben.vorherFokus.focus({ preventScroll:true }); }catch(f){}
  }
}

function alleDialogeSchliessen(){
  while(dialogStapel.length) dialogSchliessen();
}

/** Ein einfacher Bestätigungsdialog — ersetzt confirm(). */
function bestaetigen({ titel, text, knopfText = "Bestätigen", gefahr = false, ebene = 1, dann }){
  const koerper = el("div",{},
    el("p",{ class:"t-body", style:"color:var(--text-2);line-height:1.5", text })
  );
  const fuss = el("div",{ style:"display:flex;gap:8px;width:100%" },
    el("button",{ class:"knopf", type:"button", style:"flex:1", text:"Abbrechen",
      onclick:() => dialogSchliessen(ebene) }),
    el("button",{ class:"knopf "+(gefahr?"gefahr-voll":"primaer"), type:"button", style:"flex:1", text:knopfText,
      onclick:() => { dialogSchliessen(ebene); dann(); } })
  );
  dialogOeffnen({ titel, koerper, fuss, ebene });
}

/* Diese Ansichten haben keinen eigenen Reiter mehr — sie werden aus den
   Einstellungen heraus geöffnet und bekommen deshalb einen Rückweg. */
const UNTERANSICHTEN = { einnahmen:"einstellungen", ausgaben:"einstellungen" };

function navigieren(ziel){
  if(!ANSICHT_TITEL[ziel]) ziel = "uebersicht";
  aktiveAnsicht = ziel;
  UI.auswahlModus = false;
  UI.auswahl.clear();
  $$(".ansicht").forEach(a => a.classList.toggle("aktiv", a.id === "v-"+ziel));

  /* Unteransichten markieren den Reiter, aus dem sie kommen. */
  const reiter = UNTERANSICHTEN[ziel] || ziel;
  $$("[data-nav]").forEach(b => {
    if(b.dataset.nav === reiter) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });

  const zurueck = $("#kopf-zurueck");
  if(UNTERANSICHTEN[ziel]){
    zurueck.hidden = false;
    zurueck.onclick = () => navigieren(UNTERANSICHTEN[ziel]);
  } else {
    zurueck.hidden = true;
    zurueck.onclick = null;
  }

  $("#kopf-h1").textContent = ANSICHT_TITEL[ziel];
  $("#inhalt").scrollTop = 0;
  window.scrollTo({ top:0, behavior:"instant" in window ? "instant" : "auto" });
  zeichnen();
}

      el("span",{ class:"rechts" }, "Löschen", icon("ic-muell"))

/**
 * Wischen: nach links löschen, nach rechts duplizieren.
 * Bewusst nur auf Touch-Geräten — mit der Maus stört das Verhalten eher.
 */
function wischGesteAnbinden(huelle, zeileEl, aufLoeschen, aufDuplizieren){
  let startX = 0, startY = 0, dx = 0, aktiv = false, entschieden = false, richtung = null;
  const SCHWELLE = 78;

  zeileEl.addEventListener("touchstart", (e) => {
    if(UI.auswahlModus) return;
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dx = 0; aktiv = true; entschieden = false; richtung = null;
    zeileEl.style.transition = "none";
  }, { passive:true });

  zeileEl.addEventListener("touchmove", (e) => {
    if(!aktiv) return;
    const x = e.touches[0].clientX - startX;
    const y = e.touches[0].clientY - startY;
    if(!entschieden){
      if(Math.abs(x) < 8 && Math.abs(y) < 8) return;
      entschieden = true;
      richtung = Math.abs(x) > Math.abs(y) * 1.4 ? "quer" : "hoch";
    }
    if(richtung !== "quer"){ aktiv = false; zeileEl.style.transform = ""; return; }
    dx = x;
    if(dx < 0 && !aufLoeschen) dx = 0;
    if(dx > 0 && !aufDuplizieren) dx = 0;
    // Widerstand über der Schwelle
    const gezeigt = Math.abs(dx) > SCHWELLE
      ? Math.sign(dx) * (SCHWELLE + (Math.abs(dx)-SCHWELLE) * 0.35)
      : dx;
    zeileEl.style.transform = `translateX(${gezeigt}px)`;
    huelle.dataset.wisch = dx < 0 ? "loeschen" : "duplizieren";
  }, { passive:true });

  const beenden = () => {
    if(!aktiv) return;
    aktiv = false;
    zeileEl.style.transition = "transform 220ms cubic-bezier(.4,0,.2,1)";
    const ausgeloest = Math.abs(dx) > SCHWELLE;
    zeileEl.style.transform = "";
    if(ausgeloest){
      if(dx < 0 && aufLoeschen) setTimeout(aufLoeschen, 120);
      else if(dx > 0 && aufDuplizieren) setTimeout(aufDuplizieren, 120);
    }
    setTimeout(() => { delete huelle.dataset.wisch; }, 240);
    dx = 0;
  };
  zeileEl.addEventListener("touchend", beenden, { passive:true });
  zeileEl.addEventListener("touchcancel", beenden, { passive:true });
}

/** Ein aufklappbarer Abschnitt. */
function klapp(titel, inhaltFn, offen = false){
  const d = el("details",{ class:"klapp" },
    el("summary",{},
      el("span",{ text:titel }),
      el("span",{ class:"pfeil" }, icon("ic-runter"))
    )
  );
  if(offen) d.open = true;
  const box = el("div",{ class:"klapp-inhalt" });
  d.appendChild(box);
  let gefuellt = false;
  const fuellen = () => { if(!gefuellt){ box.appendChild(inhaltFn()); gefuellt = true; } };
  if(offen) fuellen();
  d.addEventListener("toggle", () => { if(d.open) fuellen(); });
  return d;
}

/** Lässt eine Zahl beim ersten Laden kurz hochzählen. */
function zahlHochzaehlen(element, zielCent){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(!Number.isFinite(zielCent)) return;
  const dauer = 620;
  const start = performance.now();
  const negativ = zielCent < 0;
  function schritt(jetzt){
    const t = Math.min(1, (jetzt - start) / dauer);
    // weiches Auslaufen
    const e = 1 - Math.pow(1 - t, 3);
    element.textContent = euro(zielCent * e);
    if(t < 1) requestAnimationFrame(schritt);
    else element.textContent = euro(zielCent);
  }
  requestAnimationFrame(schritt);
}

function einnahmeLoeschen(e){
  const p = P();
  const index = p.einnahmen.findIndex(x => x.id === e.id);
  if(index < 0) return;
  const kopie = JSON.parse(JSON.stringify(e));
  p.einnahmen.splice(index,1);
  aendern();
  toast(`„${kuerzen(e.name,28)}“ gelöscht.`, () => {
    P().einnahmen.splice(Math.min(index, P().einnahmen.length), 0, kopie);
    aendern();
  });
}

function einnahmeDuplizieren(e){
  const kopie = JSON.parse(JSON.stringify(e));
  kopie.id = idNeu("ei");
  kopie.name = e.name + " (Kopie)";
  P().einnahmen.push(kopie);
  aendern();
  toast(`„${kuerzen(e.name,24)}“ dupliziert.`);
}

      oninput:(ev) => { UI.suche = ev.target.value; zeichneAusgabenListe(); } }),
    UI.suche ? el("button",{ class:"leeren", type:"button", "aria-label":"Suche leeren",
      onclick:() => { UI.suche = ""; zeichneAusgaben(); } }, icon("ic-x")) : null
  );
  wurzel.appendChild(sucheBox);

  /* Filter-Chips für Tags */
  if(p.tags.length > 0){
    const chips = el("div",{ class:"chip-scroll" });
    chips.appendChild(el("button",{
      class:"chip wahl", type:"button", "aria-pressed": UI.filterTags.size === 0 ? "true":"false",
      onclick:() => { UI.filterTags.clear(); zeichneAusgaben(); }
    }, "Alle"));
    p.tags.forEach(t => {
      chips.appendChild(el("button",{
        class:"chip wahl", type:"button",
        "aria-pressed": UI.filterTags.has(t.id) ? "true":"false",
        onclick:() => {
          if(UI.filterTags.has(t.id)) UI.filterTags.delete(t.id); else UI.filterTags.add(t.id);
          zeichneAusgaben();
        }
      },
        el("span",{ class:"punkt", style:`background:${tagFarbe(t)}` }),
        el("span",{ text:t.name })
      ));
    });
    wurzel.appendChild(chips);
  }

  /* Gruppierung und Sortierung */
  const steuerung = el("div",{ style:"display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px" });
  steuerung.appendChild(el("select",{ class:"eingabe", style:"min-height:40px;font-size:14px;padding:8px 34px 8px 12px;flex:1;min-width:0",
    "aria-label":"Gruppierung",
    onchange:(ev) => { UI.gruppierung = ev.target.value; zeichneAusgabenListe(); } },
    [["tag","Nach Tag"],["art","Sparen / Ausgabe"],["konto","Nach Konto"],["zahlungsweg","Nach Zahlungsweg"],["prioritaet","Nach Priorität"],["faelligkeit","Nach Fälligkeit"],["keine","Ohne Gruppen"]]
      .map(([w,t]) => el("option",{ value:w, selected: UI.gruppierung === w, text:t }))
  ));
  steuerung.appendChild(el("select",{ class:"eingabe", style:"min-height:40px;font-size:14px;padding:8px 34px 8px 12px;flex:1;min-width:0",
    "aria-label":"Sortierung",
    onchange:(ev) => { UI.sortierung = ev.target.value; zeichneAusgabenListe(); } },
    [["betrag","Betrag ↓"],["name","Name A–Z"],["faelligkeit","Fälligkeit"]]
      .map(([w,t]) => el("option",{ value:w, selected: UI.sortierung === w, text:t }))
  ));
  steuerung.appendChild(el("button",{ class:"knopf klein rahmen", type:"button", style:"flex:none",
    "aria-label": UI.auswahlModus ? "Auswahl beenden" : "Mehrere auswählen",
    onclick:() => { UI.auswahlModus = !UI.auswahlModus; UI.auswahl.clear(); zeichnen(); } },
    icon("ic-check"), UI.auswahlModus ? "Fertig" : "Auswahl"));
  wurzel.appendChild(steuerung);

  /* Kopf-Summe */
  wurzel.appendChild(el("div",{ id:"ausgaben-summe" }));
  /* Die eigentliche Liste bekommt einen eigenen Container, damit Suche und
     Filter sie neu zeichnen können, ohne die Bedienelemente zu verlieren. */
  wurzel.appendChild(el("div",{ id:"ausgaben-liste" }));
  zeichneAusgabenListe();
}

function gefilterteAusgaben(){
  const p = P();
  const suchtext = UI.suche.trim().toLowerCase();
  return p.ausgaben.filter(a => {
    if(UI.filterTags.size > 0){
      if(!a.tags.some(t => UI.filterTags.has(t))) return false;
    }
    if(suchtext){
      const tagNamen = (a.tags||[]).map(id => P().tags.find(t=>t.id===id)?.name || "").join(" ");
      const heu = (a.name + " " + tagNamen + " " + wegFuer(a).name + " " + (a.notiz||"")).toLowerCase();
      if(!heu.includes(suchtext)) return false;
    }
    return true;
  });
}

function zeichneAusgabenListe(){
  const box = $("#ausgaben-liste");
  const summeBox = $("#ausgaben-summe");
  if(!box) return;
  box.replaceChildren();
  const p = P();
  const gefiltert = gefilterteAusgaben();

  if(summeBox){
    summeBox.replaceChildren();
    const aktiv = gefiltert.filter(a => a.aktiv !== false);
    const ausgabenTeil = aktiv.filter(a => !istSparen(a)).reduce((s,a)=>s+jahresCent(a),0);
    const sparTeil = aktiv.filter(istSparen).reduce((s,a)=>s+jahresCent(a),0);
    const gesamt = ausgabenTeil + sparTeil;
    const istGefiltert = gefiltert.length !== p.ausgaben.length;

    /* Oben steht immer die Summe ALLER Positionen dieser Liste. Erst darunter
       wird aufgeteilt — sonst liest sich „davon Sparen“ so, als wäre der
       Sparbetrag in den Ausgaben enthalten. Ist er nicht: er kommt dazu. */
    const unterzeile = (farbe, name, neben, wert, fett) =>
      el("div",{ style:"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:10px" },
        el("span",{ style:"min-width:0" },
          el("span",{ class:"t-label", style:"display:inline-flex;align-items:center;gap:7px" },
            el("span",{ style:`width:8px;height:8px;border-radius:2px;background:${farbe};display:inline-block;flex:none` }),
            el("span",{ text:name })
          ),
          neben ? el("span",{ class:"t-klein", style:"display:block;margin-left:15px", text:neben }) : null
        ),
        el("span",{ style:`font-size:16px;font-weight:${fett?640:600};font-variant-numeric:tabular-nums;white-space:nowrap;color:${farbe==="var(--gruen)"?"var(--gruen)":"var(--text)"}`,
          text:wert })
      );

    summeBox.appendChild(el("div",{ class:"karte eng" },
      el("div",{ style:"display:flex;align-items:baseline;justify-content:space-between;gap:12px" },
        el("div",{},
          el("div",{ class:"t-kapitaelchen",
            text: (istGefiltert ? "Auswahl " : "Diese Liste ") + zeitraumWort() }),
          el("div",{ class:"t-klein", style:"margin-top:2px",
            text:`${gefiltert.length} von ${p.ausgaben.length} ${plural(p.ausgaben.length,"Position","Positionen")}` })
        ),
        el("div",{ style:"font-size:24px;font-weight:640;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap",
          text:euroZ(gesamt) })
      ),
      /* Die Aufteilung erscheint nur, wenn es überhaupt Sparposten gibt. */
      sparTeil > 0 ? el("div",{ style:"margin-top:12px;padding-top:12px;border-top:1px solid var(--linie)" },
        unterzeile("var(--text-3)", "Ausgaben", "Geld, das weg ist", euroZ(ausgabenTeil), false),
        unterzeile("var(--gruen)", "Sparen", "bleibt dein Geld", euroZ(sparTeil), true)
      ) : null
    ));
  }

  if(gefiltert.length === 0){
    box.appendChild(el("div",{ class:"leer" },
      (() => { const s = icon("ic-suche"); s.classList.add("bild"); return s; })(),
      el("h3",{ text:"Nichts gefunden" }),
      el("p",{ text:"Für diese Suche oder diesen Filter gibt es keine Positionen." }),
      el("button",{ class:"knopf rahmen", type:"button", text:"Filter zurücksetzen",
        onclick:() => { UI.suche=""; UI.filterTags.clear(); zeichneAusgaben(); } })
    ));
    return;
  }

  /* Sortierfunktion */
  const sortieren = (liste) => {
    const kopie = [...liste];
    if(UI.sortierung === "name") kopie.sort((a,b) => collator.compare(a.name, b.name));
    else if(UI.sortierung === "faelligkeit") kopie.sort((a,b) => (a.faelligTag||1) - (b.faelligTag||1) || collator.compare(a.name,b.name));
    else kopie.sort((a,b) => jahresCent(b) - jahresCent(a) || collator.compare(a.name,b.name));
    return kopie;
  };

  /* Gruppieren */
  const gruppen = new Map();
  const gruppenSchluessel = (a) => {
    switch(UI.gruppierung){
      case "art": return istSparen(a) ? "Sparen" : "Ausgaben";
      case "prioritaet": return PRIORITAETEN[a.prioritaet]?.name || "Ohne";
      case "zahlungsweg": return wegFuer(a).name;
      case "konto": { const k = kontoFuer(a); return k ? k.name : "Ohne Konto"; }
      case "faelligkeit": {
        const t = klemmen(a.faelligTag||1,1,31);
        if(!INTERVALLE[a.intervall].kalender) return "Laufend (wöchentlich / 14-tägig)";
        if(t <= 5) return "1. bis 5.";
        if(t <= 15) return "6. bis 15.";
        if(t <= 25) return "16. bis 25.";
        return "26. bis Monatsende";
      }
      case "tag": {
        const erstes = (a.tags||[]).find(t => t !== SPAR_TAG_ID) || (a.tags||[])[0];
        if(!erstes) return "Ohne Tag";
        const t = P().tags.find(t => t.id === erstes);
        return t ? t.name : "Ohne Tag";
      }
      default: return "";
    }
  };

  if(UI.gruppierung === "keine"){
    const liste = el("div",{ class:"liste" });
    sortieren(gefiltert).forEach(a => liste.appendChild(ausgabenZeile(a)));
    box.appendChild(liste);
  } else {
    gefiltert.forEach(a => {
      const s = gruppenSchluessel(a);
      if(!gruppen.has(s)) gruppen.set(s, []);
      gruppen.get(s).push(a);
    });
    const sortierteGruppen = Array.from(gruppen.entries()).sort((a,b) => {
      const sa = a[1].filter(x=>x.aktiv!==false).reduce((s,x)=>s+jahresCent(x),0);
      const sb = b[1].filter(x=>x.aktiv!==false).reduce((s,x)=>s+jahresCent(x),0);
      return sb - sa || collator.compare(a[0], b[0]);
    });
    sortierteGruppen.forEach(([name, positionen]) => {
      const aktivG = positionen.filter(x=>x.aktiv!==false);
      const summe = aktivG.reduce((s,x)=>s+jahresCent(x),0);
      /* Besteht die Gruppe komplett aus Sparposten, gehört sie grün
         beschriftet — sonst wirkt die Summe wie zusätzliche Ausgaben. */
      const nurSparen = aktivG.length > 0 && aktivG.every(istSparen);
      box.appendChild(el("div",{ class:"liste-titel" },
        el("span",{ class:"t-kapitaelchen", style: nurSparen ? "color:var(--gruen)" : null,
          text: nurSparen ? name + " · bleibt dein Geld" : name }),
        el("span",{ class:"t-label zahl", style: nurSparen ? "color:var(--gruen)" : null, text:euroZ(summe) })
      ));
      const liste = el("div",{ class:"liste" });
      sortieren(positionen).forEach(a => liste.appendChild(ausgabenZeile(a)));
      box.appendChild(liste);
    });
  }

  box.appendChild(el("button",{ class:"knopf rahmen breit", type:"button", style:"margin-top:8px",
    onclick:() => ausgabeDialog(null) }, icon("ic-plus"), "Position hinzufügen"));

  zeichneAktionsleiste();
}

function ausgabenZeile(a){
  const p = P();
  const tags = (a.tags||[]).map(id => p.tags.find(t => t.id === id)).filter(Boolean);
  return zeile({
    id: a.id,
    name: a.name,
    unter: postenUnterzeile(a),
    betragJahr: a.aktiv === false ? 0 : jahresCent(a),
    tags,
    pausiert: a.aktiv === false,
    mitAuswahl: true,
    sparen: istSparen(a),
    aufTippen: () => ausgabeDialog(a),
    aufLoeschen: () => ausgabeLoeschen(a),
    aufDuplizieren: () => ausgabeDuplizieren(a)
  });
}

function ausgabeLoeschen(a){
  const p = P();
  const index = p.ausgaben.findIndex(x => x.id === a.id);
  if(index < 0) return;
  const kopie = JSON.parse(JSON.stringify(a));
  p.ausgaben.splice(index,1);
  aendern();
  toast(`„${kuerzen(a.name,28)}“ gelöscht.`, () => {
    P().ausgaben.splice(Math.min(index, P().ausgaben.length), 0, kopie);
    aendern();
  });
}

function ausgabeDuplizieren(a){
  const kopie = JSON.parse(JSON.stringify(a));
  kopie.id = idNeu("au");
  kopie.name = a.name + " (Kopie)";
  P().ausgaben.push(kopie);
  aendern();
  toast(`„${kuerzen(a.name,24)}“ dupliziert.`);
}

/* ================================================================
   6. DIAGRAMME — alle selbst gezeichnet, kein fremder Code
   ================================================================ */

/**
 * Der Geldfluss. Drei Spalten: Einnahmen → Gesamt → Ziele.
 * Die Höhe jedes Bandes entspricht dem Betrag.
 */
function sankeyZeichnen(){
  const huelle = el("div",{ class:"sankey-huelle" });
  const k = kennzahlen();

  /* Quellen: die einzelnen Einnahmen, große zuerst. */
  let quellen = aktiveEinnahmen()
    .map(e => ({ name:e.name, wert:jahresCent(e) }))
    .filter(q => q.wert > 0)
    .sort((a,b) => b.wert - a.wert);
  if(quellen.length > 5){
    const rest = quellen.slice(4).reduce((s,q)=>s+q.wert,0);
    quellen = quellen.slice(0,4);
    quellen.push({ name:"Weitere", wert:rest });
  }
  quellen.forEach((q,i) => q.farbe = palettenFarbe(i+4));

  /* Bei einem Defizit wird der fehlende Betrag als eigene Quelle sichtbar. */
  if(k.ueberschussJahr < 0){
    quellen.push({ name:"Fehlbetrag", wert:-k.ueberschussJahr, farbe:"var(--rot)" });
  }

  /* Ziele: wohin das Geld geht. */
  const wege = summenNachZahlungsweg();
  const ziele = [
    { name:"Bar",         wert:wege.bar||0,                        farbe:"var(--p3)" },
    { name:"Girokonto",   wert:(wege.giro||0)+(wege.lastschrift||0),farbe:"var(--p1)" },
    { name:"Tagesgeld",   wert:wege.tagesgeld||0,                  farbe:"var(--p2)" },
    { name:"Kreditkarte", wert:wege.kreditkarte||0,                farbe:"var(--p6)" }
  ].filter(z => z.wert > 0);
  if(k.ueberschussJahr > 0) ziele.push({ name:"Übrig", wert:k.ueberschussJahr, farbe:"var(--gruen)" });

  const summeQ = quellen.reduce((s,q)=>s+q.wert,0);
  const summeZ = ziele.reduce((s,z)=>s+z.wert,0);
  if(summeQ <= 0 || summeZ <= 0 || quellen.length === 0 || ziele.length === 0){
    huelle.appendChild(el("p",{ class:"t-klein", style:"padding:8px 4px",
      text:"Sobald Einnahmen und Ausgaben eingetragen sind, siehst du hier, wohin dein Geld fließt." }));
    return huelle;
  }

  /* Maße in viewBox-Einheiten */
  const B = 420;
  const BAND = 186;                       // Gesamthöhe aller Bänder
  const LUECKE = 9;
  const OBEN = 24;
  const maxKnoten = Math.max(quellen.length, ziele.length);
  const H = OBEN + BAND + (maxKnoten-1)*LUECKE + 18;

  const xL = 94, xLb = 99;                // linker Knoten
  const xM = 196, xMb = 204;              // Mittelknoten
  const xR = 316, xRb = 321;              // rechter Knoten

  const svg = svgEl("svg",{
    viewBox:`0 0 ${B} ${H}`, class:"diagramm",
    style:"width:100%;max-width:520px;margin:0 auto;height:auto",
    role:"img",
    "aria-label":`Geldfluss: ${euroZ(summeQ)} verteilen sich auf ${ziele.map(z=>z.name).join(", ")}.`
  });

  /* Positionen berechnen — jede Seite mittig ausgerichtet. */
  const platzieren = (liste, summe) => {
    const hoehen = liste.map(x => Math.max(7, x.wert / summe * BAND));
    const gesamt = hoehen.reduce((s,h)=>s+h,0) + (liste.length-1)*LUECKE;
    let y = OBEN + (BAND + (maxKnoten-1)*LUECKE - gesamt) / 2;
    return liste.map((x,i) => {
      const eintrag = { ...x, y, h:hoehen[i] };
      y += hoehen[i] + LUECKE;
      return eintrag;
    });
  };
  const qPos = platzieren(quellen, summeQ);
  const zPos = platzieren(ziele, summeZ);

  /* Der Mittelknoten nimmt beide Seiten auf. */
  const mitteH = BAND;
  const mitteY = OBEN + (maxKnoten-1)*LUECKE/2;

  /* Ein Band von (x0,y0,h0) nach (x1,y1,h1). */
  const band = (x0,y0,h0,x1,y1,h1,farbe,verzoegerung) => {
    const xm = (x0 + x1) / 2;
    const d = `M ${x0} ${y0} C ${xm} ${y0}, ${xm} ${y1}, ${x1} ${y1}`
            + ` L ${x1} ${y1+h1} C ${xm} ${y1+h1}, ${xm} ${y0+h0}, ${x0} ${y0+h0} Z`;
    const p = svgEl("path",{ d, fill:farbe, class:"sankey-band" });
    p.style.animationDelay = verzoegerung+"ms";
    return p;
  };

  /* Bänder links → Mitte */
  let laufM = mitteY;
  qPos.forEach((q,i) => {
    const h = q.wert / summeQ * mitteH;
    svg.appendChild(band(xLb, q.y, q.h, xM, laufM, h, q.farbe, 60*i));
    laufM += h;
  });
  /* Bänder Mitte → rechts */
  let laufM2 = mitteY;
  zPos.forEach((z,i) => {
    const h = z.wert / summeZ * mitteH;
    svg.appendChild(band(xMb, laufM2, h, xR, z.y, z.h, z.farbe, 120 + 60*i));
    laufM2 += h;
  });

  /* Knotenbalken und Beschriftungen */
  const knoten = (x, y, h, farbe, verzoegerung) => {
    const r = svgEl("rect",{ x, y, width:5, height:Math.max(3,h), rx:2.5, fill:farbe, class:"sankey-knoten" });
    r.style.animationDelay = verzoegerung+"ms";
    return r;
  };
  const beschriftung = (x, y, anker, name, betrag, verzoegerung) => {
    const g = svgEl("g",{ class:"sankey-knoten" });
    g.style.animationDelay = verzoegerung+"ms";
    const t1 = svgEl("text",{ x, y, "text-anchor":anker, "font-size":"10.5", "font-weight":"600",
      fill:"var(--text)", "letter-spacing":"-0.01em" });
    t1.textContent = kuerzen(name, 14);
    const t2 = svgEl("text",{ x, y:y+11.5, "text-anchor":anker, "font-size":"9.5",
      fill:"var(--text-2)", "font-variant-numeric":"tabular-nums" });
    t2.textContent = betrag;
    g.appendChild(t1); g.appendChild(t2);
    return g;
  };

  qPos.forEach((q,i) => {
    svg.appendChild(knoten(xL, q.y, q.h, q.farbe, 60*i));
    svg.appendChild(beschriftung(xL-8, q.y + q.h/2 - 2, "end", q.name, euroZ(q.wert), 60*i));
  });
  zPos.forEach((z,i) => {
    svg.appendChild(knoten(xRb, z.y, z.h, z.farbe, 120+60*i));
    svg.appendChild(beschriftung(xRb+10, z.y + z.h/2 - 2, "start", z.name, euroZ(z.wert), 120+60*i));
  });

  /* Mittelknoten */
  const m = svgEl("rect",{ x:xM, y:mitteY, width:8, height:mitteH, rx:4, fill:"var(--text)", opacity:"0.16", class:"sankey-knoten" });
  svg.appendChild(m);
  const mt = svgEl("text",{ x:xM+4, y:mitteY-9, "text-anchor":"middle", "font-size":"9.5",
    "font-weight":"600", fill:"var(--text-3)", "letter-spacing":"0.06em" });
  mt.textContent = "GESAMT";
  svg.appendChild(mt);

  huelle.appendChild(svg);
  return huelle;
}

/**
 * Ein Donut mit Legende. teile = [{name, wert, farbe}]
 */
function donutZeichnen(teile, rest){
  const alle = rest ? [...teile, rest] : teile;
  const summe = alle.reduce((s,t)=>s+t.wert,0);
  const huelle = el("div",{ class:"donut-huelle" });

  if(summe <= 0){
    huelle.appendChild(el("p",{ class:"t-klein", text:"Noch keine Beträge eingetragen." }));
    return huelle;
  }

  const R = 70, SB = 22, U = 2*Math.PI*R;
  const box = el("div",{ class:"donut-box" });
  const svg = svgEl("svg",{ viewBox:"0 0 180 180", width:"180", height:"180",
    role:"img", "aria-label":"Anteile: " + alle.map(t => `${t.name} ${prozent(t.wert,summe)}`).join(", ") });

  svg.appendChild(svgEl("circle",{ cx:90, cy:90, r:R, fill:"none",
    stroke:"var(--karte-2)", "stroke-width":SB }));

  let offset = 0;
  alle.forEach((t,i) => {
    const anteil = t.wert / summe;
    const laenge = anteil * U;
    const c = svgEl("circle",{
      cx:90, cy:90, r:R, fill:"none",
      stroke:t.farbe, "stroke-width":SB,
      "stroke-dasharray":`${Math.max(0,laenge-1.6)} ${U - Math.max(0,laenge-1.6)}`,
      "stroke-dashoffset": -offset,
      transform:"rotate(-90 90 90)",
      "stroke-linecap": alle.length === 1 ? "butt" : "butt",
      class:"donut-seg"
    });
    c.style.animationDelay = (i*70)+"ms";
    svg.appendChild(c);
    offset += laenge;
  });

  box.appendChild(svg);
  box.appendChild(el("div",{ class:"donut-mitte" },
    el("div",{ class:"gross", text:euroZ(summe) }),
    el("div",{ class:"klein", text:zeitraumWort() })
  ));
  huelle.appendChild(box);

  const legende = el("div",{ class:"legende", style:"flex-direction:column;gap:8px;flex:1;min-width:180px" });
  alle.forEach(t => {
    legende.appendChild(el("div",{ class:"legende-eintrag", style:"width:100%;justify-content:space-between" },
      el("span",{ style:"display:flex;align-items:center;gap:7px;min-width:0;flex:1" },
        el("span",{ class:"punkt", style:`background:${t.farbe}` }),
        el("span",{ style:"overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)", text:t.name })
      ),
      el("span",{ class:"lw", style:"white-space:nowrap", text:`${euroZ(t.wert)} · ${prozent(t.wert,summe)}` })
    ));
  });
  huelle.appendChild(legende);
  return huelle;
}

/** Waagerechte Balken als Rangliste. */
function balkenRangliste(eintraege, gesamt){
  const box = el("div",{});
  const max = Math.max(...eintraege.map(e => e.wert), 1);
  eintraege.forEach((e,i) => {
    const breite = Math.max(1.5, e.wert / max * 100);
    const fuellung = el("div",{ class:"balken-fuellung",
      style:`width:${breite}%;background:${e.farbe || palettenFarbe(i)}` });
    fuellung.style.animationDelay = (i*45)+"ms";
    box.appendChild(el("div",{ class:"balken-zeile" },
      el("span",{ class:"bz-name", text:e.name, title:e.name }),
      el("span",{ class:"balken-spur" }, fuellung),
      el("span",{ class:"bz-wert", text: gesamt ? prozent(e.wert,gesamt) : euroZ(e.wert) })
    ));
  });
  return box;
}

/** Der Jahresverlauf als Balkendiagramm über zwölf Monate. */
function jahresverlaufZeichnen(){
  const werte = jahresverlauf();
  const max = Math.max(...werte, 1);
  const durchschnitt = werte.reduce((s,w)=>s+w,0) / 12;

  const B = 420, H = 190, padU = 26, padO = 16, padL = 4, padR = 4;
  const nutzH = H - padU - padO;
  const spalte = (B - padL - padR) / 12;
  const bw = Math.min(24, spalte * 0.62);

  const svg = svgEl("svg",{ viewBox:`0 0 ${B} ${H}`, class:"diagramm",
    style:"width:100%;height:auto", role:"img",
    "aria-label":"Ausgaben je Monat: " + werte.map((w,i)=>`${MONATE_LANG[i]} ${euro(w)}`).join(", ") });

  /* Durchschnittslinie */
  const yD = padO + nutzH - (durchschnitt/max*nutzH);
  svg.appendChild(svgEl("line",{ x1:padL, y1:yD, x2:B-padR, y2:yD,
    stroke:"var(--linie-stark)", "stroke-width":1, "stroke-dasharray":"3 4" }));
  const dt = svgEl("text",{ x:B-padR, y:yD-5, "text-anchor":"end", "font-size":"9",
    fill:"var(--text-3)", "font-variant-numeric":"tabular-nums" });
  dt.textContent = "Schnitt " + euroKurz(durchschnitt);
  svg.appendChild(dt);

  const jetztMonat = heute().getMonth();
  werte.forEach((w,i) => {
    const h = Math.max(2, w / max * nutzH);
    const x = padL + spalte*i + (spalte-bw)/2;
    const y = padO + nutzH - h;
    const teuer = w > durchschnitt * 1.18;
    const r = svgEl("rect",{ x, y, width:bw, height:h, rx:Math.min(4,bw/2),
      fill: teuer ? "var(--p3)" : "var(--akzent)",
      opacity: i === jetztMonat ? "1" : "0.78" });
    r.style.transformOrigin = `${x+bw/2}px ${padO+nutzH}px`;
    r.style.animation = `balken-hoch 620ms ${i*40}ms cubic-bezier(.4,0,.2,1) both`;
    svg.appendChild(r);

    const t = svgEl("text",{ x:x+bw/2, y:H-10, "text-anchor":"middle", "font-size":"9.5",
      fill: i === jetztMonat ? "var(--text)" : "var(--text-3)",
      "font-weight": i === jetztMonat ? "700" : "400" });
    t.textContent = MONATE_KURZ[i];
    svg.appendChild(t);
  });

  const box = el("div",{});
  box.appendChild(svg);

  /* Die auffälligen Monate benennen */
  const teuerste = werte.map((w,i)=>({w,i})).sort((a,b)=>b.w-a.w)[0];
  const guenstigste = werte.map((w,i)=>({w,i})).sort((a,b)=>a.w-b.w)[0];
  if(teuerste.w > 0 && teuerste.w !== guenstigste.w){
    box.appendChild(el("p",{ class:"t-klein", style:"margin-top:12px;line-height:1.5",
      html:`Teuerster Monat: <strong style="color:var(--text)">${MONATE_LANG[teuerste.i]}</strong> mit ${euro(teuerste.w)}. Günstigster: ${MONATE_LANG[guenstigste.i]} mit ${euro(guenstigste.w)}.` }));
  }
  return box;
}

/** Der Fälligkeitskalender für einen Monat. */
function kalenderZeichnen(){
  const monat = UI.kalenderMonat;
  const jahr = heute().getFullYear();
  const proTag = faelligkeitenProTag(monat);
  const tageImMonat = new Date(jahr, monat, 0).getDate();
  const ersterWochentag = (new Date(jahr, monat-1, 1).getDay() + 6) % 7; // Montag = 0
  const istAktuellerMonat = (monat === heute().getMonth()+1);
  const heuteTag = heute().getDate();

  const box = el("div",{});

  /* Monatswahl */
  box.appendChild(el("div",{ style:"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px" },
    el("button",{ class:"sym", type:"button", "aria-label":"Vorheriger Monat",
      onclick:() => { UI.kalenderMonat = UI.kalenderMonat === 1 ? 12 : UI.kalenderMonat-1; zeichnen(); } }, icon("ic-links")),
    el("div",{ style:"flex:1;text-align:center" },
      el("div",{ class:"t-h3", text:MONATE_LANG[monat-1] }),
      el("div",{ class:"t-klein", text:`${euro(Array.from(proTag.values()).reduce((s,e)=>s+e.summe,0))} an festen Terminen` })
    ),
    el("button",{ class:"sym", type:"button", "aria-label":"Nächster Monat",
      onclick:() => { UI.kalenderMonat = UI.kalenderMonat === 12 ? 1 : UI.kalenderMonat+1; zeichnen(); } }, icon("ic-rechts"))
  ));

  const raster = el("div",{ class:"kal" });
  WOCHENTAGE.forEach(t => raster.appendChild(el("div",{ class:"kal-kopf", text:t })));
  for(let i=0; i<ersterWochentag; i++) raster.appendChild(el("div",{ class:"kal-tag leer-tag" }));
  for(let t=1; t<=tageImMonat; t++){
    const eintrag = proTag.get(t);
    const hat = !!eintrag && eintrag.summe > 0;
    const zelle = el("button",{
      class:"kal-tag", type:"button",
      dataset:{ hat: hat ? "ja":"nein", heute: (istAktuellerMonat && t === heuteTag) ? "ja":"nein" },
      "aria-label": hat
        ? `${t}. ${MONATE_LANG[monat-1]}: ${euro(eintrag.summe)}, ${eintrag.positionen.length} ${plural(eintrag.positionen.length,"Position","Positionen")}`
        : `${t}. ${MONATE_LANG[monat-1]}: nichts fällig`,
      onclick: hat ? () => tagDetailDialog(eintrag, monat) : null
    },
      el("span",{ class:"nr", text:String(t) }),
      hat ? el("span",{ class:"bt", text:euroKurz(eintrag.summe) }) : null
    );
    raster.appendChild(zelle);
  }
  box.appendChild(raster);

  /* Laufende Positionen, die keinen festen Tag haben */
  const laufend = aktiveAusgaben().filter(a => !INTERVALLE[a.intervall].kalender);
  if(laufend.length > 0){
    const summeL = laufend.reduce((s,a)=>s+Math.round(a.betragCent*INTERVALLE[a.intervall].faktor/12),0);
    box.appendChild(el("p",{ class:"t-klein", style:"margin-top:14px;line-height:1.5",
      html:`Dazu kommen ${laufend.length} laufende ${plural(laufend.length,"Position","Positionen")} ohne festen Termin (wöchentlich oder 14-tägig): rund <strong style="color:var(--text)">${euro(summeL)}</strong> im Monat.` }));
  }
  return box;
}

/* ----------------------------------------------------------------
   Das Monatsblatt gruppiert die Posten nach Zahlungsweg — genau wie
   die gewohnte Tabelle mit den Spalten "Bankkonto" und "Sparmappe".
   ---------------------------------------------------------------- */
function blattBlock(titel, iconId, posten, gruen){
  const block = el("div",{ class:"blatt-block" });
  block.appendChild(el("div",{ class:"blatt-kopf" },
    icon(iconId),
    el("span",{ class:"titel", style: gruen ? "color:var(--gruen)" : null, text:titel })
  ));
  block.appendChild(el("div",{ class:"blatt-zeile spalten-titel" },
    el("span",{ class:"bz-name", text:"Posten" }),
    el("span",{ class:"bz-monat", text:"Monat" }),
    el("span",{ class:"bz-jahr", text:"Jahr" })
  ));

  if(posten.length === 0){
    block.appendChild(el("div",{ class:"blatt-zeile leer" },
      el("span",{ class:"bz-name", text:"nichts eingetragen" }),
      el("span",{ class:"bz-monat", text:"—" }),
      el("span",{ class:"bz-jahr", text:"—" })
    ));
    return { block, summe:0 };
  }

  const sortiert = posten.slice().sort((a,b) => jahresCent(b) - jahresCent(a));
  let summe = 0;
  sortiert.forEach(a => {
    const jahr = jahresCent(a);
    summe += jahr;
    block.appendChild(el("button",{ class:"blatt-zeile" + (gruen ? " gruen-zeile" : ""),
      type:"button", style:"width:100%;text-align:left",
      onclick:() => ausgabeDialog(a) },
      el("span",{ class:"bz-name", text:a.name, title:a.name }),
      el("span",{ class:"bz-monat", text:euro(jahr/12) }),
      el("span",{ class:"bz-jahr", text:euro(jahr) })
    ));
  });

  block.appendChild(el("div",{ class:"blatt-zeile summe" },
    el("span",{ class:"bz-name", text:"Summe" }),
    el("span",{ class:"bz-monat", style: gruen ? "color:var(--gruen)" : null, text:euro(summe/12) }),
    el("span",{ class:"bz-jahr", text:euro(summe) })
  ));
  return { block, summe };
}

function reiterMonatsblatt(wurzel){
  const p = P();
  const k = kennzahlen();

  /* --- Einkommen --- */
  const einBlock = el("div",{ class:"blatt-block" });
  einBlock.appendChild(el("div",{ class:"blatt-kopf" },
    icon("ic-einnahmen"),
    el("span",{ class:"titel", text:"Einkommen" })
  ));
  einBlock.appendChild(el("div",{ class:"blatt-zeile spalten-titel" },
    el("span",{ class:"bz-name", text:"Quelle" }),
    el("span",{ class:"bz-monat", text:"Monat" }),
    el("span",{ class:"bz-jahr", text:"Jahr" })
  ));
  const einAktiv = aktiveEinnahmen().slice().sort((a,b) => jahresCent(b) - jahresCent(a));
  if(einAktiv.length === 0){
    einBlock.appendChild(el("div",{ class:"blatt-zeile leer" },
      el("span",{ class:"bz-name", text:"noch keine Einnahme eingetragen" }),
      el("span",{ class:"bz-monat", text:"—" }),
      el("span",{ class:"bz-jahr", text:"—" })
    ));
  } else {
    einAktiv.forEach(e => {
      const jahr = jahresCent(e);
      einBlock.appendChild(el("button",{ class:"blatt-zeile", type:"button", style:"width:100%;text-align:left",
        onclick:() => einnahmeDialog(e) },
        el("span",{ class:"bz-name", text:e.name, title:e.name }),
        el("span",{ class:"bz-monat", text:euro(jahr/12) }),
        el("span",{ class:"bz-jahr", text:euro(jahr) })
      ));
    });
    einBlock.appendChild(el("div",{ class:"blatt-zeile summe" },
      el("span",{ class:"bz-name", text:"Summe" }),
      el("span",{ class:"bz-monat", text:euro(k.einnahmenJahr/12) }),
      el("span",{ class:"bz-jahr", text:euro(k.einnahmenJahr) })
    ));
  }
  wurzel.appendChild(el("div",{ class:"blatt", style:"margin-bottom:12px" }, einBlock));

  /* --- Ein Block je Zahlungsweg, Sparen getrennt --- */
  const posten = aktivePosten();
  const bloecke = [];
  p.zahlungswege.forEach(w => {
