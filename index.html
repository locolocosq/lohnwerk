<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lohnwerk — Gehalts- und Budgetplanung. Alle Daten bleiben auf deinem Gerät.">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lohnwerk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>Lohnwerk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ============================================================
   FARBEN, ABSTÄNDE, TYPOGRAFIE — alles als Variablen
   Hell ist die Grundlage, Dunkel überschreibt nur die Farben.
   ============================================================ */
:root{
  /* Flächen */
  --bg:#f7f7f8;
  --bg-erhoben:#ffffff;
  --karte:#ffffff;
  --karte-2:#f2f2f4;
  --linie:rgba(0,0,0,.09);
  --linie-stark:rgba(0,0,0,.16);

  /* Schrift */
  --text:#1d1d1f;
  --text-2:#6e6e73;
  --text-3:#74747a;

  /* Akzent und Zustände */
  --akzent:#0066cc;
  --akzent-weich:rgba(0,102,204,.10);
  --akzent-text:#ffffff;
  --gruen:#1b7d3f;
  --gruen-weich:rgba(27,125,63,.10);
  --rot:#c72a1e;
  --rot-weich:rgba(199,42,30,.10);

  /* Kuratierte, gedämpfte Palette für Tags und Diagramme */
  --p1:#4a6fa5;
  --p2:#5f8d7e;
  --p3:#b8813f;
  --p4:#9c6b8e;
  --p5:#4f7d8c;
  --p6:#a1674f;
  --p7:#6c7a89;
  --p8:#7d8a52;

  /* Form */
  --r-karte:16px;
  --r-knopf:10px;
  --r-klein:8px;
  --r-pille:999px;
  --schatten:0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
  --schatten-hoch:0 8px 40px rgba(0,0,0,.16);

  /* 4-px-Abstandsskala */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --s7:32px; --s8:40px; --s9:48px; --s10:64px;

  /* Bewegung */
  --kurve:cubic-bezier(.4,0,.2,1);
  --dauer:200ms;

  --pfeil-runter:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236e6e73' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");

  --schrift:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sicher-unten:env(safe-area-inset-bottom, 0px);
  --sicher-oben:env(safe-area-inset-top, 0px);
}

/* Dunkelmodus: automatisch nach Systemeinstellung … */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="hell"]){
    --bg:#0f0f11;
    --bg-erhoben:#1c1c1e;
    --karte:#1c1c1e;
    --karte-2:#252528;
    --linie:rgba(255,255,255,.10);
    --linie-stark:rgba(255,255,255,.20);
    --text:#f2f2f4;
    --text-2:#a1a1a8;
    --text-3:#92929c;
    --akzent:#3f9bff;
    --akzent-weich:rgba(63,155,255,.14);
    --akzent-text:#08121c;
    --gruen:#3ec46f;
    --gruen-weich:rgba(62,196,111,.14);
    --rot:#ff6157;
    --rot-weich:rgba(255,97,87,.14);
    --p1:#7c9ed6; --p2:#82b6a4; --p3:#d5a765; --p4:#c395b6;
    --p5:#79a8b9; --p6:#c98f74; --p7:#98a5b3; --p8:#a6b378;
    --pfeil-runter:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23a1a1a8' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  --schatten:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --schatten-hoch:0 8px 40px rgba(0,0,0,.6);
  }
}
/* … und manuell umschaltbar. */
:root[data-theme="dunkel"]{
  --bg:#0f0f11;
  --bg-erhoben:#1c1c1e;
  --karte:#1c1c1e;
  --karte-2:#252528;
  --linie:rgba(255,255,255,.10);
  --linie-stark:rgba(255,255,255,.20);
  --text:#f2f2f4;
  --text-2:#a1a1a8;
  --text-3:#92929c;
  --akzent:#3f9bff;
  --akzent-weich:rgba(63,155,255,.14);
  --akzent-text:#08121c;
  --gruen:#3ec46f;
  --gruen-weich:rgba(62,196,111,.14);
  --rot:#ff6157;
  --rot-weich:rgba(255,97,87,.14);
  --p1:#7c9ed6; --p2:#82b6a4; --p3:#d5a765; --p4:#c395b6;
  --p5:#79a8b9; --p6:#c98f74; --p7:#98a5b3; --p8:#a6b378;
  --pfeil-runter:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23a1a1a8' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  --schatten:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --schatten-hoch:0 8px 40px rgba(0,0,0,.6);
}

/* ============================================================
   GRUNDLAGEN
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--schrift);
  font-size:17px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit;}
button{background:none;border:0;cursor:pointer;padding:0;}
input,select,textarea{background:none;border:0;}
ul,ol{margin:0;padding:0;list-style:none;}
h1,h2,h3,h4,p{margin:0;}
a{color:var(--akzent);}
svg{display:block;}
:focus{outline:none;}
:focus-visible{
  outline:2px solid var(--akzent);
  outline-offset:2px;
  border-radius:4px;
}
::selection{background:var(--akzent-weich);}
.nur-screenreader{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ============================================================
   TYPOGRAFIE-SKALA
   ============================================================ */
.hero-zahl{
  font-size:52px;line-height:1.04;font-weight:600;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.t-h1{font-size:28px;line-height:1.2;font-weight:650;letter-spacing:-.022em;}
.t-h2{font-size:20px;line-height:1.25;font-weight:600;letter-spacing:-.018em;}
.t-h3{font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.01em;}
.t-body{font-size:16px;line-height:1.45;}
.t-klein{font-size:14px;line-height:1.4;color:var(--text-2);}
.t-label{
  font-size:13px;line-height:1.3;color:var(--text-2);
  letter-spacing:.02em;font-weight:500;
}
.t-kapitaelchen{
  font-size:12px;font-weight:600;color:var(--text-2);
  letter-spacing:.06em;text-transform:uppercase;
}
.zahl{font-variant-numeric:tabular-nums;}
.gruen{color:var(--gruen);}
.rot{color:var(--rot);}
.gedaempft{color:var(--text-2);}
.gedaempft-2{color:var(--text-3);}

/* ============================================================
   LAYOUT — mobil eine Spalte, ab 900px Seitenleiste
   ============================================================ */
.app{min-height:100dvh;display:flex;flex-direction:column;}

.kopf{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--sicher-oben) + var(--s3)) var(--s4) var(--s3);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid transparent;
  transition:border-color 150ms var(--kurve);
  display:flex;align-items:center;gap:var(--s3);
}
.kopf.geschoben{border-bottom-color:var(--linie);}
.kopf-titel{flex:1;min-width:0;}
.kopf-titel h1{
  font-size:24px;font-weight:650;letter-spacing:-.022em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kopf-titel .unterzeile{
  font-size:13px;color:var(--text-2);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.inhalt{
  flex:1;
  width:100%;max-width:1100px;margin:0 auto;
  padding:var(--s4) var(--s4) calc(96px + var(--sicher-unten));
}
.ansicht{display:none;animation:einblenden 220ms var(--kurve);}
.ansicht.aktiv{display:block;}
@keyframes einblenden{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* Untere Tab-Leiste (Handy) */
.tableiste{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;
  padding-bottom:var(--sicher-unten);
  background:color-mix(in srgb, var(--bg-erhoben) 88%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--linie);
}
.tab{
  flex:1;min-height:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-3);font-size:10.5px;font-weight:500;letter-spacing:.01em;
  padding:6px 2px 8px;
  transition:color 150ms var(--kurve);
  -webkit-tap-highlight-color:transparent;
}
.tab svg{width:23px;height:23px;stroke-width:1.7;}
.tab[aria-current="page"]{color:var(--akzent);}
.tab:active{transform:scale(.94);}

/* Seitenleiste (Desktop) */
.seitenleiste{display:none;}

@media (min-width:900px){
  .app{flex-direction:row;}
  .tableiste{display:none;}
  .seitenleiste{
    display:flex;flex-direction:column;gap:2px;
    position:sticky;top:0;align-self:flex-start;
    width:236px;flex:0 0 236px;height:100dvh;
    padding:var(--s6) var(--s3);
    background:var(--bg-erhoben);
    border-right:1px solid var(--linie);
  }
  .marke{
    display:flex;align-items:center;gap:10px;
    padding:0 var(--s3) var(--s6);
  }
  .marke svg{width:26px;height:26px;}
  .marke span{font-size:19px;font-weight:650;letter-spacing:-.02em;}
  .sl-knopf{
    display:flex;align-items:center;gap:12px;
    padding:10px var(--s3);border-radius:var(--r-knopf);
    color:var(--text-2);font-size:15px;font-weight:500;
    width:100%;text-align:left;min-height:44px;
    transition:background 140ms var(--kurve), color 140ms var(--kurve);
  }
  .sl-knopf svg{width:20px;height:20px;stroke-width:1.8;flex:0 0 20px;}
  .sl-knopf:hover{background:var(--karte-2);color:var(--text);}
  .sl-knopf[aria-current="page"]{background:var(--akzent-weich);color:var(--akzent);}
  .haupt{flex:1;min-width:0;display:flex;flex-direction:column;}
  .inhalt{padding:var(--s6) var(--s7) var(--s10);}
  .kopf{padding:var(--s6) var(--s7) var(--s4);}
  .kopf-titel h1{font-size:28px;}
}

/* ============================================================
   KARTEN
   ============================================================ */
.karte{
  background:var(--karte);
  border-radius:var(--r-karte);
  box-shadow:var(--schatten);
  padding:var(--s5);
  margin-bottom:var(--s3);
}
.karte.flach{box-shadow:none;border:1px solid var(--linie);}
.karte.eng{padding:var(--s4);}
.karte.blank{padding:0;overflow:hidden;}
.karte-kopf{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:var(--s3);margin-bottom:var(--s4);
}
.karte-kopf h2{font-size:18px;font-weight:600;letter-spacing:-.015em;}

.raster{display:grid;gap:var(--s3);}
.raster-2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media (min-width:700px){
  .raster-2{grid-template-columns:repeat(4,minmax(0,1fr));}
  .raster-2.halb{grid-template-columns:repeat(2,minmax(0,1fr));}
}

/* Kennzahl-Kachel */
.kachel{
  background:var(--karte);border-radius:var(--r-karte);
  box-shadow:var(--schatten);padding:var(--s4);
  display:flex;flex-direction:column;gap:var(--s1);
  min-width:0;
}
.kachel .titel{
  font-size:12px;font-weight:600;color:var(--text-3);
  letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kachel .wert{
  font-size:22px;font-weight:640;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kachel .zusatz{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums;}

/* Hero-Bereich Übersicht */
.hero{
  padding:var(--s8) var(--s2) var(--s9);
  text-align:left;
}
.hero .vorzeile{
  font-size:13px;font-weight:600;color:var(--text-2);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:var(--s3);
}
.hero .nachzeile{
  margin-top:var(--s3);font-size:15px;color:var(--text-2);
  font-variant-numeric:tabular-nums;
}
@media (min-width:700px){
  .hero{padding:var(--s9) var(--s2) var(--s10);}
  .hero-zahl{font-size:64px;}
}

/* ============================================================
   KNÖPFE
   ============================================================ */
.knopf{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 var(--s5);
  border-radius:var(--r-knopf);
  background:var(--karte-2);color:var(--text);
  font-size:15px;font-weight:550;letter-spacing:-.01em;
  transition:transform 120ms var(--kurve), background 140ms var(--kurve), opacity 140ms var(--kurve);
  -webkit-tap-highlight-color:transparent;
  white-space:nowrap;
}
.knopf:active{transform:scale(.97);}
.knopf:disabled{opacity:.4;cursor:default;}
.knopf:disabled:active{transform:none;}
.knopf svg{width:18px;height:18px;stroke-width:1.9;flex:none;}
.knopf.primaer{background:var(--akzent);color:var(--akzent-text);}
.knopf.gefahr{background:var(--rot-weich);color:var(--rot);}
.knopf.gefahr-voll{background:var(--rot);color:#fff;}
.knopf.leise{background:transparent;color:var(--akzent);padding:0 var(--s3);}
.knopf.rahmen{background:transparent;border:1px solid var(--linie-stark);}
.knopf.breit{width:100%;}
.knopf.klein{min-height:36px;padding:0 var(--s3);font-size:14px;}
.knopf-reihe{display:flex;gap:var(--s2);flex-wrap:wrap;}

/* Runder Symbolknopf */
.sym{
  width:44px;height:44px;min-width:44px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-pille);color:var(--text-2);
  transition:background 140ms var(--kurve), transform 120ms var(--kurve), color 140ms var(--kurve);
  -webkit-tap-highlight-color:transparent;
}
.sym svg{width:21px;height:21px;stroke-width:1.8;}
.sym:hover{background:var(--karte-2);color:var(--text);}
.sym:active{transform:scale(.92);}
.sym.gefuellt{background:var(--akzent);color:var(--akzent-text);}
.sym.gefuellt:hover{background:var(--akzent);color:var(--akzent-text);opacity:.9;}

/* Schwebender Hinzufügen-Knopf */
.fab{
  position:fixed;right:var(--s4);
  bottom:calc(70px + var(--sicher-unten) + var(--s3));
  z-index:45;
  width:56px;height:56px;border-radius:var(--r-pille);
  background:var(--akzent);color:var(--akzent-text);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.20);
  transition:transform 140ms var(--kurve);
}
.fab svg{width:26px;height:26px;stroke-width:2.1;}
.fab:active{transform:scale(.93);}
@media (min-width:900px){
  .fab{bottom:var(--s7);right:var(--s7);}
}

/* Segment-Umschalter (Monat / Jahr) */
.segment{
  display:inline-flex;padding:2px;gap:2px;
  background:var(--karte-2);border-radius:var(--r-knopf);
}
.segment button{
  min-height:34px;padding:0 var(--s3);border-radius:8px;
  font-size:13.5px;font-weight:550;color:var(--text-2);
  transition:background 150ms var(--kurve), color 150ms var(--kurve);
  white-space:nowrap;
}
.segment button[aria-pressed="true"]{
  background:var(--karte);color:var(--text);
  box-shadow:0 1px 3px rgba(0,0,0,.10);
}
.segment.breit{display:flex;width:100%;}
.segment.breit button{flex:1;min-height:40px;}

/* ============================================================
   LISTEN & ZEILEN
   ============================================================ */
.liste{
  background:var(--karte);border-radius:var(--r-karte);
  box-shadow:var(--schatten);overflow:hidden;margin-bottom:var(--s3);
}
.liste-titel{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:var(--s3) var(--s2) var(--s2);
}
.liste-titel .t-kapitaelchen{padding-left:var(--s1);color:var(--text-2);}

.zeile-huelle{position:relative;overflow:hidden;background:var(--karte);}
.zeile-huelle + .zeile-huelle .zeile{border-top:1px solid var(--linie);}
.zeile{
  position:relative;z-index:2;background:var(--karte);
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s4);min-height:60px;
  width:100%;text-align:left;
  transition:background 120ms var(--kurve), transform 0ms;
  -webkit-tap-highlight-color:transparent;
}
.zeile:hover{background:var(--karte-2);}
.zeile.pausiert .zeile-haupt{opacity:.42;}
.zeile-haupt{flex:1;min-width:0;}
.zeile-name{
  font-size:16px;font-weight:500;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.zeile-unter{
  font-size:13px;color:var(--text-2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.zeile-rechts{text-align:right;flex:none;}
.zeile-betrag{
  font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;white-space:nowrap;
}
.zeile-betrag-2{
  font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;
  margin-top:2px;white-space:nowrap;
}
.zeile-pfeil{color:var(--text-3);flex:none;}
.zeile-pfeil svg{width:16px;height:16px;stroke-width:2;}

/* Wisch-Hintergründe */
.wisch-hg{
  position:absolute;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--s5);color:#fff;font-size:13px;font-weight:600;
}
.wisch-hg .links{display:flex;align-items:center;gap:6px;}
.wisch-hg .rechts{display:flex;align-items:center;gap:6px;}
.wisch-hg svg{width:18px;height:18px;stroke-width:2;}
.zeile-huelle[data-wisch="loeschen"] .wisch-hg{background:var(--rot);}
.zeile-huelle[data-wisch="duplizieren"] .wisch-hg{background:var(--akzent);}

/* Auswahlkästchen bei Mehrfachauswahl */
.auswahlbox{
  width:22px;height:22px;flex:none;border-radius:var(--r-pille);
  border:1.8px solid var(--linie-stark);
  display:flex;align-items:center;justify-content:center;
  transition:background 140ms var(--kurve), border-color 140ms var(--kurve);
}
.auswahlbox svg{width:13px;height:13px;stroke-width:3;color:#fff;opacity:0;}
.zeile[data-gewaehlt="ja"] .auswahlbox{background:var(--akzent);border-color:var(--akzent);}
.zeile[data-gewaehlt="ja"] .auswahlbox svg{opacity:1;}

/* ============================================================
   CHIPS / TAGS
   ============================================================ */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:var(--r-pille);
  font-size:12px;font-weight:550;letter-spacing:.005em;
  background:var(--karte-2);color:var(--text-2);
  white-space:nowrap;max-width:100%;
  transition:background 140ms var(--kurve), color 140ms var(--kurve);
}
.chip .punkt{width:7px;height:7px;border-radius:var(--r-pille);flex:none;}
button.chip{min-height:32px;-webkit-tap-highlight-color:transparent;}
button.chip:active{transform:scale(.96);}
button.chip[aria-pressed="true"]{background:var(--akzent);color:var(--akzent-text);}
.chip.wahl[aria-pressed="true"]{background:var(--akzent-weich);color:var(--akzent);box-shadow:inset 0 0 0 1.5px var(--akzent);}
.chip-reihe{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
}
.chip-scroll{
  display:flex;gap:6px;overflow-x:auto;padding:2px var(--s4) var(--s2);
  margin:0 calc(-1 * var(--s4));
  scrollbar-width:none;-ms-overflow-style:none;
}
.chip-scroll::-webkit-scrollbar{display:none;}
.chip-scroll .chip{flex:none;}
.chip-mini{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;color:var(--text-3);
}
.chip-mini .punkt{width:6px;height:6px;border-radius:var(--r-pille);}

/* ============================================================
   FORMULARE
   ============================================================ */
.feld{margin-bottom:var(--s4);}
.feld > label,.feld-label{
  display:block;font-size:13px;font-weight:600;color:var(--text-2);
  letter-spacing:.01em;margin-bottom:6px;
}
.eingabe{
  width:100%;min-height:48px;padding:12px var(--s4);
  background:var(--karte-2);border-radius:var(--r-knopf);
  border:1.5px solid transparent;
  font-size:16px;letter-spacing:-.01em;color:var(--text);
  transition:border-color 140ms var(--kurve), background 140ms var(--kurve);
  -webkit-appearance:none;appearance:none;
}
.eingabe::placeholder{color:var(--text-3);}
.eingabe:focus{border-color:var(--akzent);background:var(--karte);}
.eingabe:focus-visible{outline:none;}
textarea.eingabe{min-height:76px;resize:vertical;line-height:1.4;}
select.eingabe{
  background-image:var(--pfeil-runter);
  background-repeat:no-repeat;background-position:right 14px center;
  padding-right:40px;cursor:pointer;
}
.eingabe.betrag{
  font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;min-height:56px;
}
.feld-hinweis{font-size:12.5px;color:var(--text-3);margin-top:6px;}
.feld-hinweis.warn{color:var(--rot);}
.feld-reihe{display:flex;gap:var(--s3);}
.feld-reihe > *{flex:1;min-width:0;}

/* Schalter */
.schalter-zeile{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s4);
  min-height:52px;padding:var(--s2) 0;
}
.schalter-zeile .beschriftung{flex:1;min-width:0;}
.schalter-zeile .beschriftung .haupt{font-size:16px;}
.schalter-zeile .beschriftung .neben{font-size:12.5px;color:var(--text-2);margin-top:2px;}
.schalter{
  position:relative;width:51px;height:31px;flex:none;
  border-radius:var(--r-pille);background:var(--linie-stark);
  transition:background 200ms var(--kurve);
}
.schalter::after{
  content:"";position:absolute;top:2px;left:2px;
  width:27px;height:27px;border-radius:var(--r-pille);background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:transform 200ms var(--kurve);
}
.schalter[aria-checked="true"]{background:var(--gruen);}
.schalter[aria-checked="true"]::after{transform:translateX(20px);}

/* Schieberegler */
input[type="range"]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:28px;background:transparent;cursor:pointer;
}
input[type="range"]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;background:var(--linie-stark);
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:26px;height:26px;border-radius:var(--r-pille);
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);
  margin-top:-11px;
}
input[type="range"]::-moz-range-track{
  height:4px;border-radius:2px;background:var(--linie-stark);
}
input[type="range"]::-moz-range-thumb{
  width:26px;height:26px;border:0;border-radius:var(--r-pille);
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);
}

/* Suchfeld */
.suche{position:relative;margin-bottom:var(--s3);}
.suche svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:var(--text-3);stroke-width:2;pointer-events:none;
}
.suche .eingabe{padding-left:42px;}
.suche .leeren{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border-radius:var(--r-pille);
  display:flex;align-items:center;justify-content:center;color:var(--text-3);
}
.suche .leeren svg{position:static;transform:none;width:16px;height:16px;}

/* ============================================================
   MODAL / SHEET
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.4);
  opacity:0;pointer-events:none;
  transition:opacity 220ms var(--kurve);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.overlay.offen{opacity:1;pointer-events:auto;}
.sheet{
  width:100%;max-width:560px;max-height:92dvh;
  background:var(--bg-erhoben);
  border-radius:20px 20px 0 0;
  box-shadow:var(--schatten-hoch);
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform 260ms var(--kurve);
  overflow:hidden;
}
.overlay.offen .sheet{transform:none;}
.sheet-kopf{
  display:flex;align-items:center;gap:var(--s2);
  padding:var(--s3) var(--s3) var(--s3) var(--s5);
  border-bottom:1px solid var(--linie);flex:none;
}
.sheet-kopf h2{flex:1;font-size:18px;font-weight:640;letter-spacing:-.018em;min-width:0;}
.sheet-koerper{
  padding:var(--s5);overflow-y:auto;flex:1;
  -webkit-overflow-scrolling:touch;
}
.sheet-fuss{
  padding:var(--s3) var(--s5) calc(var(--s5) + var(--sicher-unten));
  border-top:1px solid var(--linie);
  display:flex;gap:var(--s2);flex:none;
  background:var(--bg-erhoben);
}
.sheet-fuss .knopf{flex:1;}
.griff{
  width:38px;height:5px;border-radius:var(--r-pille);
  background:var(--linie-stark);margin:var(--s2) auto 0;flex:none;
}
@media (min-width:700px){
  .overlay{align-items:center;padding:var(--s5);}
  .sheet{border-radius:18px;max-height:88dvh;transform:translateY(20px) scale(.98);}
  .overlay.offen .sheet{transform:none;}
  .griff{display:none;}
  .sheet-fuss{padding-bottom:var(--s5);}
}

/* ============================================================
   TOAST
   ============================================================ */
.toast-bereich{
  position:fixed;left:0;right:0;z-index:120;
  bottom:calc(74px + var(--sicher-unten));
  display:flex;flex-direction:column;align-items:center;gap:var(--s2);
  padding:0 var(--s4);pointer-events:none;
}
@media (min-width:900px){.toast-bereich{bottom:var(--s6);}}
.toast{
  pointer-events:auto;
  display:flex;align-items:center;gap:var(--s4);
  max-width:480px;width:100%;
  padding:12px var(--s3) 12px var(--s5);
  border-radius:14px;
  background:#26262a;color:#f5f5f7;
  box-shadow:0 6px 28px rgba(0,0,0,.3);
  font-size:14.5px;
  animation:toast-rein 260ms var(--kurve);
}
:root[data-theme="dunkel"] .toast{background:#3a3a3e;}
@media (prefers-color-scheme:dark){:root:not([data-theme="hell"]) .toast{background:#3a3a3e;}}
.toast.weg{animation:toast-raus 200ms var(--kurve) forwards;}
.toast .text{flex:1;min-width:0;}
.toast button{
  color:#5eb0ff;font-weight:600;font-size:14.5px;
  padding:8px 12px;border-radius:var(--r-klein);min-height:36px;white-space:nowrap;
}
@keyframes toast-rein{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:none;}}
@keyframes toast-raus{to{opacity:0;transform:translateY(10px) scale(.97);}}

/* Banner (Sicherungs-Erinnerung, Fehlerhinweis) */
.banner{
  display:flex;align-items:flex-start;gap:var(--s3);
  padding:var(--s3) var(--s4);border-radius:var(--r-karte);
  background:var(--akzent-weich);color:var(--text);
  margin-bottom:var(--s3);font-size:14px;line-height:1.4;
}
.banner.warn{background:var(--rot-weich);}
.banner svg{width:19px;height:19px;flex:none;margin-top:1px;color:var(--akzent);stroke-width:1.9;}
.banner.warn svg{color:var(--rot);}
.banner .inhalt-b{flex:1;min-width:0;}
.banner .knopf-reihe{margin-top:var(--s2);}

/* ============================================================
   LEERE ZUSTÄNDE
   ============================================================ */
.leer{
  text-align:center;padding:var(--s9) var(--s5);
  display:flex;flex-direction:column;align-items:center;gap:var(--s3);
}
.leer svg.bild{width:76px;height:76px;color:var(--text-3);opacity:.5;stroke-width:1.2;}
.leer h3{font-size:18px;font-weight:600;letter-spacing:-.015em;}
.leer p{font-size:15px;color:var(--text-2);max-width:320px;line-height:1.45;}

/* ============================================================
   DIAGRAMME
   ============================================================ */
.diagramm{width:100%;overflow:visible;}
.balken-zeile{
  display:flex;align-items:center;gap:var(--s3);
  padding:9px 0;
}
.balken-zeile .bz-name{
  flex:0 0 34%;min-width:0;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.balken-spur{
  flex:1;height:8px;border-radius:var(--r-pille);
  background:var(--karte-2);overflow:hidden;min-width:20px;
}
.balken-fuellung{
  height:100%;border-radius:var(--r-pille);
  transform-origin:left center;
  animation:balken-wachsen 620ms var(--kurve) both;
}
@keyframes balken-wachsen{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes balken-hoch{from{transform:scaleY(0);}to{transform:scaleY(1);}}
.balken-zeile .bz-wert{
  flex:none;font-size:13.5px;font-variant-numeric:tabular-nums;
  color:var(--text-2);min-width:74px;text-align:right;
}

.legende{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);margin-top:var(--s4);}
.legende-eintrag{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);min-width:0;}
.legende-eintrag .punkt{width:9px;height:9px;border-radius:2px;flex:none;}
.legende-eintrag .lw{font-variant-numeric:tabular-nums;color:var(--text-3);}

/* Donut */
.donut-huelle{
  display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap;justify-content:center;
}
.donut-mitte{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;pointer-events:none;
}
.donut-mitte .gross{
  font-size:20px;font-weight:640;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.donut-mitte .klein{font-size:11.5px;color:var(--text-2);}
.donut-box{position:relative;width:180px;height:180px;flex:none;}
.donut-seg{
  transition:opacity 150ms var(--kurve);
  animation:donut-rein 700ms var(--kurve) both;
}
@keyframes donut-rein{from{opacity:0;}to{opacity:1;}}

/* Kalender */
.kal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.kal-kopf{
  text-align:center;font-size:10.5px;font-weight:600;color:var(--text-3);
  letter-spacing:.04em;text-transform:uppercase;padding-bottom:4px;
}
.kal-tag{
  aspect-ratio:1;border-radius:var(--r-klein);
  background:var(--karte-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;padding:2px;min-height:38px;position:relative;
  transition:transform 120ms var(--kurve);
  -webkit-tap-highlight-color:transparent;
}
.kal-tag:active{transform:scale(.94);}
.kal-tag .nr{font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-2);line-height:1;}
.kal-tag .bt{
  font-size:9px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1;
  color:var(--text);white-space:nowrap;overflow:hidden;max-width:100%;
}
.kal-tag[data-hat="ja"]{background:var(--akzent-weich);}
.kal-tag[data-hat="ja"] .nr{color:var(--akzent);font-weight:600;}
.kal-tag.leer-tag{background:transparent;}
.kal-tag[data-heute="ja"]{box-shadow:inset 0 0 0 1.6px var(--akzent);}

/* Sankey — das Erkennungszeichen */
.sankey-huelle{
  margin:0 calc(-1 * var(--s5));padding:var(--s2) var(--s4) var(--s4);
  overflow-x:auto;scrollbar-width:none;
}
.sankey-huelle::-webkit-scrollbar{display:none;}
.sankey-band{
  animation:sankey-rein 900ms var(--kurve) both;
}
@keyframes sankey-rein{
  from{opacity:0;}
  to{opacity:.82;}
}
.sankey-knoten{animation:sankey-knoten-rein 600ms var(--kurve) both;}
@keyframes sankey-knoten-rein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* Fortschrittsbalken */
.fortschritt{
  height:10px;border-radius:var(--r-pille);background:var(--karte-2);
  overflow:hidden;margin:var(--s3) 0 var(--s2);
}
.fortschritt > div{
  height:100%;border-radius:var(--r-pille);background:var(--gruen);
  animation:balken-wachsen 700ms var(--kurve) both;transform-origin:left center;
}

/* 50/30/20 Balken */
.regel-balken{
  display:flex;height:34px;border-radius:var(--r-klein);overflow:hidden;
  margin:var(--s3) 0 var(--s2);background:var(--karte-2);
}
.regel-balken > div{
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:650;color:#fff;
  animation:balken-wachsen 620ms var(--kurve) both;transform-origin:left center;
  min-width:0;overflow:hidden;
}

/* Datenzeile in Auswertungen */
.datenzeile{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:var(--s4);padding:11px 0;
  border-top:1px solid var(--linie);
}
.datenzeile:first-of-type{border-top:0;}
.datenzeile .dz-name{font-size:15px;min-width:0;}
.datenzeile .dz-name .neben{display:block;font-size:12.5px;color:var(--text-2);margin-top:1px;}
.datenzeile .dz-wert{
  font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right;
}
.datenzeile .dz-wert .neben{
  display:block;font-size:12px;font-weight:400;color:var(--text-3);margin-top:1px;
}

/* Kopierbare Liste (Überweisungsplan) */
.plan-block{
  background:var(--karte-2);border-radius:var(--r-knopf);
  padding:var(--s4);font-size:14px;line-height:1.7;
  font-variant-numeric:tabular-nums;white-space:pre-wrap;word-break:break-word;
}

/* Onboarding-Schritte */
.schritt-punkte{display:flex;gap:6px;justify-content:center;padding:var(--s2) 0 var(--s4);}
.schritt-punkte span{
  width:7px;height:7px;border-radius:var(--r-pille);background:var(--linie-stark);
  transition:background 200ms var(--kurve), width 200ms var(--kurve);
}
.schritt-punkte span.aktiv{background:var(--akzent);width:20px;}
.vorschlag-raster{display:flex;flex-wrap:wrap;gap:7px;}
.vorschlag{
  padding:9px 13px;border-radius:var(--r-pille);
  background:var(--karte-2);font-size:13.5px;font-weight:500;
  min-height:40px;display:inline-flex;align-items:center;gap:6px;
  transition:background 140ms var(--kurve), color 140ms var(--kurve), transform 120ms var(--kurve);
  -webkit-tap-highlight-color:transparent;
}
.vorschlag:active{transform:scale(.96);}
.vorschlag[aria-pressed="true"]{background:var(--akzent);color:var(--akzent-text);}
.vorschlag svg{width:14px;height:14px;stroke-width:2.4;}

/* Ziehen & Ablegen */
.ablage{
  position:fixed;inset:0;z-index:200;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:var(--s4);text-align:center;padding:var(--s6);
}
.ablage.offen{display:flex;}
.ablage svg{width:64px;height:64px;color:var(--akzent);stroke-width:1.3;}
.ablage .rahmen-innen{
  position:absolute;inset:var(--s5);
  border:2.5px dashed var(--akzent);border-radius:24px;pointer-events:none;
}

/* Aufklappbarer Abschnitt */
details.klapp{
  border-top:1px solid var(--linie);
}
details.klapp summary{
  list-style:none;cursor:pointer;
  padding:var(--s4) 0;min-height:52px;
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  font-size:15px;font-weight:550;
}
details.klapp summary::-webkit-details-marker{display:none;}
details.klapp summary .pfeil{
  color:var(--text-3);transition:transform 200ms var(--kurve);flex:none;
}
details.klapp summary .pfeil svg{width:16px;height:16px;stroke-width:2.2;}
details.klapp[open] summary .pfeil{transform:rotate(180deg);}
details.klapp .klapp-inhalt{padding-bottom:var(--s4);}

/* Aktionsleiste bei Mehrfachauswahl */
.aktionsleiste{
  position:fixed;left:0;right:0;z-index:60;
  bottom:calc(70px + var(--sicher-unten));
  padding:var(--s3) var(--s4);
  display:flex;align-items:center;gap:var(--s2);
  background:var(--bg-erhoben);border-top:1px solid var(--linie);
  box-shadow:0 -4px 20px rgba(0,0,0,.10);
  animation:einblenden 200ms var(--kurve);
}
@media (min-width:900px){.aktionsleiste{bottom:0;left:236px;}}
.aktionsleiste .zaehler{flex:1;font-size:14px;font-weight:600;min-width:0;}

/* Tabelle für Konto-Summen */
.mini-tabelle{width:100%;border-collapse:collapse;font-size:14.5px;}
.mini-tabelle th{
  text-align:left;font-size:11.5px;font-weight:600;color:var(--text-3);
  letter-spacing:.05em;text-transform:uppercase;padding:0 0 var(--s2);
}
.mini-tabelle th:last-child,.mini-tabelle td:last-child{text-align:right;}
.mini-tabelle td{
  padding:10px 0;border-top:1px solid var(--linie);
  font-variant-numeric:tabular-nums;
}
.mini-tabelle td:first-child{font-variant-numeric:normal;}

/* Bewegung aus, wenn der Nutzer das wünscht */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

/* Sehr schmale Geräte (320 px) */
@media (max-width:359px){
  .hero-zahl{font-size:42px;}
  .inhalt{padding-left:var(--s3);padding-right:var(--s3);}
  .kopf{padding-left:var(--s3);padding-right:var(--s3);}
  .karte{padding:var(--s4);}
  .kachel .wert{font-size:19px;}
  .tab{font-size:9.5px;}
  .balken-zeile .bz-name{flex-basis:40%;}
  .balken-zeile .bz-wert{min-width:62px;font-size:12.5px;}
  /* Die negativen Ränder müssen zur schmaleren Polsterung passen,
     sonst schiebt sich die Seite seitwärts. */
  .chip-scroll{margin:0 calc(-1 * var(--s3));padding-left:var(--s3);padding-right:var(--s3);}
  .sankey-huelle{margin:0 calc(-1 * var(--s4));padding-left:var(--s3);padding-right:var(--s3);}
}
</style>
</head>

/** Erzeugt ein Element mit Attributen und Kindern. */
function el(tag, attr={}, ...kinder){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attr)){
    if(v === null || v === undefined || v === false) continue;
    if(k === "class") n.className = v;
    else if(k === "text") n.textContent = v;
    else if(k === "html") n.innerHTML = v;
    else if(k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if(k === "dataset") Object.assign(n.dataset, v);
    else if(v === true) n.setAttribute(k, "");
    else n.setAttribute(k, v);
  }
  for(const kind of kinder.flat()){
    if(kind === null || kind === undefined || kind === false) continue;
    n.appendChild(typeof kind === "string" ? document.createTextNode(kind) : kind);
  }
  return n;
}

/** Ein Icon aus der Sammlung oben. */
function icon(id, groesse){
  const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("aria-hidden","true");
  s.setAttribute("focusable","false");
  if(groesse){ s.style.width = groesse+"px"; s.style.height = groesse+"px"; }
  const u = document.createElementNS("http://www.w3.org/2000/svg","use");
  u.setAttribute("href","#"+id);
  s.appendChild(u);
  return s;
}

function svgEl(tag, attr={}){
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for(const [k,v] of Object.entries(attr)){
    if(v === null || v === undefined) continue;
    n.setAttribute(k, v);
  }
  return n;
}

/** 123456 → "1.234,56 €" */

}
/** Prozent mit einer Nachkommastelle, ohne Division durch Null. */
function prozent(teil, ganzes){

/**
 * Wertet eine Betragseingabe aus. Erlaubt sind Zahlen mit Komma oder Punkt
 * sowie einfache Rechnungen: 45+12,50 · 30*3 · (12+8)/2
 * Bewusst kein eval — hier steht ein eigener, kleiner Parser.
 * Rückgabe: Cent als ganze Zahl, oder null wenn die Eingabe nicht lesbar ist.
 */
function betragParsen(eingabe){
  if(typeof eingabe !== "string") return null;
  let s = eingabe.trim();
  if(s === "") return null;
  s = s.replace(/[€\s ]/g,"");
  if(s === "") return null;
  // Nur Ziffern und Rechenzeichen zulassen.
  if(!/^[0-9+\-*/().,]+$/.test(s)) return null;

  // Deutsche Schreibweise vereinheitlichen:
  // Tausenderpunkte entfernen (Punkt mit genau 3 Ziffern danach und Ziffer davor),
  // danach Komma zu Punkt.
  if(s.includes(",")){
    s = s.replace(/(\d)\.(?=\d{3}(\D|$))/g, "$1");
    s = s.replace(/,/g, ".");
  }

  let pos = 0;
  const zeichen = () => s[pos];
  function ausdruck(){
    let wert = term();
    if(wert === null) return null;
    while(zeichen() === "+" || zeichen() === "-"){
      const op = s[pos++];
      const rechts = term();
      if(rechts === null) return null;
      wert = op === "+" ? wert + rechts : wert - rechts;
    }
    return wert;
  }
  function term(){
    let wert = faktor();
    if(wert === null) return null;
    while(zeichen() === "*" || zeichen() === "/"){
      const op = s[pos++];
      const rechts = faktor();
      if(rechts === null) return null;
      if(op === "/"){
        if(rechts === 0) return null;
        wert = wert / rechts;
      } else {
        wert = wert * rechts;
      }
    }
    return wert;
  }
  function faktor(){
    if(zeichen() === "+"){ pos++; return faktor(); }
    if(zeichen() === "-"){ pos++; const w = faktor(); return w === null ? null : -w; }
    if(zeichen() === "("){
      pos++;
      const w = ausdruck();
      if(w === null || zeichen() !== ")") return null;
      pos++;
      return w;
    }
    const start = pos;
    while(pos < s.length && /[0-9.]/.test(s[pos])) pos++;
    if(pos === start) return null;
    const roh = s.slice(start,pos);
    if((roh.match(/\./g)||[]).length > 1) return null;
    const z = parseFloat(roh);
    return Number.isFinite(z) ? z : null;
  }

  const ergebnis = ausdruck();
  if(ergebnis === null || pos !== s.length) return null;
  if(!Number.isFinite(ergebnis)) return null;
  const cent = Math.round(ergebnis * 100);
  if(!Number.isSafeInteger(cent)) return null;
  return cent;
}

function heute(){ return new Date(); }
function datumIso(d = heute()){

}
function plural(n, eins, viele){ return n === 1 ? eins : viele; }

/** Kürzt lange Texte für enge Stellen. */
function kuerzen(text, max){
  if(typeof text !== "string") return "";
  return text.length > max ? text.slice(0, max-1) + "…" : text;
}

/** Entprellt eine Funktion. */
function entprellen(fn, ms){
  let t = null;
  return function(...args){
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

function klemmen(wert, min, max){ return Math.min(max, Math.max(min, wert)); }

let S = zustandNeu();           // der gesamte gespeicherte Zustand

let aktiveAnsicht = "uebersicht";

/** Liefert das gerade gewählte Profil — immer ein gültiges Objekt. */
function P(){
  let p = S.profile.find(x => x.id === S.aktivesProfil);
  if(!p){
    if(S.profile.length === 0) S.profile.push(profilNeu());
    p = S.profile[0];
    S.aktivesProfil = p.id;
  }
  // Sicherheitsnetz: fehlende Listen ergänzen, damit nirgends undefined auftaucht.
  p.einnahmen  = Array.isArray(p.einnahmen)  ? p.einnahmen  : [];
  p.ausgaben   = Array.isArray(p.ausgaben)   ? p.ausgaben   : [];
  p.konten     = Array.isArray(p.konten)     ? p.konten     : [];
  p.tags       = Array.isArray(p.tags)       ? p.tags       : [];
  p.kategorien = Array.isArray(p.kategorien) ? p.kategorien : [];
  return p;
}

/** Prüft und repariert einen geladenen Zustand, ohne je abzustürzen. */
function zustandSaeubern(roh){
  const z = zustandNeu();
  if(!roh || typeof roh !== "object") return z;

  z.schemaVersion = SCHEMA_VERSION;
  z.einrichtungFertig = roh.einrichtungFertig === true;

  const e = roh.einstellungen && typeof roh.einstellungen === "object" ? roh.einstellungen : {};
  z.einstellungen.ansicht = (e.ansicht === "jahr") ? "jahr" : "monat";
  z.einstellungen.theme = ["hell","dunkel","auto"].includes(e.theme) ? e.theme : "auto";
  z.einstellungen.wochenstunden = Number.isFinite(+e.wochenstunden) ? klemmen(+e.wochenstunden,0,168) : 0;
  z.einstellungen.notgroschenZiel = Number.isFinite(+e.notgroschenZiel) ? Math.max(0, Math.round(+e.notgroschenZiel)) : 0;
  z.einstellungen.notgroschenStand = Number.isFinite(+e.notgroschenStand) ? Math.max(0, Math.round(+e.notgroschenStand)) : 0;
  z.einstellungen.tagesgeldZins = Number.isFinite(+e.tagesgeldZins) ? klemmen(+e.tagesgeldZins,0,20) : 0;
  z.einstellungen.letzteSicherung = typeof e.letzteSicherung === "string" ? e.letzteSicherung : null;
  z.einstellungen.sicherungsHinweisAus = typeof e.sicherungsHinweisAus === "string" ? e.sicherungsHinweisAus : null;

  const profileRoh = Array.isArray(roh.profile) ? roh.profile : [];
  z.profile = profileRoh.map(prSaeubern).filter(Boolean);
  if(z.profile.length === 0) z.profile.push(profilNeu());
  const gewuenscht = z.profile.find(p => p.id === roh.aktivesProfil);
  z.aktivesProfil = gewuenscht ? gewuenscht.id : z.profile[0].id;
  return z;
}

function prSaeubern(roh){
  if(!roh || typeof roh !== "object") return null;
  const p = profilNeu(typeof roh.name === "string" && roh.name.trim() ? roh.name.trim().slice(0,60) : "Profil");
  if(typeof roh.id === "string" && roh.id) p.id = roh.id;

  p.konten = (Array.isArray(roh.konten) ? roh.konten : []).map(k => {
    if(!k || typeof k !== "object") return null;
    return {
      id: typeof k.id === "string" && k.id ? k.id : idNeu("ko"),
      name: (typeof k.name === "string" ? k.name.trim() : "").slice(0,60) || "Konto",
      typ: KONTOTYPEN[k.typ] ? k.typ : "giro",
      startsaldoCent: Number.isFinite(+k.startsaldoCent) ? Math.round(+k.startsaldoCent) : 0
    };
  }).filter(Boolean);

  p.tags = (Array.isArray(roh.tags) ? roh.tags : []).map(t => {
    if(!t || typeof t !== "object") return null;
    return {
      id: typeof t.id === "string" && t.id ? t.id : idNeu("tg"),
      name: (typeof t.name === "string" ? t.name.trim() : "").slice(0,40) || "Tag",
      farbe: PALETTE.includes(t.farbe) ? t.farbe : "p1"
    };
  }).filter(Boolean);

  p.kategorien = (Array.isArray(roh.kategorien) ? roh.kategorien : [])
    .map(k => typeof k === "string" ? k.trim().slice(0,50) : "")
    .filter(k => k.length > 0);

  const kontoIds = new Set(p.konten.map(k => k.id));
  const tagIds = new Set(p.tags.map(t => t.id));

  p.einnahmen = (Array.isArray(roh.einnahmen) ? roh.einnahmen : []).map(x => {
    if(!x || typeof x !== "object") return null;
    return {
      id: typeof x.id === "string" && x.id ? x.id : idNeu("ei"),
      name: (typeof x.name === "string" ? x.name.trim() : "").slice(0,80) || "Einnahme",
      betragCent: Number.isFinite(+x.betragCent) ? Math.max(0, Math.round(+x.betragCent)) : 0,
      intervall: INTERVALLE[x.intervall] ? x.intervall : "monatlich",
      kontoId: kontoIds.has(x.kontoId) ? x.kontoId : null,
      eingangTag: Number.isFinite(+x.eingangTag) ? klemmen(Math.round(+x.eingangTag),1,31) : 1,
      art: ["netto","brutto"].includes(x.art) ? x.art : "netto",
      aktiv: x.aktiv !== false,
      notiz: (typeof x.notiz === "string" ? x.notiz : "").slice(0,400)
    };
  }).filter(Boolean);

  p.ausgaben = (Array.isArray(roh.ausgaben) ? roh.ausgaben : []).map(x => {
    if(!x || typeof x !== "object") return null;
    const tags = (Array.isArray(x.tags) ? x.tags : []).filter(t => tagIds.has(t));
    return {
      id: typeof x.id === "string" && x.id ? x.id : idNeu("au"),
      name: (typeof x.name === "string" ? x.name.trim() : "").slice(0,80) || "Position",
      betragCent: Number.isFinite(+x.betragCent) ? Math.max(0, Math.round(+x.betragCent)) : 0,
      intervall: INTERVALLE[x.intervall] ? x.intervall : "monatlich",
      kategorie: (typeof x.kategorie === "string" ? x.kategorie.trim() : "").slice(0,50) || "Sonstiges",
      zahlungsweg: ZAHLUNGSWEGE[x.zahlungsweg] ? x.zahlungsweg : "giro",
      kontoId: kontoIds.has(x.kontoId) ? x.kontoId : null,
      faelligTag: Number.isFinite(+x.faelligTag) ? klemmen(Math.round(+x.faelligTag),1,31) : 1,
      startMonat: Number.isFinite(+x.startMonat) ? klemmen(Math.round(+x.startMonat),1,12) : 1,
      tags,
      prioritaet: PRIORITAETEN[x.prioritaet] ? x.prioritaet : "variabel",
      aktiv: x.aktiv !== false,
      notiz: (typeof x.notiz === "string" ? x.notiz : "").slice(0,400)
    };
  }).filter(Boolean);

  // Alle benutzten Kategorien müssen auch in der Kategorienliste stehen.
  const katSet = new Set(p.kategorien);
  p.ausgaben.forEach(a => { if(!katSet.has(a.kategorie)){ katSet.add(a.kategorie); p.kategorien.push(a.kategorie); } });

  return p;
}

/** Jahresbetrag einer Position in Cent. Wöchentlich = Betrag × 52. */
function jahresCent(pos){
  if(!pos || pos.aktiv === false) return 0;
  const iv = INTERVALLE[pos.intervall];
  if(!iv) return 0;
  const c = Number.isFinite(pos.betragCent) ? pos.betragCent : 0;
  return Math.round(c * iv.faktor);
}
/** Monatsbetrag in Cent (gerundet, nur für die Anzeige einzelner Zeilen). */
function monatsCent(pos){
  return Math.round(jahresCent(pos) / 12);
}
/** Der Wert im gerade gewählten Zeitraum. */
function imZeitraum(jahresWert){
  return S.einstellungen.ansicht === "jahr" ? jahresWert : jahresWert / 12;
}
function zeitraumWort(){
  return S.einstellungen.ansicht === "jahr" ? "im Jahr" : "im Monat";
}
function zeitraumKurz(){
  return S.einstellungen.ansicht === "jahr" ? "/Jahr" : "/Monat";
}
/** Formatiert einen Jahres-Cent-Wert im aktuell gewählten Zeitraum. */
function euroZ(jahresWert){
  return euro(imZeitraum(jahresWert));
}

/** Aktive Positionen des aktuellen Profils. */
function aktiveEinnahmen(){ return P().einnahmen.filter(x => x.aktiv !== false); }
function aktiveAusgaben(){ return P().ausgaben.filter(x => x.aktiv !== false); }

function summeJahr(liste){
  return liste.reduce((s,x) => s + jahresCent(x), 0);
}

/**
 * Die zentrale Kennzahl-Berechnung. Optional mit einem "Was wäre wenn"-Szenario:
 *   { einnahmenFaktor, ausgabenFaktor, ausgeblendet:Set }
 */
function kennzahlen(szenario = null){
  const ein = aktiveEinnahmen();
  let aus = aktiveAusgaben();
  if(szenario && szenario.ausgeblendet && szenario.ausgeblendet.size > 0){
    aus = aus.filter(a => !szenario.ausgeblendet.has(a.id));
  }
  const fE = szenario ? szenario.einnahmenFaktor : 1;
  const fA = szenario ? szenario.ausgabenFaktor : 1;

  const einnahmenJahr = Math.round(summeJahr(ein) * fE);
  const ausgabenJahr  = Math.round(summeJahr(aus) * fA);
  const ueberschussJahr = einnahmenJahr - ausgabenJahr;
  const sparquote = einnahmenJahr > 0 ? (ueberschussJahr / einnahmenJahr * 100) : null;

  // Bar-Bedarf: alles mit Zahlungsweg "Bar".
  const barJahr = Math.round(aus.filter(a => a.zahlungsweg === "bar").reduce((s,a)=>s+jahresCent(a),0) * fA);

  // Fixkosten und variable Kosten
  const fixJahr = Math.round(aus.filter(a => a.prioritaet === "fix").reduce((s,a)=>s+jahresCent(a),0) * fA);
  const varJahr = Math.round(aus.filter(a => a.prioritaet === "variabel").reduce((s,a)=>s+jahresCent(a),0) * fA);
  const luxJahr = Math.round(aus.filter(a => a.prioritaet === "luxus").reduce((s,a)=>s+jahresCent(a),0) * fA);

  // Rücklage: alles, was nicht monatlich oder öfter anfällt.
  const ruecklageJahr = Math.round(aus
    .filter(a => ["zweimonatlich","vierteljaehrlich","halbjaehrlich","jaehrlich","einmalig"].includes(a.intervall))
    .reduce((s,a)=>s+jahresCent(a),0) * fA);

  return {
    einnahmenJahr, ausgabenJahr, ueberschussJahr, sparquote,
    barJahr, fixJahr, varJahr, luxJahr, ruecklageJahr,
    anzahlEinnahmen: ein.length, anzahlAusgaben: aus.length
  };
}

/** Ordnet eine Ausgabe einem Konto zu — direkt oder über den Zahlungsweg. */
function kontoFuer(pos){
  const p = P();
  if(pos.kontoId){
    const k = p.konten.find(k => k.id === pos.kontoId);
    if(k) return k;
  }
  const wunschTyp = ZAHLUNGSWEGE[pos.zahlungsweg]?.kontotyp;
  if(wunschTyp){
    const k = p.konten.find(k => k.typ === wunschTyp);
    if(k) return k;
  }
  return null;
}

/** Summen je Zahlungsweg (Jahres-Cent). */
function summenNachZahlungsweg(){
  const map = {};
  Object.keys(ZAHLUNGSWEGE).forEach(w => map[w] = 0);
  aktiveAusgaben().forEach(a => { map[a.zahlungsweg] = (map[a.zahlungsweg]||0) + jahresCent(a); });
  return map;
}

/** Summen je Konto (Jahres-Cent), inklusive "ohne Konto". */
function summenNachKonto(){
  const p = P();
  const map = new Map();
  p.konten.forEach(k => map.set(k.id, { konto:k, jahr:0, anzahl:0 }));
  let ohne = { konto:null, jahr:0, anzahl:0 };
  aktiveAusgaben().forEach(a => {
    const k = kontoFuer(a);
    if(k && map.has(k.id)){
      const e = map.get(k.id);
      e.jahr += jahresCent(a); e.anzahl++;
    } else {
      ohne.jahr += jahresCent(a); ohne.anzahl++;
    }
  });
  const liste = Array.from(map.values()).filter(e => e.anzahl > 0 || e.jahr !== 0);
  if(ohne.anzahl > 0) liste.push(ohne);
  liste.sort((a,b) => b.jahr - a.jahr);
  return liste;
}

/** Summen je Tag (Jahres-Cent). */
function summenNachTag(){
  const p = P();
  const map = new Map();
  p.tags.forEach(t => map.set(t.id, { tag:t, jahr:0, anzahl:0 }));
  let ohne = 0, ohneAnzahl = 0;
  aktiveAusgaben().forEach(a => {
    if(!a.tags || a.tags.length === 0){ ohne += jahresCent(a); ohneAnzahl++; return; }
    a.tags.forEach(tid => {
      if(map.has(tid)){ const e = map.get(tid); e.jahr += jahresCent(a); e.anzahl++; }
    });
  });
  const liste = Array.from(map.values());
  liste.sort((a,b) => b.jahr - a.jahr);
  return { liste, ohneJahr:ohne, ohneAnzahl };
}

/** Summen je Kategorie (Jahres-Cent), absteigend. */
function summenNachKategorie(){
  const map = new Map();
  aktiveAusgaben().forEach(a => {
    const k = a.kategorie || "Sonstiges";
    if(!map.has(k)) map.set(k, { name:k, jahr:0, anzahl:0 });
    const e = map.get(k);
    e.jahr += jahresCent(a); e.anzahl++;
  });
  return Array.from(map.values()).sort((a,b) => b.jahr - a.jahr);
}

/**
 * Fällt eine Position in einem bestimmten Monat an? (1 = Januar)
 * Nicht-monatliche Positionen starten in ihrem Startmonat und wiederholen sich
 * im Rhythmus des Intervalls.
 */
function faelligImMonat(pos, monat1bis12){
  const iv = INTERVALLE[pos.intervall];
  if(!iv || !iv.kalender) return false;
  const schritt = 12 / iv.faktor;              // monatlich=1, jährlich=12 …
  if(pos.intervall === "einmalig") return monat1bis12 === (pos.startMonat || 1);
  const start = (pos.startMonat || 1) - 1;
  const diff = ((monat1bis12 - 1) - start + 12) % 12;
  return diff % schritt === 0;
}

/** Der tatsächlich in diesem Monat abgebuchte Betrag in Cent. */
function betragImMonat(pos, monat1bis12){
  const iv = INTERVALLE[pos.intervall];
  if(!iv) return 0;
  if(!iv.kalender){
    // Wöchentlich / 14-tägig: gleichmäßig auf jeden Monat verteilt.
    // Bewusst ohne Rundung, damit die Summe über zwölf Monate exakt bleibt.
    return pos.betragCent * iv.faktor / 12;
  }
  return faelligImMonat(pos, monat1bis12) ? pos.betragCent : 0;
}

/** Der Jahresverlauf: 12 Werte in Cent. */
function jahresverlauf(){
  const werte = [];
  for(let m=1; m<=12; m++){
    let summe = 0;
    aktiveAusgaben().forEach(a => summe += betragImMonat(a, m));
    werte.push(summe);
  }
  return werte;
}

/** Alle Positionen, die an einem bestimmten Tag eines Monats fällig sind. */
function faelligkeitenProTag(monat1bis12){
  const map = new Map();
  aktiveAusgaben().forEach(a => {
    const iv = INTERVALLE[a.intervall];
    if(!iv || !iv.kalender) return;
    if(!faelligImMonat(a, monat1bis12)) return;
    const tag = klemmen(a.faelligTag || 1, 1, 31);
    if(!map.has(tag)) map.set(tag, { tag, summe:0, positionen:[] });
    const e = map.get(tag);
    e.summe += a.betragCent;
    e.positionen.push(a);
  });
  return map;
}

/** Die nächsten Abbuchungen ab heute, über die Monatsgrenze hinaus. */
function naechsteAbbuchungen(anzahl = 5){
  const jetzt = heute();
  const heuteTag = jetzt.getDate();
  const treffer = [];
  for(let versatz = 0; versatz < 3 && treffer.length < anzahl * 3; versatz++){
    const d = new Date(jetzt.getFullYear(), jetzt.getMonth() + versatz, 1);
    const monat = d.getMonth() + 1;
    const tageImMonat = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    aktiveAusgaben().forEach(a => {
      const iv = INTERVALLE[a.intervall];
      if(!iv || !iv.kalender) return;
      if(!faelligImMonat(a, monat)) return;
      const tag = Math.min(klemmen(a.faelligTag||1,1,31), tageImMonat);
      if(versatz === 0 && tag < heuteTag) return;
      treffer.push({ pos:a, tag, monat, jahr:d.getFullYear(), versatz,
                     sortier: versatz*100 + tag });
    });
  }
  treffer.sort((a,b) => a.sortier - b.sortier || b.pos.betragCent - a.pos.betragCent);
  return treffer.slice(0, anzahl);
}

/** Der Überweisungsplan: was muss vom Gehaltseingang wohin. */
function ueberweisungsplan(){
  const wege = summenNachZahlungsweg();
  const eintraege = [];
  const barJahr = wege.bar || 0;
  const giroJahr = (wege.giro||0) + (wege.lastschrift||0);
  const tgJahr = wege.tagesgeld || 0;
  const kkJahr = wege.kreditkarte || 0;
  const k = kennzahlen();

  if(giroJahr > 0) eintraege.push({ text:"auf dem Girokonto lassen", jahr:giroJahr, icon:"ic-bank" });
  if(barJahr > 0)  eintraege.push({ text:"abheben (Bargeld)", jahr:barJahr, icon:"ic-bar" });
  if(tgJahr > 0)   eintraege.push({ text:"aufs Tagesgeld überweisen", jahr:tgJahr, icon:"ic-sparen" });
  if(kkJahr > 0)   eintraege.push({ text:"für die Kreditkarte bereithalten", jahr:kkJahr, icon:"ic-karte" });
  if(k.ruecklageJahr > 0) eintraege.push({ text:"Rücklage für Jahresrechnungen", jahr:k.ruecklageJahr, icon:"ic-kalender", hinweis:true });
  return { eintraege, ueberschussJahr: k.ueberschussJahr };
}

/** Fixkosten für X Monate — Grundlage des Notgroschens. */
function notgroschenBedarf(monate = 3){
  const k = kennzahlen();
  return Math.round(k.fixJahr / 12 * monate);
}

/** 50/30/20: Bedarf, Wünsche, Sparen — jeweils Jahres-Cent. */
function regel503020(){
  const aus = aktiveAusgaben();
  let bedarf = 0, wuensche = 0, sparen = 0;
  aus.forEach(a => {
    const j = jahresCent(a);
    const istSparen = SPAR_KATEGORIEN.some(s => (a.kategorie||"").toLowerCase().includes(s.toLowerCase()));
    if(istSparen) sparen += j;
    else if(a.prioritaet === "luxus") wuensche += j;
    else bedarf += j;
  });
  const k = kennzahlen();
  // Ein positiver Überschuss zählt als Sparen, ein Defizit bleibt außen vor.
  if(k.ueberschussJahr > 0) sparen += k.ueberschussJahr;
  const basis = k.einnahmenJahr;
  return { bedarf, wuensche, sparen, basis };
}

/** Kündigungs-Kandidaten: Tag "Kündbar" oder Priorität "Luxus". */
function kuendigungsKandidaten(){
  const p = P();
  const kuendbarTag = p.tags.find(t => t.name.toLowerCase().startsWith("kündbar"));
  return aktiveAusgaben()
    .filter(a => a.prioritaet === "luxus" || (kuendbarTag && a.tags.includes(kuendbarTag.id)))
    .sort((a,b) => jahresCent(b) - jahresCent(a));
}

/** Stundenlohn in Cent — nur wenn Wochenstunden eingetragen sind. */
function stundenlohnCent(){
  const std = S.einstellungen.wochenstunden;
  if(!std || std <= 0) return null;
  const k = kennzahlen();
  if(k.einnahmenJahr <= 0) return null;
  const jahresStunden = std * 52;
  if(jahresStunden <= 0) return null;
  return k.einnahmenJahr / jahresStunden;
}

/** Wie viele Arbeitsstunden kostet eine Position im Jahr? */
function arbeitsstunden(jahresBetragCent){
  const lohn = stundenlohnCent();
  if(!lohn || lohn <= 0) return null;
  return jahresBetragCent / lohn;
}

/** Hochrechnung des Ersparten über N Monate, optional mit Zins. */
function hochrechnung(monate){
  const k = kennzahlen();
  const proMonat = k.ueberschussJahr / 12;
  const zinsJahr = S.einstellungen.tagesgeldZins || 0;
  if(zinsJahr <= 0) return Math.round(proMonat * monate);
  const r = zinsJahr / 100 / 12;
  // Rentenendwert bei nachschüssiger Einzahlung
  const endwert = proMonat * ((Math.pow(1+r, monate) - 1) / r);
  return Math.round(endwert);
}

/** Die Farbe eines Tags als CSS-Wert. */
function tagFarbe(tag){
  return `var(--${PALETTE.includes(tag?.farbe) ? tag.farbe : "p1"})`;
}
function palettenFarbe(index){
  return `var(--${PALETTE[index % PALETTE.length]})`;
}

/* ---------- Toasts mit Rückgängig ---------- */

let toastZaehler = 0;
function toast(text, rueckgaengig = null, dauer = 6000){
  const bereich = $("#toast-bereich");
  const meins = ++toastZaehler;
  const knopf = rueckgaengig
    ? el("button",{ type:"button", text:"Rückgängig", onclick:() => { rueckgaengig(); weg(); } })
    : null;
  const t = el("div",{ class:"toast", role:"status" },
    el("div",{ class:"text", text }),
    knopf
  );
  bereich.appendChild(t);
  let zeit = setTimeout(weg, dauer);
  function weg(){
    clearTimeout(zeit);
    if(!t.isConnected) return;
    t.classList.add("weg");
    setTimeout(() => t.remove(), 220);
  }
  // Nie mehr als drei Toasts gleichzeitig.
  while(bereich.children.length > 3) bereich.firstElementChild.remove();
  return { schliessen: weg, id: meins };
}

/* ---------- Modale Dialoge (zwei Ebenen möglich) ---------- */

const dialogStapel = [];

function dialogOeffnen({ titel, koerper, fuss, ebene = 1, beimSchliessen = null, breite = null }){
  const o = ebene === 2 ? $("#overlay2") : $("#overlay");
  const kBox = ebene === 2 ? $("#sheet2-koerper") : $("#sheet-koerper");
  const fBox = ebene === 2 ? $("#sheet2-fuss") : $("#sheet-fuss");
  const tBox = ebene === 2 ? $("#sheet2-titel") : $("#sheet-titel");

  tBox.textContent = titel;
  kBox.replaceChildren();
  fBox.replaceChildren();
  if(koerper) kBox.appendChild(koerper);
  if(fuss){ fBox.appendChild(fuss); fBox.style.display = ""; } else { fBox.style.display = "none"; }

  o.hidden = false;
  // Ein Frame warten, damit die Einblend-Animation greift.
  requestAnimationFrame(() => o.classList.add("offen"));
  document.body.style.overflow = "hidden";
  kBox.scrollTop = 0;

  dialogStapel.push({ ebene, beimSchliessen, vorherFokus: document.activeElement });

  // Erstes sinnvolles Feld fokussieren.
  setTimeout(() => {
    const ziel = kBox.querySelector("[data-autofokus]") || kBox.querySelector("input:not([type=hidden]), textarea, select");
    if(ziel && window.matchMedia("(min-width:700px)").matches) ziel.focus();
    else if(ziel && ziel.dataset.autofokus !== undefined) ziel.focus();
  }, 280);
  return { koerper:kBox, fuss:fBox };
}

function dialogSchliessen(ebene = null){
  const oben = dialogStapel[dialogStapel.length - 1];
  if(!oben) return;
  if(ebene !== null && oben.ebene !== ebene) return;
  dialogStapel.pop();
  const o = oben.ebene === 2 ? $("#overlay2") : $("#overlay");
  o.classList.remove("offen");
  setTimeout(() => {
    o.hidden = true;
    if(dialogStapel.length === 0) document.body.style.overflow = "";
  }, 260);
  if(typeof oben.beimSchliessen === "function") oben.beimSchliessen();
  if(oben.vorherFokus && typeof oben.vorherFokus.focus === "function" && dialogStapel.length === 0){
    try{ oben.vorherFokus.focus({ preventScroll:true }); }catch(f){}
  }
}

function alleDialogeSchliessen(){
  while(dialogStapel.length) dialogSchliessen();
}

/**
 * Wischen: nach links löschen, nach rechts duplizieren.
 * Bewusst nur auf Touch-Geräten — mit der Maus stört das Verhalten eher.
 */
function wischGesteAnbinden(huelle, zeileEl, aufLoeschen, aufDuplizieren){
  let startX = 0, startY = 0, dx = 0, aktiv = false, entschieden = false, richtung = null;
  const SCHWELLE = 78;

  zeileEl.addEventListener("touchstart", (e) => {
    if(UI.auswahlModus) return;
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dx = 0; aktiv = true; entschieden = false; richtung = null;
    zeileEl.style.transition = "none";
  }, { passive:true });

  zeileEl.addEventListener("touchmove", (e) => {
    if(!aktiv) return;
    const x = e.touches[0].clientX - startX;
    const y = e.touches[0].clientY - startY;
    if(!entschieden){
      if(Math.abs(x) < 8 && Math.abs(y) < 8) return;
      entschieden = true;
      richtung = Math.abs(x) > Math.abs(y) * 1.4 ? "quer" : "hoch";
    }
    if(richtung !== "quer"){ aktiv = false; zeileEl.style.transform = ""; return; }
    dx = x;
    if(dx < 0 && !aufLoeschen) dx = 0;
    if(dx > 0 && !aufDuplizieren) dx = 0;
    // Widerstand über der Schwelle
    const gezeigt = Math.abs(dx) > SCHWELLE
      ? Math.sign(dx) * (SCHWELLE + (Math.abs(dx)-SCHWELLE) * 0.35)
      : dx;
    zeileEl.style.transform = `translateX(${gezeigt}px)`;
    huelle.dataset.wisch = dx < 0 ? "loeschen" : "duplizieren";
  }, { passive:true });

  const beenden = () => {
    if(!aktiv) return;
    aktiv = false;
    zeileEl.style.transition = "transform 220ms cubic-bezier(.4,0,.2,1)";
    const ausgeloest = Math.abs(dx) > SCHWELLE;
    zeileEl.style.transform = "";
    if(ausgeloest){
      if(dx < 0 && aufLoeschen) setTimeout(aufLoeschen, 120);
      else if(dx > 0 && aufDuplizieren) setTimeout(aufDuplizieren, 120);
    }
    setTimeout(() => { delete huelle.dataset.wisch; }, 240);
    dx = 0;
  };
  zeileEl.addEventListener("touchend", beenden, { passive:true });
  zeileEl.addEventListener("touchcancel", beenden, { passive:true });
}

/** Ein aufklappbarer Abschnitt. */

  return d;
}

/** Lässt eine Zahl beim ersten Laden kurz hochzählen. */
function zahlHochzaehlen(element, zielCent){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(!Number.isFinite(zielCent)) return;
  const dauer = 620;
  const start = performance.now();
  const negativ = zielCent < 0;
  function schritt(jetzt){
    const t = Math.min(1, (jetzt - start) / dauer);
    // weiches Auslaufen
    const e = 1 - Math.pow(1 - t, 3);
    element.textContent = euro(zielCent * e);
    if(t < 1) requestAnimationFrame(schritt);
    else element.textContent = euro(zielCent);
  }
  requestAnimationFrame(schritt);
}

function gefilterteAusgaben(){
  const p = P();
  const suchtext = UI.suche.trim().toLowerCase();
  return p.ausgaben.filter(a => {
    if(UI.filterTags.size > 0){
      if(!a.tags.some(t => UI.filterTags.has(t))) return false;
    }
    if(suchtext){
      const heu = (a.name + " " + a.kategorie + " " + (a.notiz||"")).toLowerCase();
      if(!heu.includes(suchtext)) return false;
    }
    return true;
  });
}

function zeichneAusgabenListe(){
  const box = $("#ausgaben-liste");
  const summeBox = $("#ausgaben-summe");
  if(!box) return;
  box.replaceChildren();
  const p = P();
  const gefiltert = gefilterteAusgaben();

  if(summeBox){
    summeBox.replaceChildren();
    const summe = gefiltert.filter(a => a.aktiv !== false).reduce((s,a)=>s+jahresCent(a),0);
    const istGefiltert = gefiltert.length !== p.ausgaben.length;
    summeBox.appendChild(el("div",{ class:"karte eng", style:"display:flex;align-items:baseline;justify-content:space-between;gap:12px" },
      el("div",{},
        el("div",{ class:"t-kapitaelchen", text: istGefiltert ? "Auswahl "+zeitraumWort() : "Summe "+zeitraumWort() }),
        el("div",{ class:"t-klein", style:"margin-top:2px",
          text:`${gefiltert.length} von ${p.ausgaben.length} ${plural(p.ausgaben.length,"Position","Positionen")}` })
      ),
      el("div",{ style:"font-size:24px;font-weight:640;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap",
        text:euroZ(summe) })
    ));
  }

  if(gefiltert.length === 0){
    box.appendChild(el("div",{ class:"leer" },
      (() => { const s = icon("ic-suche"); s.classList.add("bild"); return s; })(),
      el("h3",{ text:"Nichts gefunden" }),
      el("p",{ text:"Für diese Suche oder diesen Filter gibt es keine Positionen." }),
      el("button",{ class:"knopf rahmen", type:"button", text:"Filter zurücksetzen",
        onclick:() => { UI.suche=""; UI.filterTags.clear(); zeichneAusgaben(); } })
    ));
    return;
  }

  /* Sortierfunktion */
  const sortieren = (liste) => {
    const kopie = [...liste];
    if(UI.sortierung === "name") kopie.sort((a,b) => collator.compare(a.name, b.name));
    else if(UI.sortierung === "faelligkeit") kopie.sort((a,b) => (a.faelligTag||1) - (b.faelligTag||1) || collator.compare(a.name,b.name));
    else kopie.sort((a,b) => jahresCent(b) - jahresCent(a) || collator.compare(a.name,b.name));
    return kopie;
  };

  /* Gruppieren */
  const gruppen = new Map();
  const gruppenSchluessel = (a) => {
    switch(UI.gruppierung){
      case "kategorie": return a.kategorie || "Sonstiges";
      case "zahlungsweg": return ZAHLUNGSWEGE[a.zahlungsweg]?.name || "Unbekannt";
      case "konto": { const k = kontoFuer(a); return k ? k.name : "Ohne Konto"; }
      case "faelligkeit": {
        const t = klemmen(a.faelligTag||1,1,31);
        if(!INTERVALLE[a.intervall].kalender) return "Laufend (wöchentlich / 14-tägig)";
        if(t <= 5) return "1. bis 5.";
        if(t <= 15) return "6. bis 15.";
        if(t <= 25) return "16. bis 25.";
        return "26. bis Monatsende";
      }
      case "tag": {
        if(!a.tags || a.tags.length === 0) return "Ohne Tag";
        const t = P().tags.find(t => t.id === a.tags[0]);
        return t ? t.name : "Ohne Tag";
      }
      default: return "";
    }
  };

  if(UI.gruppierung === "keine"){
    const liste = el("div",{ class:"liste" });
    sortieren(gefiltert).forEach(a => liste.appendChild(ausgabenZeile(a)));
    box.appendChild(liste);
  } else {
    gefiltert.forEach(a => {
      const s = gruppenSchluessel(a);
      if(!gruppen.has(s)) gruppen.set(s, []);
      gruppen.get(s).push(a);
    });
    const sortierteGruppen = Array.from(gruppen.entries()).sort((a,b) => {
      const sa = a[1].filter(x=>x.aktiv!==false).reduce((s,x)=>s+jahresCent(x),0);
      const sb = b[1].filter(x=>x.aktiv!==false).reduce((s,x)=>s+jahresCent(x),0);
      return sb - sa || collator.compare(a[0], b[0]);
    });
    sortierteGruppen.forEach(([name, positionen]) => {
      const summe = positionen.filter(x=>x.aktiv!==false).reduce((s,x)=>s+jahresCent(x),0);
      box.appendChild(el("div",{ class:"liste-titel" },
        el("span",{ class:"t-kapitaelchen", text:name }),
        el("span",{ class:"t-label zahl", text:euroZ(summe) })
      ));
      const liste = el("div",{ class:"liste" });
      sortieren(positionen).forEach(a => liste.appendChild(ausgabenZeile(a)));
      box.appendChild(liste);
    });
  }

  box.appendChild(el("button",{ class:"knopf rahmen breit", type:"button", style:"margin-top:8px",
    onclick:() => ausgabeDialog(null) }, icon("ic-plus"), "Position hinzufügen"));

  zeichneAktionsleiste();
}

function ausgabenZeile(a){
  const p = P();
  const tags = (a.tags||[]).map(id => p.tags.find(t => t.id === id)).filter(Boolean);
  const iv = INTERVALLE[a.intervall];
  const teile = [iv.name];
  if(iv.kalender && a.intervall !== "einmalig") teile.push(`am ${a.faelligTag}.`);
  if(a.intervall === "einmalig") teile.push(`im ${MONATE_KURZ[(a.startMonat||1)-1]}`);
  else if(iv.faktor < 12 && iv.kalender) teile.push(`ab ${MONATE_KURZ[(a.startMonat||1)-1]}`);
  teile.push(ZAHLUNGSWEGE[a.zahlungsweg].name);
  if(a.aktiv === false) teile.push("pausiert");

  return zeile({
    id: a.id,
    name: a.name,
    unter: teile.join(" · "),
    betragJahr: a.aktiv === false ? 0 : jahresCent(a),
    tags,
    pausiert: a.aktiv === false,
    mitAuswahl: true,
    aufTippen: () => ausgabeDialog(a),
    aufLoeschen: () => ausgabeLoeschen(a),
    aufDuplizieren: () => ausgabeDuplizieren(a)
  });
}

function ausgabeLoeschen(a){
  const p = P();
  const index = p.ausgaben.findIndex(x => x.id === a.id);
  if(index < 0) return;
  const kopie = JSON.parse(JSON.stringify(a));
  p.ausgaben.splice(index,1);
  aendern();
  toast(`„${kuerzen(a.name,28)}“ gelöscht.`, () => {
    P().ausgaben.splice(Math.min(index, P().ausgaben.length), 0, kopie);
    aendern();
  });
}

function ausgabeDuplizieren(a){
  const kopie = JSON.parse(JSON.stringify(a));
  kopie.id = idNeu("au");
  kopie.name = a.name + " (Kopie)";
  P().ausgaben.push(kopie);

   6. DIAGRAMME — alle selbst gezeichnet, kein fremder Code
