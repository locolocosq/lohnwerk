   REITER 4 — ANALYSE
   ---------------------------------------------------------------- */
function reiterAnalyse(wurzel){
  const k = kennzahlen();

  /* Fix / Variabel / Luxus */
  if(k.ausgabenJahr > 0){
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" }, el("h2",{ text:"Feste und flexible Kosten" })),
      el("div",{ class:"regel-balken" },
        k.fixJahr > 0 ? el("div",{ style:`flex:${k.fixJahr};background:var(--p7)`, "aria-hidden":"true" }) : null,
        k.varJahr > 0 ? el("div",{ style:`flex:${k.varJahr};background:var(--p5)`, "aria-hidden":"true" }) : null,
        k.luxJahr > 0 ? el("div",{ style:`flex:${k.luxJahr};background:var(--p4)`, "aria-hidden":"true" }) : null
      ),
      el("div",{ style:"margin-top:6px" },
        [["Fixkosten", k.fixJahr, "var(--p7)", "läuft, egal was ist"],
         ["Variabel", k.varJahr, "var(--p5)", "Höhe schwankt"],
         ["Luxus", k.luxJahr, "var(--p4)", "könnte weg"]].map(([name,wert,farbe,neben]) =>
          el("div",{ class:"datenzeile" },
            el("span",{ class:"dz-name" },
              el("span",{ style:"display:inline-flex;align-items:center;gap:8px" },
                el("span",{ style:`width:8px;height:8px;border-radius:2px;background:${farbe};display:inline-block` }),
                el("span",{ text:name })),
              el("span",{ class:"neben", text:neben })),
            el("span",{ class:"dz-wert" },
              el("span",{ text:prozent(wert, k.ausgabenJahr) }),
              el("span",{ class:"neben", text:euroZ(wert) })
            )
          ))
      ),
      el("p",{ class:"t-klein", style:"margin-top:12px;line-height:1.5",
        text:`${prozent(k.fixJahr,k.ausgabenJahr)} deiner Ausgaben sind fest. Je niedriger dieser Anteil, desto schneller kannst du reagieren, wenn sich etwas ändert.` })
    ));
  }

  /* 50/30/20 */
  const regel = regel503020();
  if(regel.basis > 0){
    const s = regel.bedarf + regel.wuensche + regel.sparen;
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" }, el("h2",{ text:"50/30/20-Vergleich" })),
      el("div",{ class:"regel-balken" },
        regel.bedarf > 0 ? el("div",{ style:`flex:${regel.bedarf};background:var(--p1)`, "aria-hidden":"true" }) : null,
        regel.wuensche > 0 ? el("div",{ style:`flex:${regel.wuensche};background:var(--p4)`, "aria-hidden":"true" }) : null,
        regel.sparen > 0 ? el("div",{ style:`flex:${regel.sparen};background:var(--gruen)`, "aria-hidden":"true" }) : null
      ),
      el("div",{ style:"margin-top:6px" },
        [["Bedarf", regel.bedarf, 50, "var(--p1)"],
         ["Wünsche", regel.wuensche, 30, "var(--p4)"],
         ["Sparen", regel.sparen, 20, "var(--gruen)"]].map(([name,wert,soll,farbe]) => {
          const ist = s > 0 ? wert/s*100 : 0;
          return el("div",{ class:"datenzeile" },
            el("span",{ class:"dz-name" },
              el("span",{ style:"display:inline-flex;align-items:center;gap:8px" },
                el("span",{ style:`width:8px;height:8px;border-radius:2px;background:${farbe};display:inline-block` }),
                el("span",{ text:name })),
              el("span",{ class:"neben", text:`Faustregel ${soll} % · du liegst ${ist >= soll ? "darüber" : "darunter"}` })
            ),
            el("span",{ class:"dz-wert" },
              el("span",{ text: prozent(wert, s) }),
              el("span",{ class:"neben", text:euroZ(wert) })
            )
          );
        })
      ),
      el("p",{ class:"t-klein", style:"margin-top:14px;line-height:1.5",
        text:"Nur eine Faustregel, kein Maßstab. Wer in einer teuren Stadt wohnt, liegt beim Bedarf fast immer über 50 %. „Sparen“ zählt hier alles, was übrig bleibt — Sparplan und freier Rest." })
    ));
  }

  /* Kündigungs-Kandidaten */
  const kandidaten = kuendigungsKandidaten();
  if(kandidaten.length > 0){
    const summeK = kandidaten.reduce((s,a)=>s+jahresCent(a),0);
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" }, el("h2",{ text:"Was du einsparen könntest" })),
      el("p",{ class:"t-body", style:"color:var(--text-2);line-height:1.5",
        html:`Diese ${kandidaten.length} ${plural(kandidaten.length,"Position kostet","Positionen kosten")} dich <strong style="color:var(--text)">${euro(summeK)}</strong> im Jahr.` }),
      (() => {
        /* Was daraus würde, wenn du es stattdessen sparst */
        const jahre = S.einstellungen.hochrechnungJahre || 10;
        const u = sparUebersicht();
        const verlauf = sparVerlauf(0, summeK, u.mischRendite || 0, jahre,
                                    S.einstellungen.inflation||0, 0);
        const ende = verlauf[verlauf.length-1];
        return el("p",{ class:"t-klein", style:"margin-top:8px;line-height:1.55",
          html:`Würdest du das stattdessen sparen, wären daraus in ${jahre} ${plural(jahre,"Jahr","Jahren")} `
            + `<strong style="color:var(--gruen)">${euro(ende.wert)}</strong> geworden.` });
      })(),
      el("div",{ style:"margin-top:10px" },
        kandidaten.slice(0,15).map(a => {
          const std = arbeitsstunden(jahresCent(a));
          return el("div",{ class:"datenzeile" },
            el("button",{ class:"dz-name", type:"button", style:"text-align:left;min-width:0;flex:1",
              onclick:() => ausgabeDialog(a) },
              el("span",{ style:"display:block", text:a.name }),
              el("span",{ class:"neben", text: `${INTERVALLE[a.intervall].name} · ${wegFuer(a).name}`
                + (std && std >= 1 ? ` · rund ${Math.round(std)} ${plural(Math.round(std),"Arbeitsstunde","Arbeitsstunden")} im Jahr` : "") })
            ),
            el("span",{ class:"dz-wert" },
              el("span",{ text:euro(jahresCent(a)) }),
              el("span",{ class:"neben", text:"im Jahr" })
            )
          );
        })
      )
    ));
  }

  /* Was wäre wenn */
  wurzel.appendChild(wasWaereWennKarte());

  /* Stundenlohn */
  const lohn = stundenlohnCent();
  if(lohn){
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" }, el("h2",{ text:"Stundenlohn" })),
      el("div",{ style:"font-size:30px;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums",
        text:euro(lohn) }),
      el("p",{ class:"t-klein", style:"margin-top:6px;line-height:1.5",
        text:`Bei ${nfZahl.format(S.einstellungen.wochenstunden).replace(",00","")} Wochenstunden. Lohnwerk nutzt das, um bei teuren Positionen zu zeigen, wie viel Arbeitszeit dahintersteckt.` })
    ));
  } else {
    wurzel.appendChild(el("div",{ class:"karte flach" },
      el("p",{ class:"t-klein", style:"line-height:1.5",
        text:"Trag in den Einstellungen deine Wochenarbeitszeit ein — dann zeigt Lohnwerk bei jeder Position, wie vielen Arbeitsstunden sie entspricht." })
    ));
  }
}


/** Der Was-wäre-wenn-Bereich mit Schiebereglern. */
function wasWaereWennKarte(){
  const karte = el("div",{ class:"karte" });
  karte.appendChild(el("div",{ class:"karte-kopf" },
    el("h2",{ text:"Was wäre wenn" }),
    UI.szenarioAktiv ? el("button",{ class:"knopf leise klein", type:"button", text:"Zurücksetzen",
      onclick:() => { UI.szenario = { einnahmenFaktor:1, ausgabenFaktor:1, ausgeblendet:new Set() };
                      UI.szenarioAktiv = false; zeichnen(); } }) : null
  ));
  karte.appendChild(el("p",{ class:"t-klein", style:"margin-bottom:18px;line-height:1.5",
    text:"Probiere Änderungen aus. Deine gespeicherten Daten bleiben unangetastet." }));

  const ergebnis = el("div",{});
  const neuRechnen = () => {
    const s = kennzahlen(UI.szenario);
    const alt = kennzahlen();
    const diff = s.ueberschussJahr - alt.ueberschussJahr;
    ergebnis.replaceChildren(
      el("div",{ style:"padding:16px;border-radius:12px;background:var(--karte-2);margin-top:6px" },
        el("div",{ class:"t-kapitaelchen", text:"Neuer Überschuss "+zeitraumWort() }),
        el("div",{ style:`font-size:30px;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-top:2px;color:${s.ueberschussJahr>=0?"var(--gruen)":"var(--rot)"}`,
          text:euroZ(s.ueberschussJahr) }),
        el("div",{ class:"t-klein", style:"margin-top:4px",
          text: diff === 0 ? "unverändert"
            : `${diff > 0 ? "+" : "−"}${euroZ(Math.abs(diff))} gegenüber jetzt` }),
        el("div",{ class:"t-klein", style:"margin-top:8px",
          text:`Einnahmen ${euroZ(s.einnahmenJahr)} · Ausgaben ${euroZ(s.ausgabenJahr)}` })
      )
    );
  };

  const regler = (beschriftung, feld, min, max) => {
    const anzeige = el("span",{ class:"t-label zahl", style:"color:var(--akzent);font-weight:650" });
    const setzeAnzeige = () => {
      const pz = Math.round((UI.szenario[feld] - 1) * 100);
      anzeige.textContent = (pz > 0 ? "+" : "") + pz + " %";
    };
    setzeAnzeige();
    const input = el("input",{ type:"range", min, max, step:1,
      value: Math.round((UI.szenario[feld]-1)*100),
      "aria-label": beschriftung,
      oninput:(ev) => {
        UI.szenario[feld] = 1 + (+ev.target.value)/100;
        UI.szenarioAktiv = true;
        setzeAnzeige();
        neuRechnen();
      }});
    return el("div",{ class:"feld" },
      el("div",{ style:"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px" },
        el("span",{ class:"feld-label", style:"margin:0", text:beschriftung }),
        anzeige
      ),
      input
    );
  };

  karte.appendChild(regler("Einnahmen ändern","einnahmenFaktor",-50,100));
  karte.appendChild(regler("Alle Ausgaben ändern (z. B. Inflation)","ausgabenFaktor",-50,100));

  /* Einzelne Positionen ausblenden */
  const aus = aktiveAusgaben().slice().sort((a,b) => jahresCent(b)-jahresCent(a)).slice(0,20);
  if(aus.length > 0){
    karte.appendChild(klapp("Einzelne Positionen weglassen", () => {
      const box = el("div",{ class:"chip-reihe" });
      aus.forEach(a => {
        box.appendChild(el("button",{ class:"chip wahl", type:"button",
          "aria-pressed": UI.szenario.ausgeblendet.has(a.id) ? "true":"false",
          onclick:(ev) => {
            if(UI.szenario.ausgeblendet.has(a.id)) UI.szenario.ausgeblendet.delete(a.id);
            else UI.szenario.ausgeblendet.add(a.id);
            UI.szenarioAktiv = true;
            ev.currentTarget.setAttribute("aria-pressed", UI.szenario.ausgeblendet.has(a.id) ? "true":"false");
            neuRechnen();
          }}, `${kuerzen(a.name,22)} · ${euro(monatsCent(a))}`));
      });
      return box;
    }, UI.szenario.ausgeblendet.size > 0));
  }

  karte.appendChild(ergebnis);
  neuRechnen();
  return karte;
}

/** Text in die Zwischenablage — mit Rückfallweg für ältere Browser. */
function kopieren(text, knopf){
  const erfolg = () => {
    if(knopf){
      const alt = knopf.textContent;
      knopf.textContent = "Kopiert";
      setTimeout(() => { knopf.textContent = alt; }, 1600);
    } else toast("In die Zwischenablage kopiert.");
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(erfolg).catch(() => notfallKopie(text, erfolg));
  } else {
    notfallKopie(text, erfolg);
  }
}
function notfallKopie(text, erfolg){
  const ta = el("textarea",{ style:"position:fixed;opacity:0;top:0;left:0" });
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); erfolg(); }
  catch(f){ toast("Kopieren hat nicht geklappt. Markiere den Text und kopiere ihn von Hand."); }
  ta.remove();
}

/** Ein Betragsfeld, das auch rechnen kann: 45+12,50 */
function betragsFeld(startCent, beschriftung = "Betrag"){
  const feld = el("input",{
    class:"eingabe betrag", type:"text", inputmode:"decimal",
    autocomplete:"off", autocorrect:"off", spellcheck:"false",
    placeholder:"0,00",
    value: startCent > 0 ? zahlFuerFeld(startCent) : "",
    "data-autofokus":""
  });
  const hinweis = el("div",{ class:"feld-hinweis", text:"Komma oder Punkt, Rechnen erlaubt: 45+12,50" });
  const pruefen = () => {
    const roh = feld.value.trim();
    if(roh === ""){ hinweis.textContent = "Komma oder Punkt, Rechnen erlaubt: 45+12,50"; hinweis.classList.remove("warn"); return; }
    const c = betragParsen(roh);
    if(c === null){
      hinweis.textContent = "Das kann ich nicht lesen. Beispiel: 45,90 oder 45+12,50";
      hinweis.classList.add("warn");
    } else {
      hinweis.textContent = /[+\-*/()]/.test(roh) ? "Ergibt "+euro(c) : euro(c)+" — auch als Rechnung eingebbar";
      hinweis.classList.remove("warn");
    }
  };
  feld.addEventListener("input", pruefen);
  // Beim Verlassen die Rechnung ausschreiben, damit der Nutzer das Ergebnis sieht.
  feld.addEventListener("blur", () => {
    const c = betragParsen(feld.value);
    if(c !== null) feld.value = zahlFuerFeld(c);
    pruefen();
  });
  pruefen();
  const box = el("div",{ class:"feld" },
    el("div",{ class:"feld-label", text:beschriftung }),
    feld, hinweis
  );
  return { box, feld, wert:() => betragParsen(feld.value) };
}

function auswahlFeld(beschriftung, optionen, gewaehlt, aufAenderung){
  const sel = el("select",{ class:"eingabe", onchange:(e) => aufAenderung && aufAenderung(e.target.value) },
    optionen.map(([wert,text]) => el("option",{ value:wert, selected: wert === gewaehlt, text }))
  );
  return { box: el("div",{ class:"feld" }, el("div",{ class:"feld-label", text:beschriftung }), sel), feld:sel };
}

/** Ein/Aus-Schalter. */
function schalterFeld(haupt, neben, an, aufAenderung){
  const s = el("button",{ class:"schalter", type:"button", role:"switch",

      const neu = ev.currentTarget.getAttribute("aria-checked") !== "true";

  return el("div",{ class:"schalter-zeile" },

      el("div",{ class:"haupt", text:haupt }),
      neben ? el("div",{ class:"neben", text:neben }) : null

}

/* ---------- Ausgabe anlegen und bearbeiten ---------- */

    ? JSON.parse(JSON.stringify(vorhanden))

        zahlungsweg:(p.zahlungswege[1]||p.zahlungswege[0]).id, kontoId:null,

  UI.neuAlsSparen = false;

  const iv = auswahlFeld("Intervall",

  koerper.appendChild(el("div",{ class:"feld" }, el("div",{ class:"feld-label", text:"Zahlungsweg" }), wegSel));

  const kontoOptionen = [["", "— automatisch nach Zahlungsweg —"], ...p.konten.map(k => [k.id, k.name])];
  const konto = auswahlFeld("Konto", kontoOptionen, daten.kontoId || "", (w) => daten.kontoId = w || null);
  koerper.appendChild(konto.box);

  const prio = auswahlFeld("Priorität",
    [["fix","Fixkosten — läuft, egal was ist"],["variabel","Variabel — Höhe schwankt"],["luxus","Luxus — könnte weg"]],

  const monatSel = el("select",{ class:"eingabe", onchange:(e) => { daten.startMonat = +e.target.value; vorschauAktualisieren(); } },
    MONATE_LANG.map((m,i) => el("option",{ value:i+1, selected:(daten.startMonat||1)===i+1, text:m })));

  const terminBox = el("div",{ class:"feld" },
    el("div",{ class:"feld-label", text:"Fällig" }),
    el("div",{ class:"feld-reihe" },
      el("div",{}, el("div",{ class:"t-label", style:"margin-bottom:4px;font-size:12px", text:"Tag im Monat" }), tagFeld),
      el("div",{ id:"monat-box" }, el("div",{ class:"t-label", style:"margin-bottom:4px;font-size:12px", id:"monat-label", text:"Ab Monat" }), monatSel)
    ),

  );
  koerper.appendChild(terminBox);

  function terminSichtbarkeit(){
    const info = INTERVALLE[daten.intervall];
    const monatBox = $("#monat-box", terminBox);
    const hinweis = $("#termin-hinweis", terminBox);
    const monatLabel = $("#monat-label", terminBox);
    if(!info.kalender){
      terminBox.style.display = "none";

    if(daten.intervall === "monatlich"){
      monatBox.style.display = "none";
      hinweis.textContent = "Jeden Monat an diesem Tag.";

      monatBox.style.display = "";
      monatLabel.textContent = "Im Monat";
      hinweis.textContent = "Einmalige Ausgaben werden auf zwölf Monate verteilt gerechnet, damit sie in der Planung nicht fehlen.";
    } else {
      monatBox.style.display = "";
      monatLabel.textContent = "Ab Monat";
      hinweis.textContent = `Wiederholt sich ${INTERVALLE[daten.intervall].name} ab diesem Monat.`;
    }

  const tagsZeichnen = () => {
    tagBox.replaceChildren();
    P().tags.forEach(t => {
      tagBox.appendChild(el("button",{ class:"chip wahl", type:"button",
        "aria-pressed": daten.tags.includes(t.id) ? "true":"false",
        onclick:(ev) => {
          if(daten.tags.includes(t.id)) daten.tags = daten.tags.filter(x => x !== t.id);
          else daten.tags.push(t.id);
          ev.currentTarget.setAttribute("aria-pressed", daten.tags.includes(t.id) ? "true":"false");
          sparSichtbarkeit();
          vorschauAktualisieren();
        }},
        el("span",{ class:"punkt", style:`background:${tagFarbe(t)}` }),
        el("span",{ text:t.name })
      ));

  koerper.appendChild(el("div",{ class:"feld" },
    el("div",{ class:"feld-label", text:"Tags" }), tagBox,
    el("div",{ class:"feld-hinweis",
      text:"Mit dem Tag „Sparen“ zählt die Position nicht als Ausgabe, sondern als Geld, das dir bleibt." })));

  /* Sparfelder — nur sichtbar, wenn das Spar-Tag gesetzt ist. */
  const renditeFeld = el("input",{ class:"eingabe", type:"number", min:"0", max:"30", step:"0.05",
    inputmode:"decimal", value: daten.renditeProzent || "", placeholder:"z. B. 2,5",
    onchange:(e) => {
      const v = parseFloat(String(e.target.value).replace(",","."));
      daten.renditeProzent = Number.isFinite(v) ? klemmen(v,0,30) : 0;
      vorschauAktualisieren();
    }});
  const bestand = betragsFeld(daten.bestandCent, "Schon zurückgelegt");
  bestand.feld.removeAttribute("data-autofokus");
  bestand.feld.addEventListener("input", () => vorschauAktualisieren());
  const ziel = betragsFeld(daten.zielCent, "Sparziel (optional)");
  ziel.feld.removeAttribute("data-autofokus");
  ziel.feld.addEventListener("input", () => vorschauAktualisieren());

  const sparBox = el("div",{ style:"margin-top:4px;padding:16px 16px 16px 18px;border-radius:14px;"
      + "background:var(--karte-2);box-shadow:inset 3px 0 0 var(--gruen)" },
    el("div",{ style:"display:flex;align-items:center;gap:9px;margin-bottom:14px" },
      (() => { const s = icon("ic-sparen"); s.style.width="18px"; s.style.height="18px"; s.style.color="var(--gruen)"; return s; })(),
      el("span",{ class:"t-kapitaelchen", style:"color:var(--gruen)", text:"Sparposten" })
    ),
    el("div",{ class:"feld" }, el("div",{ class:"feld-label", text:"Erwartete Rendite pro Jahr in Prozent" }), renditeFeld,
      el("div",{ class:"feld-hinweis", text:"Für die Hochrechnung. Tagesgeld, Sparbuch, ETF-Erwartung — was du für realistisch hältst." })),

  );
  koerper.appendChild(sparBox);
  function sparSichtbarkeit(){
    sparBox.style.display = daten.tags.includes(SPAR_TAG_ID) ? "" : "none";
  }
  sparSichtbarkeit();

  const notizFeld = el("textarea",{ class:"eingabe", placeholder:"Optional — Vertragsnummer, Kündigungsfrist …", maxlength:"400" });
  notizFeld.value = daten.notiz || "";
  koerper.appendChild(el("div",{ class:"feld" }, el("div",{ class:"feld-label", text:"Notiz" }), notizFeld));

  koerper.appendChild(schalterFeld("Aktiv", "Pausierte Positionen zählen nicht mit.", daten.aktiv !== false,

  const vorschau = el("div",{ style:"margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--karte-2)" });
  koerper.appendChild(vorschau);
  function vorschauAktualisieren(){
    const c = betrag.wert() ?? 0;
    const jahr = Math.round(c * INTERVALLE[daten.intervall].faktor);
    const std = arbeitsstunden(jahr);
    const sparen = daten.tags.includes(SPAR_TAG_ID);

    const kinder = [
      el("div",{ class:"t-kapitaelchen", text:"Ergibt" }),
      el("div",{ style:"font-size:16px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums",
        text:`${euro(jahr/12)} im Monat · ${euro(jahr)} im Jahr` })
    ];

    if(sparen){
      /* Bei Sparposten interessiert nicht der Arbeitsstunden-Vergleich,
         sondern was daraus wird. */
      const start = bestand.wert() ?? 0;
      const zielC = ziel.wert() ?? 0;
      const jahre = S.einstellungen.hochrechnungJahre || 10;
      const reihe = sparVerlauf(start, jahr, daten.renditeProzent||0, jahre,
                                S.einstellungen.inflation||0, S.einstellungen.sparSteigerung||0);
      const ende = reihe[reihe.length-1];
      kinder.push(el("div",{ class:"t-klein", style:"margin-top:8px;line-height:1.55",
        html:`In ${jahre} ${plural(jahre,"Jahr","Jahren")}: <strong style="color:var(--text)">${euro(ende.wert)}</strong>`
           + (ende.gewinn > 0 ? ` — davon ${euro(ende.gewinn)} Gewinn` : "")
           + `<br>Kaufkraft in heutigem Geld: ${euro(ende.kaufkraft)}` }));
      if(zielC > 0){
        const m = monateBisZiel(start, jahr/12, zielC, daten.renditeProzent||0);
        kinder.push(el("div",{ class:"t-klein", style:"margin-top:6px",
          text: m === null ? "Das Ziel wird mit diesem Betrag nicht erreicht."
              : m === 0 ? "Das Ziel ist schon erreicht."
              : `Ziel erreicht in ${m} ${plural(m,"Monat","Monaten")}${m>=12 ? ` (rund ${(m/12).toFixed(1).replace(".",",")} Jahre)` : ""}.` }));
      }
    } else if(std && std >= 1){
      kinder.push(el("div",{ class:"t-klein", style:"margin-top:4px",
        text:`Entspricht rund ${Math.round(std)} ${plural(Math.round(std),"Arbeitsstunde","Arbeitsstunden")} im Jahr.` }));
    }
    vorschau.replaceChildren(...kinder);
  }
  betrag.feld.addEventListener("input", vorschauAktualisieren);
  vorschauAktualisieren();

  const speichernFn = () => {
    const name = nameFeld.value.trim();
    const c = betrag.wert();
    if(!name){ nameFeld.focus(); toast("Gib der Position einen Namen."); return; }
    if(c === null){ betrag.feld.focus(); toast("Der Betrag ist nicht lesbar."); return; }
    daten.name = name.slice(0,80);
    daten.betragCent = Math.max(0, c);
    daten.faelligTag = klemmen(parseInt(tagFeld.value,10)||1,1,31);
    daten.notiz = notizFeld.value.slice(0,400);
    if(daten.tags.includes(SPAR_TAG_ID)){
      daten.bestandCent = Math.max(0, bestand.wert() ?? 0);
      daten.zielCent = Math.max(0, ziel.wert() ?? 0);
    } else {
      daten.renditeProzent = 0; daten.bestandCent = 0; daten.zielCent = 0;
    }
    const pr = P();
    const i = pr.ausgaben.findIndex(x => x.id === daten.id);
    if(i >= 0) pr.ausgaben[i] = daten; else pr.ausgaben.push(daten);
    dialogSchliessen();
    aendern();
    toast(neu ? "Position angelegt." : "Änderungen gespeichert.");
  };

  const fuss = el("div",{ style:"display:flex;gap:8px;width:100%" },
    vorhanden ? el("button",{ class:"knopf gefahr", type:"button", "aria-label":"Löschen",
      onclick:() => { dialogSchliessen(); setTimeout(() => ausgabeLoeschen(vorhanden), 200); } }, icon("ic-muell")) : null,
    vorhanden ? el("button",{ class:"knopf", type:"button", "aria-label":"Duplizieren",
      onclick:() => { dialogSchliessen(); setTimeout(() => ausgabeDuplizieren(vorhanden), 200); } }, icon("ic-kopie")) : null,
    el("button",{ class:"knopf primaer", type:"button", style:"flex:1", text:"Position speichern", onclick:speichernFn })
  );

  koerper.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && e.target.tagName !== "TEXTAREA"){ e.preventDefault(); speichernFn(); }
  });

  dialogOeffnen({ titel: neu ? "Neue Position" : "Position bearbeiten", koerper, fuss });
}

/**

    (w) => daten.kontotyp = w);

  /* Symbolauswahl */
  const iconBox = el("div",{ class:"chip-reihe" });
  const iconsZeichnen = () => {
    iconBox.replaceChildren();
    WEG_ICONS.forEach(ic => {
      const b = el("button",{ class:"sym", type:"button", "aria-label":"Symbol wählen",
        style:`width:44px;height:44px;background:${daten.icon===ic?"var(--akzent-weich)":"var(--karte-2)"};`

        onclick:() => { daten.icon = ic; iconsZeichnen(); } }, icon(ic));
      iconBox.appendChild(b);
    });
  };
  iconsZeichnen();

  const koerper = el("div",{},
    el("div",{ class:"feld" }, el("div",{ class:"feld-label", text:"Name" }), feld),
    typ.box,
    el("div",{ class:"feld" }, el("div",{ class:"feld-label", text:"Symbol" }), iconBox,
      el("div",{ class:"feld-hinweis",
        text:"Bargeld zählt beim Punkt „Bar bereitlegen“ mit. Alles andere läuft über ein Konto." }))
  );

  const speichernFn = () => {
    const name = feld.value.trim().slice(0,40);
    if(!name){ feld.focus(); toast("Gib dem Zahlungsweg einen Namen."); return; }
    daten.name = name;
    const p = P();
    const i = p.zahlungswege.findIndex(w => w.id === daten.id);
    if(i >= 0) p.zahlungswege[i] = daten; else p.zahlungswege.push(daten);
    dialogSchliessen(2);
    speichern();
    if(dann) dann(daten);
    if(aktiveAnsicht === "einstellungen") zeichnen();
  };
  koerper.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); speichernFn(); } });

  const fuss = el("div",{ style:"display:flex;gap:8px;width:100%" },

      onclick:() => wegLoeschen(daten) }, icon("ic-muell")) : null,
    el("button",{ class:"knopf primaer", type:"button", style:"flex:1",
      text: vorhanden ? "Speichern" : "Anlegen", onclick:speichernFn })
  );
  dialogOeffnen({ titel: vorhanden ? "Zahlungsweg bearbeiten" : "Neuer Zahlungsweg", koerper, fuss, ebene:2 });
}

function wegLoeschen(weg){
  const p = P();
  if(p.zahlungswege.length <= 1){
    toast("Es muss mindestens ein Zahlungsweg übrig bleiben.");
    return;
  }
  const betroffen = p.ausgaben.filter(a => a.zahlungsweg === weg.id).length;
  const ersatz = p.zahlungswege.find(w => w.id !== weg.id);
  bestaetigen({
    titel:"Zahlungsweg löschen",
    text: betroffen > 0
      ? `${betroffen} ${plural(betroffen,"Position wechselt","Positionen wechseln")} auf „${ersatz.name}“. Die Positionen selbst bleiben erhalten.`
      : `„${weg.name}“ wird gelöscht.`,
    knopfText:"Löschen", gefahr:true, ebene:2,
    dann:() => {
      const pr = P();
      pr.zahlungswege = pr.zahlungswege.filter(w => w.id !== weg.id);
      pr.ausgaben.forEach(a => { if(a.zahlungsweg === weg.id) a.zahlungsweg = ersatz.id; });
      dialogSchliessen(2);
      aendern();
      toast("Zahlungsweg gelöscht.");
    }
  });
}

    if(aktiveAnsicht === "einstellungen" || aktiveAnsicht === "ausgaben") zeichnen();
  };

      onclick:() => tagLoeschen(daten) }, icon("ic-muell")) : null,
    el("button",{ class:"knopf primaer", type:"button", style:"flex:1", text: vorhanden ? "Speichern" : "Anlegen", onclick:speichernFn })
  );
  if(vorhanden && (vorhanden.id === SPAR_TAG_ID || vorhanden.id === ZAKAT_TAG_ID)){
    koerper.insertBefore(el("div",{ class:"banner", style:"margin-bottom:18px" },

        text: vorhanden.id === SPAR_TAG_ID

          : "Dieses Tag gehört fest zu Lohnwerk. Positionen damit gelten als Zakat-Zahlungen und werden im Zakat-Rechner von deiner Pflicht abgezogen. Umbenennen und umfärben geht, löschen nicht." })
    ), koerper.firstChild);
  }
  dialogOeffnen({ titel: vorhanden ? "Tag bearbeiten" : "Neuer Tag", koerper, fuss, ebene:2 });
}

function tagLoeschen(tag){
  const p = P();
  if(tag.id === SPAR_TAG_ID || tag.id === ZAKAT_TAG_ID){
    toast(`Das Tag „${tag.name}“ gehört fest zu Lohnwerk und lässt sich nicht löschen.`);
    return;
  }
  const betroffen = p.ausgaben.filter(a => a.tags.includes(tag.id)).length;
  bestaetigen({
    titel:"Tag löschen",
    text: betroffen > 0
      ? `„${tag.name}“ wird bei ${betroffen} ${plural(betroffen,"Position","Positionen")} entfernt. Die Positionen selbst bleiben erhalten.`
      : `„${tag.name}“ wird gelöscht.`,
    knopfText:"Löschen", gefahr:true, ebene:2,
    dann:() => {
      const pr = P();
      pr.tags = pr.tags.filter(t => t.id !== tag.id);
      pr.ausgaben.forEach(a => a.tags = a.tags.filter(t => t !== tag.id));
      UI.filterTags.delete(tag.id);
      dialogSchliessen(2);
      aendern();
      toast("Tag gelöscht.");
    }
  });
}

function kontoDialog(vorhanden){
  const daten = vorhanden ? { ...vorhanden } : { id:idNeu("ko"), name:"", typ:"giro", startsaldoCent:0 };
  const feld = el("input",{ class:"eingabe", type:"text", placeholder:"z. B. Girokonto", maxlength:"60",
    value:daten.name, "data-autofokus":"" });
  const typ = auswahlFeld("Typ", Object.entries(KONTOTYPEN).map(([w,d]) => [w,d.name]), daten.typ,
    (w) => daten.typ = w);
  const saldo = betragsFeld(daten.startsaldoCent, "Aktueller Stand (optional)");
  saldo.feld.removeAttribute("data-autofokus");

  const koerper = el("div",{},
    el("div",{ class:"feld" }, el("div",{ class:"feld-label", text:"Name" }), feld),
    typ.box, saldo.box
  );
  const speichernFn = () => {
    const name = feld.value.trim().slice(0,60);
    if(!name){ feld.focus(); return; }
    daten.name = name;
    daten.startsaldoCent = saldo.wert() ?? 0;
    const p = P();
    const i = p.konten.findIndex(k => k.id === daten.id);
    if(i >= 0) p.konten[i] = daten; else p.konten.push(daten);
    dialogSchliessen(2);

  koerper.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); speichernFn(); } });
  const fuss = el("div",{ style:"display:flex;gap:8px;width:100%" },
    vorhanden ? el("button",{ class:"knopf gefahr", type:"button", "aria-label":"Konto löschen",
      onclick:() => kontoLoeschen(daten) }, icon("ic-muell")) : null,
    el("button",{ class:"knopf primaer", type:"button", style:"flex:1", text: vorhanden ? "Speichern":"Anlegen", onclick:speichernFn })
  );
  dialogOeffnen({ titel: vorhanden ? "Konto bearbeiten" : "Neues Konto", koerper, fuss, ebene:2 });
}

function kontoLoeschen(konto){
  const p = P();
  const betroffen = p.ausgaben.filter(a => a.kontoId === konto.id).length
                  + p.einnahmen.filter(e => e.kontoId === konto.id).length;
  bestaetigen({
    titel:"Konto löschen",
    text: betroffen > 0
      ? `${betroffen} ${plural(betroffen,"Position ist","Positionen sind")} diesem Konto zugeordnet. Die Zuordnung wird aufgehoben, die Positionen bleiben.`
      : `„${konto.name}“ wird gelöscht.`,
    knopfText:"Löschen", gefahr:true, ebene:2,
    dann:() => {
      const pr = P();
      pr.konten = pr.konten.filter(k => k.id !== konto.id);
      pr.ausgaben.forEach(a => { if(a.kontoId === konto.id) a.kontoId = null; });
      pr.einnahmen.forEach(e => { if(e.kontoId === konto.id) e.kontoId = null; });
      dialogSchliessen(2);
      aendern();
      toast("Konto gelöscht.");
    }
  });
}

function profilDialog(vorhanden){
  const neu = !vorhanden;
  const feld = el("input",{ class:"eingabe", type:"text", maxlength:"60",
    placeholder:"z. B. Nach Gehaltserhöhung", value: vorhanden ? vorhanden.name : "", "data-autofokus":"" });
  let quelle = "leer";
  const koerper = el("div",{},
    el("div",{ class:"feld" }, el("div",{ class:"feld-label", text:"Name" }), feld)
  );
  if(neu){
    koerper.appendChild(el("div",{ class:"feld" },
      el("div",{ class:"feld-label", text:"Womit starten?" }),
      el("div",{ class:"segment breit" },
        el("button",{ type:"button", "aria-pressed":"true", text:"Leer", onclick:(e) => {
          quelle="leer"; e.target.parentElement.children[0].setAttribute("aria-pressed","true");
          e.target.parentElement.children[1].setAttribute("aria-pressed","false"); }}),
        el("button",{ type:"button", "aria-pressed":"false", text:"Kopie des aktuellen", onclick:(e) => {
          quelle="kopie"; e.target.parentElement.children[0].setAttribute("aria-pressed","false");
          e.target.parentElement.children[1].setAttribute("aria-pressed","true"); }})
      ),
      el("div",{ class:"feld-hinweis", text:"Eine Kopie enthält alle Einnahmen, Ausgaben, Konten und Tags — zum Durchspielen." })
    ));
  }
  const speichernFn = () => {
    const name = feld.value.trim().slice(0,60);
    if(!name){ feld.focus(); return; }
    if(neu){
      let p;
      if(quelle === "kopie"){
        p = JSON.parse(JSON.stringify(P()));
        p.id = idNeu("pr");
      } else {
        p = profilNeu(name);
        p.tags = [ { ...SPAR_TAG }, { ...ZAKAT_TAG }, ...TAG_VORSCHLAEGE.slice(0,6).map(t => ({ id:idNeu("tg"), name:t.name, farbe:t.farbe })) ];
        p.konten = KONTO_VORSCHLAEGE.map(k => ({ id:idNeu("ko"), name:k.name, typ:k.typ, startsaldoCent:0 }));
      }
      p.name = name;
      S.profile.push(p);
      S.aktivesProfil = p.id;
    } else {
      const p = S.profile.find(x => x.id === vorhanden.id);
      if(p) p.name = name;
    }
    dialogSchliessen(2);
    aendern();
    toast(neu ? `Profil „${name}“ angelegt.` : "Profil umbenannt.");
  };
  koerper.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); speichernFn(); } });
  const fuss = el("div",{ style:"display:flex;gap:8px;width:100%" },
    (vorhanden && S.profile.length > 1) ? el("button",{ class:"knopf gefahr", type:"button", "aria-label":"Profil löschen",
      onclick:() => profilLoeschen(vorhanden) }, icon("ic-muell")) : null,
    el("button",{ class:"knopf primaer", type:"button", style:"flex:1", text: neu ? "Anlegen":"Speichern", onclick:speichernFn })
  );
  dialogOeffnen({ titel: neu ? "Neues Profil" : "Profil bearbeiten", koerper, fuss, ebene:2 });
}

function profilLoeschen(profil){
  if(S.profile.length <= 1) return;
  const anzahl = (profil.einnahmen?.length||0) + (profil.ausgaben?.length||0);
  bestaetigen({
    titel:"Profil löschen",
    text:`„${profil.name}“ wird mit ${anzahl} ${plural(anzahl,"Position","Positionen")} gelöscht. Das lässt sich nicht rückgängig machen.`,
    knopfText:"Löschen", gefahr:true, ebene:2,
    dann:() => {
      S.profile = S.profile.filter(p => p.id !== profil.id);
      if(S.aktivesProfil === profil.id) S.aktivesProfil = S.profile[0].id;
      dialogSchliessen(2);
      aendern();
      toast("Profil gelöscht.");
    }
  });
}

          text: fehlt ? "—" : (pp.art==="schuld" ? "− " : "") + euro(wert) })
      ));
    });
    const v = zakatVermoegen();
    zkKarte.appendChild(el("div",{ style:"display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1.5px solid var(--linie-stark)" },
      el("span",{ class:"t-label", style:"font-weight:650", text:"Zakatpflichtig" }),
      el("span",{ style:"font-size:18px;font-weight:650;font-variant-numeric:tabular-nums", text:euro(v.netto) })
    ));
    zkKarte.appendChild(el("div",{ class:"knopf-reihe", style:"margin-top:14px" },
      el("button",{ class:"knopf klein rahmen", type:"button",
        onclick:() => { UI.rechnerOffen = "zakat"; navigieren("werkzeuge"); } },
        icon("ic-ziel"), "Zum Zakat-Rechner")
    ));
  }
  wurzel.appendChild(zkKarte);

  /* --- Schon gezahlte Zakat: reine Buchführung --- */
  const bezahltFeld = betragsFeld(S.einstellungen.zakat.bezahltCent || 0, "In diesem Jahr überwiesen");
  bezahltFeld.feld.removeAttribute("data-autofokus");
  const bezahltHinweis = bezahltFeld.box.querySelector(".feld-hinweis");
  if(bezahltHinweis) bezahltHinweis.remove();
  bezahltFeld.feld.addEventListener("change", () => {
    S.einstellungen.zakat.bezahltCent = Math.max(0, bezahltFeld.wert() ?? 0);
    aendern();
  });

  const bezahltKarte = el("div",{ class:"karte" },
    el("div",{ class:"karte-kopf" }, el("h2",{ text:"Schon bezahlte Zakat" })),
    el("p",{ class:"t-klein", style:"margin-top:-8px;margin-bottom:16px;line-height:1.55",
      text:"Trag hier ein, was du in diesem Zakat-Jahr bereits überwiesen hast. Die Zahl dient nur "
         + "der Übersicht — an deinem Monatsbetrag und an den Positionen ändert sie nichts." }),
    bezahltFeld.box
  );

  /* Die Gegenüberstellung, sobald eine Zakat berechnet werden kann. */
  const zv = zakatVermoegen();
  const zNisab = S.einstellungen.zakat.grundlage === "silber"
    ? Math.round(NISAB_SILBER_GRAMM * (S.einstellungen.silberPreisCent||0))
    : Math.round(NISAB_GOLD_GRAMM * (S.einstellungen.goldPreisCent||0));
  if(zNisab > 0 && zv.netto >= zNisab){
    const soll = Math.round(zv.netto * ZAKAT_SATZ);
    const bezahlt = S.einstellungen.zakat.bezahltCent || 0;
    const rest = soll - bezahlt;
    const zeile = (name, wert, farbe, fett) => el("div",{ class:"datenzeile" },
      el("span",{ class:"dz-name", style: fett ? "font-weight:600" : null, text:name }),
      el("span",{ class:"dz-wert", style: farbe ? `color:${farbe}` : null, text:wert })
    );
    bezahltKarte.appendChild(el("div",{ style:"margin-top:4px" },
      zeile("Zakat gesamt", euro(soll)),
      zeile("Davon schon gezahlt", "− "+euro(bezahlt), bezahlt > 0 ? "var(--gruen)" : null),
      el("div",{ class:"datenzeile", style:"border-top:1.5px solid var(--linie-stark)" },
        el("span",{ class:"dz-name", style:"font-weight:650",
          text: rest <= 0 ? "Vollständig gezahlt" : "Bleibt offen" }),
        el("span",{ class:"dz-wert", style:`font-size:17px;color:${rest <= 0 ? "var(--gruen)" : "var(--text)"}`,
          text: rest <= 0 ? euro(0) : euro(rest) })
      )
    ));
    if(rest < 0){
      bezahltKarte.appendChild(el("p",{ class:"t-klein", style:"margin-top:10px;line-height:1.5",
        text:`Du hast ${euro(-rest)} mehr gezahlt, als die Rechnung ergibt. Das Zuviel gilt als freiwillige Gabe.` }));
    }
    bezahltKarte.appendChild(el("div",{ class:"knopf-reihe", style:"margin-top:14px" },
      el("button",{ class:"knopf klein rahmen", type:"button",
        onclick:() => {
          const alt = S.einstellungen.zakat.bezahltCent || 0;
          S.einstellungen.zakat.bezahltCent = 0;
          aendern();
          toast("Zurückgesetzt — für ein neues Zakat-Jahr.", () => {
            S.einstellungen.zakat.bezahltCent = alt; aendern();
          });
        }},
        "Auf null setzen")
    ));
    bezahltKarte.appendChild(el("p",{ class:"t-klein", style:"margin-top:10px;line-height:1.5",
      text:"Nach deinem Stichtag beginnt ein neues Zakat-Jahr — dann setzt du den Wert wieder auf null." }));
  } else {
    bezahltKarte.appendChild(el("p",{ class:"t-klein", style:"margin-top:12px;line-height:1.5",
      text:"Sobald dein Vermögen über der Schwelle liegt und die Tagespreise eingetragen sind, "
         + "steht hier die Gegenüberstellung: Zakat gesamt, davon gezahlt, was offen bleibt." }));
  }
  wurzel.appendChild(bezahltKarte);

  /* --- Annahmen für die Hochrechnung --- */
  const zahlFeld = (wert, min, max, schritt, platzhalter, setzen) =>
    el("input",{ class:"eingabe", type:"number", min:String(min), max:String(max), step:String(schritt),
      inputmode:"decimal", value: wert || "", placeholder:platzhalter,
      onchange:(e) => {
        const v = parseFloat(String(e.target.value).replace(",","."));
        setzen(Number.isFinite(v) ? klemmen(v,min,max) : 0);
        aendern();
      }});

  wurzel.appendChild(el("div",{ class:"karte" },
    el("div",{ class:"karte-kopf" }, el("h2",{ text:"Annahmen für die Hochrechnung" })),
    el("p",{ class:"t-klein", style:"margin-top:-8px;margin-bottom:18px;line-height:1.5",
      text:"Diese Werte gelten für alle Prognosen in der Auswertung. Die erwartete Rendite trägst du bei jedem Sparposten einzeln ein — Gold rechnet dann anders als ein Aktienfonds." }),
    el("div",{ class:"feld" },
      el("div",{ class:"feld-label", text:"Inflation in Prozent pro Jahr" }),
      zahlFeld(S.einstellungen.inflation, 0, 20, 0.1, "z. B. 2",
        (v) => S.einstellungen.inflation = v),
      el("div",{ class:"feld-hinweis", text:"Damit rechnet Lohnwerk aus, was dein Erspartes später real noch wert ist. Langfristiger Schnitt in Deutschland: rund 2 %." })),
    el("div",{ class:"feld" },
      el("div",{ class:"feld-label", text:"Sparrate steigt jährlich um … Prozent" }),
      zahlFeld(S.einstellungen.sparSteigerung, 0, 20, 0.5, "0",
        (v) => S.einstellungen.sparSteigerung = v),
      el("div",{ class:"feld-hinweis", text:"Wenn du erwartest, künftig mehr sparen zu können — etwa durch Gehaltserhöhungen. 0 lässt die Rate gleich." })),
    el("div",{ class:"feld", style:"margin-bottom:0" },
      el("div",{ class:"feld-label", text:"Zeitraum der Hochrechnung in Jahren" }),
      zahlFeld(S.einstellungen.hochrechnungJahre, 1, 40, 1, "10",
        (v) => S.einstellungen.hochrechnungJahre = Math.round(v)))
  ));

  /* --- Sichern & Wiederherstellen --- */
  const tage = tageSeit(S.einstellungen.letzteSicherung);
  wurzel.appendChild(el("div",{ class:"karte" },
    el("div",{ class:"karte-kopf" }, el("h2",{ text:"Sichern & Wiederherstellen" })),
    el("p",{ class:"t-klein", style:"margin-top:-8px;margin-bottom:16px;line-height:1.5",
      text: S.einstellungen.letzteSicherung
        ? `Letzte Sicherung: ${datumLesbar(S.einstellungen.letzteSicherung)}${tage !== null ? ` (vor ${tage} ${plural(tage,"Tag","Tagen")})` : ""}.`
        : "Du hast noch keine Sicherung angelegt." }),
    el("div",{ class:"knopf-reihe" },
      el("button",{ class:"knopf primaer", type:"button", onclick:() => jsonExportieren() },
        icon("ic-export"), "Sicherung speichern"),
      el("button",{ class:"knopf rahmen", type:"button", onclick:() => $("#datei-input").click() },
        icon("ic-import"), "Sicherung laden"),
      el("button",{ class:"knopf rahmen", type:"button", onclick:() => csvExportieren() },
        icon("ic-export"), "Als CSV (Excel)")
    ),
    el("p",{ class:"t-klein", style:"margin-top:14px;line-height:1.5",
      text:"Du kannst eine Sicherungsdatei auch einfach auf dieses Fenster ziehen." })
  ));

  /* --- Wo liegen meine Daten? --- */
  wurzel.appendChild(el("div",{ class:"karte" },
    el("div",{ style:"display:flex;align-items:center;gap:11px;margin-bottom:14px" },
      (() => { const s = icon("ic-schloss"); s.style.width="20px"; s.style.height="20px"; s.style.color="var(--akzent)"; return s; })(),
      el("h2",{ class:"t-h2", text:"Wo liegen meine Daten?" })
    ),
    el("div",{ style:"font-size:15px;line-height:1.6;color:var(--text-2);display:grid;gap:12px" },
      el("p",{ text:"Alles, was du hier einträgst, bleibt auf diesem Gerät. In diesem Browser. Nichts davon wird irgendwohin geschickt, es gibt keinen Server und kein Konto." }),
      el("p",{ text:"Eine einzige Ausnahme: der Knopf „Tagespreis holen“ im Zakat-Rechner. Wenn du ihn drückst, fragt Lohnwerk nach dem heutigen Gold- und Silberkurs. Auch dabei geht nichts von dir hinaus — nur die Frage nach dem Kurs. Ohne diesen Knopf verlässt keine einzige Anfrage dein Gerät." }),
      el("p",{ text:"Das heißt auch: Wenn du die Browserdaten löschst, den privaten Modus benutzt oder das Gerät wechselst, sind die Daten weg." }),
      el("p",{ text:"Deshalb: Speichere ab und zu eine Sicherung. Das ist eine einzelne Datei, die du auf dem Rechner, in deiner Cloud oder auf einem Stick ablegen kannst. Mit „Sicherung laden“ ist alles in Sekunden zurück." }),
      el("p",{ text:"Falls du diese App aus einem öffentlichen GitHub-Repository geladen hast: Dort liegt nur das Programm. Deine Zahlen waren nie dort." })
    )
  ));

  /* --- Über --- */
  wurzel.appendChild(el("div",{ class:"karte" },
    el("div",{ class:"karte-kopf" }, el("h2",{ text:"Sonstiges" })),
    el("div",{ class:"knopf-reihe" },
      el("button",{ class:"knopf rahmen", type:"button", onclick:() => einrichtungOeffnen() },
        "Einrichtung erneut starten"),
      el("button",{ class:"knopf rahmen", type:"button", onclick:() => beispieldatenLaden() },
        "Beispieldaten laden"),
      beispieldatenLoeschenKnopf()
    )
  ));

  /* --- Zurücksetzen --- */
  wurzel.appendChild(el("div",{ class:"karte", style:"border:1px solid var(--rot-weich)" },
    el("div",{ class:"karte-kopf" }, el("h2",{ style:"color:var(--rot)", text:"Alles zurücksetzen" })),
    el("p",{ class:"t-klein", style:"margin-top:-8px;margin-bottom:16px;line-height:1.5",
      text:"Löscht alle Profile, Einnahmen, Ausgaben, Konten und Tags von diesem Gerät. Speichere vorher eine Sicherung, wenn du unsicher bist." }),
    el("button",{ class:"knopf gefahr breit", type:"button", onclick:() => zuruecksetzenDialog() },
      icon("ic-muell"), "Alle Daten löschen")
  ));

  /* --- Fassung und Update-Prüfung --- */
  const versionsKarte = el("div",{ class:"karte flach" },
    el("div",{ style:"display:flex;align-items:baseline;justify-content:space-between;gap:12px" },
      el("span",{ class:"t-kapitaelchen", text:"Fassung" }),
      el("span",{ style:"font-size:16px;font-weight:640;font-variant-numeric:tabular-nums", text:"v"+APP_VERSION })
    ),
    el("p",{ class:"t-klein", style:"margin-top:8px;line-height:1.55",
      text:"Wenn dir etwas fehlt, das es geben sollte, läuft auf diesem Gerät womöglich eine ältere Fassung. "
         + "Der Knopf holt die neueste und startet die App neu. Deine Daten bleiben dabei erhalten." })
  );
  versionsKarte.appendChild(el("button",{ class:"knopf rahmen breit", type:"button", style:"margin-top:14px",
    onclick:(ev) => aufUpdatePruefen(ev.currentTarget) },
    icon("ic-wiederkehr"), "Auf neue Fassung prüfen"));
  wurzel.appendChild(versionsKarte);

  wurzel.appendChild(el("p",{ class:"t-klein", style:"text-align:center;padding:20px 0 0",
    text:"Lohnwerk · läuft ohne Internet · keine Konten, keine Werbung, kein Tracking" }));
}

/**
 * Holt die neueste Fassung und startet die App neu.
 * Nötig, weil der Browser die Programmdateien zwischenspeichert —
 * ohne das kann eine alte Fassung hartnäckig hängenbleiben.
 * Angerührt werden dabei nur die Programmdateien, nie deine Daten.
 */
async function aufUpdatePruefen(knopf){
  const alt = knopf.innerHTML;
  knopf.disabled = true;
  knopf.replaceChildren(document.createTextNode("Wird geprüft …"));

  /* Vor dem Neustart alles sichern, was noch aussteht. */
  speichernSofort();

  try{
    if("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      /* Den Zwischenspeicher der Programmdateien leeren — die Daten des
         Nutzers liegen im localStorage und bleiben unberührt. */
      if(window.caches){
        const namen = await caches.keys();
        await Promise.all(namen.filter(n => n.startsWith("lohnwerk-")).map(n => caches.delete(n)));
      }
      await Promise.all(regs.map(r => r.update().catch(() => r.unregister())));
    }
  }catch(fehler){ /* auch ohne Service Worker neu laden */ }

  toast("Wird neu geladen …", null, 2500);
  setTimeout(() => {
    /* Ein Anhängsel an der Adresse umgeht auch hartnäckige Zwischenspeicher. */
    const url = new URL(location.href);
    url.searchParams.set("frisch", Date.now().toString(36));
    location.replace(url.toString());
  }, 600);
}

/** Startet einen Download aus einem Text. */
function dateiHerunterladen(dateiname, inhalt, typ){
  const blob = new Blob([inhalt], { type: typ });
  const url = URL.createObjectURL(blob);
  const a = el("a",{ href:url, download:dateiname, style:"display:none" });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1200);
}

function jsonExportieren(){
  const paket = {
    app: "Lohnwerk",
    schemaVersion: SCHEMA_VERSION,
    exportiertAm: new Date().toISOString(),
    daten: S
  };
  const name = `lohnwerk-sicherung-${datumIso()}.json`;
  dateiHerunterladen(name, JSON.stringify(paket, null, 2), "application/json;charset=utf-8");
  S.einstellungen.letzteSicherung = new Date().toISOString();
  S.einstellungen.sicherungsHinweisAus = null;
  aendern();
  toast(`Gespeichert als ${name}`);
}

function csvExportieren(){
  const p = P();
  const trenn = ";";
  const feld = (w) => {
    const s = String(w ?? "");
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const zahl = (cent) => nfZahl.format(Math.round(cent)/100);   // deutsches Format für Excel

  const zeilen = [];
  zeilen.push(["Typ","Bezeichnung","Betrag","Intervall","Betrag pro Monat","Betrag pro Jahr",
               "Zahlungsweg","Konto","Fälliger Tag","Startmonat","Tags","Priorität",
               "Rendite % p.a.","Bestand","Sparziel","Aktiv","Notiz"].map(feld).join(trenn));

  p.einnahmen.forEach(e => {
    const j = e.aktiv === false ? 0 : jahresCent(e);
    const konto = p.konten.find(k => k.id === e.kontoId);
    zeilen.push([
      "Einnahme", e.name, zahl(e.betragCent), INTERVALLE[e.intervall].name,
      zahl(j/12), zahl(j), e.art === "brutto" ? "Brutto" : "Netto", konto ? konto.name : "",
      e.eingangTag, "", "", "", "", "", "", e.aktiv === false ? "nein":"ja", e.notiz || ""
    ].map(feld).join(trenn));
  });

  p.ausgaben.forEach(a => {
    const j = a.aktiv === false ? 0 : jahresCent(a);
    const konto = kontoFuer(a);
    const tagNamen = a.tags.map(id => p.tags.find(t => t.id === id)?.name).filter(Boolean).join(", ");
    const sparen = istSparen(a);
    zeilen.push([
      sparen ? "Sparen" : "Ausgabe", a.name, zahl(a.betragCent), INTERVALLE[a.intervall].name,
      zahl(j/12), zahl(j), wegFuer(a).name,
      konto ? konto.name : "", a.faelligTag, MONATE_LANG[(a.startMonat||1)-1],
      tagNamen, PRIORITAETEN[a.prioritaet].name,
      sparen ? nfZahl.format(a.renditeProzent||0) : "",
      sparen ? zahl(a.bestandCent||0) : "",
      sparen && a.zielCent ? zahl(a.zielCent) : "",
      a.aktiv === false ? "nein":"ja", a.notiz || ""
    ].map(feld).join(trenn));
  });

  const k = kennzahlen();
  const u = sparUebersicht();
  zeilen.push("");
  zeilen.push(["Summe","Einnahmen","","", zahl(k.einnahmenJahr/12), zahl(k.einnahmenJahr)].map(feld).join(trenn));
  zeilen.push(["Summe","Ausgaben (ohne Sparen)","","", zahl(k.ausgabenJahr/12), zahl(k.ausgabenJahr)].map(feld).join(trenn));
  zeilen.push(["Summe","Überschuss","","", zahl(k.ueberschussJahr/12), zahl(k.ueberschussJahr)].map(feld).join(trenn));
  zeilen.push(["Summe","davon fester Sparplan","","", zahl(k.sparplanJahr/12), zahl(k.sparplanJahr)].map(feld).join(trenn));
  zeilen.push(["Summe","davon frei verfügbar","","", zahl(k.freiJahr/12), zahl(k.freiJahr)].map(feld).join(trenn));
  zeilen.push(["Summe","Bar bereitlegen","","", zahl(k.barJahr/12), zahl(k.barJahr)].map(feld).join(trenn));
  zeilen.push(["Summe","Rücklage für Jahresrechnungen","","", zahl(k.ruecklageJahr/12), zahl(k.ruecklageJahr)].map(feld).join(trenn));
  zeilen.push(["Stand","Bereits zurückgelegt","","","", zahl(u.bestandGesamt)].map(feld).join(trenn));

  /* --- Zakat-Vermögen --- */
  const zkPosten = zakatPosten();
  if(zkPosten.length > 0){
    const v = zakatVermoegen();
    const e = S.einstellungen;
    zeilen.push("");
    zeilen.push(["Zakat-Vermögen","Bezeichnung","Art","Menge","Einheit","Wert in Euro"].map(feld).join(trenn));
    zkPosten.forEach(pp => {
      const art = ZAKAT_ARTEN[pp.art];
      zeilen.push([
        "Posten", pp.name, art.name,
        art.geld ? "" : (pp.art === "btc" ? nfBtc.format(pp.wert) : nfZahl.format(pp.wert)),
        art.geld ? "" : art.einheit,
        zahl(zakatPostenWert(pp))
      ].map(feld).join(trenn));
    });
    zeilen.push(["Zakat","Besitz","","","", zahl(v.besitz)].map(feld).join(trenn));
    if(v.schulden > 0){
      zeilen.push(["Zakat", e.zakat.schule === "hanafi" ? "Schulden (abgezogen)" : "Schulden (nicht abgezogen)",
        "","","", zahl(v.schulden)].map(feld).join(trenn));
    }
    zeilen.push(["Zakat","Zakatpflichtiges Vermögen","","","", zahl(v.netto)].map(feld).join(trenn));

    /* Preise und Schwelle */
    const nisab = e.zakat.grundlage === "silber"
      ? Math.round(NISAB_SILBER_GRAMM * (e.silberPreisCent||0))
      : Math.round(NISAB_GOLD_GRAMM * (e.goldPreisCent||0));
    zeilen.push(["Zakat","Schwelle (Nisab)",
      e.zakat.grundlage === "silber" ? NISAB_SILBER_GRAMM+" g Silber" : NISAB_GOLD_GRAMM+" g Gold",
      "","", zahl(nisab)].map(feld).join(trenn));
    zeilen.push(["Zakat","Rechtsschule", e.zakat.schule === "hanafi" ? "Hanafi" : "Schafi'i","","",""].map(feld).join(trenn));
    if(e.goldPreisCent)   zeilen.push(["Preis","Gold je Gramm","","","", zahl(e.goldPreisCent)].map(feld).join(trenn));
    if(e.silberPreisCent) zeilen.push(["Preis","Silber je Gramm","","","", zahl(e.silberPreisCent)].map(feld).join(trenn));
    if(e.btcPreisCent)    zeilen.push(["Preis","Bitcoin je BTC","","","", zahl(e.btcPreisCent)].map(feld).join(trenn));
    if(e.preiseStand)     zeilen.push(["Preis","Stand der Preise", datumLesbar(e.preiseStand),"","",""].map(feld).join(trenn));

    /* Die fällige Zakat und der Abgleich */
    const pflichtig = nisab > 0 && v.netto >= nisab;
    const betrag = pflichtig ? Math.round(v.netto * ZAKAT_SATZ) : 0;
    zeilen.push(["Zakat","Fällig (2,5 %)","","", zahl(betrag/12), zahl(betrag)].map(feld).join(trenn));
    if(pflichtig){
      const ab = zakatAbgleich(betrag);
      zeilen.push(["Zakat","davon schon verplant","","", zahl(ab.verplant/12), zahl(ab.verplant)].map(feld).join(trenn));
      zeilen.push(["Zakat","noch offen","","", zahl(ab.offen/12), zahl(ab.offen)].map(feld).join(trenn));
    }
    if(e.zakat.stichtag) zeilen.push(["Zakat","Stichtag", datumLesbar(e.zakat.stichtag),"","",""].map(feld).join(trenn));
  }

  // BOM (U+FEFF) voranstellen, damit Excel die Umlaute richtig liest.
  const inhalt = "\uFEFF" + zeilen.join("\r\n");
  const name = `lohnwerk-${p.name.replace(/[^\wäöüÄÖÜß-]+/g,"_")}-${datumIso()}.csv`;
  dateiHerunterladen(name, inhalt, "text/csv;charset=utf-8");
  toast(`Gespeichert als ${name}`);
}

/** Liest eine Datei ein und zeigt die Vorschau. */
function dateiEinlesen(datei){
  if(!datei) return;
  if(datei.size > 12 * 1024 * 1024){
    toast("Die Datei ist zu groß. Erwartet wird eine Lohnwerk-Sicherung.");
    return;
  }
  const leser = new FileReader();
  leser.onload = () => {
    let daten = null;
    try{
      const roh = JSON.parse(String(leser.result));
      daten = (roh && roh.daten) ? roh.daten : roh;
    }catch(fehler){
      toast("Diese Datei lässt sich nicht lesen. Erwartet wird eine .json-Sicherung von Lohnwerk.", null, 8000);
      return;
    }
    const geprueft = zustandSaeubern(daten);
    const anzahlE = geprueft.profile.reduce((s,p) => s + p.einnahmen.length, 0);
    const anzahlA = geprueft.profile.reduce((s,p) => s + p.ausgaben.length, 0);
    if(anzahlE + anzahlA === 0 && geprueft.profile.length === 0){
      toast("In dieser Datei sind keine Positionen enthalten.");
      return;
    }
    importVorschauDialog(geprueft, datei.name, anzahlE, anzahlA);
  };
  leser.onerror = () => toast("Die Datei konnte nicht gelesen werden.");
  leser.readAsText(datei, "utf-8");
}

/** Fügt die Daten einer Sicherung zum aktuellen Profil hinzu. */
function importHinzufuegen(neuerZustand){
  const ziel = P();
  neuerZustand.profile.forEach(quelle => {
    // Konten übernehmen, gleiche Namen zusammenführen.
    const kontoKarte = new Map();
    quelle.konten.forEach(k => {
      const vorhanden = ziel.konten.find(z => z.name.toLowerCase() === k.name.toLowerCase());
      if(vorhanden){ kontoKarte.set(k.id, vorhanden.id); }
      else { const neu = { ...k, id:idNeu("ko") }; ziel.konten.push(neu); kontoKarte.set(k.id, neu.id); }
    });
    // Tags übernehmen, gleiche Namen zusammenführen.
    const tagKarte = new Map();
    tagKarte.set(SPAR_TAG_ID, SPAR_TAG_ID);       // das feste Tag bleibt, wie es ist
    quelle.tags.forEach(t => {
      if(t.id === SPAR_TAG_ID) return;
      const vorhanden = ziel.tags.find(z => z.name.toLowerCase() === t.name.toLowerCase());
      if(vorhanden){ tagKarte.set(t.id, vorhanden.id); }
      else { const neu = { ...t, id:idNeu("tg") }; ziel.tags.push(neu); tagKarte.set(t.id, neu.id); }
    });
    // Zahlungswege gleicher Bezeichnung zusammenführen.
    const wegKarte = new Map();
    quelle.zahlungswege.forEach(w => {
      const vorhanden = ziel.zahlungswege.find(z => z.name.toLowerCase() === w.name.toLowerCase());
      if(vorhanden){ wegKarte.set(w.id, vorhanden.id); }
      else { const neu = { ...w, id:idNeu("zw") }; ziel.zahlungswege.push(neu); wegKarte.set(w.id, neu.id); }
    });
    quelle.einnahmen.forEach(e => {
      ziel.einnahmen.push({ ...e, id:idNeu("ei"), kontoId: kontoKarte.get(e.kontoId) || null });
    });
    quelle.ausgaben.forEach(a => {
      ziel.ausgaben.push({ ...a, id:idNeu("au"),
        kontoId: kontoKarte.get(a.kontoId) || null,
        zahlungsweg: wegKarte.get(a.zahlungsweg) || ziel.zahlungswege[0].id,
        tags: a.tags.map(t => tagKarte.get(t)).filter(Boolean) });
    });
  });
}

function einrichtungOeffnen(){
  let schritt = 1;
  const auswahlPosten = new Set();
  const auswahlKonten = new Set(KONTO_VORSCHLAEGE.map(k => k.name));
  const einkommen = [{ name:"Gehalt", betrag:"" }];

  const koerper = el("div",{});
  const punkte = el("div",{ class:"schritt-punkte" },
    [1,2,3].map(i => el("span",{ class: i===1 ? "aktiv":"" })));
  const inhalt = el("div",{});
  koerper.appendChild(punkte);
  koerper.appendChild(inhalt);

  const zurueckKnopf = el("button",{ class:"knopf", type:"button", style:"flex:none", text:"Zurück",
    onclick:() => { if(schritt > 1){ schritt--; zeichneSchritt(); } } });
  const weiterKnopf = el("button",{ class:"knopf primaer", type:"button", style:"flex:1", text:"Weiter",
    onclick:() => { if(schritt < 3){ schritt++; zeichneSchritt(); } else fertigstellen(); } });
  const fuss = el("div",{ style:"display:flex;gap:8px;width:100%" }, zurueckKnopf, weiterKnopf);

  function zeichneSchritt(){
    Array.from(punkte.children).forEach((s,i) => s.classList.toggle("aktiv", i === schritt-1));
    zurueckKnopf.style.display = schritt === 1 ? "none" : "";
    weiterKnopf.textContent = schritt === 3 ? "Fertig" : "Weiter";
    inhalt.replaceChildren();

    if(schritt === 1){
      inhalt.appendChild(el("h3",{ class:"t-h2", style:"margin-bottom:6px", text:"Was kommt rein?" }));
      inhalt.appendChild(el("p",{ class:"t-klein", style:"margin-bottom:20px;line-height:1.5",
        text:"Trag ein, was du im Monat bekommst. Beträge kannst du auch später noch ändern." }));
      const liste = el("div",{});
      const zeichneEinkommen = () => {
        liste.replaceChildren();
        einkommen.forEach((e,i) => {
          liste.appendChild(el("div",{ class:"feld-reihe", style:"margin-bottom:12px;align-items:flex-end" },
            el("div",{ style:"flex:1.3" },
              el("div",{ class:"t-label", style:"margin-bottom:4px;font-size:12px", text:"Bezeichnung" }),
              el("input",{ class:"eingabe", type:"text", value:e.name, placeholder:"z. B. Gehalt",
                oninput:(ev) => e.name = ev.target.value })),
            el("div",{ style:"flex:1" },
              el("div",{ class:"t-label", style:"margin-bottom:4px;font-size:12px", text:"Monatlich" }),
              el("input",{ class:"eingabe", type:"text", inputmode:"decimal", value:e.betrag, placeholder:"0,00",
                oninput:(ev) => e.betrag = ev.target.value })),
            einkommen.length > 1 ? el("button",{ class:"sym", type:"button", "aria-label":"Zeile entfernen",
              style:"flex:none;margin-bottom:2px",
              onclick:() => { einkommen.splice(i,1); zeichneEinkommen(); } }, icon("ic-x")) : null
          ));
        });
        liste.appendChild(el("button",{ class:"knopf rahmen breit", type:"button",
          onclick:() => { einkommen.push({ name:"", betrag:"" }); zeichneEinkommen(); } },
          icon("ic-plus"), "Weitere Einnahme"));
      };
      zeichneEinkommen();
      inhalt.appendChild(liste);
    }

    if(schritt === 2){
      inhalt.appendChild(el("h3",{ class:"t-h2", style:"margin-bottom:6px", text:"Was geht raus, was legst du zurück?" }));
      inhalt.appendChild(el("p",{ class:"t-klein", style:"margin-bottom:20px;line-height:1.5",
        text:"Tippe an, was auf dich zutrifft. Die Beträge trägst du gleich danach ein — hier geht es nur um die Auswahl." }));

      const bauen = (titel, liste, hinweis) => {
        inhalt.appendChild(el("div",{ class:"t-kapitaelchen", style:"margin:18px 0 10px", text:titel }));
        if(hinweis) inhalt.appendChild(el("p",{ class:"t-klein", style:"margin-bottom:12px;line-height:1.5", text:hinweis }));
        const raster = el("div",{ class:"vorschlag-raster" });
        liste.forEach(v => {
          raster.appendChild(el("button",{ class:"vorschlag", type:"button",
            "aria-pressed": auswahlPosten.has(v.name) ? "true":"false",
            onclick:(ev) => {
              if(auswahlPosten.has(v.name)) auswahlPosten.delete(v.name); else auswahlPosten.add(v.name);
              ev.currentTarget.setAttribute("aria-pressed", auswahlPosten.has(v.name) ? "true":"false");
            }}, v.name));
        });
        inhalt.appendChild(raster);
      };
      bauen("Ausgaben", POSTEN_VORSCHLAEGE.filter(v => !v.sparen));
      bauen("Sparen", POSTEN_VORSCHLAEGE.filter(v => v.sparen),
        "Diese Posten bekommen das Tag „Sparen“. Sie zählen nicht als Ausgabe — das Geld bleibt ja deins.");
    }

    if(schritt === 3){
      inhalt.appendChild(el("h3",{ class:"t-h2", style:"margin-bottom:6px", text:"Wie zahlst du?" }));
      inhalt.appendChild(el("p",{ class:"t-klein", style:"margin-bottom:20px;line-height:1.5",
        text:"Diese Konten legt Lohnwerk für dich an. Damit siehst du später, wie viel Geld wo liegen muss." }));
      const raster = el("div",{ class:"vorschlag-raster" });
      KONTO_VORSCHLAEGE.forEach(k => {
        raster.appendChild(el("button",{ class:"vorschlag", type:"button",
          "aria-pressed": auswahlKonten.has(k.name) ? "true":"false",
          onclick:(ev) => {
            if(auswahlKonten.has(k.name)) auswahlKonten.delete(k.name); else auswahlKonten.add(k.name);
            ev.currentTarget.setAttribute("aria-pressed", auswahlKonten.has(k.name) ? "true":"false");
          }}, k.name));
      });
      inhalt.appendChild(raster);
      inhalt.appendChild(el("p",{ class:"t-klein", style:"margin-top:22px;line-height:1.5",
        text:"Außerdem legt Lohnwerk nützliche Tags an (Fixkosten, Kündbar, Wohnen, Auto und weitere) sowie die Zahlungswege Bar, Überweisung, Dauerauftrag, Lastschrift, Kreditkarte und Tagesgeld. Alles lässt sich später ändern." }));
    }
  }

  function fertigstellen(){
    const p = P();
    // Konten
    KONTO_VORSCHLAEGE.filter(k => auswahlKonten.has(k.name)).forEach(k => {
      if(!p.konten.some(x => x.name === k.name))
        p.konten.push({ id:idNeu("ko"), name:k.name, typ:k.typ, startsaldoCent:0 });
    });
    // Tags — das Spar-Tag ist schon da, die anderen kommen dazu.
    TAG_VORSCHLAEGE.forEach(t => {
      if(!p.tags.some(x => x.name.toLowerCase() === t.name.toLowerCase()))
        p.tags.push({ id:idNeu("tg"), name:t.name, farbe:t.farbe });
    });
    const tagId = (name) => p.tags.find(t => t.name.toLowerCase() === name.toLowerCase())?.id;

    // Einnahmen
    const giro = p.konten.find(k => k.typ === "giro");
    einkommen.forEach(e => {
      const name = (e.name || "").trim();
      const c = betragParsen(e.betrag);
      if(!name || c === null || c <= 0) return;
      p.einnahmen.push({ id:idNeu("ei"), name:name.slice(0,80), betragCent:c, intervall:"monatlich",
        kontoId: giro ? giro.id : null, eingangTag:1, art:"netto", aktiv:true, notiz:"" });
    });

    /* Positionen mit Betrag 0 anlegen — der Nutzer trägt nur noch Zahlen ein. */
    const wegBar = p.zahlungswege.find(w => w.kontotyp === "bargeld");
    const wegStandard = p.zahlungswege.find(w => w.name === "Lastschrift") || p.zahlungswege[1] || p.zahlungswege[0];
    const wegSparen = p.zahlungswege.find(w => w.kontotyp === "tagesgeld") || wegStandard;

    POSTEN_VORSCHLAEGE.filter(v => auswahlPosten.has(v.name)).forEach(v => {
      if(p.ausgaben.some(a => a.name === v.name)) return;
      const tags = v.tags.map(tagId).filter(Boolean);
      if(v.sparen && !tags.includes(SPAR_TAG_ID)) tags.unshift(SPAR_TAG_ID);
      p.ausgaben.push({
        id:idNeu("au"), name:v.name, betragCent:0, intervall:"monatlich",
        zahlungsweg: v.sparen ? wegSparen.id : (v.bar && wegBar ? wegBar.id : wegStandard.id),
        kontoId:null, faelligTag:1, startMonat:1, tags,
        prioritaet: v.prio, aktiv:true, notiz:"",
        renditeProzent:0, bestandCent:0, zielCent:0
      });
    });

    S.einrichtungFertig = true;
    dialogSchliessen();
    aendern();
    navigieren(auswahlPosten.size > 0 ? "ausgaben" : "uebersicht");
    if(auswahlPosten.size > 0){
      toast(`${auswahlPosten.size} ${plural(auswahlPosten.size,"Position angelegt","Positionen angelegt")}. Trag jetzt die Beträge ein.`, null, 8000);
    }
  }

  zeichneSchritt();
  dialogOeffnen({ titel:"Einrichtung", koerper, fuss });
}

      /* Sparposten — jeder mit eigener Rendite, Bestand und Ziel */
      A("Altersvorsorge ETF", 15000, "monatlich", "Dauerauftrag", 1, "fix", ["Sparen"], 1, null,
        { rendite:6, bestand:1240000, ziel:0 }),
      A("Sparplan Tagesgeld", 25000, "monatlich", "Dauerauftrag", 28, "fix", ["Sparen"], 1, konten.tg.id,
        { rendite:2.4, bestand:412000, ziel:1500000 }),
      A("Notgroschen", 10000, "monatlich", "Dauerauftrag", 28, "fix", ["Sparen"], 1, konten.tg.id,
        { rendite:2.4, bestand:180000, ziel:900000 }),
      A("Rücklage Auto", 6000, "monatlich", "Dauerauftrag", 28, "fix", ["Sparen","Auto"], 1, konten.tg.id,
        { rendite:2.4, bestand:95000, ziel:400000 })
    ];

    p.name = "Beispiel";
    S.profile.push(p);
    S.aktivesProfil = p.id;
    S.einrichtungFertig = true;
    alleDialogeSchliessen();
    aendern();
    navigieren("uebersicht");
    toast("Beispieldaten geladen. Du findest sie als eigenes Profil unter Einstellungen.", null, 8000);
  };

  const schonDa = S.profile.find(p => p.name === "Beispiel");
  if(schonDa){
    bestaetigen({
      titel:"Beispieldaten neu laden",
      text:"Es gibt bereits ein Profil „Beispiel“. Es wird durch einen frischen Muster-Haushalt ersetzt. Deine anderen Profile bleiben unverändert.",
      knopfText:"Neu laden",
      dann:() => {
        S.profile = S.profile.filter(p => p.name !== "Beispiel");
        starten();
      }
    });
  } else {
    starten();
  }
}

function beispieldatenLoeschenKnopf(){
  const beispiel = S.profile.find(p => p.name === "Beispiel");
  if(!beispiel) return null;
  return el("button",{ class:"knopf klein gefahr", type:"button", text:"Beispieldaten löschen",
    onclick:() => {
      bestaetigen({
        titel:"Beispieldaten löschen",
        text:"Das Profil „Beispiel“ wird entfernt. Deine eigenen Profile bleiben unverändert.",
        knopfText:"Löschen", gefahr:true,
        dann:() => {
          S.profile = S.profile.filter(p => p.name !== "Beispiel");
          if(S.profile.length === 0) S.profile.push(profilNeu());
          if(!S.profile.some(p => p.id === S.aktivesProfil)) S.aktivesProfil = S.profile[0].id;
          aendern();
          toast("Beispieldaten gelöscht.");
        }
      });
    }});
}


/* ================================================================
   10. ZEICHNEN, HINWEISE, EREIGNISSE, START
   ================================================================ */

/** Zeichnet die gerade sichtbare Ansicht neu. */
function zeichnen(){
  kopfUnterzeileAktualisieren();
  bannerZeichnen();
  fabAktualisieren();
  switch(aktiveAnsicht){
    case "uebersicht":    zeichneUebersicht(); break;
    case "einnahmen":     zeichneEinnahmen(); break;
    case "ausgaben":      zeichneAusgaben(); break;
    case "auswertung":    zeichneAuswertung(); break;
    case "werkzeuge":     zeichneWerkzeuge(); break;
    case "einstellungen": zeichneEinstellungen(); break;
  }
  zeichneAktionsleiste();
  UI.erstesZeichnen = false;
}

function kopfUnterzeileAktualisieren(){
  const box = $("#kopf-unterzeile");
  const p = P();
  const mehrereProfile = S.profile.length > 1;
  box.textContent = mehrereProfile ? p.name : "";
  box.style.display = mehrereProfile ? "" : "none";
}

/** Der schwebende Plus-Knopf, wo er sinnvoll ist. */
function fabAktualisieren(){
  const fab = $("#fab");
  const zeigen = (aktiveAnsicht === "einnahmen" || aktiveAnsicht === "ausgaben") && !UI.auswahlModus;
  fab.hidden = !zeigen;
  fab.setAttribute("aria-label", aktiveAnsicht === "einnahmen" ? "Neue Einnahme anlegen" : "Neue Position anlegen");
}

/** Hinweise oben: defekte Daten, fällige Sicherung. */
function bannerZeichnen(){
  const bereich = $("#banner-bereich");
  bereich.replaceChildren();

  if(ladeFehler){
    bereich.appendChild(el("div",{ class:"banner warn" },
      icon("ic-warn"),
      el("div",{ class:"inhalt-b" },
        el("strong",{ text:"Die gespeicherten Daten waren beschädigt." }),
        el("div",{ style:"margin-top:2px",
          text:"Lohnwerk startet mit einem leeren Stand. Die alte, unlesbare Fassung wurde beiseitegelegt, falls sie sich noch retten lässt." }),
        el("div",{ class:"knopf-reihe" },
          el("button",{ class:"knopf klein rahmen", type:"button", text:"Verstanden",
            onclick:() => { ladeFehler = false; bannerZeichnen(); } })
        )
      )
    ));
  }

  // Erinnerung an die Sicherung, wenn sie älter als 30 Tage ist.
  const tage = tageSeit(S.einstellungen.letzteSicherung);
  const hatDaten = P().einnahmen.length + P().ausgaben.length > 0;
  const weggeklickt = S.einstellungen.sicherungsHinweisAus
    && tageSeit(S.einstellungen.sicherungsHinweisAus) !== null
    && tageSeit(S.einstellungen.sicherungsHinweisAus) < 7;

  if(hatDaten && !weggeklickt && (tage === null || tage > 30)){
    bereich.appendChild(el("div",{ class:"banner" },
      icon("ic-info"),
      el("div",{ class:"inhalt-b" },
        el("div",{ text: tage === null
          ? "Du hast noch keine Sicherung angelegt. Ohne Sicherung sind deine Daten weg, wenn du die Browserdaten löschst."
          : `Letzte Sicherung vor ${tage} ${plural(tage,"Tag","Tagen")}. Jetzt sichern?` }),
        el("div",{ class:"knopf-reihe" },
          el("button",{ class:"knopf klein primaer", type:"button", text:"Jetzt sichern",
            onclick:() => jsonExportieren() }),
          el("button",{ class:"knopf klein", type:"button", text:"Später",
            onclick:() => {
              S.einstellungen.sicherungsHinweisAus = new Date().toISOString();
              aendern();
            } })
        )
      )
    ));
  }
}

/** Hell / Dunkel anwenden. */
function themeAnwenden(){
  const t = S.einstellungen.theme;
  if(t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  // Die Farbe der Statusleiste auf dem Handy mitziehen.
  const dunkel = t === "dunkel" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  $$('meta[name="theme-color"]').forEach(m => m.remove());
  document.head.appendChild(el("meta",{ name:"theme-color", content: dunkel ? "#0f0f11" : "#f7f7f8" }));
}

function zeitraumKnoepfeAktualisieren(){
  const jahr = S.einstellungen.ansicht === "jahr";
  $("#btn-monat").setAttribute("aria-pressed", jahr ? "false":"true");
  $("#btn-jahr").setAttribute("aria-pressed", jahr ? "true":"false");
}

/* ---------- Ereignisse ---------- */

function ereignisseAnbinden(){
  /* Navigation */
  $$("[data-nav]").forEach(b => b.addEventListener("click", () => navigieren(b.dataset.nav)));

  /* Monat / Jahr */
  $("#btn-monat").addEventListener("click", () => {
    S.einstellungen.ansicht = "monat"; zeitraumKnoepfeAktualisieren(); aendern();
  });
  $("#btn-jahr").addEventListener("click", () => {
    S.einstellungen.ansicht = "jahr"; zeitraumKnoepfeAktualisieren(); aendern();
  });

  /* Schwebender Knopf */
  $("#fab").addEventListener("click", () => {
    if(aktiveAnsicht === "einnahmen") einnahmeDialog(null);
    else ausgabeDialog(null);
  });

  /* Dialoge schließen */
  $("#sheet-schliessen").addEventListener("click", () => dialogSchliessen(1));
  $("#sheet2-schliessen").addEventListener("click", () => dialogSchliessen(2));
  $("#overlay").addEventListener("click", (e) => { if(e.target.id === "overlay") dialogSchliessen(1); });
  $("#overlay2").addEventListener("click", (e) => { if(e.target.id === "overlay2") dialogSchliessen(2); });

  /* Tastatur */
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && dialogStapel.length > 0){ e.preventDefault(); dialogSchliessen(); }
  });

  /* Fokus im Dialog halten */
  document.addEventListener("keydown", (e) => {
    if(e.key !== "Tab" || dialogStapel.length === 0) return;
    const oben = dialogStapel[dialogStapel.length-1];
    const sheet = oben.ebene === 2 ? $("#sheet2") : $("#sheet");
    const fokussierbar = $$('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', sheet)
      .filter(x => x.offsetParent !== null);
    if(fokussierbar.length === 0) return;
    const erster = fokussierbar[0], letzter = fokussierbar[fokussierbar.length-1];
    if(e.shiftKey && document.activeElement === erster){ e.preventDefault(); letzter.focus(); }
    else if(!e.shiftKey && document.activeElement === letzter){ e.preventDefault(); erster.focus(); }
  });

  /* Schatten unter der Kopfzeile beim Scrollen */
  const kopf = $("#kopf");
  const scrollPruefen = () => {
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    kopf.classList.toggle("geschoben", y > 4);
  };
  window.addEventListener("scroll", scrollPruefen, { passive:true });
  scrollPruefen();

  /* Datei-Auswahl */
  $("#datei-input").addEventListener("change", (e) => {
    const datei = e.target.files && e.target.files[0];
    if(datei) dateiEinlesen(datei);
    e.target.value = "";
  });

  /* Ziehen & Ablegen einer Sicherungsdatei */
  const ablage = $("#ablage");
  let ziehZaehler = 0;
  window.addEventListener("dragenter", (e) => {
    if(!e.dataTransfer || !Array.from(e.dataTransfer.types||[]).includes("Files")) return;
    e.preventDefault();
    ziehZaehler++;
    ablage.classList.add("offen");
  });
  window.addEventListener("dragover", (e) => {
    if(!e.dataTransfer || !Array.from(e.dataTransfer.types||[]).includes("Files")) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
  });
  window.addEventListener("dragleave", (e) => {
    ziehZaehler = Math.max(0, ziehZaehler - 1);
    if(ziehZaehler === 0) ablage.classList.remove("offen");
  });
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    ziehZaehler = 0;
    ablage.classList.remove("offen");
    const datei = e.dataTransfer?.files?.[0];
    if(datei) dateiEinlesen(datei);
  });

  /* Systemfarbe ändert sich */
  if(window.matchMedia){
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const reagieren = () => { if(S.einstellungen.theme === "auto") themeAnwenden(); };
    if(mq.addEventListener) mq.addEventListener("change", reagieren);
    else if(mq.addListener) mq.addListener(reagieren);
  }

  /* Vor dem Schließen noch schnell sichern */
  window.addEventListener("beforeunload", () => speichernSofort());
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "hidden") speichernSofort();
  });
}

/* ---------- Start ---------- */

function start(){
  laden();
  themeAnwenden();
  zeitraumKnoepfeAktualisieren();
  ereignisseAnbinden();
  navigieren("uebersicht");

  // Beim allerersten Start durch die Einrichtung führen.
  const leer = S.profile.length === 0
    || (P().einnahmen.length === 0 && P().ausgaben.length === 0);
  if(leer && !S.einrichtungFertig){
    setTimeout(() => einrichtungOeffnen(), 500);
  }

  // Den Service Worker registrieren, damit die App offline läuft.
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        // Kein Drama — die App funktioniert auch ohne Offline-Fähigkeit.
      });
    });
  }
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", start);
} else {
  start();
}
</script>
