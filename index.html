/**
 * Der Geldfluss. Drei Spalten: Einnahmen → Gesamt → Ziele.
 * Die Höhe jedes Bandes entspricht dem Betrag.
 */
function sankeyZeichnen(){
  const huelle = el("div",{ class:"sankey-huelle" });
  const k = kennzahlen();

  /* Quellen: die einzelnen Einnahmen, große zuerst. */
  let quellen = aktiveEinnahmen()
    .map(e => ({ name:e.name, wert:jahresCent(e) }))
    .filter(q => q.wert > 0)
    .sort((a,b) => b.wert - a.wert);
  if(quellen.length > 5){
    const rest = quellen.slice(4).reduce((s,q)=>s+q.wert,0);
    quellen = quellen.slice(0,4);
    quellen.push({ name:"Weitere", wert:rest });
  }
  quellen.forEach((q,i) => q.farbe = palettenFarbe(i+4));

  /* Bei einem Defizit wird der fehlende Betrag als eigene Quelle sichtbar. */
  if(k.ueberschussJahr < 0){
    quellen.push({ name:"Fehlbetrag", wert:-k.ueberschussJahr, farbe:"var(--rot)" });
  }

  /* Ziele: wohin das Geld geht. */
  const wege = summenNachZahlungsweg();
  const ziele = [
    { name:"Bar",         wert:wege.bar||0,                        farbe:"var(--p3)" },
    { name:"Girokonto",   wert:(wege.giro||0)+(wege.lastschrift||0),farbe:"var(--p1)" },
    { name:"Tagesgeld",   wert:wege.tagesgeld||0,                  farbe:"var(--p2)" },
    { name:"Kreditkarte", wert:wege.kreditkarte||0,                farbe:"var(--p6)" }
  ].filter(z => z.wert > 0);
  if(k.ueberschussJahr > 0) ziele.push({ name:"Übrig", wert:k.ueberschussJahr, farbe:"var(--gruen)" });

  const summeQ = quellen.reduce((s,q)=>s+q.wert,0);
  const summeZ = ziele.reduce((s,z)=>s+z.wert,0);
  if(summeQ <= 0 || summeZ <= 0 || quellen.length === 0 || ziele.length === 0){
    huelle.appendChild(el("p",{ class:"t-klein", style:"padding:8px 4px",
      text:"Sobald Einnahmen und Ausgaben eingetragen sind, siehst du hier, wohin dein Geld fließt." }));
    return huelle;
  }

  /* Maße in viewBox-Einheiten */
  const B = 420;
  const BAND = 186;                       // Gesamthöhe aller Bänder
  const LUECKE = 9;
  const OBEN = 24;
  const maxKnoten = Math.max(quellen.length, ziele.length);
  const H = OBEN + BAND + (maxKnoten-1)*LUECKE + 18;

  const xL = 94, xLb = 99;                // linker Knoten
  const xM = 196, xMb = 204;              // Mittelknoten
  const xR = 316, xRb = 321;              // rechter Knoten

  const svg = svgEl("svg",{
    viewBox:`0 0 ${B} ${H}`, class:"diagramm",
    style:"width:100%;max-width:520px;margin:0 auto;height:auto",
    role:"img",
    "aria-label":`Geldfluss: ${euroZ(summeQ)} verteilen sich auf ${ziele.map(z=>z.name).join(", ")}.`
  });

  /* Positionen berechnen — jede Seite mittig ausgerichtet. */
  const platzieren = (liste, summe) => {
    const hoehen = liste.map(x => Math.max(7, x.wert / summe * BAND));
    const gesamt = hoehen.reduce((s,h)=>s+h,0) + (liste.length-1)*LUECKE;
    let y = OBEN + (BAND + (maxKnoten-1)*LUECKE - gesamt) / 2;
    return liste.map((x,i) => {
      const eintrag = { ...x, y, h:hoehen[i] };
      y += hoehen[i] + LUECKE;
      return eintrag;
    });
  };
  const qPos = platzieren(quellen, summeQ);
  const zPos = platzieren(ziele, summeZ);

  /* Der Mittelknoten nimmt beide Seiten auf. */
  const mitteH = BAND;
  const mitteY = OBEN + (maxKnoten-1)*LUECKE/2;

  /* Ein Band von (x0,y0,h0) nach (x1,y1,h1). */
  const band = (x0,y0,h0,x1,y1,h1,farbe,verzoegerung) => {
    const xm = (x0 + x1) / 2;
    const d = `M ${x0} ${y0} C ${xm} ${y0}, ${xm} ${y1}, ${x1} ${y1}`
            + ` L ${x1} ${y1+h1} C ${xm} ${y1+h1}, ${xm} ${y0+h0}, ${x0} ${y0+h0} Z`;
    const p = svgEl("path",{ d, fill:farbe, class:"sankey-band" });
    p.style.animationDelay = verzoegerung+"ms";
    return p;
  };

  /* Bänder links → Mitte */
  let laufM = mitteY;
  qPos.forEach((q,i) => {
    const h = q.wert / summeQ * mitteH;
    svg.appendChild(band(xLb, q.y, q.h, xM, laufM, h, q.farbe, 60*i));
    laufM += h;
  });
  /* Bänder Mitte → rechts */
  let laufM2 = mitteY;
  zPos.forEach((z,i) => {
    const h = z.wert / summeZ * mitteH;
    svg.appendChild(band(xMb, laufM2, h, xR, z.y, z.h, z.farbe, 120 + 60*i));
    laufM2 += h;
  });

  /* Knotenbalken und Beschriftungen */
  const knoten = (x, y, h, farbe, verzoegerung) => {
    const r = svgEl("rect",{ x, y, width:5, height:Math.max(3,h), rx:2.5, fill:farbe, class:"sankey-knoten" });
    r.style.animationDelay = verzoegerung+"ms";
    return r;
  };
  const beschriftung = (x, y, anker, name, betrag, verzoegerung) => {
    const g = svgEl("g",{ class:"sankey-knoten" });
    g.style.animationDelay = verzoegerung+"ms";
    const t1 = svgEl("text",{ x, y, "text-anchor":anker, "font-size":"10.5", "font-weight":"600",
      fill:"var(--text)", "letter-spacing":"-0.01em" });
    t1.textContent = kuerzen(name, 14);
    const t2 = svgEl("text",{ x, y:y+11.5, "text-anchor":anker, "font-size":"9.5",
      fill:"var(--text-2)", "font-variant-numeric":"tabular-nums" });
    t2.textContent = betrag;
    g.appendChild(t1); g.appendChild(t2);
    return g;
  };

  qPos.forEach((q,i) => {
    svg.appendChild(knoten(xL, q.y, q.h, q.farbe, 60*i));
    svg.appendChild(beschriftung(xL-8, q.y + q.h/2 - 2, "end", q.name, euroZ(q.wert), 60*i));
  });
  zPos.forEach((z,i) => {
    svg.appendChild(knoten(xRb, z.y, z.h, z.farbe, 120+60*i));
    svg.appendChild(beschriftung(xRb+10, z.y + z.h/2 - 2, "start", z.name, euroZ(z.wert), 120+60*i));
  });

  /* Mittelknoten */
  const m = svgEl("rect",{ x:xM, y:mitteY, width:8, height:mitteH, rx:4, fill:"var(--text)", opacity:"0.16", class:"sankey-knoten" });
  svg.appendChild(m);
  const mt = svgEl("text",{ x:xM+4, y:mitteY-9, "text-anchor":"middle", "font-size":"9.5",
    "font-weight":"600", fill:"var(--text-3)", "letter-spacing":"0.06em" });
  mt.textContent = "GESAMT";
  svg.appendChild(mt);

  huelle.appendChild(svg);
  return huelle;
}

/**
 * Ein Donut mit Legende. teile = [{name, wert, farbe}]
 */
function donutZeichnen(teile, rest){
  const alle = rest ? [...teile, rest] : teile;
  const summe = alle.reduce((s,t)=>s+t.wert,0);
  const huelle = el("div",{ class:"donut-huelle" });

  if(summe <= 0){
    huelle.appendChild(el("p",{ class:"t-klein", text:"Noch keine Beträge eingetragen." }));
    return huelle;
  }

  const R = 70, SB = 22, U = 2*Math.PI*R;
  const box = el("div",{ class:"donut-box" });
  const svg = svgEl("svg",{ viewBox:"0 0 180 180", width:"180", height:"180",
    role:"img", "aria-label":"Anteile: " + alle.map(t => `${t.name} ${prozent(t.wert,summe)}`).join(", ") });

  svg.appendChild(svgEl("circle",{ cx:90, cy:90, r:R, fill:"none",
    stroke:"var(--karte-2)", "stroke-width":SB }));

  let offset = 0;
  alle.forEach((t,i) => {
    const anteil = t.wert / summe;
    const laenge = anteil * U;
    const c = svgEl("circle",{
      cx:90, cy:90, r:R, fill:"none",
      stroke:t.farbe, "stroke-width":SB,
      "stroke-dasharray":`${Math.max(0,laenge-1.6)} ${U - Math.max(0,laenge-1.6)}`,
      "stroke-dashoffset": -offset,
      transform:"rotate(-90 90 90)",
      "stroke-linecap": alle.length === 1 ? "butt" : "butt",
      class:"donut-seg"
    });
    c.style.animationDelay = (i*70)+"ms";
    svg.appendChild(c);
    offset += laenge;
  });

  box.appendChild(svg);
  box.appendChild(el("div",{ class:"donut-mitte" },
    el("div",{ class:"gross", text:euroZ(summe) }),
    el("div",{ class:"klein", text:zeitraumWort() })
  ));
  huelle.appendChild(box);

  const legende = el("div",{ class:"legende", style:"flex-direction:column;gap:8px;flex:1;min-width:180px" });
  alle.forEach(t => {
    legende.appendChild(el("div",{ class:"legende-eintrag", style:"width:100%;justify-content:space-between" },
      el("span",{ style:"display:flex;align-items:center;gap:7px;min-width:0;flex:1" },
        el("span",{ class:"punkt", style:`background:${t.farbe}` }),
        el("span",{ style:"overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)", text:t.name })
      ),
      el("span",{ class:"lw", style:"white-space:nowrap", text:`${euroZ(t.wert)} · ${prozent(t.wert,summe)}` })
    ));
  });
  huelle.appendChild(legende);
  return huelle;
}

/** Waagerechte Balken als Rangliste. */
function balkenRangliste(eintraege, gesamt){
  const box = el("div",{});
  const max = Math.max(...eintraege.map(e => e.wert), 1);
  eintraege.forEach((e,i) => {
    const breite = Math.max(1.5, e.wert / max * 100);
    const fuellung = el("div",{ class:"balken-fuellung",
      style:`width:${breite}%;background:${e.farbe || palettenFarbe(i)}` });
    fuellung.style.animationDelay = (i*45)+"ms";
    box.appendChild(el("div",{ class:"balken-zeile" },
      el("span",{ class:"bz-name", text:e.name, title:e.name }),
      el("span",{ class:"balken-spur" }, fuellung),
      el("span",{ class:"bz-wert", text: gesamt ? prozent(e.wert,gesamt) : euroZ(e.wert) })
    ));
  });
  return box;
}

/** Der Jahresverlauf als Balkendiagramm über zwölf Monate. */
function jahresverlaufZeichnen(){
  const werte = jahresverlauf();
  const max = Math.max(...werte, 1);
  const durchschnitt = werte.reduce((s,w)=>s+w,0) / 12;

  const B = 420, H = 190, padU = 26, padO = 16, padL = 4, padR = 4;
  const nutzH = H - padU - padO;
  const spalte = (B - padL - padR) / 12;
  const bw = Math.min(24, spalte * 0.62);

  const svg = svgEl("svg",{ viewBox:`0 0 ${B} ${H}`, class:"diagramm",
    style:"width:100%;height:auto", role:"img",
    "aria-label":"Ausgaben je Monat: " + werte.map((w,i)=>`${MONATE_LANG[i]} ${euro(w)}`).join(", ") });

  /* Durchschnittslinie */
  const yD = padO + nutzH - (durchschnitt/max*nutzH);
  svg.appendChild(svgEl("line",{ x1:padL, y1:yD, x2:B-padR, y2:yD,
    stroke:"var(--linie-stark)", "stroke-width":1, "stroke-dasharray":"3 4" }));
  const dt = svgEl("text",{ x:B-padR, y:yD-5, "text-anchor":"end", "font-size":"9",
    fill:"var(--text-3)", "font-variant-numeric":"tabular-nums" });
  dt.textContent = "Schnitt " + euroKurz(durchschnitt);
  svg.appendChild(dt);

  const jetztMonat = heute().getMonth();
  werte.forEach((w,i) => {
    const h = Math.max(2, w / max * nutzH);
    const x = padL + spalte*i + (spalte-bw)/2;
    const y = padO + nutzH - h;
    const teuer = w > durchschnitt * 1.18;
    const r = svgEl("rect",{ x, y, width:bw, height:h, rx:Math.min(4,bw/2),
      fill: teuer ? "var(--p3)" : "var(--akzent)",
      opacity: i === jetztMonat ? "1" : "0.78" });
    r.style.transformOrigin = `${x+bw/2}px ${padO+nutzH}px`;
    r.style.animation = `balken-hoch 620ms ${i*40}ms cubic-bezier(.4,0,.2,1) both`;
    svg.appendChild(r);

    const t = svgEl("text",{ x:x+bw/2, y:H-10, "text-anchor":"middle", "font-size":"9.5",
      fill: i === jetztMonat ? "var(--text)" : "var(--text-3)",
      "font-weight": i === jetztMonat ? "700" : "400" });
    t.textContent = MONATE_KURZ[i];
    svg.appendChild(t);
  });

  const box = el("div",{});
  box.appendChild(svg);

  /* Die auffälligen Monate benennen */
  const teuerste = werte.map((w,i)=>({w,i})).sort((a,b)=>b.w-a.w)[0];
  const guenstigste = werte.map((w,i)=>({w,i})).sort((a,b)=>a.w-b.w)[0];
  if(teuerste.w > 0 && teuerste.w !== guenstigste.w){
    box.appendChild(el("p",{ class:"t-klein", style:"margin-top:12px;line-height:1.5",
      html:`Teuerster Monat: <strong style="color:var(--text)">${MONATE_LANG[teuerste.i]}</strong> mit ${euro(teuerste.w)}. Günstigster: ${MONATE_LANG[guenstigste.i]} mit ${euro(guenstigste.w)}.` }));
  }
  return box;
}

/** Der Fälligkeitskalender für einen Monat. */
function kalenderZeichnen(){
  const monat = UI.kalenderMonat;
  const jahr = heute().getFullYear();
  const proTag = faelligkeitenProTag(monat);
  const tageImMonat = new Date(jahr, monat, 0).getDate();
  const ersterWochentag = (new Date(jahr, monat-1, 1).getDay() + 6) % 7; // Montag = 0
  const istAktuellerMonat = (monat === heute().getMonth()+1);
  const heuteTag = heute().getDate();

  const box = el("div",{});

  /* Monatswahl */
  box.appendChild(el("div",{ style:"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px" },
    el("button",{ class:"sym", type:"button", "aria-label":"Vorheriger Monat",
      onclick:() => { UI.kalenderMonat = UI.kalenderMonat === 1 ? 12 : UI.kalenderMonat-1; zeichnen(); } }, icon("ic-links")),
    el("div",{ style:"flex:1;text-align:center" },
      el("div",{ class:"t-h3", text:MONATE_LANG[monat-1] }),
      el("div",{ class:"t-klein", text:`${euro(Array.from(proTag.values()).reduce((s,e)=>s+e.summe,0))} an festen Terminen` })
    ),
    el("button",{ class:"sym", type:"button", "aria-label":"Nächster Monat",
      onclick:() => { UI.kalenderMonat = UI.kalenderMonat === 12 ? 1 : UI.kalenderMonat+1; zeichnen(); } }, icon("ic-rechts"))
  ));

  const raster = el("div",{ class:"kal" });
  WOCHENTAGE.forEach(t => raster.appendChild(el("div",{ class:"kal-kopf", text:t })));
  for(let i=0; i<ersterWochentag; i++) raster.appendChild(el("div",{ class:"kal-tag leer-tag" }));
  for(let t=1; t<=tageImMonat; t++){
    const eintrag = proTag.get(t);
    const hat = !!eintrag && eintrag.summe > 0;
    const zelle = el("button",{
      class:"kal-tag", type:"button",
      dataset:{ hat: hat ? "ja":"nein", heute: (istAktuellerMonat && t === heuteTag) ? "ja":"nein" },
      "aria-label": hat
        ? `${t}. ${MONATE_LANG[monat-1]}: ${euro(eintrag.summe)}, ${eintrag.positionen.length} ${plural(eintrag.positionen.length,"Position","Positionen")}`
        : `${t}. ${MONATE_LANG[monat-1]}: nichts fällig`,
      onclick: hat ? () => tagDetailDialog(eintrag, monat) : null
    },
      el("span",{ class:"nr", text:String(t) }),
      hat ? el("span",{ class:"bt", text:euroKurz(eintrag.summe) }) : null
    );
    raster.appendChild(zelle);
  }
  box.appendChild(raster);

  /* Laufende Positionen, die keinen festen Tag haben */
  const laufend = aktiveAusgaben().filter(a => !INTERVALLE[a.intervall].kalender);
  if(laufend.length > 0){
    const summeL = laufend.reduce((s,a)=>s+Math.round(a.betragCent*INTERVALLE[a.intervall].faktor/12),0);
    box.appendChild(el("p",{ class:"t-klein", style:"margin-top:14px;line-height:1.5",
      html:`Dazu kommen ${laufend.length} laufende ${plural(laufend.length,"Position","Positionen")} ohne festen Termin (wöchentlich oder 14-tägig): rund <strong style="color:var(--text)">${euro(summeL)}</strong> im Monat.` }));
  }
  return box;
}

    el("span",{ style:"font-size:20px;font-weight:640;font-variant-numeric:tabular-nums", text:euro(eintrag.summe) })
  ));
  const liste = el("div",{ class:"liste", style:"box-shadow:none;border:1px solid var(--linie)" });
  eintrag.positionen.slice().sort((a,b)=>b.betragCent-a.betragCent).forEach(a => {
    liste.appendChild(el("div",{ class:"zeile-huelle" },
      el("button",{ class:"zeile", type:"button", onclick:() => { dialogSchliessen(); setTimeout(()=>ausgabeDialog(a),120); } },

          el("div",{ class:"zeile-name", text:a.name }),
          el("div",{ class:"zeile-unter", text:`${a.kategorie} · ${ZAHLUNGSWEGE[a.zahlungsweg].name}` })

  wurzel.appendChild(el("div",{ class:"karte" },
    el("div",{ style:"display:flex;align-items:center;gap:14px" },
      el("div",{ style:"width:44px;height:44px;border-radius:12px;background:var(--akzent-weich);color:var(--akzent);display:flex;align-items:center;justify-content:center;flex:none" },
        icon("ic-bar", 24)),
      el("div",{ style:"flex:1;min-width:0" },
        el("div",{ class:"t-kapitaelchen", text:"Bar bereitlegen" }),
        el("div",{ style:"font-size:30px;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-top:2px",
          text:euroZ(k.barJahr) })
      )
    ),
    el("p",{ class:"t-klein", style:"margin-top:10px;line-height:1.5",
      text: k.barJahr > 0
        ? `So viel brauchst du ${zeitraumWort()} in bar. Alles Weitere läuft über deine Konten.`
        : "Aktuell ist keine Position als Barzahlung eingetragen." })
  ));

  /* --- Summen je Konto --- */
  const proKonto = summenNachKonto();
  if(proKonto.length > 0){
    const tabelle = el("table",{ class:"mini-tabelle" },
      el("thead",{}, el("tr",{},
        el("th",{ text:"Konto" }), el("th",{ text:zeitraumWort() })
      )),
      el("tbody",{}, proKonto.map(e => el("tr",{},
        el("td",{},
          el("div",{ style:"display:flex;align-items:center;gap:9px" },
            (() => { const s = icon(e.konto ? KONTOTYPEN[e.konto.typ].icon : "ic-ordner"); s.style.width="17px"; s.style.height="17px"; s.style.color="var(--text-3)"; s.style.flex="none"; return s; })(),
            el("span",{ text: e.konto ? e.konto.name : "Ohne Konto" })
          )
        ),
        el("td",{ text:euroZ(e.jahr) })
      )))
    );
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" }, el("h2",{ text:"Nach Konto" })),
      tabelle
    ));
  }

  /* --- Überweisungsplan --- */
  const plan = ueberweisungsplan();
  if(plan.eintraege.length > 0){
    const zeilenText = plan.eintraege.map(e =>
      `${euroZ(e.jahr)} — ${e.text}`).join("\n");
    const gesamtText = `Vom Einkommen (${euroZ(k.einnahmenJahr)}):\n` + zeilenText +
      (plan.ueberschussJahr > 0 ? `\n${euroZ(plan.ueberschussJahr)} — bleibt übrig` : "");

    const block = el("div",{ class:"plan-block", text:gesamtText });
    const karte = el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" },
        el("h2",{ text:"Überweisungsplan" }),
        el("button",{ class:"knopf leise klein", type:"button", text:"Kopieren",
          onclick:(ev) => kopieren(gesamtText, ev.currentTarget) })
      ),
      el("p",{ class:"t-klein", style:"margin-bottom:14px;line-height:1.5",
        text:"So verteilst du dein Geld, sobald das Gehalt da ist." }),
      block
    );
    wurzel.appendChild(karte);
  }

  /* --- Kategorien --- */
  const kats = summenNachKategorie();
  if(kats.length > 0){
    const gesamtKat = kats.reduce((s,x)=>s+x.jahr,0);
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" },
        el("h2",{ text:"Teuerste Kategorien" }),
        el("span",{ class:"t-label", text:zeitraumWort() })
      ),
      balkenRangliste(kats.slice(0,10).map((x,i) => ({
        name:x.name, wert:x.jahr, farbe:palettenFarbe(i)
      })), gesamtKat),
      el("div",{ style:"border-top:1px solid var(--linie);margin-top:14px;padding-top:12px" },
        kats.slice(0,10).map(x => el("div",{ class:"datenzeile", style:"border:0;padding:6px 0" },
          el("span",{ class:"dz-name", text:x.name }),
          el("span",{ class:"dz-wert", text:euroZ(x.jahr) })
        ))
      )
    ));
  }

  /* --- Tags --- */
  const tagDaten = summenNachTag();
  if(p.tags.length > 0){
    const mitWert = tagDaten.liste.filter(t => t.jahr > 0);
    const gesamtT = mitWert.reduce((s,t)=>s+t.jahr,0);
    const karte = el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" },
        el("h2",{ text:"Nach Tag" }),
        el("span",{ class:"t-label", text:zeitraumWort() })
      )
    );
    if(mitWert.length === 0){
      karte.appendChild(el("p",{ class:"t-klein",
        text:"Noch keiner Position ist ein Tag zugewiesen. Tags helfen zu sehen, was in bar bereitliegen muss und was über welches Konto läuft." }));
    } else {
      karte.appendChild(balkenRangliste(mitWert.map(t => ({
        name:t.tag.name, wert:t.jahr, farbe:tagFarbe(t.tag)
      })), gesamtT));
      karte.appendChild(el("div",{ style:"border-top:1px solid var(--linie);margin-top:14px;padding-top:12px" },
        mitWert.map(t => el("div",{ class:"datenzeile", style:"border:0;padding:6px 0" },
          el("span",{ class:"dz-name" },
            el("span",{ style:"display:inline-flex;align-items:center;gap:7px" },
              el("span",{ style:`width:8px;height:8px;border-radius:2px;background:${tagFarbe(t.tag)};display:inline-block` }),
              el("span",{ text:t.tag.name })
            )
          ),
          el("span",{ class:"dz-wert" },
            el("span",{ text:euroZ(t.jahr) }),
            el("span",{ class:"neben", text:`${t.anzahl} ${plural(t.anzahl,"Position","Positionen")}` })
          )
        ))
      ));
      if(tagDaten.ohneAnzahl > 0){
        karte.appendChild(el("p",{ class:"t-klein", style:"margin-top:10px",
          text:`${tagDaten.ohneAnzahl} ${plural(tagDaten.ohneAnzahl,"Position hat","Positionen haben")} noch keinen Tag (${euroZ(tagDaten.ohneJahr)}).` }));
      }
    }
    wurzel.appendChild(karte);
  }

  /* --- Fälligkeitskalender --- */
  wurzel.appendChild(el("div",{ class:"karte" },
    el("div",{ class:"karte-kopf" }, el("h2",{ text:"Fälligkeiten" })),
    kalenderZeichnen()
  ));

  /* --- Jahresverlauf --- */
  wurzel.appendChild(el("div",{ class:"karte" },
    el("div",{ class:"karte-kopf" },
      el("h2",{ text:"Jahresverlauf" }),
      el("span",{ class:"t-label", text:"je Monat" })
    ),
    jahresverlaufZeichnen()
  ));

  /* --- Rücklage --- */
  if(k.ruecklageJahr > 0){
    const nichtMonatlich = aktiveAusgaben()
      .filter(a => ["zweimonatlich","vierteljaehrlich","halbjaehrlich","jaehrlich","einmalig"].includes(a.intervall))
      .sort((a,b) => jahresCent(b) - jahresCent(a));
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" }, el("h2",{ text:"Rücklage für Jahresrechnungen" })),
      el("div",{ style:"font-size:30px;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums",
        text:euro(k.ruecklageJahr/12) }),
      el("p",{ class:"t-klein", style:"margin-top:6px;line-height:1.5",
        html:`So viel solltest du <strong style="color:var(--text)">jeden Monat</strong> zur Seite legen, damit die ${nichtMonatlich.length} ${plural(nichtMonatlich.length,"Rechnung","Rechnungen")}, die nicht monatlich kommen, dich nicht überraschen. Im Jahr sind das ${euro(k.ruecklageJahr)}.` }),
      klapp("Diese Positionen sind gemeint", () => {
        const box = el("div",{});
        nichtMonatlich.forEach(a => box.appendChild(el("div",{ class:"datenzeile" },
          el("span",{ class:"dz-name" },
            el("span",{ text:a.name }),
            el("span",{ class:"neben", text:`${INTERVALLE[a.intervall].name}, ${a.intervall==="einmalig"?"im":"ab"} ${MONATE_KURZ[(a.startMonat||1)-1]}` })
          ),
          el("span",{ class:"dz-wert" },
            el("span",{ text:euro(a.betragCent) }),
            el("span",{ class:"neben", text:euro(jahresCent(a)/12)+" /Monat" })
          )
        )));
        return box;
      })
    ));
  }

  /* --- Fix / Variabel --- */
  const gesamtAus = k.ausgabenJahr;
  if(gesamtAus > 0){
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" }, el("h2",{ text:"Feste und flexible Kosten" })),
      el("div",{ class:"regel-balken" },
        k.fixJahr > 0 ? el("div",{ style:`flex:${k.fixJahr};background:var(--p7)`,
          "aria-hidden":"true" }) : null,
        k.varJahr > 0 ? el("div",{ style:`flex:${k.varJahr};background:var(--p5)`,
          "aria-hidden":"true" }) : null,
        k.luxJahr > 0 ? el("div",{ style:`flex:${k.luxJahr};background:var(--p4)`,
          "aria-hidden":"true" }) : null
      ),
      el("div",{ class:"legende" },
        el("span",{ class:"legende-eintrag" }, el("span",{ class:"punkt", style:"background:var(--p7)" }), `Fix ${euroZ(k.fixJahr)}`),
        el("span",{ class:"legende-eintrag" }, el("span",{ class:"punkt", style:"background:var(--p5)" }), `Variabel ${euroZ(k.varJahr)}`),
        el("span",{ class:"legende-eintrag" }, el("span",{ class:"punkt", style:"background:var(--p4)" }), `Luxus ${euroZ(k.luxJahr)}`)
      ),
      el("p",{ class:"t-klein", style:"margin-top:12px;line-height:1.5",
        text:`${prozent(k.fixJahr,gesamtAus)} deiner Ausgaben sind fest. Je niedriger dieser Anteil, desto schneller kannst du reagieren, wenn sich etwas ändert.` })
    ));
  }

  /* --- 50/30/20 --- */
  const regel = regel503020();
  if(regel.basis > 0){
    const s = regel.bedarf + regel.wuensche + regel.sparen;
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" }, el("h2",{ text:"50/30/20-Vergleich" })),
      el("div",{ class:"regel-balken" },
        regel.bedarf > 0 ? el("div",{ style:`flex:${regel.bedarf};background:var(--p1)`,
          "aria-hidden":"true" }) : null,
        regel.wuensche > 0 ? el("div",{ style:`flex:${regel.wuensche};background:var(--p4)`,
          "aria-hidden":"true" }) : null,
        regel.sparen > 0 ? el("div",{ style:`flex:${regel.sparen};background:var(--p2)`,
          "aria-hidden":"true" }) : null
      ),
      el("div",{ style:"margin-top:6px" },
        [["Bedarf", regel.bedarf, 50, "var(--p1)"],
         ["Wünsche", regel.wuensche, 30, "var(--p4)"],
         ["Sparen", regel.sparen, 20, "var(--p2)"]].map(([name,wert,soll,farbe]) =>
          el("div",{ class:"datenzeile" },
            el("span",{ class:"dz-name" },
              el("span",{ style:"display:inline-flex;align-items:center;gap:8px" },
                el("span",{ style:`width:8px;height:8px;border-radius:2px;background:${farbe};display:inline-block` }),
                el("span",{ text:name })
              ),
              el("span",{ class:"neben", text:`Faustregel: ${soll} %` })
            ),
            el("span",{ class:"dz-wert" },
              el("span",{ text: prozent(wert, s) }),
              el("span",{ class:"neben", text:euroZ(wert) })
            )
          ))
      ),
      el("p",{ class:"t-klein", style:"margin-top:14px;line-height:1.5",
        text:"Das ist nur eine Faustregel, kein Maßstab. Wer in einer teuren Stadt wohnt, liegt beim Bedarf fast immer über 50 %. Sparen zählt hier alles, was du zurücklegst, plus deinen Überschuss." })
    ));
  }

  /* --- Notgroschen --- */
  const bedarf3 = notgroschenBedarf(3);
  const bedarf6 = notgroschenBedarf(6);
  if(bedarf3 > 0){
    const ziel = S.einstellungen.notgroschenZiel || bedarf3;
    const stand = S.einstellungen.notgroschenStand;
    const anteil = ziel > 0 ? klemmen(stand/ziel*100, 0, 100) : 0;
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" }, el("h2",{ text:"Notgroschen" })),
      el("p",{ class:"t-body", style:"color:var(--text-2);line-height:1.5",
        html:`Deine festen Kosten für drei Monate: <strong style="color:var(--text)">${euro(bedarf3)}</strong>. Für sechs Monate: ${euro(bedarf6)}.` }),
      el("div",{ class:"fortschritt" }, el("div",{ style:`width:${anteil}%` })),
      el("div",{ style:"display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums" },
        el("span",{ text:`${euro(stand)} zurückgelegt` }),
        el("span",{ text:`Ziel ${euro(ziel)}` })
      ),
      el("div",{ class:"knopf-reihe", style:"margin-top:14px" },
        el("button",{ class:"knopf klein rahmen", type:"button", text:"Stand aktualisieren",
          onclick:() => notgroschenDialog(bedarf3) })
      )
    ));
  }

  /* --- Kündigungs-Kandidaten --- */
  const kandidaten = kuendigungsKandidaten();
  if(kandidaten.length > 0){
    const summeK = kandidaten.reduce((s,a)=>s+jahresCent(a),0);
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" }, el("h2",{ text:"Kündigungs-Kandidaten" })),
      el("p",{ class:"t-body", style:"color:var(--text-2);line-height:1.5",
        html:`Diese ${kandidaten.length} ${plural(kandidaten.length,"Position kostet","Positionen kosten")} dich <strong style="color:var(--text)">${euro(summeK)}</strong> im Jahr.` }),
      el("div",{ style:"margin-top:10px" },
        kandidaten.slice(0,12).map(a => {
          const std = arbeitsstunden(jahresCent(a));
          return el("div",{ class:"datenzeile" },
            el("span",{ class:"dz-name" },
              el("span",{ text:a.name }),
              el("span",{ class:"neben", text: `${a.kategorie} · ${INTERVALLE[a.intervall].name}` + (std ? ` · rund ${Math.round(std)} ${plural(Math.round(std),"Arbeitsstunde","Arbeitsstunden")} im Jahr` : "") })
            ),
            el("span",{ class:"dz-wert" },
              el("span",{ text:euro(jahresCent(a)) }),
              el("span",{ class:"neben", text:"im Jahr" })
            )
          );
        })
      )
    ));
  }

  /* --- Was wäre wenn --- */
  wurzel.appendChild(wasWaereWennKarte());

  /* --- Hochrechnung --- */
  if(k.ueberschussJahr !== 0){
    const zins = S.einstellungen.tagesgeldZins;
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" }, el("h2",{ text:"Hochrechnung" })),
      el("div",{ style:"display:grid;gap:2px" },
        [12,24,60].map(m => el("div",{ class:"datenzeile" },
          el("span",{ class:"dz-name", text:`in ${m/12} ${plural(m/12,"Jahr","Jahren")}` }),
          el("span",{ class:"dz-wert " + (hochrechnung(m) >= 0 ? "gruen":"rot"), text:euro(hochrechnung(m)) })
        ))
      ),
      el("p",{ class:"t-klein", style:"margin-top:12px;line-height:1.5",
        text: k.ueberschussJahr > 0
          ? (zins > 0
              ? `Bei gleichbleibendem Überschuss und ${nfProzent.format(zins).replace(",0","")} % Zinsen im Jahr.`
              : "Bei gleichbleibendem Überschuss, ohne Zinsen. Einen Zinssatz kannst du in den Einstellungen eintragen.")
          : "So groß wird die Lücke, wenn sich nichts ändert." })
    ));
  }
}

/** Der Was-wäre-wenn-Bereich mit Schiebereglern. */
function wasWaereWennKarte(){
  const karte = el("div",{ class:"karte" });
  karte.appendChild(el("div",{ class:"karte-kopf" },
    el("h2",{ text:"Was wäre wenn" }),
    UI.szenarioAktiv ? el("button",{ class:"knopf leise klein", type:"button", text:"Zurücksetzen",
      onclick:() => { UI.szenario = { einnahmenFaktor:1, ausgabenFaktor:1, ausgeblendet:new Set() };
                      UI.szenarioAktiv = false; zeichnen(); } }) : null
  ));
  karte.appendChild(el("p",{ class:"t-klein", style:"margin-bottom:18px;line-height:1.5",
    text:"Probiere Änderungen aus. Deine gespeicherten Daten bleiben unangetastet." }));

  const ergebnis = el("div",{});
  const neuRechnen = () => {
    const s = kennzahlen(UI.szenario);
    const alt = kennzahlen();
    const diff = s.ueberschussJahr - alt.ueberschussJahr;
    ergebnis.replaceChildren(
      el("div",{ style:"padding:16px;border-radius:12px;background:var(--karte-2);margin-top:6px" },
        el("div",{ class:"t-kapitaelchen", text:"Neuer Überschuss "+zeitraumWort() }),
        el("div",{ style:`font-size:30px;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-top:2px;color:${s.ueberschussJahr>=0?"var(--gruen)":"var(--rot)"}`,
          text:euroZ(s.ueberschussJahr) }),
        el("div",{ class:"t-klein", style:"margin-top:4px",
          text: diff === 0 ? "unverändert"
            : `${diff > 0 ? "+" : "−"}${euroZ(Math.abs(diff))} gegenüber jetzt` }),
        el("div",{ class:"t-klein", style:"margin-top:8px",
          text:`Einnahmen ${euroZ(s.einnahmenJahr)} · Ausgaben ${euroZ(s.ausgabenJahr)}` })
      )
    );
  };

  const regler = (beschriftung, feld, min, max) => {
    const anzeige = el("span",{ class:"t-label zahl", style:"color:var(--akzent);font-weight:650" });
    const setzeAnzeige = () => {
      const pz = Math.round((UI.szenario[feld] - 1) * 100);
      anzeige.textContent = (pz > 0 ? "+" : "") + pz + " %";
    };
    setzeAnzeige();
    const input = el("input",{ type:"range", min, max, step:1,
      value: Math.round((UI.szenario[feld]-1)*100),
      "aria-label": beschriftung,
      oninput:(ev) => {
        UI.szenario[feld] = 1 + (+ev.target.value)/100;
        UI.szenarioAktiv = true;
        setzeAnzeige();
        neuRechnen();
      }});
    return el("div",{ class:"feld" },
      el("div",{ style:"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px" },
        el("span",{ class:"feld-label", style:"margin:0", text:beschriftung }),
        anzeige
      ),
      input
    );
  };

  karte.appendChild(regler("Einnahmen ändern","einnahmenFaktor",-50,100));
  karte.appendChild(regler("Alle Ausgaben ändern (z. B. Inflation)","ausgabenFaktor",-50,100));

  /* Einzelne Positionen ausblenden */
  const aus = aktiveAusgaben().slice().sort((a,b) => jahresCent(b)-jahresCent(a)).slice(0,20);
  if(aus.length > 0){
    karte.appendChild(klapp("Einzelne Positionen weglassen", () => {
      const box = el("div",{ class:"chip-reihe" });
      aus.forEach(a => {
        box.appendChild(el("button",{ class:"chip wahl", type:"button",
          "aria-pressed": UI.szenario.ausgeblendet.has(a.id) ? "true":"false",
          onclick:(ev) => {
            if(UI.szenario.ausgeblendet.has(a.id)) UI.szenario.ausgeblendet.delete(a.id);
            else UI.szenario.ausgeblendet.add(a.id);
            UI.szenarioAktiv = true;
            ev.currentTarget.setAttribute("aria-pressed", UI.szenario.ausgeblendet.has(a.id) ? "true":"false");
            neuRechnen();
          }}, `${kuerzen(a.name,22)} · ${euro(monatsCent(a))}`));
      });
      return box;
    }, UI.szenario.ausgeblendet.size > 0));
  }

  karte.appendChild(ergebnis);
  neuRechnen();
  return karte;
}

/** Text in die Zwischenablage — mit Rückfallweg für ältere Browser. */
function kopieren(text, knopf){
  const erfolg = () => {
    if(knopf){
      const alt = knopf.textContent;
      knopf.textContent = "Kopiert";
      setTimeout(() => { knopf.textContent = alt; }, 1600);
    } else toast("In die Zwischenablage kopiert.");
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(erfolg).catch(() => notfallKopie(text, erfolg));
  } else {
    notfallKopie(text, erfolg);
  }
}
function notfallKopie(text, erfolg){
  const ta = el("textarea",{ style:"position:fixed;opacity:0;top:0;left:0" });
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); erfolg(); }
  catch(f){ toast("Kopieren hat nicht geklappt. Markiere den Text und kopiere ihn von Hand."); }
  ta.remove();
}

function notgroschenDialog(vorschlag){
  const koerper = el("div",{});
  const zielFeld = el("input",{ class:"eingabe betrag", type:"text", inputmode:"decimal",
    value: zahlFuerFeld(S.einstellungen.notgroschenZiel || vorschlag), "data-autofokus":"" });
  const standFeld = el("input",{ class:"eingabe betrag", type:"text", inputmode:"decimal",
    value: zahlFuerFeld(S.einstellungen.notgroschenStand) });
  koerper.appendChild(el("div",{ class:"feld" }, el("label",{ text:"Zielbetrag" }), zielFeld,
    el("div",{ class:"feld-hinweis", text:`Vorschlag: ${euro(vorschlag)} — das sind drei Monate Fixkosten.` })));
  koerper.appendChild(el("div",{ class:"feld" }, el("label",{ text:"Bereits zurückgelegt" }), standFeld));

  const fuss = el("div",{ style:"display:flex;gap:8px;width:100%" },
    el("button",{ class:"knopf", type:"button", style:"flex:1", text:"Abbrechen", onclick:() => dialogSchliessen() }),
    el("button",{ class:"knopf primaer", type:"button", style:"flex:1", text:"Speichern", onclick:() => {
      const z = betragParsen(zielFeld.value);
      const st = betragParsen(standFeld.value);
      S.einstellungen.notgroschenZiel = z === null ? 0 : Math.max(0,z);
      S.einstellungen.notgroschenStand = st === null ? 0 : Math.max(0,st);
      dialogSchliessen();
      aendern();
    }})
  );
  dialogOeffnen({ titel:"Notgroschen", koerper, fuss });
}

/** Ein Betragsfeld, das auch rechnen kann: 45+12,50 */
function betragsFeld(startCent, beschriftung = "Betrag"){
  const feld = el("input",{
    class:"eingabe betrag", type:"text", inputmode:"decimal",
    autocomplete:"off", autocorrect:"off", spellcheck:"false",
    placeholder:"0,00",
    value: startCent > 0 ? zahlFuerFeld(startCent) : "",
    "data-autofokus":""
  });
  const hinweis = el("div",{ class:"feld-hinweis", text:"Komma oder Punkt, Rechnen erlaubt: 45+12,50" });
  const pruefen = () => {
    const roh = feld.value.trim();
    if(roh === ""){ hinweis.textContent = "Komma oder Punkt, Rechnen erlaubt: 45+12,50"; hinweis.classList.remove("warn"); return; }
    const c = betragParsen(roh);
    if(c === null){
      hinweis.textContent = "Das kann ich nicht lesen. Beispiel: 45,90 oder 45+12,50";
      hinweis.classList.add("warn");
    } else {
      hinweis.textContent = /[+\-*/()]/.test(roh) ? "Ergibt "+euro(c) : euro(c)+" — auch als Rechnung eingebbar";
      hinweis.classList.remove("warn");
    }
  };
  feld.addEventListener("input", pruefen);
  // Beim Verlassen die Rechnung ausschreiben, damit der Nutzer das Ergebnis sieht.
  feld.addEventListener("blur", () => {
    const c = betragParsen(feld.value);
    if(c !== null) feld.value = zahlFuerFeld(c);
    pruefen();
  });
  pruefen();
  const box = el("div",{ class:"feld" },
    el("div",{ class:"feld-label", text:beschriftung }),
    feld, hinweis
  );
  return { box, feld, wert:() => betragParsen(feld.value) };
}

/** Auswahl aus einer Liste. */
function auswahlFeld(beschriftung, optionen, gewaehlt, aufAenderung){
  const sel = el("select",{ class:"eingabe", onchange:(e) => aufAenderung && aufAenderung(e.target.value) },
    optionen.map(([wert,text]) => el("option",{ value:wert, selected: wert === gewaehlt, text }))
  );
  return { box: el("div",{ class:"feld" }, el("div",{ class:"feld-label", text:beschriftung }), sel), feld:sel };
}

/** Ein/Aus-Schalter. */
function schalterFeld(haupt, neben, an, aufAenderung){
  const s = el("button",{ class:"schalter", type:"button", role:"switch",
    "aria-checked": an ? "true":"false", "aria-label":haupt,
    onclick:(ev) => {
      const neu = ev.currentTarget.getAttribute("aria-checked") !== "true";
      ev.currentTarget.setAttribute("aria-checked", neu ? "true":"false");
      aufAenderung(neu);
    }});
  return el("div",{ class:"schalter-zeile" },
    el("div",{ class:"beschriftung" },
      el("div",{ class:"haupt", text:haupt }),
      neben ? el("div",{ class:"neben", text:neben }) : null
    ), s);
}

  /* Fälligkeit */
  const tagFeld = el("input",{ class:"eingabe", type:"number", min:"1", max:"31", inputmode:"numeric",

        text:`Entspricht rund ${Math.round(std)} ${plural(Math.round(std),"Arbeitsstunde","Arbeitsstunden")} im Jahr.` }) : null

  betrag.feld.addEventListener("input", vorschauAktualisieren);

  const speichernFn = () => {

    const c = betrag.wert();

    if(!pr.kategorien.includes(daten.kategorie)) pr.kategorien.push(daten.kategorie);
    const i = pr.ausgaben.findIndex(x => x.id === daten.id);
    if(i >= 0) pr.ausgaben[i] = daten; else pr.ausgaben.push(daten);

  const fuss = el("div",{ style:"display:flex;gap:8px;width:100%" },

function tagLoeschen(tag){
  const p = P();
  const betroffen = p.ausgaben.filter(a => a.tags.includes(tag.id)).length;
  bestaetigen({
    titel:"Tag löschen",
    text: betroffen > 0
      ? `„${tag.name}“ wird bei ${betroffen} ${plural(betroffen,"Position","Positionen")} entfernt. Die Positionen selbst bleiben erhalten.`
      : `„${tag.name}“ wird gelöscht.`,
    knopfText:"Löschen", gefahr:true, ebene:2,
    dann:() => {
      const pr = P();
      pr.tags = pr.tags.filter(t => t.id !== tag.id);
      pr.ausgaben.forEach(a => a.tags = a.tags.filter(t => t !== tag.id));
      UI.filterTags.delete(tag.id);
      dialogSchliessen(2);
      aendern();
      toast("Tag gelöscht.");
    }
  });
}

    el("button",{ class:"knopf primaer", type:"button", style:"flex:1", text: vorhanden ? "Speichern":"Anlegen", onclick:speichernFn })
  );
  dialogOeffnen({ titel: vorhanden ? "Konto bearbeiten" : "Neues Konto", koerper, fuss, ebene:2 });
}

function kontoLoeschen(konto){
  const p = P();
  const betroffen = p.ausgaben.filter(a => a.kontoId === konto.id).length
                  + p.einnahmen.filter(e => e.kontoId === konto.id).length;
  bestaetigen({
    titel:"Konto löschen",
    text: betroffen > 0
      ? `${betroffen} ${plural(betroffen,"Position ist","Positionen sind")} diesem Konto zugeordnet. Die Zuordnung wird aufgehoben, die Positionen bleiben.`
      : `„${konto.name}“ wird gelöscht.`,
    knopfText:"Löschen", gefahr:true, ebene:2,
    dann:() => {
      const pr = P();
      pr.konten = pr.konten.filter(k => k.id !== konto.id);
      pr.ausgaben.forEach(a => { if(a.kontoId === konto.id) a.kontoId = null; });
      pr.einnahmen.forEach(e => { if(e.kontoId === konto.id) e.kontoId = null; });
      dialogSchliessen(2);
      aendern();
      toast("Konto gelöscht.");
    }
  });
}

function profilDialog(vorhanden){
  const neu = !vorhanden;
  const feld = el("input",{ class:"eingabe", type:"text", maxlength:"60",
    placeholder:"z. B. Nach Gehaltserhöhung", value: vorhanden ? vorhanden.name : "", "data-autofokus":"" });
  let quelle = "leer";
  const koerper = el("div",{},
    el("div",{ class:"feld" }, el("div",{ class:"feld-label", text:"Name" }), feld)
  );
  if(neu){
    koerper.appendChild(el("div",{ class:"feld" },
      el("div",{ class:"feld-label", text:"Womit starten?" }),
      el("div",{ class:"segment breit" },
        el("button",{ type:"button", "aria-pressed":"true", text:"Leer", onclick:(e) => {
          quelle="leer"; e.target.parentElement.children[0].setAttribute("aria-pressed","true");
          e.target.parentElement.children[1].setAttribute("aria-pressed","false"); }}),
        el("button",{ type:"button", "aria-pressed":"false", text:"Kopie des aktuellen", onclick:(e) => {
          quelle="kopie"; e.target.parentElement.children[0].setAttribute("aria-pressed","false");
          e.target.parentElement.children[1].setAttribute("aria-pressed","true"); }})
      ),
      el("div",{ class:"feld-hinweis", text:"Eine Kopie enthält alle Einnahmen, Ausgaben, Konten und Tags — zum Durchspielen." })
    ));
  }
  const speichernFn = () => {
    const name = feld.value.trim().slice(0,60);
    if(!name){ feld.focus(); return; }
    if(neu){
      let p;
      if(quelle === "kopie"){
        p = JSON.parse(JSON.stringify(P()));
        p.id = idNeu("pr");
      } else {
        p = profilNeu(name);
        p.tags = TAG_VORSCHLAEGE.slice(0,5).map(t => ({ id:idNeu("tg"), name:t.name, farbe:t.farbe }));
        p.konten = KONTO_VORSCHLAEGE.map(k => ({ id:idNeu("ko"), name:k.name, typ:k.typ, startsaldoCent:0 }));
      }
      p.name = name;
      S.profile.push(p);
      S.aktivesProfil = p.id;
    } else {
      const p = S.profile.find(x => x.id === vorhanden.id);
      if(p) p.name = name;
    }
    dialogSchliessen(2);
    aendern();
    toast(neu ? `Profil „${name}“ angelegt.` : "Profil umbenannt.");
  };
  koerper.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); speichernFn(); } });
  const fuss = el("div",{ style:"display:flex;gap:8px;width:100%" },
    (vorhanden && S.profile.length > 1) ? el("button",{ class:"knopf gefahr", type:"button", "aria-label":"Profil löschen",
      onclick:() => profilLoeschen(vorhanden) }, icon("ic-muell")) : null,
    el("button",{ class:"knopf primaer", type:"button", style:"flex:1", text: neu ? "Anlegen":"Speichern", onclick:speichernFn })
  );
  dialogOeffnen({ titel: neu ? "Neues Profil" : "Profil bearbeiten", koerper, fuss, ebene:2 });
}

function profilLoeschen(profil){
  if(S.profile.length <= 1) return;
  const anzahl = (profil.einnahmen?.length||0) + (profil.ausgaben?.length||0);
  bestaetigen({
    titel:"Profil löschen",
    text:`„${profil.name}“ wird mit ${anzahl} ${plural(anzahl,"Position","Positionen")} gelöscht. Das lässt sich nicht rückgängig machen.`,
    knopfText:"Löschen", gefahr:true, ebene:2,
    dann:() => {
      S.profile = S.profile.filter(p => p.id !== profil.id);
      if(S.aktivesProfil === profil.id) S.aktivesProfil = S.profile[0].id;
      dialogSchliessen(2);
      aendern();
      toast("Profil gelöscht.");
    }
  });
}

/** Startet einen Download aus einem Text. */
function dateiHerunterladen(dateiname, inhalt, typ){
  const blob = new Blob([inhalt], { type: typ });
  const url = URL.createObjectURL(blob);
  const a = el("a",{ href:url, download:dateiname, style:"display:none" });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1200);
}

function jsonExportieren(){
  const paket = {
    app: "Lohnwerk",
    schemaVersion: SCHEMA_VERSION,
    exportiertAm: new Date().toISOString(),
    daten: S
  };
  const name = `lohnwerk-sicherung-${datumIso()}.json`;
  dateiHerunterladen(name, JSON.stringify(paket, null, 2), "application/json;charset=utf-8");

function csvExportieren(){
  const p = P();
  const trenn = ";";
  const feld = (w) => {
    const s = String(w ?? "");
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const zahl = (cent) => nfZahl.format(Math.round(cent)/100);   // deutsches Format für Excel

  const zeilen = [];
  zeilen.push(["Typ","Bezeichnung","Betrag","Intervall","Betrag pro Monat","Betrag pro Jahr",
               "Kategorie","Zahlungsweg","Konto","Fälliger Tag","Startmonat","Tags","Priorität","Aktiv","Notiz"].map(feld).join(trenn));

  p.einnahmen.forEach(e => {
    const j = e.aktiv === false ? 0 : jahresCent(e);
    const konto = p.konten.find(k => k.id === e.kontoId);
    zeilen.push([
      "Einnahme", e.name, zahl(e.betragCent), INTERVALLE[e.intervall].name,
      zahl(j/12), zahl(j), e.art === "brutto" ? "Brutto" : "Netto", "", konto ? konto.name : "",
      e.eingangTag, "", "", "", e.aktiv === false ? "nein":"ja", e.notiz || ""
    ].map(feld).join(trenn));
  });

  p.ausgaben.forEach(a => {
    const j = a.aktiv === false ? 0 : jahresCent(a);
    const konto = kontoFuer(a);
    const tagNamen = a.tags.map(id => p.tags.find(t => t.id === id)?.name).filter(Boolean).join(", ");
    zeilen.push([
      "Ausgabe", a.name, zahl(a.betragCent), INTERVALLE[a.intervall].name,
      zahl(j/12), zahl(j), a.kategorie, ZAHLUNGSWEGE[a.zahlungsweg].name,
      konto ? konto.name : "", a.faelligTag, MONATE_LANG[(a.startMonat||1)-1],
      tagNamen, PRIORITAETEN[a.prioritaet].name, a.aktiv === false ? "nein":"ja", a.notiz || ""
    ].map(feld).join(trenn));
  });

  const k = kennzahlen();
  zeilen.push("");
  zeilen.push(["Summe","Einnahmen","","", zahl(k.einnahmenJahr/12), zahl(k.einnahmenJahr)].map(feld).join(trenn));
  zeilen.push(["Summe","Ausgaben","","", zahl(k.ausgabenJahr/12), zahl(k.ausgabenJahr)].map(feld).join(trenn));
  zeilen.push(["Summe","Überschuss","","", zahl(k.ueberschussJahr/12), zahl(k.ueberschussJahr)].map(feld).join(trenn));
  zeilen.push(["Summe","Bar-Bedarf","","", zahl(k.barJahr/12), zahl(k.barJahr)].map(feld).join(trenn));

  // BOM (U+FEFF) voranstellen, damit Excel die Umlaute richtig liest.
  const inhalt = "\uFEFF" + zeilen.join("\r\n");
  const name = `lohnwerk-${p.name.replace(/[^\wäöüÄÖÜß-]+/g,"_")}-${datumIso()}.csv`;
  dateiHerunterladen(name, inhalt, "text/csv;charset=utf-8");
  toast(`Gespeichert als ${name}`);
}

/** Liest eine Datei ein und zeigt die Vorschau. */
function dateiEinlesen(datei){
  if(!datei) return;
  if(datei.size > 12 * 1024 * 1024){
    toast("Die Datei ist zu groß. Erwartet wird eine Lohnwerk-Sicherung.");
    return;
  }
  const leser = new FileReader();
  leser.onload = () => {
    let daten = null;
    try{
      const roh = JSON.parse(String(leser.result));
      daten = (roh && roh.daten) ? roh.daten : roh;
    }catch(fehler){
      toast("Diese Datei lässt sich nicht lesen. Erwartet wird eine .json-Sicherung von Lohnwerk.", null, 8000);
      return;
    }
    const geprueft = zustandSaeubern(daten);
    const anzahlE = geprueft.profile.reduce((s,p) => s + p.einnahmen.length, 0);
    const anzahlA = geprueft.profile.reduce((s,p) => s + p.ausgaben.length, 0);
    if(anzahlE + anzahlA === 0 && geprueft.profile.length === 0){
      toast("In dieser Datei sind keine Positionen enthalten.");
      return;
    }
    importVorschauDialog(geprueft, datei.name, anzahlE, anzahlA);
  };
  leser.onerror = () => toast("Die Datei konnte nicht gelesen werden.");
  leser.readAsText(datei, "utf-8");
}

/** Fügt die Daten einer Sicherung zum aktuellen Profil hinzu. */
function importHinzufuegen(neuerZustand){
  const ziel = P();
  neuerZustand.profile.forEach(quelle => {
    // Konten übernehmen, gleiche Namen zusammenführen.
    const kontoKarte = new Map();
    quelle.konten.forEach(k => {
      const vorhanden = ziel.konten.find(z => z.name.toLowerCase() === k.name.toLowerCase());
      if(vorhanden){ kontoKarte.set(k.id, vorhanden.id); }
      else { const neu = { ...k, id:idNeu("ko") }; ziel.konten.push(neu); kontoKarte.set(k.id, neu.id); }
    });
    // Tags übernehmen, gleiche Namen zusammenführen.
    const tagKarte = new Map();
    quelle.tags.forEach(t => {
      const vorhanden = ziel.tags.find(z => z.name.toLowerCase() === t.name.toLowerCase());
      if(vorhanden){ tagKarte.set(t.id, vorhanden.id); }
      else { const neu = { ...t, id:idNeu("tg") }; ziel.tags.push(neu); tagKarte.set(t.id, neu.id); }
    });
    quelle.kategorien.forEach(k => { if(!ziel.kategorien.includes(k)) ziel.kategorien.push(k); });
    quelle.einnahmen.forEach(e => {
      ziel.einnahmen.push({ ...e, id:idNeu("ei"), kontoId: kontoKarte.get(e.kontoId) || null });
    });
    quelle.ausgaben.forEach(a => {
      ziel.ausgaben.push({ ...a, id:idNeu("au"),
        kontoId: kontoKarte.get(a.kontoId) || null,
        tags: a.tags.map(t => tagKarte.get(t)).filter(Boolean) });
    });
  });
}

function einrichtungOeffnen(){
  let schritt = 1;
  const auswahlKategorien = new Set();
  const auswahlKonten = new Set(KONTO_VORSCHLAEGE.map(k => k.name));
  const einkommen = [{ name:"Gehalt", betrag:"" }];

  const koerper = el("div",{});
  const punkte = el("div",{ class:"schritt-punkte" },
    [1,2,3].map(i => el("span",{ class: i===1 ? "aktiv":"" })));
  const inhalt = el("div",{});
  koerper.appendChild(punkte);
  koerper.appendChild(inhalt);

  const zurueckKnopf = el("button",{ class:"knopf", type:"button", style:"flex:none", text:"Zurück",
    onclick:() => { if(schritt > 1){ schritt--; zeichneSchritt(); } } });
  const weiterKnopf = el("button",{ class:"knopf primaer", type:"button", style:"flex:1", text:"Weiter",
    onclick:() => { if(schritt < 3){ schritt++; zeichneSchritt(); } else fertigstellen(); } });
  const fuss = el("div",{ style:"display:flex;gap:8px;width:100%" }, zurueckKnopf, weiterKnopf);

  function zeichneSchritt(){
    Array.from(punkte.children).forEach((s,i) => s.classList.toggle("aktiv", i === schritt-1));
    zurueckKnopf.style.display = schritt === 1 ? "none" : "";
    weiterKnopf.textContent = schritt === 3 ? "Fertig" : "Weiter";
    inhalt.replaceChildren();

    if(schritt === 1){
      inhalt.appendChild(el("h3",{ class:"t-h2", style:"margin-bottom:6px", text:"Was kommt rein?" }));
      inhalt.appendChild(el("p",{ class:"t-klein", style:"margin-bottom:20px;line-height:1.5",
        text:"Trag ein, was du im Monat bekommst. Beträge kannst du auch später noch ändern." }));
      const liste = el("div",{});
      const zeichneEinkommen = () => {
        liste.replaceChildren();
        einkommen.forEach((e,i) => {
          liste.appendChild(el("div",{ class:"feld-reihe", style:"margin-bottom:12px;align-items:flex-end" },
            el("div",{ style:"flex:1.3" },
              el("div",{ class:"t-label", style:"margin-bottom:4px;font-size:12px", text:"Bezeichnung" }),
              el("input",{ class:"eingabe", type:"text", value:e.name, placeholder:"z. B. Gehalt",
                oninput:(ev) => e.name = ev.target.value })),
            el("div",{ style:"flex:1" },
              el("div",{ class:"t-label", style:"margin-bottom:4px;font-size:12px", text:"Monatlich" }),
              el("input",{ class:"eingabe", type:"text", inputmode:"decimal", value:e.betrag, placeholder:"0,00",
                oninput:(ev) => e.betrag = ev.target.value })),
            einkommen.length > 1 ? el("button",{ class:"sym", type:"button", "aria-label":"Zeile entfernen",
              style:"flex:none;margin-bottom:2px",
              onclick:() => { einkommen.splice(i,1); zeichneEinkommen(); } }, icon("ic-x")) : null
          ));
        });
        liste.appendChild(el("button",{ class:"knopf rahmen breit", type:"button",
          onclick:() => { einkommen.push({ name:"", betrag:"" }); zeichneEinkommen(); } },
          icon("ic-plus"), "Weitere Einnahme"));
      };
      zeichneEinkommen();
      inhalt.appendChild(liste);
    }

    if(schritt === 2){
      inhalt.appendChild(el("h3",{ class:"t-h2", style:"margin-bottom:6px", text:"Welche Kosten hast du?" }));
      inhalt.appendChild(el("p",{ class:"t-klein", style:"margin-bottom:20px;line-height:1.5",
        text:"Tippe an, was auf dich zutrifft. Die Beträge trägst du gleich danach ein." }));
      const raster = el("div",{ class:"vorschlag-raster" });
      KATEGORIE_VORSCHLAEGE.forEach(k => {
        raster.appendChild(el("button",{ class:"vorschlag", type:"button",
          "aria-pressed": auswahlKategorien.has(k) ? "true":"false",
          onclick:(ev) => {
            if(auswahlKategorien.has(k)) auswahlKategorien.delete(k); else auswahlKategorien.add(k);
            ev.currentTarget.setAttribute("aria-pressed", auswahlKategorien.has(k) ? "true":"false");
          }}, k));
      });
      inhalt.appendChild(raster);
    }

    if(schritt === 3){
      inhalt.appendChild(el("h3",{ class:"t-h2", style:"margin-bottom:6px", text:"Wie zahlst du?" }));
      inhalt.appendChild(el("p",{ class:"t-klein", style:"margin-bottom:20px;line-height:1.5",
        text:"Diese Konten legt Lohnwerk für dich an. Damit siehst du später, wie viel Geld wo liegen muss." }));
      const raster = el("div",{ class:"vorschlag-raster" });
      KONTO_VORSCHLAEGE.forEach(k => {
        raster.appendChild(el("button",{ class:"vorschlag", type:"button",
          "aria-pressed": auswahlKonten.has(k.name) ? "true":"false",
          onclick:(ev) => {
            if(auswahlKonten.has(k.name)) auswahlKonten.delete(k.name); else auswahlKonten.add(k.name);
            ev.currentTarget.setAttribute("aria-pressed", auswahlKonten.has(k.name) ? "true":"false");
          }}, k.name));
      });
      inhalt.appendChild(raster);
      inhalt.appendChild(el("p",{ class:"t-klein", style:"margin-top:22px;line-height:1.5",
        text:"Außerdem werden ein paar nützliche Tags angelegt: Bar, Girokonto, Tagesgeld, Fixkosten, Kündbar und weitere. Alles lässt sich in den Einstellungen ändern." }));
    }
  }

  function fertigstellen(){
    const p = P();
    // Konten
    KONTO_VORSCHLAEGE.filter(k => auswahlKonten.has(k.name)).forEach(k => {
      if(!p.konten.some(x => x.name === k.name))
        p.konten.push({ id:idNeu("ko"), name:k.name, typ:k.typ, startsaldoCent:0 });
    });
    // Tags
    TAG_VORSCHLAEGE.forEach(t => {
      if(!p.tags.some(x => x.name === t.name))
        p.tags.push({ id:idNeu("tg"), name:t.name, farbe:t.farbe });
    });
    // Kategorien
    auswahlKategorien.forEach(k => { if(!p.kategorien.includes(k)) p.kategorien.push(k); });
    // Einnahmen
    const giro = p.konten.find(k => k.typ === "giro");
    einkommen.forEach(e => {
      const name = (e.name || "").trim();
      const c = betragParsen(e.betrag);
      if(!name || c === null || c <= 0) return;
      p.einnahmen.push({ id:idNeu("ei"), name:name.slice(0,80), betragCent:c, intervall:"monatlich",
        kontoId: giro ? giro.id : null, eingangTag:1, art:"netto", aktiv:true, notiz:"" });
    });
    // Ausgaben-Gerüst mit Betrag 0, damit der Nutzer nur noch Zahlen eintragen muss
    auswahlKategorien.forEach(k => {
      if(p.ausgaben.some(a => a.name === k)) return;
      p.ausgaben.push({
        id:idNeu("au"), name:k, betragCent:0, intervall:"monatlich", kategorie:k,
        zahlungsweg: k.toLowerCase().includes("lebensmittel") || k.toLowerCase().includes("friseur") ? "bar" : "giro",
        kontoId:null, faelligTag:1, startMonat:1, tags:[],
        prioritaet: ["Miete/Wohnen","Strom","Heizung","Nebenkosten","Internet & Telefon","Mobilfunk","Rundfunkbeitrag","Krankenversicherung","Haftpflichtversicherung","Hausratversicherung","KFZ-Versicherung","Berufsunfähigkeit","Kredit/Rate","ÖPNV-Ticket","Kinderbetreuung"].includes(k) ? "fix"
                  : ["Abos & Streaming","Fitness","Urlaub","Geschenke"].includes(k) ? "luxus" : "variabel",
        aktiv:true, notiz:""
      });
    });

    S.einrichtungFertig = true;
    dialogSchliessen();
    aendern();
    navigieren(auswahlKategorien.size > 0 ? "ausgaben" : "uebersicht");
    if(auswahlKategorien.size > 0){
      toast(`${auswahlKategorien.size} ${plural(auswahlKategorien.size,"Position angelegt","Positionen angelegt")}. Trag jetzt die Beträge ein.`, null, 8000);
    }
  }

  zeichneSchritt();
  dialogOeffnen({ titel:"Einrichtung", koerper, fuss });
}

      A("Fitnessstudio", 3990, "monatlich", "Fitness", "lastschrift", 1, "luxus", ["Kündbar","Luxus","Privat"]),
      A("Kleidung", 8000, "monatlich", "Kleidung", "kreditkarte", 1, "variabel", ["Variabel"]),
      A("Friseur", 3500, "zweimonatlich", "Friseur", "bar", 12, "variabel", ["Bar","Variabel"], 1, konten.bar.id),
      A("Haustier Futter & Tierarzt", 6500, "monatlich", "Haustier", "giro", 1, "variabel", ["Variabel"]),
      A("Urlaub", 180000, "jaehrlich", "Urlaub", "giro", 1, "luxus", ["Jährlich fällig","Luxus"], 7),
      A("Geschenke", 25000, "jaehrlich", "Geschenke", "bar", 1, "variabel", ["Bar","Jährlich fällig"], 12, konten.bar.id),
      A("Taschengeld Kind", 3000, "monatlich", "Kinderbetreuung", "bar", 1, "fix", ["Bar","Fixkosten"], 1, konten.bar.id),
      A("Waschmaschine (Ersatz)", 65000, "einmalig", "Puffer", "giro", 15, "variabel", [], 10)
    ];

    p.kategorien = Array.from(new Set(p.ausgaben.map(a => a.kategorie)));
    p.name = "Beispiel";
    S.profile.push(p);
    S.aktivesProfil = p.id;
    S.einrichtungFertig = true;
    alleDialogeSchliessen();
    aendern();
    navigieren("uebersicht");
    toast("Beispieldaten geladen. Du findest sie als eigenes Profil unter Einstellungen.", null, 8000);
  };

  const schonDa = S.profile.find(p => p.name === "Beispiel");
  if(schonDa){
    bestaetigen({
      titel:"Beispieldaten neu laden",
      text:"Es gibt bereits ein Profil „Beispiel“. Es wird durch einen frischen Muster-Haushalt ersetzt. Deine anderen Profile bleiben unverändert.",
      knopfText:"Neu laden",
      dann:() => {
        S.profile = S.profile.filter(p => p.name !== "Beispiel");
        starten();
      }
    });
  } else {
    starten();
  }
}

function beispieldatenLoeschenKnopf(){
  const beispiel = S.profile.find(p => p.name === "Beispiel");
  if(!beispiel) return null;
  return el("button",{ class:"knopf klein gefahr", type:"button", text:"Beispieldaten löschen",
    onclick:() => {
      bestaetigen({
        titel:"Beispieldaten löschen",
        text:"Das Profil „Beispiel“ wird entfernt. Deine eigenen Profile bleiben unverändert.",
        knopfText:"Löschen", gefahr:true,
        dann:() => {
          S.profile = S.profile.filter(p => p.name !== "Beispiel");
          if(S.profile.length === 0) S.profile.push(profilNeu());
          if(!S.profile.some(p => p.id === S.aktivesProfil)) S.aktivesProfil = S.profile[0].id;
          aendern();
          toast("Beispieldaten gelöscht.");
        }
      });
    }});
}


/* ================================================================
   10. ZEICHNEN, HINWEISE, EREIGNISSE, START
   ================================================================ */

/** Zeichnet die gerade sichtbare Ansicht neu. */
function zeichnen(){
  kopfUnterzeileAktualisieren();
  bannerZeichnen();
  fabAktualisieren();
  switch(aktiveAnsicht){
    case "uebersicht":    zeichneUebersicht(); break;
    case "einnahmen":     zeichneEinnahmen(); break;
    case "ausgaben":      zeichneAusgaben(); break;
    case "auswertung":    zeichneAuswertung(); break;
    case "einstellungen": zeichneEinstellungen(); break;
  }
  zeichneAktionsleiste();
  UI.erstesZeichnen = false;
}

function kopfUnterzeileAktualisieren(){
  const box = $("#kopf-unterzeile");
  const p = P();
  const mehrereProfile = S.profile.length > 1;
  box.textContent = mehrereProfile ? p.name : "";
  box.style.display = mehrereProfile ? "" : "none";
}

/** Der schwebende Plus-Knopf, wo er sinnvoll ist. */
function fabAktualisieren(){
  const fab = $("#fab");
  const zeigen = (aktiveAnsicht === "einnahmen" || aktiveAnsicht === "ausgaben") && !UI.auswahlModus;
  fab.hidden = !zeigen;
  fab.setAttribute("aria-label", aktiveAnsicht === "einnahmen" ? "Neue Einnahme anlegen" : "Neue Position anlegen");
}

/** Hinweise oben: defekte Daten, fällige Sicherung. */
function bannerZeichnen(){
  const bereich = $("#banner-bereich");
  bereich.replaceChildren();

  if(ladeFehler){
    bereich.appendChild(el("div",{ class:"banner warn" },
      icon("ic-warn"),
      el("div",{ class:"inhalt-b" },
        el("strong",{ text:"Die gespeicherten Daten waren beschädigt." }),
        el("div",{ style:"margin-top:2px",
          text:"Lohnwerk startet mit einem leeren Stand. Die alte, unlesbare Fassung wurde beiseitegelegt, falls sie sich noch retten lässt." }),
        el("div",{ class:"knopf-reihe" },
          el("button",{ class:"knopf klein rahmen", type:"button", text:"Verstanden",
            onclick:() => { ladeFehler = false; bannerZeichnen(); } })
        )
      )
    ));
  }

  // Erinnerung an die Sicherung, wenn sie älter als 30 Tage ist.
  const tage = tageSeit(S.einstellungen.letzteSicherung);
  const hatDaten = P().einnahmen.length + P().ausgaben.length > 0;
  const weggeklickt = S.einstellungen.sicherungsHinweisAus
    && tageSeit(S.einstellungen.sicherungsHinweisAus) !== null
    && tageSeit(S.einstellungen.sicherungsHinweisAus) < 7;

  if(hatDaten && !weggeklickt && (tage === null || tage > 30)){
    bereich.appendChild(el("div",{ class:"banner" },
      icon("ic-info"),
      el("div",{ class:"inhalt-b" },
        el("div",{ text: tage === null
          ? "Du hast noch keine Sicherung angelegt. Ohne Sicherung sind deine Daten weg, wenn du die Browserdaten löschst."
          : `Letzte Sicherung vor ${tage} ${plural(tage,"Tag","Tagen")}. Jetzt sichern?` }),
        el("div",{ class:"knopf-reihe" },
          el("button",{ class:"knopf klein primaer", type:"button", text:"Jetzt sichern",
            onclick:() => jsonExportieren() }),
          el("button",{ class:"knopf klein", type:"button", text:"Später",
            onclick:() => {
              S.einstellungen.sicherungsHinweisAus = new Date().toISOString();
              aendern();
            } })
        )
      )
    ));
  }
}

/** Hell / Dunkel anwenden. */
function themeAnwenden(){
  const t = S.einstellungen.theme;
  if(t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  // Die Farbe der Statusleiste auf dem Handy mitziehen.
  const dunkel = t === "dunkel" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  $$('meta[name="theme-color"]').forEach(m => m.remove());
  document.head.appendChild(el("meta",{ name:"theme-color", content: dunkel ? "#0f0f11" : "#f7f7f8" }));
}

function zeitraumKnoepfeAktualisieren(){
  const jahr = S.einstellungen.ansicht === "jahr";
  $("#btn-monat").setAttribute("aria-pressed", jahr ? "false":"true");
  $("#btn-jahr").setAttribute("aria-pressed", jahr ? "true":"false");
}

/* ---------- Ereignisse ---------- */

function ereignisseAnbinden(){
  /* Navigation */
  $$("[data-nav]").forEach(b => b.addEventListener("click", () => navigieren(b.dataset.nav)));

  /* Monat / Jahr */
  $("#btn-monat").addEventListener("click", () => {
    S.einstellungen.ansicht = "monat"; zeitraumKnoepfeAktualisieren(); aendern();
  });
  $("#btn-jahr").addEventListener("click", () => {
    S.einstellungen.ansicht = "jahr"; zeitraumKnoepfeAktualisieren(); aendern();
  });

  /* Schwebender Knopf */
  $("#fab").addEventListener("click", () => {
    if(aktiveAnsicht === "einnahmen") einnahmeDialog(null);
    else ausgabeDialog(null);
  });

  /* Dialoge schließen */
  $("#sheet-schliessen").addEventListener("click", () => dialogSchliessen(1));
  $("#sheet2-schliessen").addEventListener("click", () => dialogSchliessen(2));
  $("#overlay").addEventListener("click", (e) => { if(e.target.id === "overlay") dialogSchliessen(1); });
  $("#overlay2").addEventListener("click", (e) => { if(e.target.id === "overlay2") dialogSchliessen(2); });

  /* Tastatur */
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && dialogStapel.length > 0){ e.preventDefault(); dialogSchliessen(); }
  });

  /* Fokus im Dialog halten */
  document.addEventListener("keydown", (e) => {
    if(e.key !== "Tab" || dialogStapel.length === 0) return;
    const oben = dialogStapel[dialogStapel.length-1];
    const sheet = oben.ebene === 2 ? $("#sheet2") : $("#sheet");
    const fokussierbar = $$('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', sheet)
      .filter(x => x.offsetParent !== null);
    if(fokussierbar.length === 0) return;
    const erster = fokussierbar[0], letzter = fokussierbar[fokussierbar.length-1];
    if(e.shiftKey && document.activeElement === erster){ e.preventDefault(); letzter.focus(); }
    else if(!e.shiftKey && document.activeElement === letzter){ e.preventDefault(); erster.focus(); }
  });

  /* Schatten unter der Kopfzeile beim Scrollen */
  const kopf = $("#kopf");
  const scrollPruefen = () => {
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    kopf.classList.toggle("geschoben", y > 4);
  };
  window.addEventListener("scroll", scrollPruefen, { passive:true });
  scrollPruefen();

  /* Datei-Auswahl */
  $("#datei-input").addEventListener("change", (e) => {
    const datei = e.target.files && e.target.files[0];
    if(datei) dateiEinlesen(datei);
    e.target.value = "";
  });

  /* Ziehen & Ablegen einer Sicherungsdatei */
  const ablage = $("#ablage");
  let ziehZaehler = 0;
  window.addEventListener("dragenter", (e) => {
    if(!e.dataTransfer || !Array.from(e.dataTransfer.types||[]).includes("Files")) return;
    e.preventDefault();
    ziehZaehler++;
    ablage.classList.add("offen");
  });
  window.addEventListener("dragover", (e) => {
    if(!e.dataTransfer || !Array.from(e.dataTransfer.types||[]).includes("Files")) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
  });
  window.addEventListener("dragleave", (e) => {
    ziehZaehler = Math.max(0, ziehZaehler - 1);
    if(ziehZaehler === 0) ablage.classList.remove("offen");
  });
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    ziehZaehler = 0;
    ablage.classList.remove("offen");
    const datei = e.dataTransfer?.files?.[0];
    if(datei) dateiEinlesen(datei);
  });

  /* Systemfarbe ändert sich */
  if(window.matchMedia){
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const reagieren = () => { if(S.einstellungen.theme === "auto") themeAnwenden(); };
    if(mq.addEventListener) mq.addEventListener("change", reagieren);
    else if(mq.addListener) mq.addListener(reagieren);
  }

  /* Vor dem Schließen noch schnell sichern */
  window.addEventListener("beforeunload", () => speichernSofort());
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "hidden") speichernSofort();
  });
}

/* ---------- Start ---------- */

function start(){
  laden();
  themeAnwenden();
  zeitraumKnoepfeAktualisieren();
  ereignisseAnbinden();
  navigieren("uebersicht");

  // Beim allerersten Start durch die Einrichtung führen.
  const leer = S.profile.length === 0
    || (P().einnahmen.length === 0 && P().ausgaben.length === 0);
  if(leer && !S.einrichtungFertig){
    setTimeout(() => einrichtungOeffnen(), 500);
  }

  // Den Service Worker registrieren, damit die App offline läuft.
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        // Kein Drama — die App funktioniert auch ohne Offline-Fähigkeit.
      });
    });
  }
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", start);
} else {
  start();
}
</script>
