    if(eigene.length > 0) bloecke.push(blattBlock(w.name, w.icon, eigene, false));
  });
  const sparPosten = posten.filter(istSparen);
  if(sparPosten.length > 0) bloecke.push(blattBlock("Sparen", "ic-sparen", sparPosten, true));

  if(bloecke.length > 0){
    const raster = el("div",{ class:"blatt" + (bloecke.length > 1 ? " zweispaltig" : ""), style:"margin-bottom:12px" });
    bloecke.forEach(b => raster.appendChild(b.block));
    wurzel.appendChild(raster);
  }

  /* --- Die Ergebniszeilen: was wohin --- */
  const ergebnis = el("div",{ class:"blatt-ergebnis", style:"margin-bottom:12px" });
  const ezZeile = (iconId, name, neben, jahr, farbe) => el("div",{ class:"ez" },
    el("span",{ class:"sym-feld", style: farbe ? `background:${farbe==="var(--gruen)"?"var(--gruen-weich)":"var(--rot-weich)"};color:${farbe}` : null },
      icon(iconId)),
    el("span",{ class:"ez-name" },
      el("span",{ class:"haupt", text:name }),
      el("span",{ class:"neben", text:neben })
    ),
    el("span",{ class:"ez-monat", style: farbe ? `color:${farbe}` : null, text:euro(jahr/12) }),
    el("span",{ class:"ez-jahr", text:euro(jahr)+" /Jahr" })
  );

  /* Bargeld-Wege ergeben das, was abgehoben werden muss. */
  let abhebenJahr = 0, kontoJahr = 0;
  posten.filter(a => !istSparen(a)).forEach(a => {
    if(wegFuer(a).kontotyp === "bargeld") abhebenJahr += jahresCent(a);
    else kontoJahr += jahresCent(a);
  });

  if(kontoJahr > 0) ergebnis.appendChild(ezZeile("ic-bank", "Auf dem Konto lassen",
    "für Lastschriften, Daueraufträge und Karte", kontoJahr));
  if(abhebenJahr > 0) ergebnis.appendChild(ezZeile("ic-bar", "Abheben",
    "alles, was du in bar bezahlst", abhebenJahr));
  if(k.sparplanJahr > 0) ergebnis.appendChild(ezZeile("ic-sparen", "Zur Seite legen",
    "dein fester Sparplan", k.sparplanJahr, "var(--gruen)"));
  ergebnis.appendChild(ezZeile(k.freiJahr >= 0 ? "ic-sonne" : "ic-warn",
    k.freiJahr >= 0 ? "Bleibt übrig" : "Fehlt",
    k.freiJahr >= 0 ? "frei verfügbar — was liegen bleibt, ist auch gespart" : "hier geht die Rechnung nicht auf",
    k.freiJahr, k.freiJahr >= 0 ? "var(--gruen)" : "var(--rot)"));
  wurzel.appendChild(ergebnis);

  /* Probe: Die Rechnung muss sichtbar aufgehen. */
  wurzel.appendChild(el("div",{ class:"karte flach" },
    el("div",{ class:"t-kapitaelchen", style:"margin-bottom:10px", text:"Die Rechnung" }),
    el("div",{ style:"font-size:14.5px;line-height:1.9;font-variant-numeric:tabular-nums" },
      el("div",{ style:"display:flex;justify-content:space-between;gap:12px" },
        el("span",{ text:"Einkommen" }), el("span",{ text:euro(k.einnahmenJahr/12) })),
      el("div",{ style:"display:flex;justify-content:space-between;gap:12px;color:var(--text-2)" },
        el("span",{ text:"− auf dem Konto lassen" }), el("span",{ text:euro(kontoJahr/12) })),
      el("div",{ style:"display:flex;justify-content:space-between;gap:12px;color:var(--text-2)" },
        el("span",{ text:"− abheben" }), el("span",{ text:euro(abhebenJahr/12) })),
      el("div",{ style:"display:flex;justify-content:space-between;gap:12px;color:var(--text-2)" },
        el("span",{ text:"− zur Seite legen" }), el("span",{ text:euro(k.sparplanJahr/12) })),
      el("div",{ style:"display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--linie);margin-top:6px;padding-top:6px;font-weight:650" },
        el("span",{ text:"= bleibt übrig" }),
        el("span",{ class: k.freiJahr >= 0 ? "gruen" : "rot", text:euro(k.freiJahr/12) }))
    ),
    el("p",{ class:"t-klein", style:"margin-top:12px;line-height:1.5",
      text:"Alle Beträge im Monat. Tippe eine Zeile oben an, um sie zu ändern." })
  ));

  /* --- Rücklage für Jahresrechnungen --- */
  if(k.ruecklageJahr > 0){
    const nichtMonatlich = aktiveAusgaben()
      .filter(a => ["zweimonatlich","vierteljaehrlich","halbjaehrlich","jaehrlich","einmalig"].includes(a.intervall))
      .sort((a,b) => jahresCent(b) - jahresCent(a));
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" }, el("h2",{ text:"Rücklage für Jahresrechnungen" })),
      el("div",{ style:"font-size:26px;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums",
        text:euro(k.ruecklageJahr/12) }),
      el("p",{ class:"t-klein", style:"margin-top:6px;line-height:1.5",
        html:`So viel steckt in den Zahlen oben für Rechnungen, die nicht jeden Monat kommen — ${nichtMonatlich.length} ${plural(nichtMonatlich.length,"Stück","Stück")}. Leg den Betrag beiseite, dann überrascht dich keine davon.` }),
      klapp("Welche Rechnungen das sind", () => {
        const box = el("div",{});
        nichtMonatlich.forEach(a => box.appendChild(el("div",{ class:"datenzeile" },
          el("span",{ class:"dz-name" },
            el("span",{ text:a.name }),
            el("span",{ class:"neben", text:`${INTERVALLE[a.intervall].name}, ${a.intervall==="einmalig"?"im":"ab"} ${MONATE_KURZ[(a.startMonat||1)-1]}` })
          ),
          el("span",{ class:"dz-wert" },
            el("span",{ text:euro(a.betragCent) }),
            el("span",{ class:"neben", text:euro(jahresCent(a)/12)+" /Monat" })
          )
        )));
        return box;
      })
    ));
  }

  /* --- Kopierbare Fassung --- */
  const zeilenText = [];
  zeilenText.push(`Einkommen: ${euro(k.einnahmenJahr/12)} im Monat`);
  if(kontoJahr > 0)  zeilenText.push(`${euro(kontoJahr/12)} auf dem Konto lassen`);
  if(abhebenJahr > 0) zeilenText.push(`${euro(abhebenJahr/12)} abheben`);
  if(k.sparplanJahr > 0) zeilenText.push(`${euro(k.sparplanJahr/12)} zur Seite legen`);
  zeilenText.push(`${euro(k.freiJahr/12)} bleibt übrig`);
  const text = zeilenText.join("\n");
  wurzel.appendChild(el("div",{ class:"karte" },
    el("div",{ class:"karte-kopf" },
      el("h2",{ text:"Zum Mitnehmen" }),
      el("button",{ class:"knopf leise klein", type:"button", text:"Kopieren",
        onclick:(ev) => kopieren(text, ev.currentTarget) })
    ),
    el("div",{ class:"plan-block", text })
  ));

  /* --- Kalender --- */
  wurzel.appendChild(el("div",{ class:"karte" },
    el("div",{ class:"karte-kopf" }, el("h2",{ text:"Fälligkeiten" })),
    kalenderZeichnen()
  ));
}

/* ----------------------------------------------------------------
   REITER 2 — AUSGABEN
   ---------------------------------------------------------------- */
function reiterAusgaben(wurzel){
  const k = kennzahlen();
  const p = P();

  /* Kennzahlen oben */
  wurzel.appendChild(el("div",{ class:"raster raster-2 halb", style:"margin-bottom:12px" },
    kachel("Ausgaben", euroZ(k.ausgabenJahr), `${k.anzahlAusgaben} ${plural(k.anzahlAusgaben,"Position","Positionen")}`),
    kachel("Fixkostenquote", prozent(k.fixJahr, k.ausgabenJahr),
      "je niedriger, desto flexibler")
  ));

  /* Nach Tag — Donut */
  const nachTag = summenNachHauptTag();
  if(nachTag.length > 0){
    const gesamt = nachTag.reduce((s,x)=>s+x.jahr,0);
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" },
        el("h2",{ text:"Wohin es geht" }),
        el("span",{ class:"t-label", text:zeitraumWort() })
      ),
      donutZeichnen(nachTag.slice(0,8).map((x,i) => ({
        name:x.name, wert:x.jahr, farbe:x.farbe || palettenFarbe(i)
      })), nachTag.length > 8 ? { name:"Übrige", wert:nachTag.slice(8).reduce((s,x)=>s+x.jahr,0), farbe:"var(--text-3)" } : null),
      el("p",{ class:"t-klein", style:"margin-top:16px;line-height:1.5",
        text:"Jede Position zählt hier bei ihrem ersten Tag. So ergibt die Summe genau deine Ausgaben." })
    ));
  }

  /* Rangliste aller Tags */
  const tagDaten = summenNachTag(true);
  const mitWert = tagDaten.liste.filter(t => t.jahr > 0 && t.tag.id !== SPAR_TAG_ID);
  if(mitWert.length > 0){
    const groesster = Math.max(...mitWert.map(t => t.jahr));
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" },
        el("h2",{ text:"Alle Tags im Vergleich" }),
        el("span",{ class:"t-label", text:zeitraumWort() })
      ),
      balkenRangliste(mitWert.map(t => ({ name:t.tag.name, wert:t.jahr, farbe:tagFarbe(t.tag) })), null),
      el("div",{ style:"border-top:1px solid var(--linie);margin-top:14px;padding-top:12px" },
        mitWert.map(t => el("div",{ class:"datenzeile", style:"border:0;padding:6px 0" },
          el("span",{ class:"dz-name" },
            el("span",{ style:"display:inline-flex;align-items:center;gap:7px" },
              el("span",{ style:`width:8px;height:8px;border-radius:2px;background:${tagFarbe(t.tag)};display:inline-block` }),
              el("span",{ text:t.tag.name })
            )
          ),
          el("span",{ class:"dz-wert" },
            el("span",{ text:euroZ(t.jahr) }),
            el("span",{ class:"neben", text:`${t.anzahl} ${plural(t.anzahl,"Position","Positionen")}` })
          )
        ))
      ),
      el("p",{ class:"t-klein", style:"margin-top:12px;line-height:1.5",
        text:"Eine Position kann mehrere Tags haben. Deshalb ergeben diese Zahlen zusammen mehr als deine Gesamtausgaben — jede Zeile ist für sich zu lesen." }),
      tagDaten.ohneAnzahl > 0 ? el("p",{ class:"t-klein", style:"margin-top:6px",
        text:`${tagDaten.ohneAnzahl} ${plural(tagDaten.ohneAnzahl,"Position hat","Positionen haben")} noch keinen Tag (${euroZ(tagDaten.ohneJahr)}).` }) : null
    ));
  }

  /* Nach Zahlungsweg */
  const wege = summenNachZahlungsweg().filter(w => w.jahr > 0);
  if(wege.length > 0){
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" },
        el("h2",{ text:"Nach Zahlungsweg" }),
        el("span",{ class:"t-label", text:zeitraumWort() })
      ),
      el("table",{ class:"mini-tabelle" },
        el("thead",{}, el("tr",{},
          el("th",{ text:"Weg" }), el("th",{ text:"Posten" }), el("th",{ text:zeitraumWort() })
        )),
        el("tbody",{}, wege.map(w => el("tr",{},
          el("td",{},
            el("div",{ style:"display:flex;align-items:center;gap:9px" },
              (() => { const s = icon(w.weg.icon); s.style.width="17px"; s.style.height="17px"; s.style.color="var(--text-2)"; s.style.flex="none"; return s; })(),
              el("span",{ text:w.weg.name })
            )
          ),
          el("td",{ text:String(w.anzahl) }),
          el("td",{ text:euroZ(w.jahr) })
        )))
      )
    ));
  }

  /* Größte Einzelposten */
  const groesste = aktiveAusgaben().slice().sort((a,b) => jahresCent(b)-jahresCent(a)).slice(0,12);
  if(groesste.length > 0){
    wurzel.appendChild(el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" },
        el("h2",{ text:"Größte Einzelposten" }),
        el("span",{ class:"t-label", text:"im Jahr" })
      ),
      el("div",{},
        groesste.map(a => {
          const std = arbeitsstunden(jahresCent(a));
          return el("div",{ class:"datenzeile" },
            el("span",{ class:"dz-name" },
              el("span",{ text:a.name }),
              el("span",{ class:"neben", text: `${INTERVALLE[a.intervall].name} · ${prozent(jahresCent(a), k.ausgabenJahr)} deiner Ausgaben`
                + (std && std >= 1 ? ` · ${Math.round(std)} Arbeitsstunden` : "") })
            ),
            el("span",{ class:"dz-wert" },
              el("span",{ text:euro(jahresCent(a)) }),
              el("span",{ class:"neben", text:euro(jahresCent(a)/12)+" /Monat" })
            )
          );
        })
      )
    ));
  }

  /* Jahresverlauf */
  wurzel.appendChild(el("div",{ class:"karte" },
    el("div",{ class:"karte-kopf" },
      el("h2",{ text:"Jahresverlauf" }),
      el("span",{ class:"t-label", text:"je Monat" })
    ),
    jahresverlaufZeichnen()
  ));

  /* Fälligkeitskalender — an welchem Tag geht was ab. */
  wurzel.appendChild(el("div",{ class:"karte" },
    el("div",{ class:"karte-kopf" }, el("h2",{ text:"Fälligkeiten" })),
    kalenderZeichnen()
  ));
}

/* ----------------------------------------------------------------
   REITER 3 — SPAREN
   Der neue Schwerpunkt: alles mit Tag "Sparen", je eigene Rendite.
   ---------------------------------------------------------------- */
function reiterSparen(wurzel){
  const u = sparUebersicht();
  const k = kennzahlen();

  if(u.posten.length === 0 && u.freiJahr <= 0){
    wurzel.appendChild(leerZustand(
      "ic-sparen",
      "Noch keine Sparposten",
      "Markiere eine Position mit dem Tag „Sparen“, dann rechnet Lohnwerk hier aus, was daraus wird — mit deiner erwarteten Rendite und der Inflation.",
      "Sparposten anlegen",
      () => { UI.neuAlsSparen = true; ausgabeDialog(null); }
    ));
    return;
  }

  /* Die drei wichtigsten Zahlen */
  wurzel.appendChild(el("div",{ class:"raster raster-2", style:"margin-bottom:12px" },
    kachel("Sparplan", euroZ(u.sparplanJahr), `${u.posten.length} ${plural(u.posten.length,"Posten","Posten")}`, "var(--gruen)"),
    kachel("Frei verfügbar", euroZ(u.freiJahr), "wird auch gespart",
      u.freiJahr < 0 ? "var(--rot)" : null),
    kachel("Sparquote", u.sparquote === null ? "—" : nfProzent.format(u.sparquote).replace(",0","")+" %",
      "vom Einkommen", u.sparquote === null ? null : (u.sparquote >= 0 ? "var(--gruen)" : "var(--rot)")),
    kachel("Bereits da", euro(u.bestandGesamt), "von dir eingetragen")
  ));

  /* Hinweis zur Rechenweise */
  wurzel.appendChild(el("div",{ class:"banner" },
    icon("ic-info"),
    el("div",{ class:"inhalt-b",
      html:`Du sparst insgesamt <strong>${euroZ(u.gesamtSparenJahr)}</strong> ${zeitraumWort()} — dein fester Sparplan plus alles, was am Monatsende übrig bleibt. `
        + `Bestände erhöht Lohnwerk nie von allein: Was auf deinen Konten liegt, trägst nur du ein, wenn sich etwas ändert.` })
  ));

  /* --- Die große Hochrechnung --- */
  const jahre = UI.sparJahre || S.einstellungen.hochrechnungJahre || 10;
  const reihe = sparVerlaufGesamt(jahre, true);
  const ende = reihe[reihe.length-1];
  const inf = S.einstellungen.inflation || 0;

  const hochKarte = el("div",{ class:"karte" },
    el("div",{ class:"karte-kopf" },
      el("h2",{ text:"Was daraus wird" }),
      el("div",{ class:"segment" },
        [5,10,20,30].map(j => el("button",{ type:"button", "aria-pressed": jahre === j ? "true":"false",
          text:j+" J", onclick:() => { UI.sparJahre = j; zeichneAuswertung(); } }))
      )
    )
  );

  hochKarte.appendChild(el("div",{ style:"margin-bottom:6px" },
    el("div",{ class:"t-kapitaelchen", text:`In ${jahre} ${plural(jahre,"Jahr","Jahren")} hast du` }),
    el("div",{ style:"font-size:38px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--gruen);margin-top:2px",
      text:euro(ende.wert) })
  ));

  if(inf > 0){
    hochKarte.appendChild(el("p",{ class:"t-klein", style:"line-height:1.55;margin-bottom:16px",
      html:`Das entspricht der Kaufkraft von heute <strong style="color:var(--text)">${euro(ende.kaufkraft)}</strong>. `
        + `Bei ${nfProzent.format(inf).replace(",0","")} % Inflation im Jahr verliert Geld an Wert — die Zahl oben sieht größer aus, als sie sich anfühlen wird.` }));
  }

  hochKarte.appendChild(sparVerlaufZeichnen(reihe, inf > 0));

  /* Aufschlüsselung */
  hochKarte.appendChild(el("div",{ style:"margin-top:18px" },
    el("div",{ class:"datenzeile", style:"border-top:0" },
      el("span",{ class:"dz-name" },
        el("span",{ style:"display:inline-flex;align-items:center;gap:8px" },
          el("span",{ style:"width:8px;height:8px;border-radius:2px;background:var(--p1);display:inline-block" }),
          el("span",{ text:"Selbst eingezahlt" })),
        el("span",{ class:"neben", text:"Bestand plus alle Raten" })),
      el("span",{ class:"dz-wert", text:euro(ende.eingezahlt) })
    ),
    el("div",{ class:"datenzeile" },
      el("span",{ class:"dz-name" },
        el("span",{ style:"display:inline-flex;align-items:center;gap:8px" },
          el("span",{ style:"width:8px;height:8px;border-radius:2px;background:var(--gruen);display:inline-block" }),
          el("span",{ text:"Gewinn" })),
        el("span",{ class:"neben", text:`Mischrendite ${nfProzent.format(u.mischRendite).replace(",0","")} % — gewichtet nach Sparbetrag` })),
      el("span",{ class:"dz-wert gruen", text:euro(ende.gewinn) })
    ),
    inf > 0 ? el("div",{ class:"datenzeile" },
      el("span",{ class:"dz-name" },
        el("span",{ style:"display:inline-flex;align-items:center;gap:8px" },
          el("span",{ style:"width:8px;height:8px;border-radius:2px;background:var(--rot);display:inline-block" }),
          el("span",{ text:"Kaufkraftverlust" })),
        el("span",{ class:"neben", text:`durch ${nfProzent.format(inf).replace(",0","")} % Inflation` })),
      el("span",{ class:"dz-wert rot", text:"− "+euro(ende.wert - ende.kaufkraft) })
    ) : null
  ));

  hochKarte.appendChild(el("p",{ class:"t-klein", style:"margin-top:14px;line-height:1.5",
    text:"Eine Prognose, kein Kontostand. Sie nimmt an, dass du weiter so sparst und die Rendite hält. "
       + (S.einstellungen.sparSteigerung > 0
          ? `Deine Sparrate steigt dabei jedes Jahr um ${nfProzent.format(S.einstellungen.sparSteigerung).replace(",0","")} %.`
          : "Die Annahmen änderst du in den Einstellungen.") }));
  wurzel.appendChild(hochKarte);

  /* --- Die einzelnen Sparposten --- */
  if(u.posten.length > 0){
    const karte = el("div",{ class:"karte" },
      el("div",{ class:"karte-kopf" },
        el("h2",{ text:"Deine Sparposten" }),
        el("button",{ class:"knopf leise klein", type:"button",
          onclick:() => { UI.neuAlsSparen = true; ausgabeDialog(null); } }, icon("ic-plus"), "Neu")
      )
    );

    /* Anteile der Posten als Balken */
    if(u.sparplanJahr > 0){
      karte.appendChild(balkenRangliste(u.posten.filter(x=>x.jahr>0).map((x,i) => ({
        name:x.pos.name, wert:x.jahr, farbe:palettenFarbe(i+1)
      })), u.sparplanJahr));
      karte.appendChild(el("div",{ style:"height:8px" }));
    }

    u.posten.forEach(x => {
      const verlauf = sparVerlauf(x.bestand, x.jahr, x.rendite, jahre,
                                  S.einstellungen.inflation||0, S.einstellungen.sparSteigerung||0);
      const endwert = verlauf[verlauf.length-1];
      const monate = monateBisZiel(x.bestand, x.monat, x.ziel, x.rendite);
      const anteilZiel = x.ziel > 0 ? klemmen(x.bestand / x.ziel * 100, 0, 100) : null;

      const block = el("div",{ style:"border-top:1px solid var(--linie);padding:16px 0" });
      block.appendChild(el("button",{ type:"button",
        style:"display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;text-align:left;min-height:32px",
        onclick:() => ausgabeDialog(x.pos) },
        el("span",{ style:"min-width:0" },
          el("span",{ style:"display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap", text:x.pos.name }),
          el("span",{ style:"display:block;font-size:12.5px;color:var(--text-2);margin-top:2px",
            text: `${euro(x.monat)} /Monat`
              + (x.rendite > 0 ? ` · ${nfProzent.format(x.rendite).replace(",0","")} % Rendite` : " · ohne Gewinnannahme") })
        ),
        el("span",{ style:"text-align:right;flex:none" },
          el("span",{ style:"display:block;font-size:16px;font-weight:640;font-variant-numeric:tabular-nums", text:euro(x.bestand) }),
          el("span",{ style:"display:block;font-size:11.5px;color:var(--text-3)", text:"aktuell" })
        )
      ));

      if(anteilZiel !== null){
        block.appendChild(el("div",{ class:"fortschritt", style:"margin:12px 0 6px" },
          el("div",{ style:`width:${anteilZiel}%` })));
        block.appendChild(el("div",{ style:"display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums" },
          el("span",{ text:`${Math.round(anteilZiel)} % vom Ziel` }),
          el("span",{ text: monate === 0 ? "Ziel erreicht"
                          : monate === null ? `Ziel ${euro(x.ziel)}`
                          : `noch ${monate} ${plural(monate,"Monat","Monate")}` })
        ));
      }

      block.appendChild(el("div",{ class:"t-klein", style:"margin-top:10px;line-height:1.5",
        html:`In ${jahre} ${plural(jahre,"Jahr","Jahren")}: <strong style="color:var(--text)">${euro(endwert.wert)}</strong>`
          + (endwert.gewinn > 0 ? ` · davon ${euro(endwert.gewinn)} Gewinn` : "")
          + ((S.einstellungen.inflation||0) > 0 ? ` · Kaufkraft ${euro(endwert.kaufkraft)}` : "") }));

      karte.appendChild(block);
    });
    wurzel.appendChild(karte);
  }

  /* --- Notgroschen --- */
  const bedarf3 = notgroschenBedarf(3);
  const bedarf6 = notgroschenBedarf(6);
  if(bedarf3 > 0){
    const ziel = S.einstellungen.notgroschenZiel || bedarf3;
    /* Als Stand zählt, was auf Sparposten mit dem Wort "Notgroschen" liegt —
       sonst der gesamte Bestand. */
    const notPosten = u.posten.filter(x => /notgroschen|reserve|puffer/i.test(x.pos.name));
    const stand = notPosten.length > 0
      ? notPosten.reduce((s,x)=>s+x.bestand,0)
      : u.bestandGesamt;
    const anteil = ziel > 0 ? klemmen(stand/ziel*100, 0, 100) : 0;
    wurzel.appendChild(el("div",{ class:"karte" },

/** Sparziel-Rechner: Wie lange dauert es bis X? Oder: wie viel pro Monat? */
function sparzielRechner(){
  const u = sparUebersicht();
  const karte = el("div",{ class:"karte" });
  karte.appendChild(el("div",{ class:"karte-kopf" },
    el("h2",{ text:"Sparziel-Rechner" })
  ));
  karte.appendChild(el("p",{ class:"t-klein", style:"margin-top:-8px;margin-bottom:18px;line-height:1.55",
    text:"Trag einen Wunschbetrag ein — der Rechner sagt dir, wie lange du dafür brauchst und wann du es "
       + "erreicht hast. Die Vorgaben kommen aus deinen echten Zahlen, ändern lassen sie sich aber frei. "
       + "An deinen gespeicherten Daten ändert der Rechner nichts." }));

  let zielCent = 1000000;      // 10.000 €
  let start = u.bestandGesamt;
  let rate = Math.round(u.gesamtSparenJahr / 12);
  let rendite = u.mischRendite || 0;

  const zielFeld = betragsFeld(zielCent, "Wunschbetrag");
  zielFeld.feld.removeAttribute("data-autofokus");
  const startFeld = betragsFeld(start, "Schon vorhanden");
  startFeld.feld.removeAttribute("data-autofokus");
  const rateFeld = betragsFeld(rate, "Pro Monat");
  rateFeld.feld.removeAttribute("data-autofokus");
  const renditeFeld = el("input",{ class:"eingabe", type:"number", min:"0", max:"30", step:"0.1",
    inputmode:"decimal", value: rendite ? nfProzent.format(rendite).replace(",0","") : "", placeholder:"0" });

  const ergebnis = el("div",{ style:"padding:16px;border-radius:12px;background:var(--karte-2);margin-top:6px" });

  const rechnen = () => {
    const z = zielFeld.wert() ?? 0;
    const s = startFeld.wert() ?? 0;
    const r = rateFeld.wert() ?? 0;
    const zi = parseFloat(String(renditeFeld.value).replace(",",".")) || 0;
    const monate = monateBisZiel(s, r, z, zi);
    const inf = S.einstellungen.inflation || 0;

    const kinder = [];
    if(z <= 0){
      kinder.push(el("div",{ class:"t-klein", text:"Trag einen Wunschbetrag ein." }));
    } else if(monate === 0){
      kinder.push(el("div",{ class:"t-kapitaelchen", text:"Ergebnis" }));
      kinder.push(el("div",{ class:"gruen", style:"font-size:22px;font-weight:640;margin-top:4px", text:"Schon erreicht" }));
    } else if(monate === null){
      kinder.push(el("div",{ class:"t-kapitaelchen", text:"Ergebnis" }));
      kinder.push(el("div",{ style:"font-size:16px;margin-top:6px;line-height:1.5",
        text:"Mit dieser Rate wird das Ziel nicht erreicht. Erhöhe den Monatsbetrag." }));
      if(z > s){
        const noetig = Math.round((z - s) / (10*12));
        kinder.push(el("div",{ class:"t-klein", style:"margin-top:8px",
          text:`Für zehn Jahre bräuchtest du etwa ${euro(noetig)} im Monat.` }));
      }
    } else {
      const jahre = Math.floor(monate/12), restM = monate % 12;
      const datum = new Date();
      datum.setMonth(datum.getMonth() + monate);
      kinder.push(el("div",{ class:"t-kapitaelchen", text:"Ziel erreicht in" }));
      kinder.push(el("div",{ style:"font-size:26px;font-weight:650;letter-spacing:-.02em;margin-top:2px;color:var(--gruen)",
        text: jahre > 0 ? `${jahre} ${plural(jahre,"Jahr","Jahren")}${restM ? ` und ${restM} ${plural(restM,"Monat","Monaten")}` : ""}`
                        : `${monate} ${plural(monate,"Monat","Monaten")}` }));
      kinder.push(el("div",{ class:"t-klein", style:"margin-top:6px",
        text:`Also etwa im ${MONATE_LANG[datum.getMonth()]} ${datum.getFullYear()}.` }));
      if(inf > 0){
        const realerWert = z / Math.pow(1 + inf/100, monate/12);
        kinder.push(el("div",{ class:"t-klein", style:"margin-top:8px;line-height:1.5",
          html:`${euro(z)} haben dann noch die Kaufkraft von heute <strong style="color:var(--text)">${euro(realerWert)}</strong>.` }));
      }
    }
    ergebnis.replaceChildren(...kinder);
  };

  [zielFeld.feld, startFeld.feld, rateFeld.feld].forEach(f => f.addEventListener("input", rechnen));
  renditeFeld.addEventListener("input", rechnen);

  karte.appendChild(zielFeld.box);
  karte.appendChild(el("div",{ class:"feld-reihe" },
    el("div",{}, startFeld.box),
    el("div",{}, rateFeld.box)
  ));
  karte.appendChild(el("div",{ class:"feld" },
    el("div",{ class:"feld-label", text:"Rendite in Prozent pro Jahr" }), renditeFeld));
  karte.appendChild(ergebnis);
  rechnen();
  return karte;
}

/**
 * Das Spar-Verlaufsdiagramm: eine Fläche für das Eingezahlte, darüber
 * den Gewinn, dazu die Kaufkraft-Linie.
 */
function sparVerlaufZeichnen(reihe, mitKaufkraft){
  const B = 420, H = 210, padL = 4, padR = 4, padO = 12, padU = 26;
  const nutzH = H - padO - padU;
  const nutzB = B - padL - padR;
  const max = Math.max(...reihe.map(r => r.wert), 1);
  const n = reihe.length - 1;
  const x = (i) => padL + (n === 0 ? 0 : i / n * nutzB);
  const y = (w) => padO + nutzH - (w / max * nutzH);

  const svg = svgEl("svg",{ viewBox:`0 0 ${B} ${H}`, class:"diagramm",
    style:"width:100%;height:auto", role:"img",
    "aria-label":`Entwicklung deines Ersparten über ${n} Jahre: von ${euro(reihe[0].wert)} auf ${euro(reihe[n].wert)}.` });

  /* Waagerechte Hilfslinien */
  for(let i = 1; i <= 3; i++){
    const wert = max / 3 * i;
    const yy = y(wert);
    svg.appendChild(svgEl("line",{ x1:padL, y1:yy, x2:B-padR, y2:yy,
      stroke:"var(--linie)", "stroke-width":1 }));
    const t = svgEl("text",{ x:padL+2, y:yy-4, "font-size":"8.5", fill:"var(--text-3)",
      "font-variant-numeric":"tabular-nums" });
    t.textContent = euroKurz(wert);
    svg.appendChild(t);
  }

  const flaeche = (werte, farbe, deckkraft, verzoegerung) => {
    let d = `M ${x(0)} ${y(0)}`;
    werte.forEach((w,i) => { d += ` L ${x(i)} ${y(w)}`; });
    d += ` L ${x(n)} ${y(0)} Z`;
    const pfad = svgEl("path",{ d, fill:farbe, opacity:deckkraft });
    pfad.style.animation = `einblenden-weich 800ms ${verzoegerung}ms cubic-bezier(.4,0,.2,1) both`;
    return pfad;
  };

  /* Gesamtwert (Eingezahltes + Gewinn) und darunter das Eingezahlte */
  svg.appendChild(flaeche(reihe.map(r => r.wert), "var(--gruen)", .30, 120));
  svg.appendChild(flaeche(reihe.map(r => r.eingezahlt), "var(--p1)", .55, 0));

  const linie = (werte, farbe, breite, gestrichelt, verzoegerung) => {
    let d = "";
    werte.forEach((w,i) => { d += (i === 0 ? "M" : " L") + ` ${x(i)} ${y(w)}`; });
    const pfad = svgEl("path",{ d, fill:"none", stroke:farbe, "stroke-width":breite,
      "stroke-linecap":"round", "stroke-linejoin":"round",
      "stroke-dasharray": gestrichelt ? "4 4" : null });
    pfad.style.animation = `einblenden-weich 800ms ${verzoegerung}ms cubic-bezier(.4,0,.2,1) both`;
    return pfad;
  };
  svg.appendChild(linie(reihe.map(r => r.wert), "var(--gruen)", 2.2, false, 200));
  if(mitKaufkraft){
    svg.appendChild(linie(reihe.map(r => r.kaufkraft), "var(--rot)", 1.8, true, 320));
  }

  /* Jahresbeschriftung */
  const schritt = n <= 10 ? 1 : n <= 20 ? 2 : 5;
  for(let i = 0; i <= n; i += schritt){
    const t = svgEl("text",{ x:x(i), y:H-9, "text-anchor": i===0 ? "start" : (i===n ? "end" : "middle"),
      "font-size":"9", fill:"var(--text-3)" });
    t.textContent = i === 0 ? "heute" : "+"+i;
    svg.appendChild(t);
  }

  const box = el("div",{});
  box.appendChild(svg);
  box.appendChild(el("div",{ class:"legende" },
    el("span",{ class:"legende-eintrag" }, el("span",{ class:"punkt", style:"background:var(--p1)" }), "Eingezahlt"),
    el("span",{ class:"legende-eintrag" }, el("span",{ class:"punkt", style:"background:var(--gruen)" }), "mit Gewinn"),
    mitKaufkraft ? el("span",{ class:"legende-eintrag" },
      el("span",{ style:"width:14px;height:0;border-top:2px dashed var(--rot);display:inline-block" }), "Kaufkraft heute") : null
  ));
  return box;
}

  if(UI.rechnerOffen){

      ),

    ));

/* ----------------------------------------------------------------
   VERMÖGENSRECHNER
   Bewusst nicht "Zinsrechner": gerechnet wird mit Rendite, also
   dem Gewinn aus Anlagen wie Gold, Aktien oder Beteiligungen.
   ---------------------------------------------------------------- */
function vermoegensRechner(){
  const karte = el("div",{ class:"karte" });
  karte.appendChild(el("div",{ class:"karte-kopf" },
    el("h2",{ text:"Vermögensrechner" })
  ));
  karte.appendChild(el("p",{ class:"t-klein", style:"margin-top:-8px;margin-bottom:20px;line-height:1.55",
    text:"Rechne aus, wie sich Kapital entwickelt, wenn es Gewinn abwirft — etwa aus Gold, Aktien oder einer Beteiligung. "
       + "Der Rechner arbeitet mit Rendite, also dem Ertrag deiner Anlage, und ändert nichts an deinen gespeicherten Daten." }));

  /* Zustand des Rechners */
  const R = {
    start: 500000,          // 5.000 €
    rate: 20000,            // 200 €
    rhythmus: "monat",      // monat | jahr
    rendite: 5,
    jahre: 15,
    steigerung: 0
  };

  const startFeld = betragsFeld(R.start, "Startkapital");
  startFeld.feld.removeAttribute("data-autofokus");
  const rateFeld = betragsFeld(R.rate, "Einzahlung");
  rateFeld.feld.removeAttribute("data-autofokus");

  const renditeFeld = el("input",{ class:"eingabe", type:"number", min:"0", max:"40", step:"0.1",
    inputmode:"decimal", value:R.rendite, placeholder:"z. B. 5" });
  const jahreFeld = el("input",{ class:"eingabe", type:"number", min:"1", max:"60", step:"1",
    inputmode:"numeric", value:R.jahre });
  const steigerungFeld = el("input",{ class:"eingabe", type:"number", min:"0", max:"20", step:"0.5",
    inputmode:"decimal", value:R.steigerung, placeholder:"0" });

  /* Umschalter monatlich / jährlich */
  const rhythmusWahl = el("div",{ class:"segment breit", role:"group", "aria-label":"Rhythmus der Einzahlung" },
    el("button",{ type:"button", "aria-pressed":"true", text:"monatlich", onclick:(e) => {
      R.rhythmus = "monat";
      e.target.parentElement.children[0].setAttribute("aria-pressed","true");
      e.target.parentElement.children[1].setAttribute("aria-pressed","false");
      rechnen();
    }}),
    el("button",{ type:"button", "aria-pressed":"false", text:"jährlich", onclick:(e) => {
      R.rhythmus = "jahr";
      e.target.parentElement.children[0].setAttribute("aria-pressed","false");
      e.target.parentElement.children[1].setAttribute("aria-pressed","true");
      rechnen();
    }})
  );

  karte.appendChild(startFeld.box);
  karte.appendChild(el("div",{ class:"feld" },
    el("div",{ class:"feld-label", text:"Rhythmus der Einzahlung" }), rhythmusWahl));
  karte.appendChild(rateFeld.box);
  karte.appendChild(el("div",{ class:"feld-reihe" },
    el("div",{},
      el("div",{ class:"feld-label", text:"Rendite pro Jahr in %" }), renditeFeld),
    el("div",{},
      el("div",{ class:"feld-label", text:"Laufzeit in Jahren" }), jahreFeld)
  ));
  karte.appendChild(el("div",{ class:"feld" },
    el("div",{ class:"feld-label", text:"Einzahlung steigt jährlich um … %" }), steigerungFeld,
    el("div",{ class:"feld-hinweis", text:"Falls du planst, künftig mehr einzuzahlen. 0 lässt den Betrag gleich." })));

  const ergebnis = el("div",{});
  karte.appendChild(ergebnis);

  function rechnen(){
    R.start = startFeld.wert() ?? 0;
    R.rate = rateFeld.wert() ?? 0;
    R.rendite = klemmen(parseFloat(String(renditeFeld.value).replace(",",".")) || 0, 0, 40);
    R.jahre = klemmen(parseInt(jahreFeld.value,10) || 1, 1, 60);
    R.steigerung = klemmen(parseFloat(String(steigerungFeld.value).replace(",",".")) || 0, 0, 20);

    const proJahr = R.rhythmus === "monat" ? R.rate * 12 : R.rate;
    const inf = S.einstellungen.inflation || 0;
    const reihe = sparVerlauf(R.start, proJahr, R.rendite, R.jahre, inf, R.steigerung);
    const ende = reihe[reihe.length - 1];

    ergebnis.replaceChildren(
      el("div",{ style:"padding:18px;border-radius:14px;background:var(--karte-2);margin-top:6px" },
        el("div",{ class:"t-kapitaelchen", text:`Nach ${R.jahre} ${plural(R.jahre,"Jahr","Jahren")}` }),
        el("div",{ style:"font-size:34px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--gruen);margin-top:2px",
          text:euro(ende.wert) }),
        el("div",{ class:"datenzeile", style:"border-top:1px solid var(--linie);margin-top:14px" },
          el("span",{ class:"dz-name" },
            el("span",{ style:"display:inline-flex;align-items:center;gap:8px" },
              el("span",{ style:"width:8px;height:8px;border-radius:2px;background:var(--p1);display:inline-block" }),
              el("span",{ text:"Selbst eingezahlt" })),
            el("span",{ class:"neben", text:`Start plus ${R.rhythmus === "monat" ? "monatliche" : "jährliche"} Einzahlungen` })),
          el("span",{ class:"dz-wert", text:euro(ende.eingezahlt) })
        ),
        el("div",{ class:"datenzeile" },
          el("span",{ class:"dz-name" },
            el("span",{ style:"display:inline-flex;align-items:center;gap:8px" },
              el("span",{ style:"width:8px;height:8px;border-radius:2px;background:var(--gruen);display:inline-block" }),
              el("span",{ text:"Gewinn" })),
            el("span",{ class:"neben", text:`bei ${nfProzent.format(R.rendite).replace(",0","")} % Rendite im Jahr` })),
          el("span",{ class:"dz-wert gruen", text:euro(ende.gewinn) })
        ),
        inf > 0 ? el("div",{ class:"datenzeile" },
          el("span",{ class:"dz-name" },
            el("span",{ style:"display:inline-flex;align-items:center;gap:8px" },
              el("span",{ style:"width:8px;height:8px;border-radius:2px;background:var(--rot);display:inline-block" }),
              el("span",{ text:"Kaufkraft heute" })),
            el("span",{ class:"neben", text:`nach ${nfProzent.format(inf).replace(",0","")} % Geldentwertung im Jahr` })),
          el("span",{ class:"dz-wert", text:euro(ende.kaufkraft) })
        ) : null
      ),
      sparVerlaufZeichnen(reihe, inf > 0),
      el("p",{ class:"t-klein", style:"margin-top:14px;line-height:1.55",
        text:"Eine Rechnung mit gleichbleibender Rendite. Echte Anlagen schwanken — in manchen Jahren steht ein Minus. "
           + "Sieh das Ergebnis als Größenordnung, nicht als Versprechen." })
    );
  }

  [startFeld.feld, rateFeld.feld].forEach(f => f.addEventListener("input", rechnen));
  [renditeFeld, jahreFeld, steigerungFeld].forEach(f => f.addEventListener("input", rechnen));
  rechnen();
  return karte;
}

/* ----------------------------------------------------------------
   ZAKAT-RECHNER

   Rechnet die Zakat auf Geldvermögen nach hanafitischer und
   schafiitischer Lehre. Der Rechner nimmt bewusst keine Kurse aus
   dem Netz — die Preise für Gold und Silber trägst du selbst ein,
   damit die App offline und ohne jede Datenübertragung bleibt.
   ---------------------------------------------------------------- */

/* ----------------------------------------------------------------
   ISLAMISCHER KALENDER

   Der Browser bringt den Hidschri-Kalender selbst mit — es wird also
   nichts nachgeladen. Gerechnet wird nach Umm al-Qura, dem Kalender,
   dem auch Saudi-Arabien folgt.

   Wichtig: Das ist eine Berechnung, keine Mondsichtung. Vor Ort kann
   der tatsächliche Monatsbeginn ein bis zwei Tage abweichen.
   ---------------------------------------------------------------- */

const HIJRI_MONATE = [
  "Muharram", "Safar", "Rabi' al-awwal", "Rabi' al-thani",
  "Dschumada al-awwal", "Dschumada al-thani", "Radschab", "Schaban",
  "Ramadan", "Schawwal", "Dhul-Qada", "Dhul-Hidscha"
];
const RAMADAN_MONAT = 9;

/* Welcher Kalender steht zur Verfügung? Umm al-Qura bevorzugt. */
const HIJRI_KALENDER = (() => {
  for(const k of ["islamic-umalqura","islamic","islamic-civil"]){
    try{
      const probe = new Intl.DateTimeFormat("en-US-u-ca-"+k, { year:"numeric" }).formatToParts(new Date());
      if(probe.some(t => t.type === "year")) return k;
    }catch(fehler){ /* nächsten versuchen */ }
  }
  return null;
})();

/** Das Hidschri-Datum zu einem gewöhnlichen Datum. */
function hijriVonDatum(datum){
  if(!HIJRI_KALENDER) return null;
  try{
    const teile = new Intl.DateTimeFormat("en-US-u-ca-"+HIJRI_KALENDER,
      { day:"numeric", month:"numeric", year:"numeric" }).formatToParts(datum);
    const o = {};
    teile.forEach(t => { if(t.type !== "literal") o[t.type] = t.value; });
    const jahr = parseInt(o.year,10), monat = parseInt(o.month,10), tag = parseInt(o.day,10);
    if(!Number.isFinite(jahr) || !Number.isFinite(monat) || !Number.isFinite(tag)) return null;
    return { jahr, monat, tag };
  }catch(fehler){ return null; }
}

/** Vergleicht zwei Hidschri-Daten: negativ, 0 oder positiv. */
function hijriVergleich(a, b){
  return (a.jahr - b.jahr) || (a.monat - b.monat) || (a.tag - b.tag);
}

/**
 * Das gewöhnliche Datum zu einem Hidschri-Datum.
 * Erst grob geschätzt, dann tageweise angenähert — der Browser kann
 * nur in eine Richtung rechnen, deshalb dieser Umweg.
 */
function datumVonHijri(hJahr, hMonat, hTag){
  if(!HIJRI_KALENDER) return null;
  const ziel = { jahr:hJahr, monat:hMonat, tag:hTag };
  /* Ein Mondjahr hat rund 354,367 Tage, ein Mondmonat rund 29,531. */
  const tage = (hJahr - 1) * 354.367 + (hMonat - 1) * 29.531 + (hTag - 1);
  let d = new Date(Date.UTC(622, 6, 16, 12) + Math.round(tage) * 86400000);

  /* Grobe Annäherung in großen Schritten. */
  for(let i = 0; i < 30; i++){
    const ist = hijriVonDatum(d);
    if(!ist) return null;
    const abstand = (ziel.jahr - ist.jahr) * 354.367
                  + (ziel.monat - ist.monat) * 29.531
                  + (ziel.tag - ist.tag);
    if(Math.abs(abstand) < 1) break;
    d = new Date(d.getTime() + Math.round(abstand) * 86400000);
  }
  /* Feinschliff Tag für Tag. */
  for(let i = 0; i < 60; i++){
    const ist = hijriVonDatum(d);
    if(!ist) return null;
    const v = hijriVergleich(ist, ziel);
    if(v === 0) return d;
    d = new Date(d.getTime() + (v < 0 ? 1 : -1) * 86400000);
  }
  return null;
}

/** Die zwölf Monatsanfänge eines Hidschri-Jahres als gewöhnliche Daten. */
function hijriJahresuebersicht(hJahr){
  const monate = [];
  for(let m = 1; m <= 12; m++){
    const beginn = datumVonHijri(hJahr, m, 1);
    const naechster = m < 12 ? datumVonHijri(hJahr, m+1, 1) : datumVonHijri(hJahr+1, 1, 1);
    monate.push({
      nummer: m,
      name: HIJRI_MONATE[m-1],
      beginn,
      ende: naechster ? new Date(naechster.getTime() - 86400000) : null,
      tage: (beginn && naechster) ? Math.round((naechster - beginn) / 86400000) : null
    });
  }
  return monate;
}

/** Der nächste Ramadan-Beginn ab heute. */
function naechsterRamadan(){
  const jetzt = heute();
  const h = hijriVonDatum(jetzt);
  if(!h) return null;
  let jahr = h.jahr;
  let beginn = datumVonHijri(jahr, RAMADAN_MONAT, 1);
  /* Ist der Ramadan dieses Jahres schon vorbei, nimm den nächsten. */
  if(beginn && beginn < jetzt && !(h.monat === RAMADAN_MONAT)){
    if(h.monat > RAMADAN_MONAT){
      jahr++;
      beginn = datumVonHijri(jahr, RAMADAN_MONAT, 1);
    }
  }
  if(!beginn) return null;
  const ende = datumVonHijri(jahr, RAMADAN_MONAT + 1, 1);
  return {
    jahr, beginn,
    ende: ende ? new Date(ende.getTime() - 86400000) : null,
    laeuft: h.monat === RAMADAN_MONAT,
    tageHin: Math.max(0, Math.round((beginn - jetzt) / 86400000))
  };
}

/** Ein Hidschri-Datum in Klartext. */
function hijriLesbar(h){
  if(!h) return "—";
  return `${h.tag}. ${HIJRI_MONATE[h.monat-1]} ${h.jahr}`;
}

/* ----------------------------------------------------------------
   ZAKAT-VERMÖGEN
   Die Posten liegen in den Einstellungen und werden hier bewertet.
   ---------------------------------------------------------------- */

/** Die Liste der Vermögensposten — immer ein Array. */
function zakatPosten(){
  const z = S.einstellungen.zakat;
  if(!z.posten || !Array.isArray(z.posten)) z.posten = [];
  return z.posten;
}

/** Der Eurowert eines Postens in Cent. Braucht die Tagespreise. */
function zakatPostenWert(posten){
  const e = S.einstellungen;
  switch(posten.art){
    case "geld":
    case "schuld":  return Math.round(posten.wert);
    case "gold":    return Math.round(posten.wert * (e.goldPreisCent || 0));
    case "silber":  return Math.round(posten.wert * (e.silberPreisCent || 0));
    case "btc":     return Math.round(posten.wert * (e.btcPreisCent || 0));
    default:        return 0;
  }
}

/** Fehlt für einen Posten der nötige Tagespreis? */
function zakatPreisFehlt(posten){
  const e = S.einstellungen;
  if(posten.wert <= 0) return false;
  if(posten.art === "gold")   return !(e.goldPreisCent > 0);
  if(posten.art === "silber") return !(e.silberPreisCent > 0);
  if(posten.art === "btc")    return !(e.btcPreisCent > 0);
  return false;
}

/**
 * Wertet alle Posten aus und liefert die Summen.
 * Schulden werden nur nach hanafitischer Lehre abgezogen.
 */
function zakatVermoegen(){
  const posten = zakatPosten();
  const schule = S.einstellungen.zakat.schule || "hanafi";
  let besitz = 0, schulden = 0, goldGramm = 0, silberGramm = 0;
  const fehlendePreise = new Set();

  posten.forEach(p => {
    if(zakatPreisFehlt(p)) fehlendePreise.add(p.art);
    const wert = zakatPostenWert(p);
    if(p.art === "schuld") schulden += wert;
    else besitz += wert;
    if(p.art === "gold") goldGramm += p.wert;
    if(p.art === "silber") silberGramm += p.wert;
  });

  const netto = schule === "hanafi" ? Math.max(0, besitz - schulden) : besitz;
  return { besitz, schulden, netto, goldGramm, silberGramm,
           fehlendePreise: Array.from(fehlendePreise) };
}

/* Die klassischen Maße: 20 Golddinar und 200 Silberdirham. */
const NISAB_GOLD_GRAMM = 85;
const NISAB_SILBER_GRAMM = 595;
const ZAKAT_SATZ = 0.025;          // 2,5 % = ein Vierzigstel
const FEINUNZE_GRAMM = 31.1034768; // eine Troy-Unze in Gramm

/* ----------------------------------------------------------------
   TAGESPREISE HOLEN

   Das ist die EINZIGE Stelle in Lohnwerk, die etwas aus dem Internet
   lädt — und sie läuft ausschließlich auf Knopfdruck. Übertragen wird
   dabei nichts von dir: Es geht nur die Frage "was kostet gerade eine
   Unze Gold" hinaus, keine deiner Zahlen. Alles andere in der App
   funktioniert weiterhin vollständig offline.

   Die Kurse kommen in US-Dollar je Feinunze und werden hier auf
   Euro je Gramm umgerechnet.
   ---------------------------------------------------------------- */

/** Holt eine Adresse mit Zeitlimit. Wirft bei Fehler. */
async function holen(url, ms = 8000){
  const abbruch = new AbortController();
  const uhr = setTimeout(() => abbruch.abort(), ms);
  try{
    const antwort = await fetch(url, { signal:abbruch.signal, cache:"no-store" });
    if(!antwort.ok) throw new Error("Antwort " + antwort.status);
    return await antwort.json();
  } finally {
    clearTimeout(uhr);
  }
}

/** Der Dollar-Euro-Kurs, aus mehreren Quellen mit Rückfall. */
async function eurKursHolen(){
  const quellen = [
    async () => (await holen("https://open.er-api.com/v6/latest/USD"))?.rates?.EUR,
    async () => (await holen("https://api.exchangerate-api.com/v4/latest/USD"))?.rates?.EUR,
    async () => (await holen("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json"))?.usd?.eur
  ];
  for(const quelle of quellen){
    try{
      const kurs = await quelle();
      if(Number.isFinite(kurs) && kurs > 0.3 && kurs < 3) return kurs;
    }catch(fehler){ /* nächste Quelle versuchen */ }
  }
  throw new Error("Kein Wechselkurs erreichbar");
}

/**
 * Liefert { goldCent, silberCent } — Euro-Cent je Gramm.
 * Wirft eine Fehlermeldung in Klartext, wenn etwas nicht klappt.
 */
async function edelmetallpreiseHolen(){
  if(!navigator.onLine) throw new Error("Du bist gerade offline.");

  let gold, silber, kurs;
  try{
    [gold, silber] = await Promise.all([
      holen("https://api.gold-api.com/price/XAU"),
      holen("https://api.gold-api.com/price/XAG")
    ]);
  }catch(fehler){
    throw new Error("Der Preisdienst ist gerade nicht erreichbar.");
  }
  const goldUsdUnze = Number(gold?.price);
  const silberUsdUnze = Number(silber?.price);
  if(!Number.isFinite(goldUsdUnze) || !Number.isFinite(silberUsdUnze) || goldUsdUnze <= 0 || silberUsdUnze <= 0){
    throw new Error("Der Preisdienst hat unerwartete Werte geliefert.");
  }

  try{
    kurs = await eurKursHolen();
  }catch(fehler){
    throw new Error("Der Wechselkurs ist gerade nicht erreichbar.");
  }

  /* Bitcoin gibt es direkt in Euro — ein Fehlschlag hier soll die
     Edelmetallpreise nicht mitreißen. */
  let btcCent = 0;
  try{
    btcCent = await btcKursHolen(kurs);
  }catch(fehler){ /* ohne Bitcoin weitermachen */ }

  return {
    goldCent:   Math.round(goldUsdUnze   * kurs / FEINUNZE_GRAMM * 100),
    silberCent: Math.round(silberUsdUnze * kurs / FEINUNZE_GRAMM * 100),
    btcCent,
    stand: new Date().toISOString()
  };
}

/** Der Bitcoin-Kurs in Euro-Cent, aus mehreren Quellen mit Rückfall. */
async function btcKursHolen(usdEurKurs){
  const quellen = [
    /* Coinbase liefert direkt Euro. */
    async () => Number((await holen("https://api.coinbase.com/v2/prices/BTC-EUR/spot"))?.data?.amount),
    async () => Number((await holen("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur"))?.bitcoin?.eur),
    /* Notfalls über den Dollarkurs. */
    async () => {
      const p = Number((await holen("https://api.gold-api.com/price/BTC"))?.price);
      return Number.isFinite(p) && usdEurKurs ? p * usdEurKurs : NaN;
    }
  ];
  for(const quelle of quellen){
    try{
      const kurs = await quelle();
      if(Number.isFinite(kurs) && kurs > 0) return Math.round(kurs * 100);
    }catch(fehler){ /* nächste Quelle */ }
  }
  throw new Error("Kein Bitcoin-Kurs erreichbar");
}

      el("div",{ style:"display:flex;justify-content:space-between;gap:12px;align-items:baseline" },
        el("span",{ class:"t-label", text:"Besitz" }),
        el("span",{ style:"font-variant-numeric:tabular-nums;font-weight:600", text:euro(v.besitz) })
      ),
      v.schulden > 0 ? el("div",{ style:"display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:6px" },
        el("span",{ class:"t-label", text: Z.schule === "hanafi" ? "Schulden abgezogen" : "Schulden (nicht abgezogen)" }),
        el("span",{ style:`font-variant-numeric:tabular-nums;font-weight:600;color:${Z.schule==="hanafi"?"var(--rot)":"var(--text-3)"}`,
          text:(Z.schule==="hanafi"?"− ":"")+euro(v.schulden) })
      ) : null,
      el("div",{ style:"display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--linie)" },
        el("span",{ class:"t-label", style:"font-weight:650", text:"Zakatpflichtig" }),
        el("span",{ style:"font-size:17px;font-weight:650;font-variant-numeric:tabular-nums", text:euro(v.netto) })
      )
    ));
  }

  const ergebnis = el("div",{});
  karte.appendChild(ergebnis);

  function rechnen(){
    Z.goldPreis = goldFeld.wert() ?? 0;
    Z.silberPreis = silberFeld.wert() ?? 0;

    /* Selbst eingetippte Preise merken, damit sie beim nächsten Öffnen
       wieder da sind. Ein von Hand geänderter Wert gilt nicht mehr als
       abgerufen — sonst stimmt die Herkunftsangabe nicht. */
    Z.btcPreis = btcFeld.wert() ?? 0;
    if(Z.goldPreis !== (S.einstellungen.goldPreisCent||0)
       || Z.silberPreis !== (S.einstellungen.silberPreisCent||0)
       || Z.btcPreis !== (S.einstellungen.btcPreisCent||0)){
      S.einstellungen.goldPreisCent = Z.goldPreis;
      S.einstellungen.silberPreisCent = Z.silberPreis;
      S.einstellungen.btcPreisCent = Z.btcPreis;
      if(Z.goldPreis > 0 || Z.silberPreis > 0 || Z.btcPreis > 0){
        S.einstellungen.preiseStand = new Date().toISOString();
        S.einstellungen.preiseAusNetz = false;
      }
      speichern();
      standAktualisieren();
    }
    /* Alle Posten bewerten. */
    const v = zakatVermoegen();
    const netto = v.netto;

    /* Die Schwelle in Euro — abhängig von der gewählten Grundlage. */
    const nisab = Z.grundlage === "silber"
      ? Math.round(NISAB_SILBER_GRAMM * Z.silberPreis)
      : Math.round(NISAB_GOLD_GRAMM * Z.goldPreis);
    const preisFehlt = Z.grundlage === "silber" ? Z.silberPreis <= 0 : Z.goldPreis <= 0;
    const pflichtig = !preisFehlt && netto >= nisab && nisab > 0;
    const betrag = pflichtig ? Math.round(netto * ZAKAT_SATZ) : 0;
    /* Was man monatlich zurücklegen müsste, um den Betrag im Jahr beisammen
       zu haben. Bewusst durch 12 geteilt — gerechnet wird in Kalendermonaten,
       auch wenn der Zakat-Stichtag dem Mondjahr folgt. */
    const proMonat = Math.round(betrag / 12);

    merken();
    const kinder = [];

    if(preisFehlt){
      kinder.push(el("div",{ class:"banner warn", style:"margin-top:6px" },
        icon("ic-warn"),
        el("div",{ class:"inhalt-b",
          text: Z.grundlage === "silber"
            ? "Trag den Silberpreis je Gramm ein — ohne ihn lässt sich die Schwelle nicht bestimmen."
            : "Trag den Goldpreis je Gramm ein — ohne ihn lässt sich die Schwelle nicht bestimmen." })
      ));
    } else {
      kinder.push(el("div",{ style:`padding:18px;border-radius:14px;margin-top:6px;background:${pflichtig ? "var(--karte-2)" : "var(--karte-2)"}` },
        el("div",{ class:"t-kapitaelchen", text: pflichtig ? "Zu entrichten" : "Ergebnis" }),
        el("div",{ style:`font-size:34px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:2px;color:${pflichtig ? "var(--gruen)" : "var(--text-2)"}`,
          text: pflichtig ? euro(betrag) : "keine Zakat fällig" }),
        el("p",{ class:"t-klein", style:"margin-top:8px;line-height:1.55",
          text: pflichtig
            ? `2,5 % von ${euro(netto)}. Voraussetzung ist, dass dein Vermögen ein islamisches Mondjahr lang über der Schwelle lag.`
            : `Dein Vermögen von ${euro(netto)} liegt unter der Schwelle von ${euro(nisab)}. Dann ist keine Zakat fällig.` })
      ));

      /* Monatsbetrag und Abgleich mit dem, was schon läuft. */
      if(pflichtig && proMonat > 0){
        kinder.push(el("div",{ style:"padding:18px;border-radius:14px;margin-top:12px;background:var(--karte-2);box-shadow:inset 3px 0 0 var(--akzent)" },
          el("div",{ class:"t-kapitaelchen", text:"Monatlich zurücklegen" }),
          el("div",{ style:"font-size:30px;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--akzent)",
            text:euro(proMonat) }),
          el("p",{ class:"t-klein", style:"margin-top:8px;line-height:1.55",
            html:`So hast du die ${euro(betrag)} in zwölf Monaten beisammen und musst sie nicht auf einmal aufbringen.` })
        ));
        kinder.push(zakatAbgleichKarte(betrag, proMonat));
      }

      /* Aufschlüsselung */
      const zeile = (name, neben, wert, farbe) => el("div",{ class:"datenzeile" },
        el("span",{ class:"dz-name" },
          el("span",{ text:name }),
          neben ? el("span",{ class:"neben", text:neben }) : null),
        el("span",{ class:"dz-wert", style: farbe ? `color:${farbe}` : null, text:wert })
      );
      const box = el("div",{ style:"margin-top:16px" });
      /* Nach Art zusammengefasst, damit die Zeilen nicht ausufern. */
      const nachArt = {};
      zakatPosten().forEach(p => {
        if(!nachArt[p.art]) nachArt[p.art] = { wert:0, menge:0, anzahl:0 };
        nachArt[p.art].wert += zakatPostenWert(p);
        nachArt[p.art].menge += p.wert;
        nachArt[p.art].anzahl++;
      });
      if(nachArt.geld) box.appendChild(zeile("Geld und Anlagen",
        `${nachArt.geld.anzahl} ${plural(nachArt.geld.anzahl,"Posten","Posten")}`, euro(nachArt.geld.wert)));
      if(nachArt.gold) box.appendChild(zeile("Gold",
        `${nfZahl.format(nachArt.gold.menge).replace(",00","")} g`, euro(nachArt.gold.wert)));
      if(nachArt.silber) box.appendChild(zeile("Silber",
        `${nfZahl.format(nachArt.silber.menge).replace(",00","")} g`, euro(nachArt.silber.wert)));
      if(nachArt.btc) box.appendChild(zeile("Bitcoin",
        `${nfBtc.format(nachArt.btc.menge)} BTC`, euro(nachArt.btc.wert)));
      if(nachArt.schuld){
        box.appendChild(Z.schule === "hanafi"
          ? zeile("Fällige Schulden", "werden abgezogen", "− "+euro(nachArt.schuld.wert), "var(--rot)")
          : zeile("Fällige Schulden", "nach schafiitischer Lehre nicht abgezogen", euro(nachArt.schuld.wert), "var(--text-2)"));
      }
      box.appendChild(zeile("Zakatpflichtiges Vermögen", null, euro(netto)));
      box.appendChild(zeile("Schwelle (Nisab)",
        Z.grundlage === "silber" ? `${NISAB_SILBER_GRAMM} g Silber` : `${NISAB_GOLD_GRAMM} g Gold`,
        euro(nisab)));
      kinder.push(box);

      /* Bei Schafi'i getrennte Betrachtung sichtbar machen */
      if(Z.schule === "schafii" && nachArt.gold?.wert > 0 && nachArt.silber?.wert > 0){
        const nisabGold = Math.round(NISAB_GOLD_GRAMM * Z.goldPreis);
        const nisabSilber = Math.round(NISAB_SILBER_GRAMM * Z.silberPreis);
        kinder.push(el("div",{ class:"banner", style:"margin-top:16px" },
          icon("ic-info"),
          el("div",{ class:"inhalt-b", style:"line-height:1.55",
            html: `In der schafiitischen Lehre werden Gold und Silber <strong>getrennt</strong> bewertet, jedes mit eigener Schwelle: `
              + `Gold ${euro(nachArt.gold.wert)} gegen ${euro(nisabGold)}, Silber ${euro(nachArt.silber.wert)} gegen ${euro(nisabSilber)}. `
              + `Die Rechnung oben fasst zusammen — prüfe die beiden Posten deshalb auch einzeln.` })
        ));
      }
    }

    /* Fehlende Tagespreise für Posten, die welche brauchen. */
    if(v.fehlendePreise.length > 0){
      kinder.push(el("div",{ class:"banner warn", style:"margin-top:14px" },
        icon("ic-warn"),
        el("div",{ class:"inhalt-b",
          text:`Für ${v.fehlendePreise.map(a => ZAKAT_ARTEN[a].name).join(" und ")} fehlt der Tagespreis. `
             + "Diese Posten werden noch nicht mitgerechnet." })
      ));
    }

    postenZeichnen();
    ergebnis.replaceChildren(...kinder, zakatErklaerung());
  }

  [goldFeld.feld, silberFeld.feld, btcFeld.feld].forEach(f => f.addEventListener("input", rechnen));

  grundlageAktualisieren();
  rechnen();
  return karte;
}

/** Legt die üblichen Posten auf einen Schlag an — leer, zum Ausfüllen. */
function zakatVorlagenAnlegen(dann){
  const liste = zakatPosten();
  ZAKAT_POSTEN_VORLAGEN.forEach(v => {
    if(liste.some(p => p.name.toLowerCase() === v.name.toLowerCase())) return;
    liste.push({ id:idNeu("zp"), name:v.name, art:v.art, wert:0 });
  });
  speichern();
  if(dann) dann();
  toast(`${ZAKAT_POSTEN_VORLAGEN.length} Posten angelegt. Trag jetzt die Werte ein.`);
}

/** Einen Vermögensposten anlegen oder bearbeiten. */
function zakatPostenDialog(vorhanden, dann){
  const neu = !vorhanden;
  const daten = vorhanden
    ? { ...vorhanden }
    : { id:idNeu("zp"), name:"", art:"geld", wert:0 };

  const koerper = el("div",{});
  const nameFeld = el("input",{ class:"eingabe", type:"text", maxlength:"50",
    placeholder:"z. B. Tagesgeld bei der Sparkasse", value:daten.name, "data-autofokus":"" });
  koerper.appendChild(el("div",{ class:"feld" },
    el("div",{ class:"feld-label", text:"Bezeichnung" }), nameFeld));

  /* Art wählen */
  const artBox = el("div",{ class:"chip-reihe" });
  const wertBox = el("div",{});
  const artZeichnen = () => {
    artBox.replaceChildren();
    Object.entries(ZAKAT_ARTEN).forEach(([schluessel, art]) => {
      artBox.appendChild(el("button",{ class:"chip wahl", type:"button",
        "aria-pressed": daten.art === schluessel ? "true":"false",
        onclick:() => { daten.art = schluessel; artZeichnen(); wertZeichnen(); }},
        icon(art.icon, 13), el("span",{ text:art.name })));
    });
  };
  artZeichnen();
  koerper.appendChild(el("div",{ class:"feld" },
    el("div",{ class:"feld-label", text:"Art" }), artBox,
    el("div",{ class:"feld-hinweis", id:"zp-art-hinweis", text:ZAKAT_ARTEN[daten.art].hinweis })));

  /* Wertfeld — je nach Art ein Betrag oder eine Menge */
  let holeWert = () => 0;
  function wertZeichnen(){
    const art = ZAKAT_ARTEN[daten.art];
    const hinweis = $("#zp-art-hinweis", koerper);
    if(hinweis) hinweis.textContent = art.hinweis;
    wertBox.replaceChildren();

    if(art.geld){
      const f = betragsFeld(daten.wert || 0, art.name === "Schuld" ? "Betrag der Schuld" : "Betrag");
      f.feld.removeAttribute("data-autofokus");
      wertBox.appendChild(f.box);
      holeWert = () => Math.max(0, f.wert() ?? 0);
    } else {
      const schritt = daten.art === "btc" ? "0.00000001" : "0.1";
      const inp = el("input",{ class:"eingabe", type:"number", min:"0", step:schritt,
        inputmode:"decimal", placeholder:"0",
        value: daten.wert ? String(daten.wert).replace(".",",") : "" });
      const vorschau = el("div",{ class:"feld-hinweis" });
      const aktualisieren = () => {
        const menge = parseFloat(String(inp.value).replace(",",".")) || 0;
        const preis = daten.art === "gold" ? S.einstellungen.goldPreisCent
                    : daten.art === "silber" ? S.einstellungen.silberPreisCent
                    : S.einstellungen.btcPreisCent;
        vorschau.textContent = !preis
          ? `Trag im Rechner den Tagespreis für ${art.name} ein, dann wird hier der Wert angezeigt.`
          : `Entspricht ${euro(Math.round(menge * preis))} beim aktuell hinterlegten Preis.`;
      };
      inp.addEventListener("input", aktualisieren);
      aktualisieren();
      wertBox.appendChild(el("div",{ class:"feld" },
        el("div",{ class:"feld-label", text:`Menge in ${art.einheit}` }), inp, vorschau));
      holeWert = () => Math.max(0, parseFloat(String(inp.value).replace(",",".")) || 0);
    }
  }
  wertZeichnen();
  koerper.appendChild(wertBox);

  const speichernFn = () => {
    const name = nameFeld.value.trim().slice(0,50) || ZAKAT_ARTEN[daten.art].name;
    daten.name = name;
    daten.wert = holeWert();
    const liste = zakatPosten();
    const i = liste.findIndex(p => p.id === daten.id);
    if(i >= 0) liste[i] = daten; else liste.push(daten);
    speichern();
    dialogSchliessen(2);
    if(dann) dann();
    if(aktiveAnsicht === "einstellungen") zeichnen();
  };
  koerper.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); speichernFn(); } });

  const fuss = el("div",{ style:"display:flex;gap:8px;width:100%" },
    vorhanden ? el("button",{ class:"knopf gefahr", type:"button", "aria-label":"Posten löschen",
      onclick:() => {
        const liste = zakatPosten();
        const i = liste.findIndex(p => p.id === daten.id);
        if(i >= 0) liste.splice(i,1);
        speichern();
        dialogSchliessen(2);
        if(dann) dann();
        if(aktiveAnsicht === "einstellungen") zeichnen();
        toast(`„${daten.name}“ entfernt.`);
      }}, icon("ic-muell")) : null,
    el("button",{ class:"knopf primaer", type:"button", style:"flex:1",
      text: neu ? "Anlegen" : "Speichern", onclick:speichernFn })
  );
  dialogOeffnen({ titel: neu ? "Neuer Vermögensposten" : "Posten bearbeiten", koerper, fuss, ebene:2 });
}

/**
 * Der Abgleich: Was von der Pflicht läuft schon, was bleibt offen?
 * Alles mit dem Tag „Zakat“ zählt als Zahlung und wird abgezogen.
 */
function zakatAbgleichKarte(sollJahr, sollMonat){
  const a = zakatAbgleich(sollJahr);
  const laufende = zakatPositionen();
  const box = el("div",{ style:"padding:18px;border-radius:14px;margin-top:12px;background:var(--karte-2)" });

  box.appendChild(el("div",{ class:"t-kapitaelchen", style:"margin-bottom:4px", text:"Davon läuft schon" }));

  if(laufende.length === 0){
    box.appendChild(el("p",{ class:"t-klein", style:"line-height:1.55;margin-bottom:14px",
      text:"Noch keine deiner Positionen ist als Zakat markiert. Setz bei einer Spende das Tag „Zakat“ — "
         + "dann zieht Lohnwerk sie hier ab und zeigt dir, was übrig bleibt." }));
  } else {
    laufende.forEach(pos => {
      box.appendChild(el("button",{ class:"datenzeile", type:"button",
        style:"width:100%;text-align:left;border-top:1px solid var(--linie)",
        onclick:() => ausgabeDialog(pos) },
        el("span",{ class:"dz-name" },
          el("span",{ text:pos.name }),
          el("span",{ class:"neben", text:`${INTERVALLE[pos.intervall].name} · ${wegFuer(pos).name}` })
        ),
        el("span",{ class:"dz-wert" },
          el("span",{ text:euro(jahresCent(pos)/12) }),
          el("span",{ class:"neben", text:euro(jahresCent(pos))+" /Jahr" })
        )
      ));
    });
    box.appendChild(el("div",{ class:"datenzeile", style:"border-top:1.5px solid var(--linie-stark)" },
      el("span",{ class:"dz-name", text:"Summe" }),
      el("span",{ class:"dz-wert" },
        el("span",{ text:euro(a.verplant/12) }),
        el("span",{ class:"neben", text:euro(a.verplant)+" /Jahr" })
      )
    ));
  }

  /* Der offene Rest */
  const offenMonat = Math.round(a.offen/12);
  const gedeckt = a.offen <= 0;
  box.appendChild(el("div",{ style:`margin-top:16px;padding-top:14px;border-top:1px solid var(--linie)` },
    el("div",{ class:"t-kapitaelchen", text: gedeckt ? "Vollständig gedeckt" : "Noch offen" }),
    el("div",{ style:`font-size:28px;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-top:2px;color:${gedeckt ? "var(--gruen)" : "var(--rot)"}`,
      text: gedeckt ? euro(0) : euro(offenMonat) }),
    el("p",{ class:"t-klein", style:"margin-top:6px;line-height:1.55",
      text: gedeckt
        ? (a.zuViel > 0
            ? `Du gibst sogar ${euro(a.zuViel/12)} im Monat mehr, als die Rechnung verlangt. Das Zuviel gilt als freiwillige Gabe (Sadaqa).`
            : "Deine laufenden Zahlungen decken die Zakat genau ab.")
        : `${euro(sollMonat)} sind fällig, ${euro(a.verplant/12)} laufen schon. Es fehlen ${euro(offenMonat)} im Monat.` })
  ));

  /* Die Restposition anlegen oder anpassen */
  const rest = a.restPosition;
  const knopfText = !rest ? "Restposition anlegen"
                  : gedeckt ? "Restposition pausieren"
                  : "Restbetrag aktualisieren";
  const braucht = !rest ? !gedeckt : !a.restStimmt;

  box.appendChild(el("div",{ class:"knopf-reihe", style:"margin-top:14px" },
    el("button",{ class:"knopf klein " + (braucht ? "primaer" : "rahmen"), type:"button",
      onclick:() => zakatRestEintragen(a.offen) },
      icon(rest && gedeckt ? "ic-pause" : "ic-plus"), knopfText),
    el("button",{ class:"knopf klein rahmen", type:"button",
      onclick:(ev) => kopieren(
        `Zakat ${euro(sollJahr)} im Jahr (${euro(sollMonat)} im Monat)\n`
        + laufende.map(p => `− ${euro(jahresCent(p)/12)} ${p.name}`).join("\n")
        + (laufende.length ? "\n" : "")
        + `= ${euro(offenMonat)} noch offen`, ev.currentTarget) },
      "Kopieren")
  ));

  if(rest){
    box.appendChild(el("p",{ class:"t-klein", style:"margin-top:10px;line-height:1.5",
      text: a.restStimmt
        ? `Deine Position „${rest.name}“ steht auf ${euro(jahresCent(rest)/12)} im Monat und passt zur Rechnung.`
        : `Deine Position „${rest.name}“ steht auf ${euro(jahresCent(rest)/12)} im Monat — die Rechnung ergibt ${euro(offenMonat)}.` }));
  } else if(!gedeckt){
    box.appendChild(el("p",{ class:"t-klein", style:"margin-top:10px;line-height:1.5",
      text:"Der Knopf legt eine monatliche Position über den Fehlbetrag an. Sie bekommt das Zakat-Tag und "
         + "taucht im Monatsblatt auf — so ist die volle Summe verplant." }));
  }

  box.appendChild(stichtagBereich());
  return box;
}

/**
 * Der persönliche Stichtag mit Countdown.
 * Das islamische Jahr hat rund 354 Tage — deshalb wandert der Stichtag
 * jedes Jahr um etwa elf Tage nach vorn.
 */
const MONDJAHR_TAGE = 354;

function stichtagBereich(){
  const box = el("div",{ style:"margin-top:16px;padding-top:14px;border-top:1px solid var(--linie)" });
  const gesetzt = S.einstellungen.zakat?.stichtag || null;

  box.appendChild(el("div",{ class:"t-kapitaelchen", style:"margin-bottom:8px", text:"Dein Stichtag" }));

  /* --- Der eingetragene Stichtag mit Countdown --- */
  if(gesetzt){
    /* Vom eingetragenen Datum in Mondjahr-Schritten vorwärts, bis er
       in der Zukunft liegt. Auf Tagesbeginn vergleichen, damit ein
       Stichtag am heutigen Tag als „heute“ gilt. */
    const start = new Date(gesetzt + "T12:00:00");
    const jetzt = heute();
    const heuteMittag = new Date(jetzt.getFullYear(), jetzt.getMonth(), jetzt.getDate(), 12, 0, 0);
    let naechster = new Date(start.getTime());
    let sicherung = 0;
    while(naechster < heuteMittag && sicherung < 200){
      naechster = new Date(naechster.getTime() + MONDJAHR_TAGE * 86400000);
      sicherung++;
    }
    const tageHin = Math.max(0, Math.round((naechster - heuteMittag) / 86400000));
    const seitLetztem = MONDJAHR_TAGE - tageHin;
    const ratenBisher = Math.floor(seitLetztem / 30.44);
    const hStart = hijriVonDatum(start);

    box.appendChild(el("div",{ style:"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px" },
      el("span",{ style:"font-size:20px;font-weight:640;letter-spacing:-.02em",
        text: tageHin === 0 ? "heute" : `in ${tageHin} ${plural(tageHin,"Tag","Tagen")}` }),
      el("span",{ class:"t-label zahl", text: datumLesbar(naechster.toISOString()) })
    ));
    if(hStart){
      box.appendChild(el("p",{ class:"t-klein", style:"margin-bottom:10px",
        text: `Nach islamischem Kalender: ${hStart.tag}. ${HIJRI_MONATE[hStart.monat-1]}` }));
    }
    box.appendChild(el("p",{ class:"t-klein", style:"line-height:1.55;margin-bottom:12px",
      text: `Bis dahin sind rund ${ratenBisher} von zwölf Monatsraten geflossen. `
          + "Ein Mondjahr hat etwa 354 Tage — elf weniger als ein Sonnenjahr. Rechne am Stichtag deshalb "
          + "genau nach, statt anzunehmen, zwölf Raten seien automatisch genug." }));
  } else {
    box.appendChild(el("p",{ class:"t-klein", style:"line-height:1.55;margin-bottom:12px",
      text:"Wähle den Tag, an dem du deine Zakat abrechnest — meist der Tag, an dem dein Vermögen "
         + "erstmals über der Schwelle lag. Viele nehmen dafür einen festen Tag im Ramadan." }));
  }

  /* --- Die Wahl: islamisch oder gewöhnlich --- */
  const wahlBox = el("div",{});
  box.appendChild(wahlBox);

  const gewoehnlichesFeld = el("input",{ class:"eingabe", type:"date", value: gesetzt || "",
    "aria-label":"Stichtag als gewöhnliches Datum",
    onchange:(e) => {
      S.einstellungen.zakat.stichtag = e.target.value || null;
      speichern();
      zeichneWerkzeuge();
    }});

  if(!HIJRI_KALENDER){
    /* Sollte der Browser den Hidschri-Kalender nicht kennen. */
    wahlBox.appendChild(gewoehnlichesFeld);
    return box;
  }

  const modus = UI.stichtagModus || "islamisch";
  wahlBox.appendChild(el("div",{ class:"segment breit", style:"margin-bottom:12px", role:"group",
    "aria-label":"Art der Datumsangabe" },
    el("button",{ type:"button", "aria-pressed": modus === "islamisch" ? "true":"false",
      text:"Islamisch", onclick:() => { UI.stichtagModus = "islamisch"; zeichneWerkzeuge(); }}),
    el("button",{ type:"button", "aria-pressed": modus === "gewoehnlich" ? "true":"false",
      text:"Kalenderdatum", onclick:() => { UI.stichtagModus = "gewoehnlich"; zeichneWerkzeuge(); }})
  ));

  if(modus === "gewoehnlich"){
    wahlBox.appendChild(gewoehnlichesFeld);
    return box;
  }

  /* --- Islamische Auswahl: Monat und Tag --- */
  const hHeute = hijriVonDatum(heute());
  const hGesetzt = gesetzt ? hijriVonDatum(new Date(gesetzt + "T12:00:00")) : null;
  let gewMonat = hGesetzt ? hGesetzt.monat : RAMADAN_MONAT;
  let gewTag = hGesetzt ? hGesetzt.tag : 1;

  const vorschau = el("div",{ class:"feld-hinweis", style:"margin-top:10px" });

  const uebernehmen = () => {
    /* Das nächste Vorkommen dieses islamischen Datums ab heute. */
    let jahr = hHeute ? hHeute.jahr : 1447;
    let d = datumVonHijri(jahr, gewMonat, gewTag);
    const jetzt = heute();
    const heuteMittag = new Date(jetzt.getFullYear(), jetzt.getMonth(), jetzt.getDate(), 12, 0, 0);
    if(d && d < heuteMittag){
      const naechstes = datumVonHijri(jahr + 1, gewMonat, gewTag);
      if(naechstes) d = naechstes;
    }
    if(!d){
      vorschau.textContent = "Dieses Datum lässt sich nicht umrechnen. Nimm einen anderen Tag.";
      return null;
    }
    const p = n => String(n).padStart(2,"0");
    const iso = d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
    const tage = Math.round((d - heuteMittag) / 86400000);
    vorschau.textContent = `Entspricht ${datumLesbar(d.toISOString())}`
      + (tage === 0 ? " — das ist heute." : tage > 0 ? ` — in ${tage} ${plural(tage,"Tag","Tagen")}.` : ".");
    return iso;
  };

  const monatSel = el("select",{ class:"eingabe", "aria-label":"Islamischer Monat",
    onchange:(e) => { gewMonat = +e.target.value; uebernehmen(); }},
    HIJRI_MONATE.map((name,i) => el("option",{ value:i+1, selected:(i+1)===gewMonat,
      text: (i+1) + ". " + name + ((i+1) === RAMADAN_MONAT ? " ☾" : "") })));

  const tagFeld = el("input",{ class:"eingabe", type:"number", min:"1", max:"30",
    inputmode:"numeric", value:String(gewTag), "aria-label":"Tag im Monat",
    oninput:(e) => { gewTag = klemmen(parseInt(e.target.value,10)||1, 1, 30); uebernehmen(); }});

  wahlBox.appendChild(el("div",{ class:"feld-reihe" },
    el("div",{ style:"flex:2" },
      el("div",{ class:"t-label", style:"margin-bottom:4px;font-size:12px", text:"Monat" }), monatSel),
    el("div",{ style:"flex:1" },
      el("div",{ class:"t-label", style:"margin-bottom:4px;font-size:12px", text:"Tag" }), tagFeld)
  ));
  wahlBox.appendChild(vorschau);
  uebernehmen();

  wahlBox.appendChild(el("button",{ class:"knopf primaer breit", type:"button", style:"margin-top:12px",
    onclick:() => {
      const iso = uebernehmen();
      if(!iso) return;
      S.einstellungen.zakat.stichtag = iso;
      speichern();
      zeichneWerkzeuge();
      toast(`Stichtag gesetzt: ${gewTag}. ${HIJRI_MONATE[gewMonat-1]}`);
    }}, icon("ic-check"), "Als Stichtag übernehmen"));

  /* --- Der islamische Kalender zum Nachschlagen --- */
  wahlBox.appendChild(hijriKalenderKarte());
  return box;
}

/** Zeigt das laufende Hidschri-Jahr mit allen Monatsanfängen. */
function hijriKalenderKarte(){
  const hHeute = hijriVonDatum(heute());
  if(!hHeute) return el("div",{});

  const jahr = UI.hijriJahr || hHeute.jahr;
  const monate = hijriJahresuebersicht(jahr);
  const ram = naechsterRamadan();

  const box = el("div",{ style:"margin-top:18px;padding-top:14px;border-top:1px solid var(--linie)" });

  box.appendChild(el("div",{ style:"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px" },
    el("button",{ class:"sym", type:"button", "aria-label":"Vorheriges Jahr",
      onclick:() => { UI.hijriJahr = jahr - 1; zeichneWerkzeuge(); } }, icon("ic-links")),
    el("div",{ style:"flex:1;text-align:center" },
      el("div",{ class:"t-h3", text:jahr + " AH" }),
      el("div",{ class:"t-klein", text:"heute: " + hijriLesbar(hHeute) })
    ),
    el("button",{ class:"sym", type:"button", "aria-label":"Nächstes Jahr",
      onclick:() => { UI.hijriJahr = jahr + 1; zeichneWerkzeuge(); } }, icon("ic-rechts"))
  ));

  /* Ramadan hervorgehoben */
  if(ram && ram.beginn){
    box.appendChild(el("div",{ class:"banner", style:"margin:10px 0 14px" },
      icon("ic-kalender"),
      el("div",{ class:"inhalt-b", style:"line-height:1.55" },
        el("strong",{ text: ram.laeuft ? "Ramadan läuft gerade" : `Ramadan ${ram.jahr} beginnt in ${ram.tageHin} ${plural(ram.tageHin,"Tag","Tagen")}` }),
        el("div",{ style:"margin-top:2px",
          text: `${datumLesbar(ram.beginn.toISOString())}`
              + (ram.ende ? ` bis ${datumLesbar(ram.ende.toISOString())}` : "") })
      )
    ));
  }

  const liste = el("div",{});
  monate.forEach(m => {
    if(!m.beginn) return;
    const istRamadan = m.nummer === RAMADAN_MONAT;
    const istJetzt = hHeute.jahr === jahr && hHeute.monat === m.nummer;
    liste.appendChild(el("button",{ class:"datenzeile", type:"button",
      /* Der laufende Monat wird durch einen Balken hervorgehoben, nicht
         durch eine Fläche — die würde den Textkontrast drücken. */
      style:"width:100%;text-align:left" + (istJetzt ? ";box-shadow:inset 3px 0 0 var(--akzent);padding-left:10px" : ""),
      onclick:() => {
        const p = n => String(n).padStart(2,"0");
        const d = m.beginn;
        S.einstellungen.zakat.stichtag = d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
        speichern();
        zeichneWerkzeuge();
        toast(`Stichtag auf den 1. ${m.name} gesetzt.`);
      }},
      el("span",{ class:"dz-name" },
        el("span",{ style: istRamadan ? "font-weight:650;color:var(--akzent)" : null,
          text: m.name + (istRamadan ? " ☾" : "") }),
        el("span",{ class:"neben", text: m.tage ? `${m.tage} Tage` : "" })
      ),
      el("span",{ class:"dz-wert", style:"font-weight:500" },
        el("span",{ text: m.beginn.toLocaleDateString("de-DE",{ day:"numeric", month:"short" }) }),
        el("span",{ class:"neben", text: m.beginn.getFullYear() })
      )
    ));
  });
  box.appendChild(liste);

  box.appendChild(el("p",{ class:"t-klein", style:"margin-top:12px;line-height:1.55",
    text:"Berechnet nach dem Umm-al-Qura-Kalender. Das ist eine Rechnung, keine Mondsichtung — "
       + "vor Ort kann der Monatsbeginn ein bis zwei Tage abweichen. Tippe einen Monat an, "
       + "um seinen ersten Tag als Stichtag zu übernehmen." }));
  return box;
}


/**
 * Trägt den offenen Zakat-Rest als Position ein oder passt sie an.
 * Damit erscheint er im Monatsblatt und in der Rücklagenempfehlung —
 * die App rechnet den Monatsanteil dann selbst aus.
 */
function zakatRestEintragen(offenJahrCent){
  const p = P();
  const vorhanden = zakatRestPosition();

  if(vorhanden){
    const alt = vorhanden.betragCent;
    const altAktiv = vorhanden.aktiv;
    if(offenJahrCent <= 0){
      /* Nichts mehr offen — die Position wird pausiert statt gelöscht,
         damit sie beim nächsten Mal wieder bereitsteht. */
      vorhanden.aktiv = false;
      aendern();
      toast("Deine Zakat ist vollständig verplant. Die Restposition ist pausiert.", () => {
        const p2 = zakatRestPosition();
        if(p2){ p2.aktiv = altAktiv; p2.betragCent = alt; }
        aendern();
      });
      return;
    }
    /* Die Position läuft monatlich, also ist betragCent der Monatsbetrag. */
    vorhanden.betragCent = Math.round(offenJahrCent / 12);
    vorhanden.intervall = "monatlich";
    vorhanden.aktiv = true;
    aendern();
    toast(`Offener Rest auf ${euro(Math.round(offenJahrCent/12))} im Monat gesetzt.`, () => {
      const p2 = zakatRestPosition();
      if(p2){ p2.betragCent = alt; p2.aktiv = altAktiv; }
      aendern();
    });
    return;
  }

  if(offenJahrCent <= 0){
    toast("Es ist nichts offen — deine Zakat ist schon vollständig verplant.");
    return;
  }

  /* Ein Zahlungsweg, der zu einer Überweisung passt. */
  const weg = p.zahlungswege.find(w => /überweisung|ueberweisung/i.test(w.name))
           || p.zahlungswege.find(w => w.kontotyp === "giro")
           || p.zahlungswege[0];

  /* Als monatliche Position, damit sie sofort im Monatsblatt steht.
     betragCent ist der Monatsbetrag — jahresCent multipliziert mit 12. */
  const neu = {
    id: idNeu("au"),
    name: "Zakat (offener Rest)",
    betragCent: Math.round(offenJahrCent / 12),
    intervall: "monatlich",
    zahlungsweg: weg.id,
    kontoId: null,
    faelligTag: 1,
    startMonat: heute().getMonth() + 1,
    tags: [ZAKAT_TAG_ID],
    prioritaet: "fix",
    aktiv: true,
    notiz: "Deckt den Teil deiner Zakat, der noch keiner festen Zahlung zugeordnet ist.",
    renditeProzent: 0, bestandCent: 0, zielCent: 0,
    zakatRest: true
  };
  p.ausgaben.push(neu);
  aendern();
  toast(`Restposition angelegt — ${euro(neu.betragCent)} im Monat.`, () => {
    P().ausgaben = P().ausgaben.filter(a => a.id !== neu.id);
    aendern();
  }, 8000);
}
