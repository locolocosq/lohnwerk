<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lohnwerk — Gehalts- und Budgetplanung. Alle Daten bleiben auf deinem Gerät.">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lohnwerk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>Lohnwerk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ============================================================
   FARBEN, ABSTÄNDE, TYPOGRAFIE — alles als Variablen
   Hell ist die Grundlage, Dunkel überschreibt nur die Farben.
   ============================================================ */
:root{
  /* Flächen */
  --bg:#f7f7f8;
  --bg-erhoben:#ffffff;
  --karte:#ffffff;
  --karte-2:#f2f2f4;
  --linie:rgba(0,0,0,.09);
  --linie-stark:rgba(0,0,0,.16);

  /* Schrift */
  --text:#1d1d1f;
  --text-2:#6e6e73;
  --text-3:#74747a;

  /* Akzent und Zustände */
  --akzent:#0066cc;
  --akzent-weich:rgba(0,102,204,.10);
  --akzent-text:#ffffff;
  --gruen:#1b7d3f;
  --gruen-weich:rgba(27,125,63,.10);
  --rot:#c72a1e;
  --rot-weich:rgba(199,42,30,.10);

  /* Kuratierte, gedämpfte Palette für Tags und Diagramme */
  --p1:#4a6fa5;
  --p2:#5f8d7e;
  --p3:#b8813f;
  --p4:#9c6b8e;
  --p5:#4f7d8c;
  --p6:#a1674f;
  --p7:#6c7a89;
  --p8:#7d8a52;

  /* Form */
  --r-karte:16px;
  --r-knopf:10px;
  --r-klein:8px;
  --r-pille:999px;
  --schatten:0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
  --schatten-hoch:0 8px 40px rgba(0,0,0,.16);

  /* 4-px-Abstandsskala */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --s7:32px; --s8:40px; --s9:48px; --s10:64px;

  /* Bewegung */
  --kurve:cubic-bezier(.4,0,.2,1);
  --dauer:200ms;

  --pfeil-runter:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236e6e73' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");

  --schrift:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sicher-unten:env(safe-area-inset-bottom, 0px);
  --sicher-oben:env(safe-area-inset-top, 0px);
}

/* Dunkelmodus: automatisch nach Systemeinstellung … */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="hell"]){
    --bg:#0f0f11;
    --bg-erhoben:#1c1c1e;
    --karte:#1c1c1e;
    --karte-2:#252528;
    --linie:rgba(255,255,255,.10);
    --linie-stark:rgba(255,255,255,.20);
    --text:#f2f2f4;
    --text-2:#a1a1a8;
    --text-3:#92929c;
    --akzent:#3f9bff;
    --akzent-weich:rgba(63,155,255,.14);
    --akzent-text:#08121c;
    --gruen:#3ec46f;
    --gruen-weich:rgba(62,196,111,.14);
    --rot:#ff6157;
    --rot-weich:rgba(255,97,87,.14);
    --p1:#7c9ed6; --p2:#82b6a4; --p3:#d5a765; --p4:#c395b6;
    --p5:#79a8b9; --p6:#c98f74; --p7:#98a5b3; --p8:#a6b378;
    --pfeil-runter:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23a1a1a8' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  --schatten:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --schatten-hoch:0 8px 40px rgba(0,0,0,.6);
  }
}
/* … und manuell umschaltbar. */
:root[data-theme="dunkel"]{
  --bg:#0f0f11;
  --bg-erhoben:#1c1c1e;
  --karte:#1c1c1e;
  --karte-2:#252528;
  --linie:rgba(255,255,255,.10);
  --linie-stark:rgba(255,255,255,.20);
  --text:#f2f2f4;
  --text-2:#a1a1a8;
  --text-3:#92929c;
  --akzent:#3f9bff;
  --akzent-weich:rgba(63,155,255,.14);
  --akzent-text:#08121c;
  --gruen:#3ec46f;
  --gruen-weich:rgba(62,196,111,.14);
  --rot:#ff6157;
  --rot-weich:rgba(255,97,87,.14);
  --p1:#7c9ed6; --p2:#82b6a4; --p3:#d5a765; --p4:#c395b6;
  --p5:#79a8b9; --p6:#c98f74; --p7:#98a5b3; --p8:#a6b378;
  --pfeil-runter:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23a1a1a8' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  --schatten:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --schatten-hoch:0 8px 40px rgba(0,0,0,.6);
}

/* ============================================================
   GRUNDLAGEN
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--schrift);
  font-size:17px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit;}
button{background:none;border:0;cursor:pointer;padding:0;}
input,select,textarea{background:none;border:0;}
ul,ol{margin:0;padding:0;list-style:none;}
h1,h2,h3,h4,p{margin:0;}
a{color:var(--akzent);}
svg{display:block;}
:focus{outline:none;}
:focus-visible{
  outline:2px solid var(--akzent);
  outline-offset:2px;
  border-radius:4px;
}
::selection{background:var(--akzent-weich);}
.nur-screenreader{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ============================================================
   TYPOGRAFIE-SKALA
   ============================================================ */
.hero-zahl{
  font-size:52px;line-height:1.04;font-weight:600;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.t-h1{font-size:28px;line-height:1.2;font-weight:650;letter-spacing:-.022em;}
.t-h2{font-size:20px;line-height:1.25;font-weight:600;letter-spacing:-.018em;}
.t-h3{font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.01em;}
.t-body{font-size:16px;line-height:1.45;}
.t-klein{font-size:14px;line-height:1.4;color:var(--text-2);}
.t-label{
  font-size:13px;line-height:1.3;color:var(--text-2);
  letter-spacing:.02em;font-weight:500;
}
.t-kapitaelchen{
  font-size:12px;font-weight:600;color:var(--text-2);
  letter-spacing:.06em;text-transform:uppercase;
}
.zahl{font-variant-numeric:tabular-nums;}
.gruen{color:var(--gruen);}
.rot{color:var(--rot);}
.gedaempft{color:var(--text-2);}
.gedaempft-2{color:var(--text-3);}

/* ============================================================
   LAYOUT — mobil eine Spalte, ab 900px Seitenleiste
   ============================================================ */
.app{min-height:100dvh;display:flex;flex-direction:column;}

.kopf{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--sicher-oben) + var(--s3)) var(--s4) var(--s3);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid transparent;
  transition:border-color 150ms var(--kurve);
  display:flex;align-items:center;gap:var(--s3);
}
.kopf.geschoben{border-bottom-color:var(--linie);}
.kopf-titel{flex:1;min-width:0;}
.kopf-titel h1{
  font-size:24px;font-weight:650;letter-spacing:-.022em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kopf-titel .unterzeile{
  font-size:13px;color:var(--text-2);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.inhalt{
  flex:1;
  width:100%;max-width:1100px;margin:0 auto;
  padding:var(--s4) var(--s4) calc(96px + var(--sicher-unten));
}
.ansicht{display:none;animation:einblenden 220ms var(--kurve);}
.ansicht.aktiv{display:block;}
@keyframes einblenden{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* Untere Tab-Leiste (Handy) */
.tableiste{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;
  padding-bottom:var(--sicher-unten);
  background:color-mix(in srgb, var(--bg-erhoben) 88%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--linie);
}
.tab{
  flex:1;min-width:0;min-height:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-3);font-size:9.5px;font-weight:500;letter-spacing:0;
  padding:6px 1px 8px;
  transition:color 150ms var(--kurve);
  -webkit-tap-highlight-color:transparent;
  /* Sechs Tabs müssen auch auf 320 px nebeneinander passen. */
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tab svg{width:21px;height:21px;stroke-width:1.7;flex:none;}
@media (min-width:400px){
  .tab{font-size:10.5px;letter-spacing:.01em;}
  .tab svg{width:23px;height:23px;}
}
.tab[aria-current="page"]{color:var(--akzent);}
.tab:active{transform:scale(.94);}

/* Seitenleiste (Desktop) */
.seitenleiste{display:none;}

@media (min-width:900px){
  .app{flex-direction:row;}
  .tableiste{display:none;}
  .seitenleiste{
    display:flex;flex-direction:column;gap:2px;
    position:sticky;top:0;align-self:flex-start;
    width:236px;flex:0 0 236px;height:100dvh;
    padding:var(--s6) var(--s3);
    background:var(--bg-erhoben);
    border-right:1px solid var(--linie);
  }
  .marke{
    display:flex;align-items:center;gap:10px;
    padding:0 var(--s3) var(--s6);
  }
  .marke svg{width:26px;height:26px;}
  .marke span{font-size:19px;font-weight:650;letter-spacing:-.02em;}
  .sl-knopf{
    display:flex;align-items:center;gap:12px;
    padding:10px var(--s3);border-radius:var(--r-knopf);
    color:var(--text-2);font-size:15px;font-weight:500;
    width:100%;text-align:left;min-height:44px;
    transition:background 140ms var(--kurve), color 140ms var(--kurve);
  }
  .sl-knopf svg{width:20px;height:20px;stroke-width:1.8;flex:0 0 20px;}
  .sl-knopf:hover{background:var(--karte-2);color:var(--text);}
  .sl-knopf[aria-current="page"]{background:var(--akzent-weich);color:var(--akzent);}
  .haupt{flex:1;min-width:0;display:flex;flex-direction:column;}
  .inhalt{padding:var(--s6) var(--s7) var(--s10);}
  .kopf{padding:var(--s6) var(--s7) var(--s4);}
  .kopf-titel h1{font-size:28px;}
}

/* ============================================================
   KARTEN
   ============================================================ */
.karte{
  background:var(--karte);
  border-radius:var(--r-karte);
  box-shadow:var(--schatten);
  padding:var(--s5);
  margin-bottom:var(--s3);
}
.karte.flach{box-shadow:none;border:1px solid var(--linie);}
.karte.eng{padding:var(--s4);}
.karte.blank{padding:0;overflow:hidden;}
.karte-kopf{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:var(--s3);margin-bottom:var(--s4);
}
.karte-kopf h2{font-size:18px;font-weight:600;letter-spacing:-.015em;}

.raster{display:grid;gap:var(--s3);}
.raster-2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media (min-width:700px){
  .raster-2{grid-template-columns:repeat(4,minmax(0,1fr));}
  .raster-2.halb{grid-template-columns:repeat(2,minmax(0,1fr));}
}

/* Kennzahl-Kachel */
.kachel{
  background:var(--karte);border-radius:var(--r-karte);
  box-shadow:var(--schatten);padding:var(--s4);
  display:flex;flex-direction:column;gap:var(--s1);
  min-width:0;
}
.kachel .titel{
  font-size:12px;font-weight:600;color:var(--text-3);
  letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kachel .wert{
  font-size:22px;font-weight:640;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kachel .zusatz{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums;}

/* Hero-Bereich Übersicht */
.hero{
  padding:var(--s8) var(--s2) var(--s9);
  text-align:left;
}
.hero .vorzeile{
  font-size:13px;font-weight:600;color:var(--text-2);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:var(--s3);
}
.hero .nachzeile{
  margin-top:var(--s3);font-size:15px;color:var(--text-2);
  font-variant-numeric:tabular-nums;
}
@media (min-width:700px){
  .hero{padding:var(--s9) var(--s2) var(--s10);}
  .hero-zahl{font-size:64px;}
}

/* ============================================================
   KNÖPFE
   ============================================================ */
.knopf{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 var(--s5);
  border-radius:var(--r-knopf);
  background:var(--karte-2);color:var(--text);
  font-size:15px;font-weight:550;letter-spacing:-.01em;
  transition:transform 120ms var(--kurve), background 140ms var(--kurve), opacity 140ms var(--kurve);
  -webkit-tap-highlight-color:transparent;
  white-space:nowrap;
}
.knopf:active{transform:scale(.97);}
.knopf:disabled{opacity:.4;cursor:default;}
.knopf:disabled:active{transform:none;}
.knopf svg{width:18px;height:18px;stroke-width:1.9;flex:none;}
.knopf.primaer{background:var(--akzent);color:var(--akzent-text);}
.knopf.gefahr{background:var(--rot-weich);color:var(--rot);}
.knopf.gefahr-voll{background:var(--rot);color:#fff;}
.knopf.leise{background:transparent;color:var(--akzent);padding:0 var(--s3);}
.knopf.rahmen{background:transparent;border:1px solid var(--linie-stark);}
.knopf.breit{width:100%;}
.knopf.klein{min-height:36px;padding:0 var(--s3);font-size:14px;}
.knopf-reihe{display:flex;gap:var(--s2);flex-wrap:wrap;}

/* Runder Symbolknopf */
.sym{
  width:44px;height:44px;min-width:44px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-pille);color:var(--text-2);
  transition:background 140ms var(--kurve), transform 120ms var(--kurve), color 140ms var(--kurve);
  -webkit-tap-highlight-color:transparent;
}
.sym svg{width:21px;height:21px;stroke-width:1.8;}
.sym:hover{background:var(--karte-2);color:var(--text);}
.sym:active{transform:scale(.92);}
.sym.gefuellt{background:var(--akzent);color:var(--akzent-text);}
.sym.gefuellt:hover{background:var(--akzent);color:var(--akzent-text);opacity:.9;}

/* Schwebender Hinzufügen-Knopf */
.fab{
  position:fixed;right:var(--s4);
  bottom:calc(70px + var(--sicher-unten) + var(--s3));
  z-index:45;
  width:56px;height:56px;border-radius:var(--r-pille);
  background:var(--akzent);color:var(--akzent-text);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.20);
  transition:transform 140ms var(--kurve);
}
.fab svg{width:26px;height:26px;stroke-width:2.1;}
.fab:active{transform:scale(.93);}
@media (min-width:900px){
  .fab{bottom:var(--s7);right:var(--s7);}
}

/* Segment-Umschalter (Monat / Jahr) */
.segment{
  display:inline-flex;padding:2px;gap:2px;
  background:var(--karte-2);border-radius:var(--r-knopf);
}
.segment button{
  min-height:34px;padding:0 var(--s3);border-radius:8px;
  font-size:13.5px;font-weight:550;color:var(--text-2);
  transition:background 150ms var(--kurve), color 150ms var(--kurve);
  white-space:nowrap;
}
.segment button[aria-pressed="true"]{
  background:var(--karte);color:var(--text);
  box-shadow:0 1px 3px rgba(0,0,0,.10);
}
.segment.breit{display:flex;width:100%;}
.segment.breit button{flex:1;min-height:40px;}

/* ============================================================
   LISTEN & ZEILEN
   ============================================================ */
.liste{
  background:var(--karte);border-radius:var(--r-karte);
  box-shadow:var(--schatten);overflow:hidden;margin-bottom:var(--s3);
}
.liste-titel{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:var(--s3) var(--s2) var(--s2);
}
.liste-titel .t-kapitaelchen{padding-left:var(--s1);color:var(--text-2);}

.zeile-huelle{position:relative;overflow:hidden;background:var(--karte);}
.zeile-huelle + .zeile-huelle .zeile{border-top:1px solid var(--linie);}
.zeile{
  position:relative;z-index:2;background:var(--karte);
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s4);min-height:60px;
  width:100%;text-align:left;
  transition:background 120ms var(--kurve), transform 0ms;
  -webkit-tap-highlight-color:transparent;
}
.zeile:hover{background:var(--karte-2);}
.zeile.pausiert .zeile-haupt{opacity:.42;}
.zeile-haupt{flex:1;min-width:0;}
.zeile-name{
  font-size:16px;font-weight:500;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.zeile-unter{
  font-size:13px;color:var(--text-2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.zeile-rechts{text-align:right;flex:none;}
.zeile-betrag{
  font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;white-space:nowrap;
}
.zeile-betrag-2{
  font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;
  margin-top:2px;white-space:nowrap;
}
.zeile-pfeil{color:var(--text-3);flex:none;}
.zeile-pfeil svg{width:16px;height:16px;stroke-width:2;}

/* Wisch-Hintergründe */
.wisch-hg{
  position:absolute;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--s5);color:#fff;font-size:13px;font-weight:600;
}
.wisch-hg .links{display:flex;align-items:center;gap:6px;}
.wisch-hg .rechts{display:flex;align-items:center;gap:6px;}
.wisch-hg svg{width:18px;height:18px;stroke-width:2;}
.zeile-huelle[data-wisch="loeschen"] .wisch-hg{background:var(--rot);}
.zeile-huelle[data-wisch="duplizieren"] .wisch-hg{background:var(--akzent);}

/* Auswahlkästchen bei Mehrfachauswahl */
.auswahlbox{
  width:22px;height:22px;flex:none;border-radius:var(--r-pille);
  border:1.8px solid var(--linie-stark);
  display:flex;align-items:center;justify-content:center;
  transition:background 140ms var(--kurve), border-color 140ms var(--kurve);
}
.auswahlbox svg{width:13px;height:13px;stroke-width:3;color:#fff;opacity:0;}
.zeile[data-gewaehlt="ja"] .auswahlbox{background:var(--akzent);border-color:var(--akzent);}
.zeile[data-gewaehlt="ja"] .auswahlbox svg{opacity:1;}

/* ============================================================
   CHIPS / TAGS
   ============================================================ */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:var(--r-pille);
  font-size:12px;font-weight:550;letter-spacing:.005em;
  background:var(--karte-2);color:var(--text-2);
  white-space:nowrap;max-width:100%;
  transition:background 140ms var(--kurve), color 140ms var(--kurve);
}
.chip .punkt{width:7px;height:7px;border-radius:var(--r-pille);flex:none;}
button.chip{min-height:32px;-webkit-tap-highlight-color:transparent;}
button.chip:active{transform:scale(.96);}
button.chip[aria-pressed="true"]{background:var(--akzent);color:var(--akzent-text);}
.chip.wahl[aria-pressed="true"]{background:var(--akzent-weich);color:var(--akzent);box-shadow:inset 0 0 0 1.5px var(--akzent);}
.chip-reihe{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
}
.chip-scroll{
  display:flex;gap:6px;overflow-x:auto;padding:2px var(--s4) var(--s2);
  margin:0 calc(-1 * var(--s4));
  scrollbar-width:none;-ms-overflow-style:none;
}
.chip-scroll::-webkit-scrollbar{display:none;}
.chip-scroll .chip{flex:none;}
.chip-mini{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;color:var(--text-3);
}
.chip-mini .punkt{width:6px;height:6px;border-radius:var(--r-pille);}

/* ============================================================
   FORMULARE
   ============================================================ */
.feld{margin-bottom:var(--s4);}
.feld > label,.feld-label{
  display:block;font-size:13px;font-weight:600;color:var(--text-2);
  letter-spacing:.01em;margin-bottom:6px;
}
.eingabe{
  width:100%;min-height:48px;padding:12px var(--s4);
  background:var(--karte-2);border-radius:var(--r-knopf);
  border:1.5px solid transparent;
  font-size:16px;letter-spacing:-.01em;color:var(--text);
  transition:border-color 140ms var(--kurve), background 140ms var(--kurve);
  -webkit-appearance:none;appearance:none;
}
.eingabe::placeholder{color:var(--text-3);}
.eingabe:focus{border-color:var(--akzent);background:var(--karte);}
.eingabe:focus-visible{outline:none;}
textarea.eingabe{min-height:76px;resize:vertical;line-height:1.4;}
select.eingabe{
  background-image:var(--pfeil-runter);
  background-repeat:no-repeat;background-position:right 14px center;
  padding-right:40px;cursor:pointer;
}
.eingabe.betrag{
  font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;min-height:56px;
}
.feld-hinweis{font-size:12.5px;color:var(--text-2);margin-top:6px;}
.feld-hinweis.warn{color:var(--rot);}
.feld-reihe{display:flex;gap:var(--s3);}
.feld-reihe > *{flex:1;min-width:0;}

/* Schalter */
.schalter-zeile{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s4);
  min-height:52px;padding:var(--s2) 0;
}
.schalter-zeile .beschriftung{flex:1;min-width:0;}
.schalter-zeile .beschriftung .haupt{font-size:16px;}
.schalter-zeile .beschriftung .neben{font-size:12.5px;color:var(--text-2);margin-top:2px;}
.schalter{
  position:relative;width:51px;height:31px;flex:none;
  border-radius:var(--r-pille);background:var(--linie-stark);
  transition:background 200ms var(--kurve);
}
.schalter::after{
  content:"";position:absolute;top:2px;left:2px;
  width:27px;height:27px;border-radius:var(--r-pille);background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:transform 200ms var(--kurve);
}
.schalter[aria-checked="true"]{background:var(--gruen);}
.schalter[aria-checked="true"]::after{transform:translateX(20px);}

/* Schieberegler */
input[type="range"]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:28px;background:transparent;cursor:pointer;
}
input[type="range"]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;background:var(--linie-stark);
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:26px;height:26px;border-radius:var(--r-pille);
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);
  margin-top:-11px;
}
input[type="range"]::-moz-range-track{
  height:4px;border-radius:2px;background:var(--linie-stark);
}
input[type="range"]::-moz-range-thumb{
  width:26px;height:26px;border:0;border-radius:var(--r-pille);
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);
}

/* Suchfeld */
.suche{position:relative;margin-bottom:var(--s3);}
.suche svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:var(--text-3);stroke-width:2;pointer-events:none;
}
.suche .eingabe{padding-left:42px;}
.suche .leeren{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border-radius:var(--r-pille);
  display:flex;align-items:center;justify-content:center;color:var(--text-3);
}
.suche .leeren svg{position:static;transform:none;width:16px;height:16px;}

/* ============================================================
   MODAL / SHEET
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.4);
  opacity:0;pointer-events:none;
  transition:opacity 220ms var(--kurve);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.overlay.offen{opacity:1;pointer-events:auto;}
.sheet{
  width:100%;max-width:560px;max-height:92dvh;
  background:var(--bg-erhoben);
  border-radius:20px 20px 0 0;
  box-shadow:var(--schatten-hoch);
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform 260ms var(--kurve);
  overflow:hidden;
}
.overlay.offen .sheet{transform:none;}
.sheet-kopf{
  display:flex;align-items:center;gap:var(--s2);
  padding:var(--s3) var(--s3) var(--s3) var(--s5);
  border-bottom:1px solid var(--linie);flex:none;
}
.sheet-kopf h2{flex:1;font-size:18px;font-weight:640;letter-spacing:-.018em;min-width:0;}
.sheet-koerper{
  padding:var(--s5);overflow-y:auto;flex:1;
  -webkit-overflow-scrolling:touch;
}
.sheet-fuss{
  padding:var(--s3) var(--s5) calc(var(--s5) + var(--sicher-unten));
  border-top:1px solid var(--linie);
  display:flex;gap:var(--s2);flex:none;
  background:var(--bg-erhoben);
}
.sheet-fuss .knopf{flex:1;}
.griff{
  width:38px;height:5px;border-radius:var(--r-pille);
  background:var(--linie-stark);margin:var(--s2) auto 0;flex:none;
}
@media (min-width:700px){
  .overlay{align-items:center;padding:var(--s5);}
  .sheet{border-radius:18px;max-height:88dvh;transform:translateY(20px) scale(.98);}
  .overlay.offen .sheet{transform:none;}
  .griff{display:none;}
  .sheet-fuss{padding-bottom:var(--s5);}
}

/* ============================================================
   TOAST
   ============================================================ */
.toast-bereich{
  position:fixed;left:0;right:0;z-index:120;
  bottom:calc(74px + var(--sicher-unten));
  display:flex;flex-direction:column;align-items:center;gap:var(--s2);
  padding:0 var(--s4);pointer-events:none;
}
@media (min-width:900px){.toast-bereich{bottom:var(--s6);}}
.toast{
  pointer-events:auto;
  display:flex;align-items:center;gap:var(--s4);
  max-width:480px;width:100%;
  padding:12px var(--s3) 12px var(--s5);
  border-radius:14px;
  background:#26262a;color:#f5f5f7;
  box-shadow:0 6px 28px rgba(0,0,0,.3);
  font-size:14.5px;
  animation:toast-rein 260ms var(--kurve);
}
:root[data-theme="dunkel"] .toast{background:#3a3a3e;}
@media (prefers-color-scheme:dark){:root:not([data-theme="hell"]) .toast{background:#3a3a3e;}}
.toast.weg{animation:toast-raus 200ms var(--kurve) forwards;}
.toast .text{flex:1;min-width:0;}
.toast button{
  color:#5eb0ff;font-weight:600;font-size:14.5px;
  padding:8px 12px;border-radius:var(--r-klein);min-height:36px;white-space:nowrap;
}
@keyframes toast-rein{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:none;}}
@keyframes toast-raus{to{opacity:0;transform:translateY(10px) scale(.97);}}

/* Banner (Sicherungs-Erinnerung, Fehlerhinweis) */
.banner{
  display:flex;align-items:flex-start;gap:var(--s3);
  padding:var(--s3) var(--s4);border-radius:var(--r-karte);
  background:var(--akzent-weich);color:var(--text);
  margin-bottom:var(--s3);font-size:14px;line-height:1.4;
}
.banner.warn{background:var(--rot-weich);}
.banner svg{width:19px;height:19px;flex:none;margin-top:1px;color:var(--akzent);stroke-width:1.9;}
.banner.warn svg{color:var(--rot);}
.banner .inhalt-b{flex:1;min-width:0;}
.banner .knopf-reihe{margin-top:var(--s2);}

/* ============================================================
   LEERE ZUSTÄNDE
   ============================================================ */
.leer{
  text-align:center;padding:var(--s9) var(--s5);
  display:flex;flex-direction:column;align-items:center;gap:var(--s3);
}
.leer svg.bild{width:76px;height:76px;color:var(--text-3);opacity:.5;stroke-width:1.2;}
.leer h3{font-size:18px;font-weight:600;letter-spacing:-.015em;}
.leer p{font-size:15px;color:var(--text-2);max-width:320px;line-height:1.45;}

/* ============================================================
   DIAGRAMME
   ============================================================ */
.diagramm{width:100%;overflow:visible;}
.balken-zeile{
  display:flex;align-items:center;gap:var(--s3);
  padding:9px 0;
}
.balken-zeile .bz-name{
  flex:0 0 34%;min-width:0;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.balken-spur{
  flex:1;height:8px;border-radius:var(--r-pille);
  background:var(--karte-2);overflow:hidden;min-width:20px;
}
.balken-fuellung{
  height:100%;border-radius:var(--r-pille);
  transform-origin:left center;
  animation:balken-wachsen 620ms var(--kurve) both;
}
@keyframes balken-wachsen{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes balken-hoch{from{transform:scaleY(0);}to{transform:scaleY(1);}}
@keyframes einblenden-weich{from{opacity:0;}to{opacity:1;}}
.balken-zeile .bz-wert{
  flex:none;font-size:13.5px;font-variant-numeric:tabular-nums;
  color:var(--text-2);min-width:74px;text-align:right;
}

.legende{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);margin-top:var(--s4);}
.legende-eintrag{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);min-width:0;}
.legende-eintrag .punkt{width:9px;height:9px;border-radius:2px;flex:none;}
.legende-eintrag .lw{font-variant-numeric:tabular-nums;color:var(--text-3);}

/* Donut */
.donut-huelle{
  display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap;justify-content:center;
}
.donut-mitte{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;pointer-events:none;
}
.donut-mitte .gross{
  font-size:20px;font-weight:640;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.donut-mitte .klein{font-size:11.5px;color:var(--text-2);}
.donut-box{position:relative;width:180px;height:180px;flex:none;}
.donut-seg{
  transition:opacity 150ms var(--kurve);
  animation:donut-rein 700ms var(--kurve) both;
}
@keyframes donut-rein{from{opacity:0;}to{opacity:1;}}

/* Kalender */
.kal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.kal-kopf{
  text-align:center;font-size:10.5px;font-weight:600;color:var(--text-3);
  letter-spacing:.04em;text-transform:uppercase;padding-bottom:4px;
}
.kal-tag{
  aspect-ratio:1;border-radius:var(--r-klein);
  background:var(--karte-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;padding:2px;min-height:38px;position:relative;
  transition:transform 120ms var(--kurve);
  -webkit-tap-highlight-color:transparent;
}
.kal-tag:active{transform:scale(.94);}
.kal-tag .nr{font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-2);line-height:1;}
.kal-tag .bt{
  font-size:9px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1;
  color:var(--text);white-space:nowrap;overflow:hidden;max-width:100%;
}
.kal-tag[data-hat="ja"]{background:var(--akzent-weich);}
.kal-tag[data-hat="ja"] .nr{color:var(--akzent);font-weight:600;}
.kal-tag.leer-tag{background:transparent;}
.kal-tag[data-heute="ja"]{box-shadow:inset 0 0 0 1.6px var(--akzent);}

/* Sankey — das Erkennungszeichen */
.sankey-huelle{
  margin:0 calc(-1 * var(--s5));padding:var(--s2) var(--s4) var(--s4);
  overflow-x:auto;scrollbar-width:none;
}
.sankey-huelle::-webkit-scrollbar{display:none;}
.sankey-band{
  animation:sankey-rein 900ms var(--kurve) both;
}
@keyframes sankey-rein{
  from{opacity:0;}
  to{opacity:.82;}
}
.sankey-knoten{animation:sankey-knoten-rein 600ms var(--kurve) both;}
@keyframes sankey-knoten-rein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* Fortschrittsbalken */
.fortschritt{
  height:10px;border-radius:var(--r-pille);background:var(--karte-2);
  overflow:hidden;margin:var(--s3) 0 var(--s2);
}
.fortschritt > div{
  height:100%;border-radius:var(--r-pille);background:var(--gruen);
  animation:balken-wachsen 700ms var(--kurve) both;transform-origin:left center;
}

/* 50/30/20 Balken */
.regel-balken{
  display:flex;height:34px;border-radius:var(--r-klein);overflow:hidden;
  margin:var(--s3) 0 var(--s2);background:var(--karte-2);
}
.regel-balken > div{
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:650;color:#fff;
  animation:balken-wachsen 620ms var(--kurve) both;transform-origin:left center;
  min-width:0;overflow:hidden;
}

/* Datenzeile in Auswertungen */
.datenzeile{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:var(--s4);padding:11px 0;
  border-top:1px solid var(--linie);
}
.datenzeile:first-of-type{border-top:0;}
.datenzeile .dz-name{font-size:15px;min-width:0;}
.datenzeile .dz-name .neben{display:block;font-size:12.5px;color:var(--text-2);margin-top:1px;}
.datenzeile .dz-wert{
  font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right;
}
.datenzeile .dz-wert .neben{
  /* --text-2 statt --text-3: Datenzeilen stehen oft auf grauem Grund,
     dort reicht der hellere Ton nicht für gute Lesbarkeit. */
  display:block;font-size:12px;font-weight:400;color:var(--text-2);margin-top:1px;
}

/* Kopierbare Liste (Überweisungsplan) */
.plan-block{
  background:var(--karte-2);border-radius:var(--r-knopf);
  padding:var(--s4);font-size:14px;line-height:1.7;
  font-variant-numeric:tabular-nums;white-space:pre-wrap;word-break:break-word;
}

/* Onboarding-Schritte */
.schritt-punkte{display:flex;gap:6px;justify-content:center;padding:var(--s2) 0 var(--s4);}
.schritt-punkte span{
  width:7px;height:7px;border-radius:var(--r-pille);background:var(--linie-stark);
  transition:background 200ms var(--kurve), width 200ms var(--kurve);
}
.schritt-punkte span.aktiv{background:var(--akzent);width:20px;}
.vorschlag-raster{display:flex;flex-wrap:wrap;gap:7px;}
.vorschlag{
  padding:9px 13px;border-radius:var(--r-pille);
  background:var(--karte-2);font-size:13.5px;font-weight:500;
  min-height:40px;display:inline-flex;align-items:center;gap:6px;
  transition:background 140ms var(--kurve), color 140ms var(--kurve), transform 120ms var(--kurve);
  -webkit-tap-highlight-color:transparent;
}
.vorschlag:active{transform:scale(.96);}
.vorschlag[aria-pressed="true"]{background:var(--akzent);color:var(--akzent-text);}
.vorschlag svg{width:14px;height:14px;stroke-width:2.4;}

/* Ziehen & Ablegen */
.ablage{
  position:fixed;inset:0;z-index:200;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:var(--s4);text-align:center;padding:var(--s6);
}
.ablage.offen{display:flex;}
.ablage svg{width:64px;height:64px;color:var(--akzent);stroke-width:1.3;}
.ablage .rahmen-innen{
  position:absolute;inset:var(--s5);
  border:2.5px dashed var(--akzent);border-radius:24px;pointer-events:none;
}

/* Aufklappbarer Abschnitt */
details.klapp{
  border-top:1px solid var(--linie);
}
details.klapp summary{
  list-style:none;cursor:pointer;
  padding:var(--s4) 0;min-height:52px;
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  font-size:15px;font-weight:550;
}
details.klapp summary::-webkit-details-marker{display:none;}
details.klapp summary .pfeil{
  color:var(--text-3);transition:transform 200ms var(--kurve);flex:none;
}
details.klapp summary .pfeil svg{width:16px;height:16px;stroke-width:2.2;}
details.klapp[open] summary .pfeil{transform:rotate(180deg);}
details.klapp .klapp-inhalt{padding-bottom:var(--s4);}

/* Aktionsleiste bei Mehrfachauswahl */
.aktionsleiste{
  position:fixed;left:0;right:0;z-index:60;
  bottom:calc(70px + var(--sicher-unten));
  padding:var(--s3) var(--s4);
  display:flex;align-items:center;gap:var(--s2);
  background:var(--bg-erhoben);border-top:1px solid var(--linie);
  box-shadow:0 -4px 20px rgba(0,0,0,.10);
  animation:einblenden 200ms var(--kurve);
}
@media (min-width:900px){.aktionsleiste{bottom:0;left:236px;}}
.aktionsleiste .zaehler{flex:1;font-size:14px;font-weight:600;min-width:0;}

/* ============================================================
   MONATSBLATT — die schlichte Tabellenansicht
   Nachbau der gewohnten Tabellenkalkulation: Spalten nebeneinander,
   je Zeile Bezeichnung, Monatsbetrag und Jahresbetrag.
   ============================================================ */
.blatt{display:grid;gap:var(--s3);}
@media (min-width:760px){
  .blatt.zweispaltig{grid-template-columns:repeat(2,minmax(0,1fr));}
}
.blatt-block{
  background:var(--karte);border-radius:var(--r-karte);
  box-shadow:var(--schatten);overflow:hidden;
}
.blatt-kopf{
  display:flex;align-items:center;gap:9px;
  padding:var(--s4) var(--s4) var(--s3);
  border-bottom:1px solid var(--linie);
}
.blatt-kopf svg{width:17px;height:17px;color:var(--text-2);flex:none;stroke-width:1.9;}
.blatt-kopf .titel{
  flex:1;min-width:0;font-size:13px;font-weight:650;
  letter-spacing:.04em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.blatt-zeile{
  display:grid;grid-template-columns:1fr auto auto;
  align-items:baseline;gap:var(--s3);
  padding:9px var(--s4);
  border-top:1px solid var(--linie);
  font-size:14.5px;
}
.blatt-zeile:first-of-type{border-top:0;}
.blatt-zeile .bz-name{
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.blatt-zeile .bz-monat,.blatt-zeile .bz-jahr{
  font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;
}
.blatt-zeile .bz-monat{font-weight:600;min-width:82px;}
.blatt-zeile .bz-jahr{font-size:12.5px;color:var(--text-2);min-width:88px;}
.blatt-zeile.spalten-titel{
  border-top:0;padding-top:6px;padding-bottom:6px;
  font-size:11px;font-weight:600;color:var(--text-2);
  letter-spacing:.05em;text-transform:uppercase;
}
.blatt-zeile.spalten-titel .bz-monat,.blatt-zeile.spalten-titel .bz-jahr{font-weight:600;font-size:11px;}
.blatt-zeile.summe{
  border-top:1.5px solid var(--linie-stark);
  background:var(--karte-2);font-weight:650;
}
.blatt-zeile.summe .bz-jahr{color:var(--text-2);font-weight:600;}
.blatt-zeile.leer .bz-name{color:var(--text-3);font-style:italic;}
.blatt-zeile.gruen-zeile .bz-monat{color:var(--gruen);}

/* Die Ergebniszeilen ganz unten */
.blatt-ergebnis{
  background:var(--karte);border-radius:var(--r-karte);
  box-shadow:var(--schatten);overflow:hidden;
}
.blatt-ergebnis .ez{
  display:grid;grid-template-columns:auto 1fr auto auto;
  align-items:center;gap:var(--s3);
  padding:var(--s4);border-top:1px solid var(--linie);
}
.blatt-ergebnis .ez:first-child{border-top:0;}
.blatt-ergebnis .ez .sym-feld{
  width:36px;height:36px;border-radius:10px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--karte-2);color:var(--text-2);
}
.blatt-ergebnis .ez .sym-feld svg{width:18px;height:18px;stroke-width:1.9;}
.blatt-ergebnis .ez .ez-name{min-width:0;}
.blatt-ergebnis .ez .ez-name .haupt{font-size:16px;font-weight:600;letter-spacing:-.01em;}
.blatt-ergebnis .ez .ez-name .neben{font-size:12.5px;color:var(--text-2);margin-top:1px;}
.blatt-ergebnis .ez .ez-monat{
  font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;white-space:nowrap;text-align:right;
}
.blatt-ergebnis .ez .ez-jahr{
  font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right;min-width:88px;
}
@media (max-width:420px){
  .blatt-ergebnis .ez{grid-template-columns:auto 1fr auto;}
  .blatt-ergebnis .ez .ez-jahr{grid-column:3;text-align:right;}
  .blatt-ergebnis .ez .ez-monat{grid-column:3;}
  .blatt-zeile{grid-template-columns:1fr auto;}
  .blatt-zeile .bz-jahr{grid-column:2;grid-row:2;}
}

/* Tabelle für Konto-Summen */
.mini-tabelle{width:100%;border-collapse:collapse;font-size:14.5px;}
.mini-tabelle th{
  text-align:left;font-size:11.5px;font-weight:600;color:var(--text-3);
  letter-spacing:.05em;text-transform:uppercase;padding:0 0 var(--s2);
}
.mini-tabelle th:last-child,.mini-tabelle td:last-child{text-align:right;}
.mini-tabelle td{
  padding:10px 0;border-top:1px solid var(--linie);
  font-variant-numeric:tabular-nums;
}
.mini-tabelle td:first-child{font-variant-numeric:normal;}

/* Bewegung aus, wenn der Nutzer das wünscht */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

/* Sehr schmale Geräte (320 px) */
@media (max-width:359px){
  .hero-zahl{font-size:42px;}
  .inhalt{padding-left:var(--s3);padding-right:var(--s3);}
  .kopf{padding-left:var(--s3);padding-right:var(--s3);}
  .karte{padding:var(--s4);}
  .kachel .wert{font-size:19px;}
  .tab{font-size:9.5px;}
  .balken-zeile .bz-name{flex-basis:40%;}
  .balken-zeile .bz-wert{min-width:62px;font-size:12.5px;}
  .tab{font-size:8.5px;}
  .tab svg{width:19px;height:19px;}
  /* Die negativen Ränder müssen zur schmaleren Polsterung passen,
     sonst schiebt sich die Seite seitwärts. */
  .chip-scroll{margin:0 calc(-1 * var(--s3));padding-left:var(--s3);padding-right:var(--s3);}
  .sankey-huelle{margin:0 calc(-1 * var(--s4));padding-left:var(--s3);padding-right:var(--s3);}
}
</style>

/** Erzeugt ein Element mit Attributen und Kindern. */
function el(tag, attr={}, ...kinder){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attr)){
    if(v === null || v === undefined || v === false) continue;
    if(k === "class") n.className = v;
    else if(k === "text") n.textContent = v;
    else if(k === "html") n.innerHTML = v;
    else if(k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if(k === "dataset") Object.assign(n.dataset, v);
    else if(v === true) n.setAttribute(k, "");
    else n.setAttribute(k, v);
  }
  for(const kind of kinder.flat()){
    if(kind === null || kind === undefined || kind === false) continue;
    n.appendChild(typeof kind === "string" ? document.createTextNode(kind) : kind);
  }
  return n;
}

/** Ein Icon aus der Sammlung oben. */

  s.setAttribute("aria-hidden","true");
  s.setAttribute("focusable","false");
  if(groesse){ s.style.width = groesse+"px"; s.style.height = groesse+"px"; }
  const u = document.createElementNS("http://www.w3.org/2000/svg","use");
  u.setAttribute("href","#"+id);
  s.appendChild(u);
  return s;
}

function svgEl(tag, attr={}){
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for(const [k,v] of Object.entries(attr)){
    if(v === null || v === undefined) continue;
    n.setAttribute(k, v);
  }

}

const nfEuro = new Intl.NumberFormat("de-DE",{ style:"currency", currency:"EUR", minimumFractionDigits:2, maximumFractionDigits:2 });
const nfEuroKurz = new Intl.NumberFormat("de-DE",{ style:"currency", currency:"EUR", minimumFractionDigits:0, maximumFractionDigits:0 });
const nfZahl = new Intl.NumberFormat("de-DE",{ minimumFractionDigits:2, maximumFractionDigits:2 });
const nfProzent = new Intl.NumberFormat("de-DE",{ minimumFractionDigits:1, maximumFractionDigits:1 });
/* Bitcoin wird in bis zu acht Nachkommastellen gehandelt. */
const nfBtc = new Intl.NumberFormat("de-DE",{ minimumFractionDigits:0, maximumFractionDigits:8 });

/** 123456 → "1.234,56 €" */
function euro(cent){
  if(!Number.isFinite(cent)) return "—";
  return nfEuro.format(Math.round(cent)/100);
}
/** Ohne Nachkommastellen, für enge Stellen wie den Kalender. */
function euroKurz(cent){
  if(!Number.isFinite(cent)) return "—";
  return nfEuroKurz.format(Math.round(cent)/100);
}
/** Nur die Zahl, ohne Währungszeichen — für Eingabefelder. */
function zahlFuerFeld(cent){
  if(!Number.isFinite(cent)) return "";
  return nfZahl.format(Math.round(cent)/100);
}
/** Prozent mit einer Nachkommastelle, ohne Division durch Null. */
function prozent(teil, ganzes){
  if(!Number.isFinite(teil) || !Number.isFinite(ganzes) || ganzes === 0) return "—";
  return nfProzent.format(teil/ganzes*100).replace(",0","") + " %";
}

/**
 * Wertet eine Betragseingabe aus. Erlaubt sind Zahlen mit Komma oder Punkt
 * sowie einfache Rechnungen: 45+12,50 · 30*3 · (12+8)/2
 * Bewusst kein eval — hier steht ein eigener, kleiner Parser.
 * Rückgabe: Cent als ganze Zahl, oder null wenn die Eingabe nicht lesbar ist.
 */
function betragParsen(eingabe){
  if(typeof eingabe !== "string") return null;
  let s = eingabe.trim();
  if(s === "") return null;
  s = s.replace(/[€\s ]/g,"");
  if(s === "") return null;
  // Nur Ziffern und Rechenzeichen zulassen.
  if(!/^[0-9+\-*/().,]+$/.test(s)) return null;

  // Deutsche Schreibweise vereinheitlichen:
  // Tausenderpunkte entfernen (Punkt mit genau 3 Ziffern danach und Ziffer davor),
  // danach Komma zu Punkt.
  if(s.includes(",")){
    s = s.replace(/(\d)\.(?=\d{3}(\D|$))/g, "$1");
    s = s.replace(/,/g, ".");
  }

  let pos = 0;
  const zeichen = () => s[pos];
  function ausdruck(){
    let wert = term();
    if(wert === null) return null;
    while(zeichen() === "+" || zeichen() === "-"){
      const op = s[pos++];
      const rechts = term();
      if(rechts === null) return null;
      wert = op === "+" ? wert + rechts : wert - rechts;
    }
    return wert;
  }
  function term(){
    let wert = faktor();
    if(wert === null) return null;
    while(zeichen() === "*" || zeichen() === "/"){
      const op = s[pos++];
      const rechts = faktor();
      if(rechts === null) return null;
      if(op === "/"){
        if(rechts === 0) return null;
        wert = wert / rechts;
      } else {
        wert = wert * rechts;
      }
    }
    return wert;
  }
  function faktor(){
    if(zeichen() === "+"){ pos++; return faktor(); }
    if(zeichen() === "-"){ pos++; const w = faktor(); return w === null ? null : -w; }
    if(zeichen() === "("){
      pos++;
      const w = ausdruck();
      if(w === null || zeichen() !== ")") return null;
      pos++;
      return w;
    }
    const start = pos;
    while(pos < s.length && /[0-9.]/.test(s[pos])) pos++;
    if(pos === start) return null;
    const roh = s.slice(start,pos);
    if((roh.match(/\./g)||[]).length > 1) return null;
    const z = parseFloat(roh);
    return Number.isFinite(z) ? z : null;
  }

  const ergebnis = ausdruck();
  if(ergebnis === null || pos !== s.length) return null;
  if(!Number.isFinite(ergebnis)) return null;
  const cent = Math.round(ergebnis * 100);
  if(!Number.isSafeInteger(cent)) return null;
  return cent;
}

/* ---------- Text und Datum ---------- */

function heute(){ return new Date(); }
function datumIso(d = heute()){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function datumLesbar(iso){
  if(!iso) return "nie";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "nie";
  return `${d.getDate()}. ${MONATE_LANG[d.getMonth()]} ${d.getFullYear()}`;
}
function tageSeit(iso){
  if(!iso) return null;
  const d = new Date(iso);
  if(isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function plural(n, eins, viele){ return n === 1 ? eins : viele; }

/** Kürzt lange Texte für enge Stellen. */
function kuerzen(text, max){
  if(typeof text !== "string") return "";
  return text.length > max ? text.slice(0, max-1) + "…" : text;
}

/** Vergleicht Texte nach deutschen Regeln (ä vor b). */

/** Entprellt eine Funktion. */
function entprellen(fn, ms){
  let t = null;
  return function(...args){
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

function klemmen(wert, min, max){ return Math.min(max, Math.max(min, wert)); }
